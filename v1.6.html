<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LebnAra — لبينارا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d6a1f;--green-l:#eaf3de;--green-m:#4a9e2f;
  --red:#a32d2d;--red-l:#fcebeb;--red-m:#e24b4a;
  --amber:#ba7517;--amber-l:#faeeda;--amber-m:#ef9f27;
  --blue:#185fa5;--blue-l:#e6f1fb;
  --teal:#0f6e56;--teal-l:#e1f5ee;
  --purple:#534ab7;--purple-l:#eeedfe;
  --bg:#f4f6f8;--surf:#fff;--bdr:#e5e7eb;
  --txt:#1a1a1a;--txt2:#6b7280;--txt3:#9ca3af;
  --r:10px;--rs:6px;
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a3a0f,#2d6a1f)}
.login-box{background:var(--surf);border-radius:16px;padding:40px 32px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:28px;font-weight:800;color:var(--green);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--txt2);margin-bottom:28px}
.login-box input{width:100%;padding:10px 14px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:14px;margin-bottom:12px;font-family:inherit;background:var(--bg)}
.login-box input:focus{outline:none;border-color:var(--green-m)}
.login-btn{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.login-btn:hover{background:var(--green-m)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none}

/* ── APP SHELL ── */
#app{display:none}
.topbar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.logo-name{font-size:15px;font-weight:800;color:var(--green)}
.logo-ar{font-size:11px;color:var(--txt2)}
.user-info{display:flex;align-items:center;gap:8px;font-size:13px}
.role-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.role-admin{background:var(--purple-l);color:var(--purple)}
.role-factory{background:var(--teal-l);color:var(--teal)}
.role-farm{background:var(--green-l);color:var(--green)}
.role-sales{background:var(--blue-l);color:var(--blue)}
.role-purchases{background:var(--amber-l);color:var(--amber)}
.logout-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:none;cursor:pointer;font-size:12px;color:var(--txt2)}

.nav{background:var(--surf);border-bottom:1px solid var(--bdr);display:flex;overflow-x:auto;padding:0 8px;gap:2px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:9px 13px;font-size:12px;border:none;background:none;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;font-family:inherit}
.nav-btn:hover{color:var(--txt);background:var(--bg)}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}

.main{padding:14px;max-width:960px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px}
.kpi-lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.kpi-val{font-size:22px;font-weight:700;line-height:1}
.kpi-unit{font-size:10px;color:var(--txt2);margin-top:2px}

/* ── BADGES ── */
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block}
.b-green{background:var(--green-l);color:var(--green)}
.b-red{background:var(--red-l);color:var(--red)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-blue{background:var(--blue-l);color:var(--blue)}
.b-teal{background:var(--teal-l);color:var(--teal)}
.b-purple{background:var(--purple-l);color:var(--purple)}

/* ── TABLES ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:7px 9px;color:var(--txt2);font-weight:500;border-bottom:1px solid var(--bdr);font-size:11px;white-space:nowrap}
td{text-align:right;padding:9px;border-bottom:1px solid var(--bdr);color:var(--txt)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* ── FORMS ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:11px;color:var(--txt2);font-weight:500}
.fi input,.fi select,.fi textarea{padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--surf);color:var(--txt);font-size:13px;font-family:inherit}
.fi input:focus,.fi select:focus{outline:none;border-color:var(--green-m)}
.fi.full{grid-column:1/-1}
.sec{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;padding-top:6px;border-top:1px solid var(--bdr)}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:var(--rs);font-size:13px;cursor:pointer;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);transition:all .15s;font-family:inherit}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--green);color:#fff;border-color:var(--green)}
.btn-p:hover{background:var(--green-m);border-color:var(--green-m)}
.btn-r{background:var(--red-l);color:var(--red);border-color:var(--red-m)}
.btn-a{background:var(--amber-l);color:var(--amber);border-color:var(--amber-m)}
.btn-b{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* ── TABS ── */
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--bdr);background:var(--surf);cursor:pointer;color:var(--txt2);transition:all .15s;font-family:inherit}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}

/* ── MODAL ── */
.modal-bg{display:none;background:rgba(0,0,0,.5);position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;align-items:flex-start;justify-content:center;padding-top:60px}
.modal-bg.open{display:flex}
.modal{background:var(--surf);border-radius:var(--r);padding:20px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--txt2);line-height:1}

/* ── ALERTS ── */
.alert{padding:9px 12px;border-radius:var(--rs);font-size:13px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.al-w{background:var(--amber-l);color:var(--amber)}
.al-d{background:var(--red-l);color:var(--red)}
.al-i{background:var(--blue-l);color:var(--blue)}
.al-s{background:var(--green-l);color:var(--green)}

/* ── PROGRESS ── */
.prog{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:3px;background:var(--amber-m)}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:9999;white-space:nowrap;max-width:90vw}

/* ── LOADING ── */
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--green-m);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.ld{text-align:center;padding:24px;color:var(--txt2);font-size:13px}

/* ══════════════════════════════════════════
   POS — نقطة البيع
══════════════════════════════════════════ */
#pos-page{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:300;flex-direction:column}
#pos-page.open{display:flex}
.pos-top{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pos-title{font-size:16px;font-weight:700}
.pos-body{display:flex;flex:1;overflow:hidden;gap:0}
.pos-products{flex:1;padding:12px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}
.pos-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s;text-align:center;user-select:none}
.pos-card:hover{border-color:var(--green-m);transform:scale(1.02)}
.pos-card:active{transform:scale(.97)}
.pos-card-name{font-size:13px;font-weight:600;margin-bottom:4px}
.pos-card-price{font-size:18px;font-weight:800;color:var(--green)}
.pos-card-unit{font-size:10px;color:var(--txt2)}
.pos-cart{width:300px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.pos-cart-items{flex:1;overflow-y:auto;padding:10px}
.pos-cart-item{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bdr)}
.pos-cart-item:last-child{border-bottom:none}
.pci-name{flex:1;font-size:12px;font-weight:500}
.pci-qty{display:flex;align-items:center;gap:4px}
.pci-qty button{width:22px;height:22px;border:1px solid var(--bdr);border-radius:4px;background:var(--bg);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.pci-qty span{font-size:13px;font-weight:600;min-width:20px;text-align:center}
.pci-price{font-size:12px;font-weight:600;color:var(--green);min-width:60px;text-align:left}
.pci-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 2px}
.pos-footer{padding:12px;border-top:1px solid var(--bdr);background:var(--surf)}
.pos-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pos-total-lbl{font-size:13px;color:var(--txt2)}
.pos-total-val{font-size:22px;font-weight:800;color:var(--green)}
.pos-disc-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.pos-disc-row label{font-size:11px;color:var(--txt2)}
.pos-disc-row input{width:80px;padding:5px 8px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg)}
.pos-disc-btn{padding:5px 10px;font-size:11px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--amber-l);color:var(--amber);cursor:pointer;font-family:inherit}
.pos-client-row{margin-bottom:8px}
.pos-client-row select{width:100%;padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg);font-family:inherit}
.pos-pay-btn{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.pos-pay-btn:hover{background:var(--green-m)}
.pos-pay-btn:disabled{background:var(--txt3);cursor:not-allowed}
.pos-barcode-row{display:flex;gap:6px;margin-bottom:10px}
.pos-barcode-row input{flex:1;padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg);font-family:inherit}

/* ── RECEIPT PRINT ── */
@media print{
  body>*{display:none!important}
  #receipt-print{display:block!important}
}
#receipt-print{display:none;font-family:'Courier New',monospace;font-size:12px;width:280px;margin:0 auto;direction:rtl}
.rcp-logo{text-align:center;font-size:16px;font-weight:bold;border-bottom:1px dashed #000;padding-bottom:6px;margin-bottom:6px}
.rcp-row{display:flex;justify-content:space-between;margin:2px 0}
.rcp-sep{border-top:1px dashed #000;margin:6px 0}
.rcp-total{font-size:15px;font-weight:bold}

/* ── USERS PAGE ── */
.user-card{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--bdr)}
.user-card:last-child{border-bottom:none}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--green);flex-shrink:0}
.user-info-col{flex:1}
.user-name{font-size:14px;font-weight:600}
.user-role{font-size:11px;color:var(--txt2)}

/* ── ACCOUNT STATEMENT ── */
.stmt-balance{text-align:center;padding:16px;border-radius:var(--r);margin-bottom:12px}
.stmt-bal-pos{background:var(--green-l)}
.stmt-bal-neg{background:var(--red-l)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .fg{grid-template-columns:1fr}
  .pos-cart{width:260px}
  .pos-products{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .pos-card-price{font-size:15px}
}
@media(max-width:480px){
  .pos-body{flex-direction:column}
  .pos-cart{width:100%;height:50%;border-right:none;border-top:1px solid var(--bdr)}
  .pos-products{height:50%}
}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">LebnAra</div>
    <div class="login-sub">لبينارا — نظام إدارة الألبان والأجبان</div>
    <input type="text" id="l-user" placeholder="اسم المستخدم" autocomplete="username">
    <input type="password" id="l-pass" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-err" id="login-err">اسم المستخدم أو كلمة المرور غير صحيحة</div>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app">
  <div class="topbar">
    <div class="logo-wrap">
      <div class="logo-icon">LB</div>
      <div>
        <div class="logo-name">LebnAra</div>
        <div class="logo-ar">لبينارا</div>
      </div>
    </div>
    <div class="user-info">
      <span id="top-username"></span>
      <span class="role-badge" id="top-role-badge"></span>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>
  <div class="nav" id="main-nav"></div>
  <div class="main" id="main-content"></div>
</div>

<!-- ══════════════ POS OVERLAY ══════════════ -->
<div id="pos-page">
  <div class="pos-top">
    <div class="pos-title">🧀 LebnAra — نقطة البيع</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="pos-cashier" style="font-size:12px;opacity:.8"></span>
      <button onclick="closePOS()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px">✕ خروج</button>
    </div>
  </div>
  <div class="pos-body">
    <!-- المنتجات -->
    <div class="pos-products" id="pos-products-grid"></div>
    <!-- السلة -->
    <div class="pos-cart">
      <div style="padding:10px;border-bottom:1px solid var(--bdr);display:flex;gap:6px">
        <div class="pos-barcode-row" style="margin:0;flex:1">
          <input type="text" id="pos-barcode" placeholder="باركود..." onkeydown="if(event.key==='Enter')scanBarcode()">
          <button onclick="scanBarcode()" class="btn btn-sm btn-b">بحث</button>
        </div>
      </div>
      <div class="pos-cart-items" id="pos-cart-items">
        <div style="text-align:center;padding:30px;color:var(--txt3);font-size:13px">اضغط على منتج للإضافة</div>
      </div>
      <div class="pos-footer">
        <div class="pos-client-row">
          <select id="pos-client">
            <option value="">كاش — بدون عميل</option>
          </select>
        </div>
        <div class="pos-disc-row">
          <label>خصم:</label>
          <input type="number" id="pos-disc-pct" placeholder="%" min="0" max="10" step="1" oninput="updatePOSTotal()">
          <button class="pos-disc-btn" onclick="applyDiscount10()">10%</button>
          <label style="margin-right:8px">قيمة:</label>
          <input type="number" id="pos-disc-val" placeholder="ل.س" min="0" oninput="updatePOSTotal()">
        </div>
        <div class="pos-total-row">
          <span class="pos-total-lbl">الإجمالي</span>
          <span class="pos-total-val" id="pos-total">0 ل.س</span>
        </div>
        <div class="pos-total-row" id="pos-disc-display" style="display:none">
          <span style="font-size:12px;color:var(--red)">الخصم</span>
          <span style="font-size:13px;font-weight:600;color:var(--red)" id="pos-disc-amount">0 ل.س</span>
        </div>
        <div class="pos-total-row" id="pos-net-row" style="display:none">
          <span style="font-size:13px;font-weight:600">الصافي</span>
          <span style="font-size:20px;font-weight:800;color:var(--green)" id="pos-net-total">0 ل.س</span>
        </div>
        <button class="pos-pay-btn" id="pos-pay-btn" onclick="processPOSSale()">💰 إتمام الدفع</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════ RECEIPT ══════════════ -->
<div id="receipt-print"></div>

<!-- ══════════════ TOAST ══════════════ -->
<div id="toast"></div>

let CU = null; // current user

async function doLogin() {
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value;
  if (!username || !password) return;
  const { data, error } = await sb.from('app_users')
    .select('*').eq('username', username).eq('password_hash', password).eq('is_active', true).single();
  if (error || !data) {
    document.getElementById('login-err').style.display = 'block'; return;
  }
  CU = data;
  document.getElementById('login-err').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('top-username').textContent = data.full_name;
  const rb = document.getElementById('top-role-badge');
  rb.textContent = ROLES[data.role]?.label || data.role;
  rb.className = 'role-badge ' + (ROLES[data.role]?.badge || '');
  buildNav();
  await logAction('تسجيل دخول', 'دخل إلى النظام', 'login');
  showPage('dashboard');
}

function doLogout() {
  logAction('تسجيل خروج', 'خرج من النظام', 'logout');
  CU = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('l-pass').value = '';
  document.getElementById('main-content').innerHTML = '';
}

document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('l-user').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('l-pass').focus(); });

function can(action) {
  if (!CU) return false;
  if (CU.role === 'admin') return true;
  const rolePerms = {
    factory:   ['view_dashboard','factory_production','view_inventory','sales_cashonly','returns'],
    farm:      ['view_dashboard','milk_record','purchase_request'],
    sales:     ['view_dashboard','sales_full','view_clients','returns','pos'],
    purchases: ['view_dashboard','view_purchases','purchase_request'],
  };
  return (rolePerms[CU.role] || []).includes(action);
}

async function logAction(action, details = '', page = '') {
  if (!CU) return;
  await sb.from('user_logs').insert({
    user_id: CU.id, username: CU.username,
    action, details, page
  });
}

//  NAV & ROUTING
// ══════════════════════════════════════════════
function buildNav() {
  const nav = document.getElementById('main-nav');
  nav.innerHTML = '';
  Object.entries(PAGES).forEach(([key, pg]) => {
    if (!pg.roles.includes(CU.role)) return;
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = pg.label;
    btn.dataset.page = key;
    if (pg.isPOS) {
      btn.onclick = () => openPOS();
    } else {
      btn.onclick = () => showPage(key, btn);
    }
    nav.appendChild(btn);
  });
}

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const b = document.querySelector(`.nav-btn[data-page="${name}"]`);
    if (b) b.classList.add('active');
  }
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div id="page-${name}" class="page active"></div>`;
  const pg = document.getElementById(`page-${name}`);
  const loader = pageLoaders[name];
  if (loader) loader(pg);
}

const pageLoaders = {
  dashboard:  renderDashboard,
  milk:       renderMilk,
  factory:    renderFactory,
  inventory:  renderInventory,
  costs:      renderCosts,
  sales_page: renderSales,
  clients:    renderClients,
  purchases:  renderPurchases,
  returns:    renderReturns,
  accounts:   renderAccounts,
  users:      renderUsers,
  logs:       renderLogs,
};

function fmt(n) { return Math.round(+n||0).toLocaleString('ar-SY'); }
function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = ok ? '#1a1a1a' : '#a32d2d';
  t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display='none', 3000);
}
function modal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function setDate(id) { const el = document.getElementById(id); if(el) el.value = todayStr(); }
function tabs(prefix, name, btn, loader) {
  document.querySelectorAll(`[id^="${prefix}-tab-"]`).forEach(el => el.style.display='none');
  const el = document.getElementById(`${prefix}-tab-${name}`);
  if (el) el.style.display = 'block';
  btn.closest('.tabs').querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (loader) loader();
}

async function saveMilk() {
  const date = document.getElementById('mk-date').value;
  const session = document.getElementById('mk-session').value;
  const inputs = document.querySelectorAll('#mk-rows input[type=number]');
  const recs = [];
  inputs.forEach(inp => { const l= +inp.value; if(l>0) recs.push({record_date:date,session,cow_id:+inp.dataset.cow,liters:l,quality:'جيدة'}); });
  if (!recs.length) { toast('أدخل كميات الحليب',false); return; }
  const {error} = await sb.from('milk_records').insert(recs);
  if (error) { toast('خطأ: '+error.message,false); return; }
  await logAction('تسجيل حليب', `${date} ${session} — ${recs.reduce((s,r)=>s+r.liters,0).toFixed(1)} لتر`, 'milk');
  toast('تم حفظ سجل الحلب ✓');
}

async function openMilkEdit(date, session) {
  milkEditMeta = {date, session};

  const [{data:recs},{data:cows}] = await Promise.all([

function calcMkEditTotal() {

async function saveMilkEdit() {

async function loadMilkHist() {

}

async function onFacProdChange() {
  const sel = document.getElementById('fac-prod');
  if(!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const ptype = opt?.dataset?.type||'';
  const labanRow = document.getElementById('fac-laban-row');
  if(!labanRow) return;
  if (ptype === 'labneh') {
    labanRow.style.display='block';
    // جلب مخزون اللبن
    const {data:laban} = await sb.from('products').select('qty').eq('product_type','laban').maybeSingle();
    const stock = laban?.qty||0;
    document.getElementById('fac-laban-stock').textContent = stock+' لتر';
    document.getElementById('fac-laban-remain').textContent = stock+' لتر';
    labanRow._stock = stock;
  } else {
    labanRow.style.display='none';
  }
}

function onFacMilkChange() {
  // إذا كان المنتج لبنة، الحليب المستخدم = اللبن المستخدم
  const sel = document.getElementById('fac-prod');
  const opt = sel?.options[sel?.selectedIndex];
  if(opt?.dataset?.type==='labneh') {
    const milkVal = document.getElementById('fac-milk').value;
    const labanInput = document.getElementById('fac-laban-used');
    if(labanInput && !labanInput.value) labanInput.value = milkVal;
    previewLabanBalance();
  }
}

function previewLabanBalance() {
  const labanRow = document.getElementById('fac-laban-row');
  const used = +document.getElementById('fac-laban-used')?.value||0;
  const stock = labanRow?._stock||0;
  const remain = Math.max(0, stock - used);
  const el = document.getElementById('fac-laban-remain');
  if(el) {
    el.textContent = remain.toFixed(1)+' لتر';
    el.style.color = remain<5?'var(--red)':'var(--teal)';
  }
}

async function saveProduction() {
  const sel = document.getElementById('fac-prod');
  const pn = sel?.value;
  const opt = sel?.options[sel?.selectedIndex];
  const ptype = opt?.dataset?.type||'';
  const qty = +document.getElementById('fac-qty').value;
  const milk = +document.getElementById('fac-milk').value;
  if (!pn||!qty) { toast('أدخل المنتج والكمية',false); return; }
  if (!milk && ptype!=='labneh') { toast('أدخل كمية الحليب المستخدم',false); return; }
  const extraCost = +document.getElementById('fac-cost').value||0;
  const prodDate = document.getElementById('fac-date').value;

  // للبنة: خصم من مخزون اللبن الرائب
  if (ptype === 'labneh') {
    const labanUsed = +document.getElementById('fac-laban-used')?.value||0;
    if (!labanUsed) { toast('أدخل كمية اللبن المستخدمة للبنة',false); return; }
    const {data:labanProd} = await sb.from('products').select('id,qty').eq('product_type','laban').maybeSingle();
    if (labanProd) {
      const newLabanQty = Math.max(0, +labanProd.qty - labanUsed);
      await sb.from('products').update({qty:newLabanQty}).eq('id',labanProd.id);
      await sb.from('inventory_logs').insert({
        product_name:'لبن رائب', change_type:'استخدام لإنتاج لبنة',
        qty_before:+labanProd.qty, qty_after:newLabanQty, qty_change:-labanUsed,
        reason:`دفعة لبنة — ${prodDate}`
      });
    }
  }

  const {error, data:prod} = await sb.from('productions').insert({
    prod_date: prodDate,
    product_name:pn, milk_used:milk||0, qty_produced:qty,
    extra_cost: extraCost,
    expiry_date: document.getElementById('fac-expiry').value||null,
    calcium_chloride: +document.getElementById('fac-calcium').value||0,
    rennet_ml: +document.getElementById('fac-rennet').value||0,
    milk_powder_g: +document.getElementById('fac-powder').value||0,
    notes: document.getElementById('fac-notes').value,
  }).select().single();
  if (error) { toast('خطأ: '+error.message,false); return; }

  // حساب التكلفة تلقائياً (فقط لغير اللبنة أو نحسب بالحليب المستخدم)
  if (milk > 0) await calcProductionCost(prod, prodDate, milk, qty, extraCost);

  // تحديث المخزون
  const {data:p} = await sb.from('products').select('qty').eq('name',pn).maybeSingle();
  if (p) {
    await sb.from('products').update({qty: +p.qty+qty}).eq('name',pn);
    await sb.from('inventory_logs').insert({
      product_name:pn, change_type:'إنتاج معمل',
      qty_before:+p.qty, qty_after:+p.qty+qty, qty_change:qty,
      reason:`دفعة إنتاج — ${prodDate}`
    });
  }

  await logAction('إنتاج معمل', `${pn} — ${qty} وحدة`, 'factory');
  toast('تم تسجيل الدفعة ✓');
  ['fac-qty','fac-milk','fac-notes','fac-laban-used'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  // تحديث عرض مخزون اللبن
  onFacProdChange();
}

async function calcProductionCost(prod, prodDate, milkUsed, qtyProduced, extraCost) {
  if (!qtyProduced) return;
  // جلب إعدادات التكلفة
  const {data:settings} = await sb.from('cost_settings').select('setting_key,setting_value');
  const cfg = {};
  (settings||[]).forEach(s => cfg[s.setting_key] = +s.setting_value);
  const milkPrice = cfg['milk_price_per_liter'] || 20;
  const dieselPrice = cfg['diesel_price_per_liter'] || 500;
  const dieselLiters = cfg['diesel_liters_per_day'] || 14;

  // تكلفة الحليب
  const milkCost = milkUsed * milkPrice;

  // تكلفة المازوت: إجمالي إنتاج اليوم أولاً
  const {data:dayProds} = await sb.from('productions').select('qty_produced').eq('prod_date', prodDate);
  const dayTotal = (dayProds||[]).reduce((s,r)=>s + +r.qty_produced, 0) || qtyProduced;
  const totalDieselCost = dieselLiters * dieselPrice;
  const dieselCost = (qtyProduced / dayTotal) * totalDieselCost;

  // تكلفة عمال المعمل اليومية (مقسّمة على الإنتاج اليومي)
  const thisMonth = prodDate.slice(0,7);
  const {data:sals} = await sb.from('salaries').select('net_salary').eq('salary_month', thisMonth).eq('department','معمل');
  const monthlyFactoryLabor = (sals||[]).reduce((s,r)=>s + +r.net_salary, 0);
  const dailyLaborCost = monthlyFactoryLabor / 30;
  const laborCost = dayTotal > 0 ? (qtyProduced / dayTotal) * dailyLaborCost : 0;

  // تكلفة المواد (تقريبية)
  const materialsCost = 0; // يمكن تطويرها لاحقاً بسعر الكالسيوم والمنفحة

  const totalCost = milkCost + dieselCost + laborCost + materialsCost + extraCost;
  const costPerUnit = qtyProduced > 0 ? totalCost / qtyProduced : 0;

  // متوسط آخر 30 دفعة من نفس المنتج
  const {data:recent} = await sb.from('production_costs')
    .select('cost_per_unit').eq('product_name', prod.product_name)
    .order('created_at',{ascending:false}).limit(30);
  const recentCosts = (recent||[]).map(r=> +r.cost_per_unit).filter(v=>v>0);
  recentCosts.push(costPerUnit);
  const avg30 = recentCosts.reduce((a,b)=>a+b,0) / recentCosts.length;
  const suggestedPrice = Math.ceil(avg30 * 1.25 / 100) * 100; // هامش 25% مقرّب لأعلى مئة

  await sb.from('production_costs').insert({
    production_id: prod.id,
    prod_date: prodDate,
    product_name: prod.product_name,
    qty_produced: qtyProduced,
    milk_cost: Math.round(milkCost),
    labor_cost: Math.round(laborCost),
    diesel_cost: Math.round(dieselCost),
    materials_cost: Math.round(materialsCost),
    extra_cost: Math.round(extraCost),
    total_cost: Math.round(totalCost),
    cost_per_unit: Math.round(costPerUnit),
    avg_cost_30d: Math.round(avg30),
    suggested_price: suggestedPrice,
  });

  // تحديث سعر البيع المقترح في جدول المنتجات (للمبيعات)
  await sb.from('products').update({ cost_per_unit: Math.round(avg30) }).eq('name', prod.product_name);
}

let invCurrent = {};
async function loadInvList() {
  const {data} = await sb.from('products').select('*').order('name');
  const isAdmin = CU.role==='admin';
  const tb = document.getElementById('inv-tb');
  tb.innerHTML = (data||[]).map(p=>{
    const m = +p.price_per_unit>0 ? Math.round(((+p.price_per_unit - +p.cost_per_unit)/ +p.price_per_unit)*100) : 0;
    const st = +p.qty> +p.min_qty*2?['متوفر','b-green']: +p.qty> +p.min_qty?['محدود','b-amber']:['منخفض','b-red'];
    return `<tr>
      <td><strong>${p.name}</strong>${p.barcode?`<br><span style="font-size:10px;color:var(--txt3)">${p.barcode}</span>`:''}</td>
      <td>${p.qty}</td><td>${p.unit}</td>
      <td>${fmt(p.cost_per_unit)} ${CUR}</td><td>${fmt(p.price_per_unit)} ${CUR}</td>
      <td style="color:${m>=30?'var(--green)':m>=15?'var(--amber)':'var(--red)'}">${m}%</td>
      <td><span class="badge ${st[1]}">${st[0]}</span></td>
      ${isAdmin?`<td style="display:flex;gap:4px;flex-wrap:nowrap">
        <button class="btn btn-sm" onclick="openInvAdj('${p.name}',${p.qty},'${p.unit}')">كمية</button>
        <button class="btn btn-sm btn-b" onclick="openInvPrice('${p.name}',${p.cost_per_unit},${p.price_per_unit})">سعر</button>
      </td>`:''}
    </tr>`;
  }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--txt3)">لا توجد منتجات</td></tr>';
}

async function saveProduct() {
  const name = document.getElementById('inv-name').value.trim();
  if (!name) { toast('أدخل اسم المنتج',false); return; }
  const qty = +document.getElementById('inv-qty').value||0;
  const unit = document.getElementById('inv-unit').value;
  const min_qty = +document.getElementById('inv-min').value||5;
  const cost_per_unit = +document.getElementById('inv-cost').value||0;
  const price_per_unit = +document.getElementById('inv-price').value||0;
  const barcode = document.getElementById('inv-barcode').value||null;

  // تحقق أولاً هل المنتج موجود
  const {data:existing} = await sb.from('products').select('id,qty').eq('name',name).maybeSingle();
  if (existing) {
    // تحديث المنتج الموجود
    await sb.from('products').update({unit,min_qty,cost_per_unit,price_per_unit,barcode}).eq('id',existing.id);
    if (qty>0) {
      const newQty = +existing.qty + qty;
      await sb.from('products').update({qty:newQty}).eq('id',existing.id);
      await sb.from('inventory_logs').insert({product_name:name,change_type:'إضافة للمخزون',qty_before:+existing.qty,qty_after:newQty,qty_change:qty,reason:'تعديل يدوي'});
    }
    toast('تم تحديث المنتج ✓');
  } else {
    // منتج جديد
    const {error} = await sb.from('products').insert({name,unit,qty,min_qty,cost_per_unit,price_per_unit,barcode});
    if (error) { toast('خطأ: '+error.message,false); return; }
    if (qty>0) await sb.from('inventory_logs').insert({product_name:name,change_type:'منتج جديد',qty_before:0,qty_after:qty,qty_change:qty,reason:'إضافة منتج جديد'});
    toast('تم إضافة المنتج ✓');
  }
  await logAction('حفظ منتج', name, 'inventory');
  document.getElementById('inv-name').value='';
  document.getElementById('inv-qty').value='0';
  // تحديث قائمة المنتجات في صفحة الإنتاج إن كانت مفتوحة
  refreshFactoryProductList();
  loadInvList();
}

// تحديث قائمة المنتجات في الإنتاج بدون إعادة تحميل الصفحة
async function refreshFactoryProductList() {
  const sel = document.getElementById('fac-prod');
  if (!sel) return;
  const {data:prods} = await sb.from('products').select('name,unit').order('name');
  const cur = sel.value;
  sel.innerHTML = (prods||[]).map(p=>`<option value="${p.name}" data-unit="${p.unit||'كغ'}">${p.name}</option>`).join('');
  if (cur) sel.value = cur;
}

function openInvAdj(name,qty,unit) {
  invCurrent = {name,qty:+qty,unit};
  document.getElementById('inv-qty-title').textContent = 'تعديل كمية: '+name;
  document.getElementById('inv-cur-qty').textContent = qty+' '+unit;
  document.getElementById('inv-adj-qty').value='';
  document.getElementById('inv-adj-reason').value='';
  document.getElementById('inv-adj-preview').textContent='—';
  modal('inv-qty-modal');
}
function previewInvAdj() {
  const type = document.getElementById('inv-adj-type').value;
  const q = +document.getElementById('inv-adj-qty').value||0;
  const cur = invCurrent.qty;
  const after = type==='add'?cur+q:type==='sub'?Math.max(0,cur-q):q;
  document.getElementById('inv-adj-preview').textContent = after.toFixed(1)+' '+invCurrent.unit;
}
async function saveInvAdj() {
  const type = document.getElementById('inv-adj-type').value;
  const q = +document.getElementById('inv-adj-qty').value||0;
  const reason = document.getElementById('inv-adj-reason').value.trim();
  if (!reason) { toast('أدخل سبب التعديل',false); return; }
  const cur = invCurrent.qty;
  const after = type==='add'?cur+q:type==='sub'?Math.max(0,cur-q):q;
  const change = after-cur;
  await sb.from('products').update({qty:after}).eq('name',invCurrent.name);
  await sb.from('inventory_logs').insert({product_name:invCurrent.name,change_type:type==='add'?'إضافة':type==='sub'?'خصم':'تعيين',qty_before:cur,qty_after:after,qty_change:change,reason});
  await logAction('تعديل مخزون', `${invCurrent.name}: ${cur}→${after}`, 'inventory');
  closeModal('inv-qty-modal'); loadInvList(); toast('تم تعديل الكمية ✓');
}

let priceCurrent = {};
function openInvPrice(name,cost,price) {
  priceCurrent = {name};
  document.getElementById('inv-price-title').textContent = 'أسعار: '+name;
  document.getElementById('inv-pcost').value = cost;
  document.getElementById('inv-pprice').value = price;
  previewMargin();
  modal('inv-price-modal');
}
function previewMargin() {
  const c=+document.getElementById('inv-pcost').value||0;
  const p=+document.getElementById('inv-pprice').value||0;
  const m = p>0?Math.round(((p-c)/p)*100):0;
  const el=document.getElementById('inv-margin-preview');
  el.textContent=m+'%'; el.style.color=m>=20?'var(--green)':m>=10?'var(--amber)':'var(--red)';
}
async function saveInvPrice() {
  const c=+document.getElementById('inv-pcost').value||0;
  const p=+document.getElementById('inv-pprice').value||0;
  await sb.from('products').update({cost_per_unit:c,price_per_unit:p}).eq('name',priceCurrent.name);
  await sb.from('inventory_logs').insert({product_name:priceCurrent.name,change_type:'تعديل أسعار',qty_before:0,qty_after:0,qty_change:0,reason:`تكلفة: ${fmt(c)} — بيع: ${fmt(p)}`});
  await logAction('تعديل أسعار', `${priceCurrent.name}: ${fmt(c)}→${fmt(p)}`, 'inventory');
  closeModal('inv-price-modal'); loadInvList(); toast('تم تحديث الأسعار ✓');
}

async function loadInvLog() {
  const {data} = await sb.from('inventory_logs').select('*').order('created_at',{ascending:false}).limit(200);
  const tb = document.getElementById('inv-log-tb');
  tb.innerHTML = (data||[]).map(l=>{
    const dt = new Date(l.created_at).toLocaleString('ar-SY');
    const ch = +l.qty_change>0?`+${l.qty_change}`: l.qty_change;
    const col = +l.qty_change>0?'var(--green)': +l.qty_change<0?'var(--red)':'var(--txt2)';
    return `<tr>
      <td style="font-size:11px">${dt}</td><td><strong>${l.product_name}</strong></td>
      <td><span class="badge b-teal" style="font-size:10px">${l.change_type}</span></td>
      <td>${l.qty_before}</td><td style="color:${col};font-weight:600">${ch}</td><td>${l.qty_after}</td>
      <td style="font-size:11px;color:var(--txt2)">${l.reason||'—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--txt3)">لا توجد تعديلات</td></tr>';
}

let saleRows = [{prod:'',qty:1,price:0}];
function initNewSale() {
  saleRows = [{prod:'',qty:1,price:0}];
  renderSaleRows();
}
function addSaleRow() { saleRows.push({prod:'',qty:1,price:0}); renderSaleRows(); }
function removeSaleRow(i) { saleRows.splice(i,1); if(!saleRows.length) saleRows=[{prod:'',qty:1,price:0}]; renderSaleRows(); }

async function renderSaleRows() {
  const {data:prods} = await sb.from('products').select('name,price_per_unit').order('name');
  const tb = document.getElementById('sl-items-tb');
  tb.innerHTML = saleRows.map((r,i)=>`<tr>
    <td><select onchange="setSaleRow(${i},'prod',this)" style="font-size:12px;padding:4px 6px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);max-width:150px" id="sl-sel-${i}">
      <option value="">-- اختر --</option>
      ${(prods||[]).map(p=>`<option value="${p.name}" data-price="${p.price_per_unit}" ${r.prod===p.name?'selected':''}>${p.name}</option>`).join('')}
    </select></td>
    <td><input type="number" value="${r.qty}" min="0.1" step="0.1" style="width:60px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px" oninput="setSaleRow(${i},'qty',this.value)"></td>
    <td><input type="number" value="${r.price}" step="1" style="width:80px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px" oninput="setSaleRow(${i},'price',this.value)"></td>
    <td style="font-weight:600">${fmt(r.qty*r.price)} ${CUR}</td>
    <td><button onclick="removeSaleRow(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:0 4px">×</button></td>
  </tr>`).join('');
  updateSaleGrand();
}
function setSaleRow(i,field,val) {
  if (field==='prod') {
    saleRows[i].prod = val.value;
    const opt = val.options[val.selectedIndex];
    if (opt?.dataset?.price) saleRows[i].price = +opt.dataset.price;
  } else { saleRows[i][field] = +val; }
  renderSaleRows();
}
function updateSaleGrand() {
  const tot = saleRows.reduce((s,r)=>s+r.qty*r.price,0);
  document.getElementById('sl-grand').textContent = fmt(tot)+' '+CUR;
}
async function saveSalePage() {
  const clientId = document.getElementById('sl-client').value;
  const total = saleRows.reduce((s,r)=>s+r.qty*r.price,0);
  if (!total) { toast('أضف منتجات للفاتورة',false); return; }
  const pay = document.getElementById('sl-pay').value;
  const {data:sale,error} = await sb.from('sales').insert({
    sale_date: document.getElementById('sl-date').value,
    client_id: clientId||null, total, payment_method:pay,
  }).select().single();
  if (error) { toast('خطأ: '+error.message,false); return; }
  const items = saleRows.filter(r=>r.prod).map(r=>({sale_id:sale.id,product_name:r.prod,qty:r.qty,unit_price:r.price}));
  if (items.length) await sb.from('sale_items').insert(items);
  if (pay==='آجل'&&clientId) {
    const {data:cl} = await sb.from('clients').select('debt').eq('id',clientId).single();
    await sb.from('clients').update({debt:(+cl?.debt||0)+total}).eq('id',clientId);
  }
  await logAction('إصدار فاتورة', `#${sale.id} — ${fmt(total)} ${CUR} — ${pay}`, 'sales');
  saleRows=[{prod:'',qty:1,price:0}]; renderSaleRows();
  toast('تم إصدار الفاتورة #'+sale.id+' ✓');
}
async function loadSalesHist() {
  const {data} = await sb.from('sales').select('id,sale_date,total,payment_method,clients(name)').order('created_at',{ascending:false}).limit(100);
  const tb = document.getElementById('sl-hist-tb');
  tb.innerHTML = (data||[]).map(s=>`<tr>
    <td>#${s.id}</td><td>${s.sale_date}</td><td>${s.clients?.name||'كاش'}</td>
    <td>${fmt(s.total)} ${CUR}</td>
    <td><span class="badge ${s.payment_method==='آجل'?'b-amber':'b-green'}">${s.payment_method}</span></td>
  </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد مبيعات</td></tr>';
}

function quickStmt(id) {

  sel.value=id;

  const btn = document.querySelector('[onclick*="cl-tab-stmt"]') || document.querySelector('.tab[onclick*="stmt"]');

    sb.from('sales').select('id,sale_date,total,payment_method').eq('client_id',id).order('sale_date',{ascending:false}),

  ]);

  const totalPaid = (pays||[]).reduce((s,r)=>s+ +r.amount,0);
  const balance = +cl?.debt||0;
  body.innerHTML = `

    <div style="font-size:12px;color:var(--txt2);margin-bottom:4px">الرصيد الحالي</div>

    <div class="kpi" style="flex:1;min-width:120px"><div class="kpi-lbl">إجمالي المدفوع</div><div class="kpi-val" style="font-size:18px;color:var(--green)">${fmt(totalPaid)}</div><div class="kpi-unit">${CUR}</div></div>
  </div>
  <div style="font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:6px">المبيعات الآجلة</div>
  <div class="tw"><table>
    <thead><tr><th>#</th><th>التاريخ</th><th>المبلغ</th><th>الدفع</th></tr></thead>
    <tbody>${(sls||[]).map(s=>`<tr><td>#${s.id}</td><td>${s.sale_date}</td><td>${fmt(s.total)} ${CUR}</td><td><span class="badge ${s.payment_method==='آجل'?'b-amber':'b-green'}">${s.payment_method}</span></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--txt3)">لا توجد</td></tr>'}</tbody>
  </table></div>
  <div style="font-size:12px;font-weight:600;color:var(--txt2);margin:10px 0 6px">الدفعات المستلمة</div>
  <div class="tw"><table>
    <thead><tr><th>التاريخ</th><th>المبلغ</th><th>الرصيد بعد</th><th>ملاحظات</th></tr></thead>

async function saveClient() {
  const name = document.getElementById('cl-name').value.trim();
  if (!name) { toast('أدخل اسم العميل',false); return; }
  await sb.from('clients').insert({name, phone:document.getElementById('cl-phone').value, client_type:document.getElementById('cl-type').value, notes:document.getElementById('cl-notes').value, debt:0});
  await logAction('إضافة عميل', name, 'clients');
  document.getElementById('cl-name').value='';
  loadClientsList(); toast('تمت إضافة العميل ✓');
}

async function savePayment() {
  const clientId = document.getElementById('pay-client-sel').value;
  const amount = +document.getElementById('pay-amount').value||0;
  if (!clientId||!amount) { toast('اختر العميل وأدخل المبلغ',false); return; }
  const {data:cl} = await sb.from('clients').select('debt,name').eq('id',clientId).single();
  const newDebt = Math.max(0,(+cl?.debt||0)-amount);
  await sb.from('clients').update({debt:newDebt}).eq('id',clientId);
  await sb.from('payments').insert({client_id:+clientId,payment_date:document.getElementById('pay-date').value,amount,balance_after:newDebt,notes:document.getElementById('pay-notes').value});
  await logAction('تسجيل دفعة', `${cl?.name} — ${fmt(amount)} ${CUR}`, 'clients');
  document.getElementById('pay-amount').value='';
  document.getElementById('pay-notes').value='';
  loadPayHist(); loadClientsList(); toast('تم تسجيل الدفعة ✓');
}

async function loadPayHist() {
  const {data} = await sb.from('payments').select('*,clients(name)').order('payment_date',{ascending:false}).limit(50);
  const tb = document.getElementById('pay-hist-tb');
  if (!tb) return;
  tb.innerHTML = (data||[]).map(p=>`<tr>
    <td>${p.payment_date}</td><td>${p.clients?.name||'—'}</td>
    <td style="color:var(--green);font-weight:600">${fmt(p.amount)} ${CUR}</td>
    <td>${fmt(p.balance_after)} ${CUR}</td>
    <td style="font-size:11px">${p.notes||'—'}</td>
  </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد دفعات</td></tr>';
}

function calcSalNet() {
  const b=+document.getElementById('sal-base').value||0;
  const bo=+document.getElementById('sal-bonus').value||0;
  const d=+document.getElementById('sal-deduct').value||0;
  document.getElementById('sal-net-preview').textContent=fmt(b+bo-d)+' '+CUR;

async function loadAccSummary() {
  const [salesR,expR,salR,debtR] = await Promise.all([
    sb.from('sales').select('total'),
    sb.from('expenses').select('amount,category'),
    sb.from('salaries').select('net_salary'),
    sb.from('clients').select('debt'),
  ]);
  const rev=(salesR.data||[]).reduce((s,r)=>s+ +r.total,0);
  const exp=(expR.data||[]).reduce((s,r)=>s+ +r.amount,0);
  const sal=(salR.data||[]).reduce((s,r)=>s+ +r.net_salary,0);
  const debt=(debtR.data||[]).reduce((s,r)=>s+ +r.debt,0);
  const net=rev-exp;
  const bycat={};
  (expR.data||[]).forEach(e=>bycat[e.category]=(bycat[e.category]||0)+ +e.amount);
  document.getElementById('ac-tab-summary').innerHTML=`
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-lbl">الإيرادات</div><div class="kpi-val" style="color:var(--green)">${fmt(rev)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">المصاريف</div><div class="kpi-val" style="color:var(--red)">${fmt(exp)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">المعاشات</div><div class="kpi-val" style="color:var(--amber)">${fmt(sal)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">صافي الربح</div><div class="kpi-val" style="color:${net>=0?'var(--green)':'var(--red)'}">${fmt(net)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">الديون المستحقة</div><div class="kpi-val" style="color:var(--amber)">${fmt(debt)}</div><div class="kpi-unit">${CUR}</div></div>
  </div>
  <div class="sec">توزيع المصاريف</div>
  <div class="card">${Object.entries(bycat).sort((a,b)=>b[1]-a[1]).map(([c,a])=>{
    const pct=exp>0?Math.round(a/exp*100):0;
    return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>${c}</span><span style="color:var(--txt2)">${fmt(a)} ${CUR} (${pct}%)</span></div><div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div></div>`;
  }).join('')||'<div style="text-align:center;color:var(--txt3);padding:16px">لا توجد مصاريف</div>'}</div>`;

async function saveSalary() {
  const name=document.getElementById('sal-name').value.trim();
  const base=+document.getElementById('sal-base').value||0;
  const bonus=+document.getElementById('sal-bonus').value||0;
  const deduct=+document.getElementById('sal-deduct').value||0;
  const month=document.getElementById('sal-month').value;

async function loadPLReport() {
  const [sR,eR,salR]= await Promise.all([sb.from('sales').select('total'),sb.from('expenses').select('amount,category'),sb.from('salaries').select('net_salary')]);
  const rev=(sR.data||[]).reduce((s,r)=>s+ +r.total,0);
  const byc={};(eR.data||[]).forEach(e=>byc[e.category]=(byc[e.category]||0)+ +e.amount);
  const sal=(salR.data||[]).reduce((s,r)=>s+ +r.net_salary,0);
  const exp=Object.values(byc).reduce((a,b)=>a+b,0);
  const net=rev-exp;
  const margin=rev>0?((net/rev)*100).toFixed(1):0;
  document.getElementById('pl-card').innerHTML=`<table>
    <tr style="background:var(--bg)"><td colspan="2" style="padding:10px;font-weight:700">الإيرادات</td></tr>
    <tr><td style="padding:8px 10px;color:var(--txt2)">مبيعات المنتجات</td><td style="color:var(--green);font-weight:700">${fmt(rev)} ${CUR}</td></tr>
    <tr style="background:var(--bg)"><td colspan="2" style="padding:10px;font-weight:700">المصاريف التشغيلية</td></tr>
    ${Object.entries(byc).map(([c,a])=>`<tr><td style="padding:8px 10px;color:var(--txt2)">${c}</td><td style="color:var(--red)">${fmt(a)} ${CUR}</td></tr>`).join('')}
    <tr style="background:var(--bg)"><td colspan="2" style="padding:10px;font-weight:700">المعاشات</td></tr>
    <tr><td style="padding:8px 10px;color:var(--txt2)">إجمالي الرواتب</td><td style="color:var(--red)">${fmt(sal)} ${CUR}</td></tr>
    <tr style="border-top:2px solid var(--bdr)"><td style="padding:10px;font-weight:700">صافي الربح</td><td style="font-size:22px;font-weight:800;color:${net>=0?'var(--green)':'var(--red)'}">${fmt(net)} ${CUR}</td></tr>
    <tr><td style="padding:8px 10px;color:var(--txt2)">هامش الربح</td><td style="font-weight:700">${margin}%</td></tr>
  </table>`;
}

async function saveNewUser() {
  const username=document.getElementById('nu-user').value.trim();
  const pass=document.getElementById('nu-pass').value;
  const name=document.getElementById('nu-name').value.trim();
  const role=document.getElementById('nu-role').value;
  if(!username||!pass||!name){toast('أدخل جميع البيانات',false);return;}
  const {error}=await sb.from('app_users').insert({username,password_hash:pass,full_name:name,role,is_active:true});
  if(error){toast('خطأ: '+error.message,false);return;}
  await logAction('إضافة مستخدم',`${name} (${username}) — ${role}`,'users');
  toggleAddUser(); loadUsersList(); toast('تمت إضافة المستخدم ✓');
}

async function changeUserRole(id,role) {
  await sb.from('app_users').update({role}).eq('id',id);
  await logAction('تغيير صلاحية',`#${id} → ${role}`,'users');
  loadUsersList(); toast('تم تغيير الصلاحية ✓');
}

async function toggleUser(id, active) {
  await sb.from('app_users').update({is_active:!active}).eq('id',id);
  await logAction(active?'تعطيل مستخدم':'تفعيل مستخدم',`#${id}`,'users');
  loadUsersList(); toast(active?'تم تعطيل المستخدم':'تم تفعيل المستخدم');
}

async function loadCostDashboard() {
  const today = todayStr();
  const {data:todayCosts} = await sb.from('production_costs').select('*').eq('prod_date', today);

  const milkTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.milk_cost, 0);
  const dieselTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.diesel_cost, 0);
  const laborTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.labor_cost, 0);
  const totalProd = (todayCosts||[]).reduce((s,r)=>s+ +r.qty_produced, 0);
  const totalCost = (todayCosts||[]).reduce((s,r)=>s+ +r.total_cost, 0);
  const avgPerKg = totalProd > 0 ? totalCost / totalProd : 0;

  document.getElementById('ck-today').textContent = fmt(avgPerKg);
  document.getElementById('ck-milk').textContent = fmt(milkTotal);
  document.getElementById('ck-diesel').textContent = fmt(dieselTotal);
  document.getElementById('ck-labor').textContent = fmt(laborTotal);

  // تفصيل اليوم
  const detail = document.getElementById('cost-today-detail');
  if (!todayCosts?.length) {
    detail.innerHTML = '<div style="text-align:center;padding:20px;color:var(--txt3)">لا يوجد إنتاج مسجّل اليوم</div>';
  } else {
    detail.innerHTML = `<div class="tw"><table>
      <thead><tr><th>المنتج</th><th>الكمية</th><th>تك. الحليب</th><th>المازوت</th><th>العمالة</th><th>إضافي</th><th>الإجمالي</th><th>تكلفة/وحدة</th><th>سعر مرجعي</th></tr></thead>
      <tbody>${todayCosts.map(c=>`<tr>
        <td><strong>${c.product_name}</strong></td>
        <td>${c.qty_produced}</td>
        <td>${fmt(c.milk_cost)}</td>
        <td>${fmt(c.diesel_cost)}</td>
        <td>${fmt(c.labor_cost)}</td>
        <td>${fmt(c.extra_cost)}</td>
        <td style="font-weight:700">${fmt(c.total_cost)} ${CUR}</td>
        <td style="color:var(--red);font-weight:700">${fmt(c.cost_per_unit)} ${CUR}</td>
        <td style="color:var(--green);font-weight:700">${fmt(c.suggested_price)} ${CUR}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  // مخطط المتوسط
  const {data:recent} = await sb.from('production_costs')
    .select('prod_date,product_name,cost_per_unit,suggested_price')
    .order('prod_date',{ascending:false}).limit(60);
  const avgChart = document.getElementById('cost-avg-chart');
  if (!recent?.length) { avgChart.innerHTML='<div style="text-align:center;padding:20px;color:var(--txt3)">لا توجد بيانات كافية</div>'; return; }
  // تجميع حسب المنتج
  const byProd = {};
  (recent||[]).forEach(r=>{ if(!byProd[r.product_name]) byProd[r.product_name]=[]; byProd[r.product_name].push(r); });
  avgChart.innerHTML = Object.entries(byProd).map(([prod, rows])=>{
    const avg = rows.reduce((s,r)=>s+ +r.cost_per_unit,0)/rows.length;
    const suggested = rows[0]?.suggested_price||0;
    const minC = Math.min(...rows.map(r=> +r.cost_per_unit));
    const maxC = Math.max(...rows.map(r=> +r.cost_per_unit));
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <strong style="font-size:13px">${prod}</strong>
        <div style="display:flex;gap:12px;font-size:12px">
          <span style="color:var(--txt2)">أدنى: ${fmt(minC)}</span>
          <span style="color:var(--txt2)">أعلى: ${fmt(maxC)}</span>
          <span style="color:var(--red);font-weight:600">متوسط: ${fmt(avg)} ${CUR}</span>
          <span style="color:var(--green);font-weight:600">مرجعي: ${fmt(suggested)} ${CUR}</span>
        </div>
      </div>
      <div style="display:flex;gap:3px;align-items:flex-end;height:50px">
        ${rows.slice(0,20).reverse().map(r=>{
          const h = maxC>0 ? Math.max(4, Math.round((+r.cost_per_unit/maxC)*46)) : 4;
          return `<div style="flex:1;height:${h}px;background:var(--amber-m);border-radius:2px 2px 0 0;min-width:6px" title="${r.prod_date}: ${fmt(r.cost_per_unit)}"></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('<hr style="border:none;border-top:1px solid var(--bdr);margin:12px 0">');
}

async function loadCostBatches() {
  const prodFilter = document.getElementById('cost-prod-filter')?.value;
  const monthFilter = document.getElementById('cost-month-filter')?.value;
  let q = sb.from('production_costs').select('*').order('prod_date',{ascending:false});
  if(prodFilter) q = q.eq('product_name', prodFilter);
  if(monthFilter) q = q.gte('prod_date', monthFilter+'-01').lte('prod_date', monthFilter+'-31');
  const {data} = await q.limit(100);

  // تعبئة فلتر المنتجات
  const {data:prods} = await sb.from('products').select('name').order('name');
  const pf = document.getElementById('cost-prod-filter');
  if(pf && pf.options.length<=1) {
    (prods||[]).forEach(p=>pf.innerHTML+=`<option value="${p.name}">${p.name}</option>`);
  }

  const tb = document.getElementById('cost-batches-tb');
  tb.innerHTML = (data||[]).map(c=>{
    const diff = +c.suggested_price - +c.cost_per_unit;
    return `<tr>
      <td style="font-size:11px">${c.prod_date}</td>
      <td><strong>${c.product_name}</strong></td>
      <td>${c.qty_produced}</td>
      <td>${fmt(c.milk_cost)}</td>
      <td>${fmt(c.diesel_cost)}</td>
      <td>${fmt(c.labor_cost)}</td>
      <td>${fmt(c.extra_cost)}</td>
      <td style="font-weight:600">${fmt(c.total_cost)}</td>
      <td style="color:var(--red);font-weight:700">${fmt(c.cost_per_unit)} ${CUR}</td>
      <td style="color:var(--amber);font-weight:600">${fmt(c.avg_cost_30d)} ${CUR}</td>
      <td style="color:var(--green);font-weight:700">${fmt(c.suggested_price)} ${CUR}
        <span style="font-size:10px;color:var(--txt3)">(+${Math.round(diff/Math.max(1,+c.cost_per_unit)*100)}%)</span>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="11" style="text-align:center;color:var(--txt3)">لا توجد بيانات</td></tr>';
}

async function loadRefPrices() {
  // آخر سعر مرجعي لكل منتج
  const {data:costs} = await sb.from('production_costs').select('product_name,avg_cost_30d,suggested_price').order('created_at',{ascending:false});
  const latestByProd = {};
  (costs||[]).forEach(c=>{ if(!latestByProd[c.product_name]) latestByProd[c.product_name]=c; });
  const {data:prods} = await sb.from('products').select('name,price_per_unit').order('name');
  const tb = document.getElementById('ref-price-tb');
  tb.innerHTML = (prods||[]).map(p=>{
    const ref = latestByProd[p.name];
    if(!ref) return `<tr><td>${p.name}</td><td colspan="5" style="color:var(--txt3)">لا توجد دفعات مسجّلة بعد</td></tr>`;
    const diff = +p.price_per_unit - +ref.suggested_price;
    const diffColor = diff>=0?'var(--green)':'var(--red)';
    return `<tr>
      <td><strong>${p.name}</strong></td>
      <td style="color:var(--red);font-weight:600">${fmt(ref.avg_cost_30d)} ${CUR}</td>
      <td style="color:var(--green);font-weight:700;font-size:15px">${fmt(ref.suggested_price)} ${CUR}</td>
      <td>${fmt(p.price_per_unit)} ${CUR}</td>
      <td style="color:${diffColor};font-weight:600">${diff>=0?'+':''}${fmt(diff)} ${CUR}</td>
      <td>
        <button class="btn btn-sm btn-p" onclick="applyOneRefPrice('${p.name}',${ref.suggested_price})">تطبيق</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--txt3)">لا توجد منتجات</td></tr>';
}

async function applyOneRefPrice(name, price) {
  await sb.from('products').update({price_per_unit: price}).eq('name', name);
  await sb.from('inventory_logs').insert({product_name:name,change_type:'تحديث سعر مرجعي',qty_before:0,qty_after:0,qty_change:0,reason:`سعر مرجعي جديد: ${fmt(price)} ${CUR}`});
  await logAction('تطبيق سعر مرجعي', `${name}: ${fmt(price)} ${CUR}`, 'costs');
  loadRefPrices(); toast(`تم تحديث سعر ${name} ✓`);
}

async function applyRefPrices() {
  if(!confirm('هل تريد تطبيق جميع الأسعار المرجعية على المنتجات؟')) return;
  const {data:costs} = await sb.from('production_costs').select('product_name,suggested_price').order('created_at',{ascending:false});
  const latest = {};
  (costs||[]).forEach(c=>{ if(!latest[c.product_name]) latest[c.product_name]=c.suggested_price; });
  for(const [name, price] of Object.entries(latest)) {
    await sb.from('products').update({price_per_unit: price}).eq('name', name);
    await sb.from('inventory_logs').insert({product_name:name,change_type:'تحديث سعر مرجعي',qty_before:0,qty_after:0,qty_change:0,reason:`سعر مرجعي: ${fmt(price)} ${CUR}`});
  }
  await logAction('تطبيق أسعار مرجعية', `${Object.keys(latest).length} منتجات`, 'costs');
  toast('تم تحديث جميع الأسعار ✓');
  loadRefPrices();
}

async function loadCostSettings() {
  const {data:settings} = await sb.from('cost_settings').select('*').order('setting_key');
  const labels = {
    milk_price_per_liter: 'سعر لتر الحليب الداخلي',
    diesel_price_per_liter: 'سعر لتر المازوت',
    diesel_liters_per_day: 'معدل المازوت اليومي للمعمل (لتر)',
  };
  const form = document.getElementById('cost-settings-form');
  form.innerHTML = `<div class="fg">${(settings||[]).map(s=>`
    <div class="fi">
      <label>${labels[s.setting_key]||s.setting_key}</label>
      <input type="number" id="cs-${s.setting_key}" value="${s.setting_value}" step="1">
    </div>`).join('')}</div>
    <div class="btn-row"><button class="btn btn-p" onclick="saveCostSettings()">حفظ الإعدادات</button></div>`;

  // تكاليف العمالة
  const thisMonth = new Date().toISOString().slice(0,7);
  const {data:sals} = await sb.from('salaries').select('employee_name,department,net_salary').eq('salary_month', thisMonth);
  const byDept = {};
  (sals||[]).forEach(s=>{ if(!byDept[s.department]) byDept[s.department]={total:0,employees:[]}; byDept[s.department].total+= +s.net_salary; byDept[s.department].employees.push(s.employee_name); });
  const lb = document.getElementById('labor-breakdown');
  lb.innerHTML = Object.entries(byDept).length
    ? Object.entries(byDept).map(([dept,info])=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bdr)">
        <div>
          <span class="badge ${dept==='معمل'?'b-teal':dept==='مزرعة'?'b-green':'b-blue'}">${dept}</span>
          <span style="font-size:11px;color:var(--txt2);margin-right:8px">${info.employees.join('، ')}</span>
        </div>
        <strong style="font-size:14px">${fmt(info.total)} ${CUR}/شهر — ${fmt(info.total/30)} ${CUR}/يوم</strong>
      </div>`).join('')
    : `<div style="text-align:center;color:var(--txt3);padding:16px">لا توجد معاشات مسجّلة لهذا الشهر (${thisMonth})</div>`;
}

async function saveCostSettings() {
  const {data:settings} = await sb.from('cost_settings').select('setting_key');
  for(const s of (settings||[])) {
    const el = document.getElementById(`cs-${s.setting_key}`);
    if(el) await sb.from('cost_settings').update({setting_value: +el.value, updated_by: CU.full_name, updated_at: new Date().toISOString()}).eq('setting_key', s.setting_key);
  }
  await logAction('تحديث إعدادات التكلفة', '', 'costs');
  toast('تم حفظ الإعدادات ✓');
}

async function recalcDayCosts() {
  const date = document.getElementById('recalc-date').value;
  if(!date) { toast('اختر التاريخ',false); return; }
  const {data:prods} = await sb.from('productions').select('*').eq('prod_date', date);
  if(!prods?.length) { toast('لا يوجد إنتاج في هذا اليوم',false); return; }
  await sb.from('production_costs').delete().eq('prod_date', date);
  for(const prod of prods) {
    await calcProductionCost(prod, date, prod.milk_used, prod.qty_produced, prod.extra_cost);
  }
  await logAction('إعادة حساب تكاليف', date, 'costs');
  toast(`تم إعادة حساب تكاليف ${date} ✓`);
  loadCostDashboard();
}

let posCart = [];
let posProducts = [];

async function openPOS() {
  document.getElementById('pos-page').classList.add('open');
  document.getElementById('pos-cashier').textContent = CU.full_name;
  await loadPOSProducts();
  await loadPOSClients();
  renderPOSCart();
}
function closePOS() { document.getElementById('pos-page').classList.remove('open'); }

async function loadPOSProducts() {
  const {data}=await sb.from('products').select('*').order('name');
  posProducts = data||[];
  const grid=document.getElementById('pos-products-grid');
  grid.innerHTML=posProducts.map(p=>`
  <div class="pos-card" onclick="addToCart('${p.name.replace(/'/g,"\\'")}')">
    <div class="pos-card-name">${p.name}</div>
    <div class="pos-card-price">${fmt(p.price_per_unit)}</div>
    <div class="pos-card-unit">${CUR} / ${p.unit||'وحدة'}</div>
    <div style="margin-top:4px"><span style="font-size:10px;color:${+p.qty>5?'var(--green)':'var(--red)'}">${p.qty} متاح</span></div>
  </div>`).join('');
}

async function loadPOSClients() {
  const {data}=await sb.from('clients').select('id,name').order('name');
  const sel=document.getElementById('pos-client');
  sel.innerHTML='<option value="">كاش — بدون عميل</option>';
  (data||[]).forEach(c=>sel.innerHTML+=`<option value="${c.id}">${c.name}</option>`);
}

function addToCart(name) {
  const prod=posProducts.find(p=>p.name===name);
  if(!prod) return;
  const existing=posCart.find(i=>i.name===name);
  if(existing) { existing.qty+=1; }
  else { posCart.push({name:prod.name,price:+prod.price_per_unit,qty:1,unit:prod.unit||'وحدة'}); }
  renderPOSCart();
}

function scanBarcode() {
  const bc=document.getElementById('pos-barcode').value.trim();
  if(!bc) return;
  const prod=posProducts.find(p=>p.barcode===bc||p.name===bc);
  if(prod) { addToCart(prod.name); document.getElementById('pos-barcode').value=''; }
  else toast('لم يُعثر على المنتج',false);
}

function renderPOSCart() {
  const div=document.getElementById('pos-cart-items');
  if(!posCart.length) { div.innerHTML='<div style="text-align:center;padding:30px;color:var(--txt3);font-size:13px">اضغط على منتج للإضافة</div>'; updatePOSTotal(); return; }
  div.innerHTML=posCart.map((item,i)=>`
  <div class="pos-cart-item">
    <div class="pci-name">${item.name}<br><span style="font-size:10px;color:var(--txt3)">${fmt(item.price)} ${CUR}</span></div>
    <div class="pci-qty">
      <button onclick="changePOSQty(${i},-1)">−</button>
      <span>${item.qty}</span>
      <button onclick="changePOSQty(${i},1)">+</button>
    </div>
    <div class="pci-price">${fmt(item.qty*item.price)}</div>
    <button class="pci-del" onclick="removeFromCart(${i})">×</button>
  </div>`).join('');
  updatePOSTotal();
}

function changePOSQty(i,d) {
  posCart[i].qty=Math.max(0.1,posCart[i].qty+d);
  if(posCart[i].qty<=0) posCart.splice(i,1);
  renderPOSCart();
}
function removeFromCart(i) { posCart.splice(i,1); renderPOSCart(); }

function applyDiscount10() {
  document.getElementById('pos-disc-pct').value=10;
  document.getElementById('pos-disc-val').value='';
  updatePOSTotal();
}

function updatePOSTotal() {
  const subtotal=posCart.reduce((s,i)=>s+i.qty*i.price,0);
  const pct=Math.min(10,+document.getElementById('pos-disc-pct').value||0);
  const val=+document.getElementById('pos-disc-val').value||0;
  const discAmt=Math.max(pct>0?subtotal*pct/100:0, val);
  const net=Math.max(0,subtotal-discAmt);
  document.getElementById('pos-total').textContent=fmt(subtotal)+' '+CUR;
  if(discAmt>0) {
    document.getElementById('pos-disc-display').style.display='flex';
    document.getElementById('pos-disc-amount').textContent=fmt(discAmt)+' '+CUR;
    document.getElementById('pos-net-row').style.display='flex';
    document.getElementById('pos-net-total').textContent=fmt(net)+' '+CUR;
  } else {
    document.getElementById('pos-disc-display').style.display='none';
    document.getElementById('pos-net-row').style.display='none';
  }
}

async function processPOSSale() {
  if(!posCart.length){toast('السلة فارغة',false);return;}
  const btn=document.getElementById('pos-pay-btn');
  btn.disabled=true; btn.textContent='جارٍ المعالجة...';
  const subtotal=posCart.reduce((s,i)=>s+i.qty*i.price,0);
  const pct=Math.min(10,+document.getElementById('pos-disc-pct').value||0);
  const val=+document.getElementById('pos-disc-val').value||0;
  const discAmt=Math.max(pct>0?subtotal*pct/100:0,val);
  const total=Math.max(0,subtotal-discAmt);
  const clientId=document.getElementById('pos-client').value;

  const {data:sale,error}=await sb.from('sales').insert({
    sale_date:todayStr(),client_id:clientId||null,total,
    payment_method:'نقد',
  }).select().single();
  if(error){toast('خطأ: '+error.message,false);btn.disabled=false;btn.textContent='💰 إتمام الدفع';return;}
  const items=posCart.map(i=>({sale_id:sale.id,product_name:i.name,qty:i.qty,unit_price:i.price}));
  await sb.from('sale_items').insert(items);
  await logAction('بيع POS',`#${sale.id} — ${fmt(total)} ${CUR}`,'pos');

  // طباعة الفاتورة
  printReceipt(sale.id, posCart, subtotal, discAmt, total);

  posCart=[];
  document.getElementById('pos-disc-pct').value='';
  document.getElementById('pos-disc-val').value='';
  document.getElementById('pos-client').value='';
  renderPOSCart();
  btn.disabled=false; btn.textContent='💰 إتمام الدفع';
  toast('تم البيع بنجاح ✓');
}

function printReceipt(id, items, subtotal, disc, total) {
  const now=new Date().toLocaleString('ar-SY');
  document.getElementById('receipt-print').innerHTML=`
  <div class="rcp-logo">${CO}<br><small style="font-size:10px">نقطة البيع</small></div>
  <div class="rcp-row"><span>فاتورة #${id}</span><span>${now}</span></div>
  <div class="rcp-row"><span>الكاشير</span><span>${CU.full_name}</span></div>
  <div class="rcp-sep"></div>
  ${items.map(i=>`
  <div class="rcp-row"><span>${i.name} × ${i.qty}</span><span>${fmt(i.qty*i.price)} ${CUR}</span></div>`).join('')}
  <div class="rcp-sep"></div>
  <div class="rcp-row"><span>المجموع</span><span>${fmt(subtotal)} ${CUR}</span></div>
  ${disc>0?`<div class="rcp-row"><span>الخصم</span><span>- ${fmt(disc)} ${CUR}</span></div>`:''}
  <div class="rcp-row rcp-total"><span>الإجمالي</span><span>${fmt(total)} ${CUR}</span></div>
  <div class="rcp-sep"></div>
  <div style="text-align:center;font-size:11px;margin-top:6px">شكراً لتعاملكم معنا<br>${CO}</div>`;
  window.print();
}
</script>
