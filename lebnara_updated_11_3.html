<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LebnAra — لبينارا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d6a1f;--green-l:#eaf3de;--green-m:#4a9e2f;
  --red:#a32d2d;--red-l:#fcebeb;--red-m:#e24b4a;
  --amber:#ba7517;--amber-l:#faeeda;--amber-m:#ef9f27;
  --blue:#185fa5;--blue-l:#e6f1fb;
  --teal:#0f6e56;--teal-l:#e1f5ee;
  --purple:#534ab7;--purple-l:#eeedfe;
  --bg:#f4f6f8;--surf:#fff;--bdr:#e5e7eb;
  --txt:#1a1a1a;--txt2:#6b7280;--txt3:#9ca3af;
  --r:10px;--rs:6px;
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a3a0f,#2d6a1f)}
.login-box{background:var(--surf);border-radius:16px;padding:40px 32px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:28px;font-weight:800;color:var(--green);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--txt2);margin-bottom:28px}
.login-box input{width:100%;padding:10px 14px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:14px;margin-bottom:12px;font-family:inherit;background:var(--bg)}
.login-box input:focus{outline:none;border-color:var(--green-m)}
.login-btn{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.login-btn:hover{background:var(--green-m)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none}

/* ── APP SHELL ── */
#app{display:none}
.topbar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.logo-name{font-size:15px;font-weight:800;color:var(--green)}
.logo-ar{font-size:11px;color:var(--txt2)}
.user-info{display:flex;align-items:center;gap:8px;font-size:13px}
.role-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.role-admin{background:var(--purple-l);color:var(--purple)}
.role-factory{background:var(--teal-l);color:var(--teal)}
.role-farm{background:var(--green-l);color:var(--green)}
.role-sales{background:var(--blue-l);color:var(--blue)}
.role-purchases{background:var(--amber-l);color:var(--amber)}
.logout-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:none;cursor:pointer;font-size:12px;color:var(--txt2)}

/* ── BOTTOM NAV ── */
.nav{
  display:none; /* hidden — using bottom-nav instead */
}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surf);border-top:1px solid var(--bdr);
  display:flex;z-index:250;
  box-shadow:0 -2px 12px rgba(0,0,0,.08);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:7px 2px;
  border:none;background:none;cursor:pointer;
  color:var(--txt2);font-family:inherit;
  transition:all .15s;position:relative;
  min-width:0;
}
.bnav-btn .bnav-icon{font-size:20px;line-height:1;}
.bnav-btn .bnav-lbl{font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;max-width:54px;text-overflow:ellipsis;}
.bnav-btn.active{color:var(--green);}
.bnav-btn.active .bnav-icon{transform:translateY(-2px);}
.bnav-btn.active::after{
  content:'';position:absolute;bottom:0;left:20%;right:20%;
  height:3px;background:var(--green);border-radius:3px 3px 0 0;
}
.bnav-btn:hover{background:var(--bg);}

.main{padding:14px 12px 76px;max-width:960px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px}
.kpi-lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.kpi-val{font-size:22px;font-weight:700;line-height:1}
.kpi-unit{font-size:10px;color:var(--txt2);margin-top:2px}

/* ── BADGES ── */
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block}
.b-green{background:var(--green-l);color:var(--green)}
.b-red{background:var(--red-l);color:var(--red)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-blue{background:var(--blue-l);color:var(--blue)}
.b-teal{background:var(--teal-l);color:var(--teal)}
.b-purple{background:var(--purple-l);color:var(--purple)}

/* ── TABLES ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:7px 9px;color:var(--txt2);font-weight:500;border-bottom:1px solid var(--bdr);font-size:11px;white-space:nowrap}
td{text-align:right;padding:9px;border-bottom:1px solid var(--bdr);color:var(--txt)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* ── FORMS ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:11px;color:var(--txt2);font-weight:500}
.fi input,.fi select,.fi textarea{padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--surf);color:var(--txt);font-size:13px;font-family:inherit}
.fi input:focus,.fi select:focus{outline:none;border-color:var(--green-m)}
.fi.full{grid-column:1/-1}
.sec{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;padding-top:6px;border-top:1px solid var(--bdr)}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:var(--rs);font-size:13px;cursor:pointer;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);transition:all .15s;font-family:inherit}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--green);color:#fff;border-color:var(--green)}
.btn-p:hover{background:var(--green-m);border-color:var(--green-m)}
.btn-r{background:var(--red-l);color:var(--red);border-color:var(--red-m)}
.btn-a{background:var(--amber-l);color:var(--amber);border-color:var(--amber-m)}
.btn-b{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* ── TABS ── */
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--bdr);background:var(--surf);cursor:pointer;color:var(--txt2);transition:all .15s;font-family:inherit}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}

/* ── MODAL ── */
.modal-bg{display:none;background:rgba(0,0,0,.5);position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;align-items:flex-start;justify-content:center;padding-top:60px}
.modal-bg.open{display:flex}
.modal{background:var(--surf);border-radius:var(--r);padding:20px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--txt2);line-height:1}

/* ── ALERTS ── */
.alert{padding:9px 12px;border-radius:var(--rs);font-size:13px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.al-w{background:var(--amber-l);color:var(--amber)}
.al-d{background:var(--red-l);color:var(--red)}
.al-i{background:var(--blue-l);color:var(--blue)}
.al-s{background:var(--green-l);color:var(--green)}

/* ── PROGRESS ── */
.prog{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:3px;background:var(--amber-m)}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:9999;white-space:nowrap;max-width:90vw}

/* ── LOADING ── */
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--green-m);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.ld{text-align:center;padding:24px;color:var(--txt2);font-size:13px}

/* ══════════════════════════════════════════
   POS — نقطة البيع
══════════════════════════════════════════ */
#pos-page{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:300;flex-direction:column}
#pos-page.open{display:flex}
.pos-top{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pos-title{font-size:16px;font-weight:700}
.pos-body{display:flex;flex:1;overflow:hidden;gap:0}
.pos-products{flex:1;padding:12px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}
.pos-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s;text-align:center;user-select:none}
.pos-card:hover{border-color:var(--green-m);transform:scale(1.02)}
.pos-card:active{transform:scale(.97)}
.pos-card-name{font-size:13px;font-weight:600;margin-bottom:4px}
.pos-card-price{font-size:18px;font-weight:800;color:var(--green)}
.pos-card-unit{font-size:10px;color:var(--txt2)}
.pos-cart{width:300px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.pos-cart-items{flex:1;overflow-y:auto;padding:10px}
.pos-cart-item{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bdr)}
.pos-cart-item:last-child{border-bottom:none}
.pci-name{flex:1;font-size:12px;font-weight:500}
.pci-qty{display:flex;align-items:center;gap:4px}
.pci-qty button{width:22px;height:22px;border:1px solid var(--bdr);border-radius:4px;background:var(--bg);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.pci-qty span{font-size:13px;font-weight:600;min-width:20px;text-align:center}
.pci-price{font-size:12px;font-weight:600;color:var(--green);min-width:60px;text-align:left}
.pci-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 2px}
.pos-footer{padding:12px;border-top:1px solid var(--bdr);background:var(--surf)}
.pos-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pos-total-lbl{font-size:13px;color:var(--txt2)}
.pos-total-val{font-size:22px;font-weight:800;color:var(--green)}
.pos-disc-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.pos-disc-row label{font-size:11px;color:var(--txt2)}
.pos-disc-row input{width:80px;padding:5px 8px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg)}
.pos-disc-btn{padding:5px 10px;font-size:11px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--amber-l);color:var(--amber);cursor:pointer;font-family:inherit}
.pos-client-row{margin-bottom:8px}
.pos-client-row select{width:100%;padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg);font-family:inherit}
.pos-pay-btn{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.pos-pay-btn:hover{background:var(--green-m)}
.pos-pay-btn:disabled{background:var(--txt3);cursor:not-allowed}
.pos-barcode-row{display:flex;gap:6px;margin-bottom:10px}
.pos-barcode-row input{flex:1;padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg);font-family:inherit}

/* ── RECEIPT PRINT ── */
@media print{
  body>*{display:none!important}
  #receipt-print{display:block!important}
}
#receipt-print{display:none;font-family:'Courier New',monospace;font-size:12px;width:280px;margin:0 auto;direction:rtl}
.rcp-logo{text-align:center;font-size:16px;font-weight:bold;border-bottom:1px dashed #000;padding-bottom:6px;margin-bottom:6px}
.rcp-row{display:flex;justify-content:space-between;margin:2px 0}
.rcp-sep{border-top:1px dashed #000;margin:6px 0}
.rcp-total{font-size:15px;font-weight:bold}

/* ── USERS PAGE ── */
.user-card{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--bdr)}
.user-card:last-child{border-bottom:none}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--green);flex-shrink:0}
.user-info-col{flex:1}
.user-name{font-size:14px;font-weight:600}
.user-role{font-size:11px;color:var(--txt2)}

/* ── ACCOUNT STATEMENT ── */
.stmt-balance{text-align:center;padding:16px;border-radius:var(--r);margin-bottom:12px}
.stmt-bal-pos{background:var(--green-l)}
.stmt-bal-neg{background:var(--red-l)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .fg{grid-template-columns:1fr}
  .pos-cart{width:260px}
  .pos-products{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .pos-card-price{font-size:15px}
}
@media(max-width:480px){
  .pos-body{flex-direction:column}
  .pos-cart{width:100%;height:50%;border-right:none;border-top:1px solid var(--bdr)}
  .pos-products{height:50%}
}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">LebnAra</div>
    <div class="login-sub">لبينارا — نظام إدارة الألبان والأجبان</div>
    <input type="text" id="l-user" placeholder="اسم المستخدم" autocomplete="username">
    <input type="password" id="l-pass" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-err" id="login-err">اسم المستخدم أو كلمة المرور غير صحيحة</div>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app">
  <div class="topbar">
    <div class="logo-wrap">
      <div class="logo-icon">LB</div>
      <div>
        <div class="logo-name">LebnAra</div>
        <div class="logo-ar">لبينارا</div>
      </div>
    </div>
    <div class="user-info">
      <span id="top-username"></span>
      <span class="role-badge" id="top-role-badge"></span>
      <button class="logout-btn" onclick="openSelfPassChange()">🔑</button>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>
  <div class="main" id="main-content"></div>
  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav" id="bottom-nav"></div>
</div>

<!-- modal تغيير كلمة المرور الشخصية -->
<div class="modal-bg" id="self-pass-modal">
  <div class="modal" style="max-width:360px">
    <div class="modal-hdr"><span class="modal-title">تغيير كلمة مرورك</span><button class="modal-close" onclick="closeModal('self-pass-modal')">×</button></div>
    <div class="fi" style="margin-bottom:10px"><label>كلمة المرور الحالية</label><input type="password" id="self-pass-old" placeholder="أدخل كلمة المرور الحالية"></div>
    <div class="fi" style="margin-bottom:10px"><label>كلمة المرور الجديدة</label><input type="password" id="self-pass-new" placeholder="كلمة المرور الجديدة (4 أحرف أو أكثر)"></div>
    <div class="fi" style="margin-bottom:10px"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="self-pass-confirm" placeholder="أعد الكتابة"></div>
    <div class="btn-row">
      <button class="btn" onclick="closeModal('self-pass-modal')">إلغاء</button>
      <button class="btn btn-p" onclick="saveSelfPass()">حفظ</button>
    </div>
  </div>
</div>

<!-- ══════════════ POS OVERLAY ══════════════ -->
<div id="pos-page">
  <div class="pos-top">
    <div class="pos-title">🧀 LebnAra — نقطة البيع</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="pos-cashier" style="font-size:12px;opacity:.8"></span>
      <button onclick="closePOS()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px">✕ خروج</button>
    </div>
  </div>
  <div class="pos-body">
    <!-- المنتجات -->
    <div class="pos-products" id="pos-products-grid"></div>
    <!-- السلة -->
    <div class="pos-cart">
      <div style="padding:10px;border-bottom:1px solid var(--bdr);display:flex;gap:6px">
        <div class="pos-barcode-row" style="margin:0;flex:1">
          <input type="text" id="pos-barcode" placeholder="باركود..." onkeydown="if(event.key==='Enter')scanBarcode()">
          <button onclick="scanBarcode()" class="btn btn-sm btn-b">بحث</button>
        </div>
      </div>
      <div class="pos-cart-items" id="pos-cart-items">
        <div style="text-align:center;padding:30px;color:var(--txt3);font-size:13px">اضغط على منتج للإضافة</div>
      </div>
      <div class="pos-footer">
        <div class="pos-client-row" style="display:flex;gap:6px">
          <select id="pos-client" style="flex:1"></select>
          <button onclick="openPOSNewClient()" class="btn btn-sm btn-b" style="flex-shrink:0" title="عميل جديد">+</button>
        </div>
        <div style="margin-bottom:8px">
          <input type="text" id="pos-notes" placeholder="ملاحظات (اختياري)..."
            style="width:100%;padding:6px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);font-size:12px;font-family:inherit">
        </div>
        <div class="pos-disc-row">
          <label>خصم:</label>
          <input type="number" id="pos-disc-pct" placeholder="%" min="0" max="10" step="1" oninput="updatePOSTotal()">
          <button class="pos-disc-btn" onclick="applyDiscount10()">10%</button>
          <label style="margin-right:8px">قيمة:</label>
          <input type="number" id="pos-disc-val" placeholder="ل.س" min="0" oninput="updatePOSTotal()">
        </div>
        <div class="pos-total-row">
          <span class="pos-total-lbl">الإجمالي</span>
          <span class="pos-total-val" id="pos-total">0 ل.س</span>
        </div>
        <div class="pos-total-row" id="pos-disc-display" style="display:none">
          <span style="font-size:12px;color:var(--red)">الخصم</span>
          <span style="font-size:13px;font-weight:600;color:var(--red)" id="pos-disc-amount">0 ل.س</span>
        </div>
        <div class="pos-total-row" id="pos-net-row" style="display:none">
          <span style="font-size:13px;font-weight:600">الصافي</span>
          <span style="font-size:20px;font-weight:800;color:var(--green)" id="pos-net-total">0 ل.س</span>
        </div>
        <button class="pos-pay-btn" id="pos-pay-btn" onclick="processPOSSale()">💰 إتمام الدفع</button>
      </div>
    </div>
  </div>
</div>

<!-- modal عميل جديد في POS -->
<div class="modal-bg" id="pos-new-client-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-hdr"><span class="modal-title">عميل جديد</span><button class="modal-close" onclick="closeModal('pos-new-client-modal')">×</button></div>
    <div class="fg">

    btn.innerHTML = `<span class="bnav-icon">${pg.icon}</span><span class="bnav-lbl">${pg.label}</span>`;
    btn.onclick = () => showGroup(key, btn);
    nav.appendChild(btn);
  });
}

// showGroup — called by bottom nav buttons
function showGroup(groupKey, btn) {
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const b = document.querySelector(`.bnav-btn[data-group="${groupKey}"]`);
    if (b) b.classList.add('active');
  }
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div id="page-${groupKey}" class="page active"></div>`;
  const pg = document.getElementById(`page-${groupKey}`);
  const loader = groupLoaders[groupKey];
  if (loader) loader(pg);
}

function tabs(prefix, name, btn, loader) {

async function loadFeedCowsTable() {
  const date = document.getElementById('feed-date')?.value;
  const {data:cows} = await sb.from('cows').select('id,name').order('name');
  if (!cows?.length) {
    document.getElementById('feed-cows-table').innerHTML = '<p style="color:var(--txt2);text-align:center;padding:16px">لا توجد أبقار مسجلة</p>';
    return;
  }
  // جلب آخر سجل لهذا التاريخ
  const {data:prev} = await sb.from('daily_feed_log')
    .select('*').eq('feed_date', date).limit(1).maybeSingle();
  const prevMap = {};
  if (prev?.cow_feeds) {
    try { const arr = typeof prev.cow_feeds === 'string' ? JSON.parse(prev.cow_feeds) : prev.cow_feeds;
      arr.forEach(r => prevMap[r.cow_id] = r.amount_kg); } catch(e) {}
  }
  if (prev?.straw_kg) {
    setTimeout(() => {
      const s = document.getElementById('feed-straw-total');
      if(s) s.value = prev.straw_kg;
    }, 100);
  }
  const table = `<div class="tw"><table>
    <thead><tr><th>#</th><th>البقرة</th><th>العلف (كغ)</th><th>ملاحظة</th></tr></thead>
    <tbody>
    ${cows.map((c,i) => `<tr>
      <td style="color:var(--txt2)">${i+1}</td>
      <td><strong>${c.name}</strong>${CU.role==='admin'?`<button onclick="openCowEdit(${c.id})" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--txt3);margin-right:4px" title="تعديل">✏️</button>`:''}</td>
      <td><input type="number" data-cow="${c.id}" class="feed-cow-inp"
        min="0" step="0.5" value="${prevMap[c.id]||''}"
        style="width:90px;padding:6px;border:2px solid var(--amber);border-radius:var(--rs);font-size:14px;font-weight:700;text-align:center;background:var(--bg)"></td>
      <td style="color:var(--txt2);font-size:11px">${prevMap[c.id] ? '✅ مسجّل' : 'لا يوجد'}</td>
    </tr>`).join('')}
    </tbody>
  </table></div>
  <div style="background:var(--amber-soft,#fef3c7);border-radius:var(--rs);padding:12px;margin-top:10px;font-weight:600">
    إجمالي العلف: <span id="feed-total-kg" style="color:var(--amber)">0.0</span> كغ
  </div>`;
  document.getElementById('feed-cows-table').innerHTML = table;
  // حساب المجموع تلقائياً
  document.querySelectorAll('.feed-cow-inp').forEach(inp => {
    inp.addEventListener('input', updateFeedTotal);
  });
  updateFeedTotal();
}

function updateFeedTotal() {
  let total = 0;
  document.querySelectorAll('.feed-cow-inp').forEach(inp => { total += parseFloat(inp.value)||0; });
  const el = document.getElementById('feed-total-kg');
  if(el) el.textContent = total.toFixed(1);
}

async function saveDailyFeed() {
  const date = document.getElementById('feed-date')?.value;
  if (!date) { toast('اختر التاريخ', false); return; }
  const strawKg = parseFloat(document.getElementById('feed-straw-total')?.value)||0;
  const cowFeeds = [];
  let totalFeed = 0;
  document.querySelectorAll('.feed-cow-inp').forEach(inp => {
    const amt = parseFloat(inp.value)||0;
    if (amt > 0) { cowFeeds.push({cow_id: +inp.dataset.cow, amount_kg: amt}); totalFeed += amt; }
  });
  if (!cowFeeds.length && strawKg === 0) { toast('أدخل كميات الإطعام أولاً', false); return; }
  // حذف السجل القديم لنفس التاريخ وإدراج جديد
  await sb.from('daily_feed_log').delete().eq('feed_date', date);
  const {error} = await sb.from('daily_feed_log').insert({
    feed_date: date,
    cow_feeds: JSON.stringify(cowFeeds),
    total_feed_kg: totalFeed,
    straw_kg: strawKg,
    recorded_by: CU?.username || 'system'
  });
  if (error) {
    toast('خطأ في حفظ الإطعام: ' + error.message, false);
    return;
  }
  await logAction('حفظ إطعام يومي', `${date} — علف: ${totalFeed}كغ، تبن: ${strawKg}كغ`, 'milk');
  toast('✅ تم حفظ الإطعام بنجاح');
  await loadFeedHist();
  await loadFeedCowsTable();
}

async function loadFeedHist() {
  const div = document.getElementById('feed-hist');
  if (!div) return;
  const {data, error} = await sb.from('daily_feed_log')
    .select('*').order('feed_date', {ascending:false}).limit(30);
  if (error) {
    div.innerHTML = `<p style="color:var(--red);font-size:12px;padding:12px">⚠️ جدول السجلات غير موجود بعد — سيتم إنشاؤه عند أول حفظ.</p>
    <p style="font-size:11px;color:var(--txt2);padding:0 12px">لإنشاء الجدول، انسخ هذا الكود في Supabase SQL Editor:</p>
    <pre style="font-size:10px;background:var(--bg);padding:10px;border-radius:var(--rs);overflow-x:auto;margin:8px 12px">CREATE TABLE IF NOT EXISTS daily_feed_log (
  id bigserial PRIMARY KEY,
  feed_date date NOT NULL,
  cow_feeds jsonb,
  total_feed_kg numeric DEFAULT 0,
  straw_kg numeric DEFAULT 0,
  recorded_by text,
  created_at timestamptz DEFAULT now()
);</pre>`;
    return;
  }
  if (!data?.length) { div.innerHTML = '<p style="text-align:center;color:var(--txt3);padding:16px">لا توجد سجلات بعد</p>'; return; }
  div.innerHTML = `<div class="tw"><table>
    <thead><tr><th>التاريخ</th><th>إجمالي العلف</th><th>التبن</th><th>سُجّل بواسطة</th></tr></thead>
    <tbody>
    ${data.map(r => {
      const dt = new Date(r.feed_date).toLocaleDateString('ar-SY');
      return `<tr>
        <td>${dt}</td>
        <td><strong style="color:var(--amber)">${r.total_feed_kg||0} كغ</strong></td>
        <td>${r.straw_kg||0} كغ</td>
        <td style="font-size:11px;color:var(--txt2)">${r.recorded_by||'—'}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

function openBreedingForm() {
  const form = document.getElementById('breeding-form');
  if (!form) return;
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  if (form.style.display === 'block') {
    sb.from('cows').select('id,name').order('name').then(({data}) => {
      const sel = document.getElementById('breed-cow');
      if (sel && data) {
        sel.innerHTML = data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }
    });
    const today = new Date().toISOString().split('T')[0];
    ['breed-heat-date','breed-insem-date'].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.value) el.value = today;
    });
    // حساب تلقائي لموعد الولادة (285 يوم من التلقيح)
    document.getElementById('breed-insem-date')?.addEventListener('change', function() {
      const d = new Date(this.value);
      d.setDate(d.getDate() + 285);
      const cd = document.getElementById('breed-calving-date');
      if (cd) cd.value = d.toISOString().split('T')[0];
    });
  }
}

async function saveBreeding() {
  const cowId   = document.getElementById('breed-cow')?.value;
  const heatD   = document.getElementById('breed-heat-date')?.value;
  const insemD  = document.getElementById('breed-insem-date')?.value;
  const type    = document.getElementById('breed-type')?.value;
  const calvD   = document.getElementById('breed-calving-date')?.value;
  const notes   = document.getElementById('breed-notes')?.value || '';
  if (!cowId || !insemD) { toast('اختر البقرة وتاريخ التلقيح', false); return; }
  const {error} = await sb.from('breeding_records').insert({
    cow_id: +cowId, heat_date: heatD||null, insem_date: insemD,
    breeding_type: type, expected_calving: calvD||null, notes,
    recorded_by: CU.full_name
  });
  if (error) {
    if (error.message.includes('does not exist') || error.code === '42P01') {
      alert('جدول breeding_records غير موجود. شغّل SQL الإنشاء من صفحة الإعدادات.');
    } else { toast('خطأ: ' + error.message, false); }
    return;
  }
  await logAction('تسجيل تلقيح', `البقرة #${cowId} — ${insemD}`, 'milk');
  document.getElementById('breeding-form').style.display = 'none';
  toast('✅ تم تسجيل التلقيح');
  loadBreeding();
}

async function loadBreeding() {
  const div = document.getElementById('breeding-list');
  if (!div) return;
  const {data, error} = await sb.from('breeding_records')
    .select('*,cows(name)').order('insem_date', {ascending:false}).limit(50);
  if (error) {
    div.innerHTML = `<div style="padding:12px;text-align:center">
      <p style="color:var(--amber);font-size:13px">⚠️ جدول التلقيح غير موجود بعد</p>
      <button class="btn btn-sm btn-p" onclick="showBreedingSQL()">عرض SQL الإنشاء</button>
    </div>`; return;
  }

async function saveCalf() {
  const name   = document.getElementById('calf-name')?.value?.trim();
  const type   = document.getElementById('calf-type')?.value;
  const born   = document.getElementById('calf-born')?.value;
  const mother = document.getElementById('calf-mother')?.value || null;
  const feed   = +document.getElementById('calf-feed')?.value || 0;
  const straw  = +document.getElementById('calf-straw')?.value || 0;
  if (!name) { toast('أدخل اسم العجل', false); return; }

    name, calf_type: type, birth_date: born||null,
    mother_id: mother?+mother:null, daily_feed_kg: feed, daily_straw_kg: straw

  if (error) {

// ══════════════════════════════════════════════
//  AUTO FEED DEDUCTION — خصم الإطعام التلقائي
// ══════════════════════════════════════════════
function initAutoFeedScheduler() {
  // يفحص كل دقيقة إذا الوقت 23:55
  setInterval(async function() {
    const now = new Date();
    if (now.getHours() === 23 && now.getMinutes() === 55) {
      const today = now.toISOString().split('T')[0];
      const lsKey = 'auto_feed_done_' + today;
      if (localStorage.getItem(lsKey)) return; // تم اليوم
      // تحقق إذا في سجل يدوي لليوم
      const {data:existing} = await sb.from('daily_feed_log')
        .select('id,recorded_by').eq('feed_date', today).maybeSingle();
      if (existing) { localStorage.setItem(lsKey, '1'); return; } // موجود يدوياً
      // جلب آخر سجل وتكراره
      const {data:last} = await sb.from('daily_feed_log')
        .select('*').order('feed_date',{ascending:false}).limit(1).maybeSingle();
      if (!last) return;
      await sb.from('daily_feed_log').insert({
        feed_date: today,
        cow_feeds: last.cow_feeds,
        total_feed_kg: last.total_feed_kg,
        straw_kg: last.straw_kg,
        recorded_by: 'تلقائي (نظام)'
      });
      localStorage.setItem(lsKey, '1');
      await logAction('خصم إطعام تلقائي', today + ' — علف:'+last.total_feed_kg+'كغ', 'milk');
      console.log('[AutoFeed] تم الخصم التلقائي ليوم', today);
    }
  }, 60000);
}

async function loadSalesAnalytics(period, btn) {
  if (btn) {
    btn.closest('.tabs').querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  const body = document.getElementById('analytics-body');
  if (!body) return;
  body.innerHTML = '<div class="ld"><span class="spin"></span></div>';
  const today = todayStr();
  let from, to, label;
  if (period === 'day') {
    from = to = today; label = 'اليوم';
  } else if (period === 'week') {
    const d = new Date(); d.setDate(d.getDate() - 6);
    from = d.toISOString().split('T')[0]; to = today; label = 'آخر 7 أيام';
  } else if (period === 'month') {
    from = today.slice(0,7) + '-01'; to = today; label = 'هذا الشهر';
  } else {
    // by product
    const {data:items} = await sb.from('sale_items').select('product_name,qty,unit_price,sales(sale_date)');
    const byP = {};
    (items||[]).forEach(i => {
      if (!byP[i.product_name]) byP[i.product_name] = {qty:0,rev:0};
      byP[i.product_name].qty += +i.qty;
      byP[i.product_name].rev += +i.qty * +i.unit_price;
    });
    const sorted = Object.entries(byP).sort((a,b) => b[1].rev - a[1].rev);
    const maxRev = Math.max(...sorted.map(([,v])=>v.rev),1);
    body.innerHTML = `
    <div style="margin-bottom:12px;font-size:12px;color:var(--txt2)">إجمالي كل المنتجات</div>
    ${sorted.map(([name,v])=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
        <strong>${name}</strong>
        <span style="color:var(--green);font-weight:700">${fmt(v.rev)} ${CUR}</span>
      </div>

      </div>
      <div style="font-size:11px;color:var(--txt2);margin-top:2px">${v.qty%1===0?v.qty:v.qty.toFixed(2)} كغ مباع</div>
    </div>`).join('')||'<div style="text-align:center;color:var(--txt3);padding:16px">لا توجد بيانات</div>'}`;
    return;
  }

  const [{data:sales},{data:items}] = await Promise.all([
    sb.from('sales').select('id,sale_date,total,payment_method,clients(name)').gte('sale_date',from).lte('sale_date',to).order('sale_date',{ascending:false}),
    sb.from('sale_items').select('product_name,qty,unit_price,sales(sale_date)').gte('sales.sale_date',from).lte('sales.sale_date',to),
  ]);
  const filtItems = (items||[]).filter(i => i.sales?.sale_date >= from && i.sales?.sale_date <= to);
  const total = (sales||[]).reduce((s,r)=>s+ +r.total,0);
  const cash  = (sales||[]).filter(s=>s.payment_method==='نقد').reduce((s,r)=>s+ +r.total,0);
  const defer = (sales||[]).filter(s=>s.payment_method==='آجل').reduce((s,r)=>s+ +r.total,0);
  const byP = {};
  filtItems.forEach(i=>{
    if(!byP[i.product_name]) byP[i.product_name]={qty:0,rev:0};
    byP[i.product_name].qty += +i.qty;
    byP[i.product_name].rev += +i.qty * +i.unit_price;
  });
  const sortedP = Object.entries(byP).sort((a,b)=>b[1].rev-a[1].rev);
  const maxP = Math.max(...sortedP.map(([,v])=>v.rev),1);

  body.innerHTML = `
  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">

    <div class="kpi"><div class="kpi-lbl">📋 آجل</div><div class="kpi-val" style="color:var(--amber);font-size:16px">${fmt(defer)}</div><div class="kpi-unit">${CUR}</div></div>
  </div>
  <div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:8px">المبيعات حسب المنتج — ${label}</div>
  ${sortedP.map(([name,v])=>`
  <div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
      <strong>${name}</strong>
      <span style="color:var(--green);font-weight:700">${fmt(v.rev)} ${CUR}</span>
    </div>
    <div style="background:var(--bg);border-radius:4px;height:8px">
      <div style="height:100%;width:${Math.round(v.rev/maxP*100)}%;background:var(--green-m);border-radius:4px"></div>
    </div>
    <div style="font-size:11px;color:var(--txt2);margin-top:2px">${v.qty%1===0?v.qty:v.qty.toFixed(2)} كغ</div>
  </div>`).join('')||'<div style="text-align:center;color:var(--txt3);padding:16px">لا توجد مبيعات في هذه الفترة</div>'}
  <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bdr)">
    <div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:8px">آخر الفواتير</div>
    ${(sales||[]).slice(0,6).map(s=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr);cursor:pointer" onclick="openSaleDetail(${s.id})">
      <div>

        <span style="font-size:12px;color:var(--txt2);margin-right:6px">${s.clients?.name||'كاش'}</span>
      </div>
      <strong style="color:var(--green)">${fmt(s.total)} ${CUR}</strong>
    </div>`).join('')}
  </div>`;
}

function distTab(tab, btn) {
  const el = document.getElementById('dist-hub-content');

  if (btn) {
    btn.closest('.tabs').querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  }
}

let visitResult = null;
let visitItems = [{prod:'',qty:1,price:0}];
let visitSelectedReason = '';

function setVisitResult(bought) {
  visitResult = bought;
  document.getElementById('visit-sale-section').style.display = bought ? 'block' : 'none';
  document.getElementById('visit-no-section').style.display  = bought ? 'none' : 'block';
  const yBtn = document.getElementById('visit-yes-btn');
  const nBtn = document.getElementById('visit-no-btn');
  if (bought) {
    yBtn.style.fontWeight='800'; yBtn.style.borderWidth='2px';
    nBtn.style.fontWeight='400'; nBtn.style.borderWidth='1px';
  } else {
    nBtn.style.fontWeight='800'; nBtn.style.borderWidth='2px';
    yBtn.style.fontWeight='400'; yBtn.style.borderWidth='1px';
  }
}

function selectVisitReason(btn, reason) {
  visitSelectedReason = reason;
  document.querySelectorAll('#visit-reasons button').forEach(b => {
    b.style.background = 'var(--surf)'; b.style.color = 'var(--txt)'; b.style.borderColor = 'var(--bdr)';
  });
  btn.style.background = 'var(--red-m)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--red-m)';
}

function getVisitLocation() {
  const inp = document.getElementById('visit-location');
  if (!inp) return;
  inp.value = 'جارٍ تحديد الموقع...';
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => { inp.value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`; },
      ()  => { inp.value = 'تعذّر تحديد الموقع'; }
    );
  } else {
    inp.value = 'الموقع غير مدعوم';
  }
}

function addVisitItem()   { visitItems.push({prod:'',qty:1,price:0}); renderVisitItems(); }
function removeVisitItem(i) { visitItems.splice(i,1); if(!visitItems.length) visitItems=[{prod:'',qty:1,price:0}]; renderVisitItems(); }
function setVisitItem(i,field,val) {
  if (field==='prod') {
    visitItems[i].prod = val.value;
    const opt = val.options[val.selectedIndex];
    if (opt?.dataset?.price) visitItems[i].price = +opt.dataset.price;
  } else visitItems[i][field] = +val;
  renderVisitItems();
}

function onVisitClientChange() {
  // update time
  const timeEl = document.getElementById('visit-time');
  if (timeEl) timeEl.value = new Date().toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'});
}

async function saveVisit() {
  const clientId = document.getElementById('visit-client').value;
  if (!clientId) { toast('اختر المحل',false); return; }
  if (visitResult === null) { toast('حدد نتيجة الزيارة',false); return; }
  const location = document.getElementById('visit-location').value;
  const time = document.getElementById('visit-time').value;
  const date = todayStr();

  if (visitResult) {
    // اشترى — أنشئ فاتورة
    const total = Math.round(visitItems.reduce((s,r)=>s+r.qty*r.price,0));
    if (!total) { toast('أضف منتجات للفاتورة',false); return; }
    const pay = document.getElementById('visit-payment').value;
    const notes = document.getElementById('visit-sale-notes').value;
    const {data:sale,error} = await sb.from('sales').insert({
      sale_date:date, client_id:clientId, total,
      payment_method:pay, notes:notes||'',
      cashier_name:CU.full_name,
    }).select().single();
    if (error) { toast('خطأ: '+error.message,false); return; }
    const items = visitItems.filter(r=>r.prod&&r.qty>0).map(r=>({sale_id:sale.id,product_name:r.prod,qty:r.qty,unit_price:r.price}));
    if (items.length) await sb.from('sale_items').insert(items);
    if (pay==='آجل') {
      const {data:cl} = await sb.from('clients').select('debt').eq('id',clientId).single();
      await sb.from('clients').update({debt:(+cl?.debt||0)+total}).eq('id',clientId);
    }
    // سجّل الزيارة
    await sb.from('distributor_visits').insert({
      visit_date:date, visit_time:time, client_id:+clientId,
      result:'اشترى', sale_id:sale.id, sale_total:total,
      location:location||null, recorded_by:CU.full_name,
    }).catch(()=>{}); // table might not exist yet
    await logAction('زيارة موزع - بيع', `فاتورة #${sale.id} — ${fmt(total)} ${CUR}`, 'distributor');
    toast(`✅ تم تسجيل الزيارة والبيع — فاتورة #${sale.id}`);
  } else {
    // لم يشترِ
    const reason = visitSelectedReason || document.getElementById('visit-other-reason').value.trim() || 'غير محدد';
    await sb.from('distributor_visits').insert({
      visit_date:date, visit_time:time, client_id:+clientId,
      result:'لم يشترِ', reason:reason,
      location:location||null, recorded_by:CU.full_name,
    }).catch(()=>{});
    await logAction('زيارة موزع - بدون بيع', reason, 'distributor');
    toast('✅ تم تسجيل الزيارة');
  }

  // reset
  visitResult = null; visitItems = [{prod:'',qty:1,price:0}]; visitSelectedReason = '';
  renderVisitForm(document.getElementById('dist-hub-content'));
}

async function loadCowDailyReport() {
  const date  = document.getElementById('crpt-date')?.value;
  const cowId = document.getElementById('crpt-cow')?.value;
  if (!date) { toast('اختر التاريخ', false); return; }
  const body = document.getElementById('cow-report-body');
  body.innerHTML = '<div class="ld"><span class="spin"></span></div>';
  const [{data:milkRecs},{data:feedLog},{data:cows},{data:purchases}] = await Promise.all([
    sb.from('milk_records').select('cow_id,liters,cows(name)').eq('record_date', date),
    sb.from('daily_feed_log').select('cow_feeds,total_feed_kg,straw_kg').eq('feed_date', date).maybeSingle(),
    sb.from('cows').select('id,name,breed,health').order('name'),
    sb.from('purchases').select('category,unit_price,qty').in('category',['علف','تبن']).in('status',['received','approved']).limit(50),
  ]);
  const feedPrices  = (purchases||[]).filter(p=>p.category==='علف');
  const strawPrices = (purchases||[]).filter(p=>p.category==='تبن');
  const avgFeedPrice  = feedPrices.length  ? feedPrices.reduce((s,p)=>s+(+p.unit_price||0),0)/feedPrices.length  : 0;
  const avgStrawPrice = strawPrices.length ? strawPrices.reduce((s,p)=>s+(+p.unit_price||0),0)/strawPrices.length : 0;
  const milkMap = {};
  (milkRecs||[]).forEach(r => {
    if (!milkMap[r.cow_id]) milkMap[r.cow_id] = 0;
    milkMap[r.cow_id] += (+r.liters||0);
  });
  const feedMap = {};
  if (feedLog?.cow_feeds) {
    const arr = typeof feedLog.cow_feeds==='string'?JSON.parse(feedLog.cow_feeds):feedLog.cow_feeds;
    (arr||[]).forEach(r => feedMap[r.cow_id] = +r.amount_kg||0);
  }
  const targetCows = cowId ? (cows||[]).filter(c=>c.id==cowId) : (cows||[]);
  const strawPerCow = (feedLog?.straw_kg||0) / (targetCows.length||1);
  const rows = targetCows.map(cow => {
    const milk=milkMap[cow.id]||0, feed=feedMap[cow.id]||0, straw=strawPerCow;
    return {cow, milk, feed, straw, feedCost: feed*avgFeedPrice + straw*avgStrawPrice};
  });
  const totalMilk=rows.reduce((s,r)=>s+r.milk,0);
  const totalCost=rows.reduce((s,r)=>s+r.feedCost,0);
  body.innerHTML = `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <div class="kpi" style="flex:1;min-width:100px"><div class="kpi-lbl">🥛 إجمالي الحليب</div><div class="kpi-val" style="color:var(--green)">${totalMilk.toFixed(1)}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi" style="flex:1;min-width:100px"><div class="kpi-lbl">💰 تكلفة الإطعام</div><div class="kpi-val" style="color:var(--red)">${fmt(Math.round(totalCost))}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi" style="flex:1;min-width:100px"><div class="kpi-lbl">📊 تكلفة/لتر</div><div class="kpi-val" style="color:var(--amber)">${totalMilk>0?fmt(Math.round(totalCost/totalMilk)):'—'}</div><div class="kpi-unit">${CUR}</div></div>
  </div>
  <div class="tw"><table>
    <thead><tr><th>البقرة</th><th>الحالة</th><th>حليب</th><th>علف(كغ)</th><th>تبن(كغ)</th><th>تكلفة</th><th>تكلفة/لتر</th></tr></thead>
    <tbody>${rows.map(r=>{
      const cpl=r.milk>0?fmt(Math.round(r.feedCost/r.milk))+' '+CUR:'—';
      const hIco={healthy:'🟢',sick:'🔴',dry:'🟡',pregnant:'🔵'}[r.cow.health]||'⚪';
      return `<tr>
        <td><strong>${r.cow.name}</strong></td><td>${hIco}</td>
        <td style="color:var(--green);font-weight:600">${r.milk.toFixed(1)} ل</td>
        <td>${r.feed.toFixed(1)}</td><td>${r.straw.toFixed(1)}</td>
        <td style="color:var(--red)">${fmt(Math.round(r.feedCost))} ${CUR}</td>
        <td style="color:var(--amber)">${cpl}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

async function loadUserPricesData() {
  const [{data:users},{data:prods},{data:prices}] = await Promise.all([
    sb.from('app_users').select('id,username,full_name,role').eq('is_active',true).order('full_name'),
    sb.from('products').select('id,name,unit,price_per_unit,cost_per_unit').order('sort_order',{ascending:true}).order('name'),
    sb.from('user_price_lists').select('*'),
  ]);
  _upUsers    = users    || [];
  // استثناء الحليب الخام فقط، وإبقاء كل الباقي بما فيها NULL
  _upProducts = (prods||[]).filter(p => p.product_type !== 'raw_milk');
  _upPrices   = {};
  (prices||[]).forEach(r => {
    if (!_upPrices[r.user_id]) _upPrices[r.user_id] = {};
    _upPrices[r.user_id][r.product_id] = r.custom_price;
  });
  renderUserPricesTable();
}

function renderUserPricesTable() {
  const div = document.getElementById('up-body');
  if (!div) return;
  const CUR_L = CUR;
  div.innerHTML = `
  <div style="overflow-x:auto">
  <table style="border-collapse:collapse;width:100%;font-size:12px">
    <thead>
      <tr style="background:var(--surf)">

        <th style="padding:8px 12px;text-align:center;border:1px solid var(--bdr);color:var(--txt2)">السعر الافتراضي</th>
        ${_upUsers.map(u => `
          <th style="padding:8px 12px;text-align:center;border:1px solid var(--bdr);min-width:110px">
            <div style="font-weight:700">${u.full_name}</div>
            <div style="font-size:10px;color:var(--txt2)">@${u.username}</div>
          </th>`).join('')}
      </tr>
    </thead>
    <tbody>
    ${_upProducts.map(p => {
      const defaultPrice = +p.price_per_unit || 0;
      const costPrice    = +p.cost_per_unit  || 0;
      return `<tr>
        <td style="padding:7px 12px;border:1px solid var(--bdr);font-weight:600;position:sticky;right:0;background:var(--bg)">${p.name}<br><span style="font-size:10px;color:var(--txt2)">${p.unit}</span></td>
        <td style="padding:7px 12px;border:1px solid var(--bdr);text-align:center;color:var(--green);font-weight:700">${fmt(defaultPrice)} ${CUR_L}</td>
        ${_upUsers.map(u => {
          const customPrice = _upPrices[u.id]?.[p.id];
          const margin = customPrice && costPrice > 0
            ? Math.round(((customPrice - costPrice) / customPrice) * 100)
            : (defaultPrice && costPrice > 0 ? Math.round(((defaultPrice - costPrice) / defaultPrice) * 100) : null);
          const marginClr = margin === null ? 'var(--txt3)' : margin >= 30 ? 'var(--green)' : margin >= 15 ? 'var(--amber)' : 'var(--red)';
          return `<td style="padding:4px 8px;border:1px solid var(--bdr);text-align:center">
            <input type="number"
              data-uid="${u.id}" data-pid="${p.id}" data-default="${defaultPrice}"
              value="${customPrice !== undefined ? customPrice : ''}"
              placeholder="${fmt(defaultPrice)}"
              min="0" step="0.5"
              oninput="onUserPriceInput(this)"
              style="width:85px;padding:4px 6px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);text-align:center;font-size:12px">
            <div class="up-margin-lbl" data-uid="${u.id}" data-pid="${p.id}"
              style="font-size:10px;color:${marginClr};margin-top:2px">
              ${margin !== null ? margin + '% هامش' : '—'}
            </div>
          </td>`;
        }).join('')}
      </tr>`;
    }).join('')}
    </tbody>
  </table>

  <div style="margin-top:12px;padding:10px;background:var(--surf);border-radius:var(--rs);font-size:11px;color:var(--txt2)">
    🟢 هامش ≥30% &nbsp; 🟡 هامش 15–29% &nbsp; 🔴 هامش &lt;15% &nbsp; — حقل فارغ = السعر الافتراضي
  </div>`;
}

function onUserPriceInput(inp) {
  const uid  = +inp.dataset.uid;
  const pid  = +inp.dataset.pid;
  const val  = parseFloat(inp.value);
  const cost = _upProducts.find(p=>p.id==pid)?.cost_per_unit || 0;
  const price = isNaN(val) ? +inp.dataset.default : val;
  const margin = cost > 0 && price > 0 ? Math.round(((price - cost) / price) * 100) : null;
  const lbl = document.querySelector(`.up-margin-lbl[data-uid="${uid}"][data-pid="${pid}"]`);
  if (lbl) {
    lbl.textContent = margin !== null ? margin + '% هامش' : '—';
    lbl.style.color = margin === null ? 'var(--txt3)' : margin >= 30 ? 'var(--green)' : margin >= 15 ? 'var(--amber)' : 'var(--red)';
  }
  inp.style.borderColor = !isNaN(val) && val !== +inp.dataset.default ? 'var(--amber)' : 'var(--bdr)';
}

async function saveAllUserPrices() {
  const inputs = document.querySelectorAll('#up-body input[data-uid]');
  const toUpsert = [];
  inputs.forEach(inp => {
    const uid  = +inp.dataset.uid;
    const pid  = +inp.dataset.pid;
    const val  = inp.value.trim();
    if (val !== '') toUpsert.push({ user_id: uid, product_id: pid, custom_price: parseFloat(val) });
  });
  if (!toUpsert.length) { toast('لا يوجد تعديلات للحفظ', false); return; }
  const {error} = await sb.from('user_price_lists').upsert(toUpsert, { onConflict: 'user_id,product_id' });
  if (error) {
    if (error.code === '42P01') {
      alert('جدول user_price_lists غير موجود. شغّل هذا في Supabase:\n\nCREATE TABLE user_price_lists (\n  id bigserial PRIMARY KEY,\n  user_id bigint NOT NULL,\n  product_id bigint NOT NULL,\n  custom_price numeric NOT NULL,\n  updated_at timestamptz DEFAULT now(),\n  UNIQUE(user_id, product_id)\n);\nALTER TABLE user_price_lists DISABLE ROW LEVEL SECURITY;');
    } else { toast('خطأ: ' + error.message, false); }
    return;
  }
  await logAction('تعديل أسعار مستخدمين', toUpsert.length + ' سعر', 'inventory');
  toast('✅ تم حفظ ' + toUpsert.length + ' سعر');
  await loadUserPricesData();
}

  const [milkR, salesR, expR, cowsR, clientsR, recentR, salesTodayR] = await Promise.all([
    sb.from('milk_records').select('liters').eq('record_date', todayStr()),
    sb.from('sales').select('total').gte('sale_date', ms),
    sb.from('expenses').select('amount').gte('expense_date', ms),
    sb.from('cows').select('id'),
    sb.from('clients').select('debt'),
    sb.from('sales').select('sale_date,total,payment_method,cashier_name,clients(name)').order('created_at',{ascending:false}).limit(6),
    sb.from('sales').select('total').eq('sale_date', todayStr()),
  ]);
  const salesToday = (salesTodayR.data||[]).reduce((s,r)=>s+ +r.total,0);
  const stEl = document.getElementById('dk-sales-today');
  if (stEl) stEl.textContent = fmt(salesToday);
  const milk = (milkR.data||[]).reduce((s,r)=>s+ +r.liters,0);

  const exp = (expR.data||[]).reduce((s,r)=>s+ +r.amount,0);
  const debt = (clientsR.data||[]).reduce((s,c)=>s+ +c.debt,0);
  const net = sales - exp;
  document.getElementById('dk-milk').textContent = milk.toFixed(1);
  document.getElementById('dk-sales').textContent = fmt(sales);
  document.getElementById('dk-exp').textContent = fmt(exp);
  document.getElementById('dk-cows').textContent = cowsR.data?.length||0;
  document.getElementById('dk-debt').textContent = fmt(debt);
  const ne = document.getElementById('dk-net');
  ne.textContent = fmt(net); ne.style.color = net>=0?'var(--green)':'var(--red)';

  // alerts
  const [sick, low, debtC] = await Promise.all([
    sb.from('cows').select('name,notes').eq('health','sick'),
    sb.from('products').select('name,qty,min_qty,unit'),
    sb.from('clients').select('name,debt').gt('debt',0),
  ]);
  let al = '';
  (sick.data||[]).forEach(c => al+=`<div class="alert al-d">⚠️ <strong>${c.name}</strong> — ${c.notes||'تحتاج رعاية'}</div>`);
  (low.data||[]).filter(p=> +p.qty<= +p.min_qty).forEach(p => al+=`<div class="alert al-w">📦 مخزون منخفض: <strong>${p.name}</strong> — ${p.qty} ${p.unit}</div>`);
  (debtC.data||[]).forEach(c => al+=`<div class="alert al-i">💰 <strong>${c.name}</strong> — ${fmt(c.debt)} ${CUR}</div>`);
  document.getElementById('d-alerts').innerHTML = al||`<div class="alert al-s">✅ لا توجد تنبيهات</div>`;

  const tb = document.getElementById('d-sales');
  tb.innerHTML = (recentR.data||[]).map(s=>`<tr>
    <td>${s.sale_date}</td><td>${s.clients?.name||'كاش'}</td>
    <td style="font-weight:600;color:var(--blue);font-size:11px">${s.cashier_name||'—'}</td>
    <td>${fmt(s.total)} ${CUR}</td>
    <td><span class="badge ${s.payment_method==='آجل'?'b-amber':'b-green'}">${s.payment_method}</span></td>
  </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد مبيعات</td></tr>`;

  // المستخدمون وآخر دخول (للمدير فقط)
  if (CU.role==='admin') {
    const [{data:users},{data:logins}] = await Promise.all([
      sb.from('app_users').select('username,full_name,role,is_active').order('full_name'),
      sb.from('user_logs').select('username,created_at').eq('action','تسجيل دخول').order('created_at',{ascending:false}).limit(300),
    ]);
    const lastLogin = {};
    (logins||[]).forEach(l=>{ if(!lastLogin[l.username]) lastLogin[l.username]=l.created_at; });
    const ut = document.getElementById('d-users');
    if (ut) ut.innerHTML = (users||[]).map(u=>{
      const ll = lastLogin[u.username];
      const llStr = ll ? new Date(ll).toLocaleString('ar-SY',{dateStyle:'short',timeStyle:'short'}) : '—';
      return `<tr>
        <td style="font-weight:600">${u.full_name||u.username}</td>
        <td>${ROLES[u.role]?.label||u.role}</td>
        <td><span class="badge ${u.is_active?'b-green':'b-red'}">${u.is_active?'فعال':'موقوف'}</span></td>
        <td style="font-size:11px;color:var(--txt2)">${llStr}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--txt3)">لا مستخدمون</td></tr>';
  }
}

let milkCows = [];
async function loadMilkEntry() {
  const {data:cows} = await sb.from('cows').select('id,name,daily_liters').order('name');
  const tb = document.getElementById('mk-rows');
  if (!cows?.length) { tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--txt3)">لا توجد أبقار</td></tr>'; return; }
  // ترتيب الأبقار حسب تفضيل المستخدم الحالي
  milkCows = cows;
  try {
    const {data:pref} = await sb.from('user_sort_prefs').select('pref_value').eq('user_id',CU.id).eq('pref_key','cow_order').maybeSingle();
    if (pref?.pref_value) {
      const order = JSON.parse(pref.pref_value);
      milkCows.sort((a,b)=>{
        const ia=order.indexOf(a.id), ib=order.indexOf(b.id);
        return (ia===-1?9999:ia)-(ib===-1?9999:ib);
      });
    }
  } catch(e){ /* الجدول غير موجود بعد */ }
  renderMilkRows();
}

function renderMilkRows() {
  const tb = document.getElementById('mk-rows');
  if(!tb) return;
  // الحفاظ على القيم المدخلة حالياً عند إعادة الترتيب
  const vals = {};
  tb.querySelectorAll('input[type=number]').forEach(i=>vals[i.dataset.cow]=i.value);
  tb.innerHTML = milkCows.map((c,idx)=>`<tr>
    <td style="white-space:nowrap"><span style="display:inline-flex;flex-direction:column;vertical-align:middle;margin-left:4px">
      <button onclick="moveCowPref(${idx},-1)" style="border:none;background:none;cursor:pointer;font-size:10px;line-height:1;padding:1px 3px;color:var(--txt2)">▲</button>
      <button onclick="moveCowPref(${idx},1)" style="border:none;background:none;cursor:pointer;font-size:10px;line-height:1;padding:1px 3px;color:var(--txt2)">▼</button>
    </span>${c.name}</td>
    <td><input type="number" min="0" step="0.1" value="${vals[c.id]!==undefined?vals[c.id]:(c.daily_liters||0)}"
      style="width:75px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
      data-cow="${c.id}" oninput="calcMilkTotal()"></td>
    <td><select style="font-size:11px;padding:3px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt)"><option>ممتازة</option><option>جيدة</option><option>عادية</option></select></td>
    <td><input type="text" placeholder="..." style="width:80px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:11px"></td>
  </tr>`).join('');
  calcMilkTotal();
}

async function moveCowPref(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= milkCows.length) return;
  [milkCows[idx], milkCows[j]] = [milkCows[j], milkCows[idx]];
  renderMilkRows();
  // حفظ التفضيل للمستخدم الحالي
  const order = JSON.stringify(milkCows.map(c=>c.id));
  try {
    const {data:ex} = await sb.from('user_sort_prefs').select('id').eq('user_id',CU.id).eq('pref_key','cow_order').maybeSingle();
    if (ex) await sb.from('user_sort_prefs').update({pref_value:order}).eq('id',ex.id);
    else await sb.from('user_sort_prefs').insert({user_id:CU.id, pref_key:'cow_order', pref_value:order});
    toast('تم حفظ الترتيب ✓');
  } catch(e){ toast('أنشئ جدول user_sort_prefs في Supabase أولاً',false); }
}

function calcMilkTotal() {
  let t=0; document.querySelectorAll('#mk-rows input[type=number]').forEach(i=>t+= +i.value||0);
  document.getElementById('mk-total').textContent = t.toFixed(1);
}

async function saveMilk() {
  const date = document.getElementById('mk-date').value;
  const session = document.getElementById('mk-session').value;
  const inputs = document.querySelectorAll('#mk-rows input[type=number]');
  const recs = [];
  let totalLiters = 0;
  inputs.forEach(inp => { const l= +inp.value; if(l>0){ recs.push({record_date:date,session,cow_id:+inp.dataset.cow,liters:l,quality:'جيدة'}); totalLiters+=l; } });
  if (!recs.length) { toast('أدخل كميات الحليب',false); return; }
  const personal = +document.getElementById('mk-personal')?.value || 0;
  if (personal > totalLiters) { toast('حليب العامل أكبر من إجمالي الحلب!',false); return; }
  const {error} = await sb.from('milk_records').insert(recs);
  if (error) { toast('خطأ: '+error.message,false); return; }

  // إضافة الحليب للمخزون بعد خصم حليب العامل الشخصي
  const delivered = totalLiters - personal;
  const {data:milkProd} = await sb.from('products').select('id,qty').eq('product_type','raw_milk').maybeSingle();
  if (milkProd && delivered > 0) {
    const newQty = +milkProd.qty + delivered;
    await sb.from('products').update({qty: newQty}).eq('id', milkProd.id);
    await sb.from('inventory_logs').insert({
      product_name:'حليب طازج', change_type:'إنتاج يومي',
      qty_before:+milkProd.qty, qty_after:newQty, qty_change:delivered,
      reason:`${date} — ${session}${personal>0?` (خصم ${personal} لتر للعامل)`:''}`
    });
  }

  // خصم حليب العامل: تسجيل مصروف يُخصم من راتبه آخر الشهر
  if (personal > 0) {
    const {data:priceRow} = await sb.from('cost_settings').select('setting_value').eq('setting_key','worker_milk_price').maybeSingle();
    const price = +priceRow?.setting_value || 0;
    const amount = personal * price;
    await sb.from('expenses').insert({
      expense_date: date,
      category: 'خصم حليب موظف',
      description: `${CU.full_name||CU.username}|${date} ${session}|${personal} لتر × ${fmt(price)}`,
      amount
    });
  }

  await logAction('تسجيل حليب', `${date} ${session} — ${totalLiters.toFixed(1)} لتر${personal>0?` (شخصي: ${personal} لتر)`:''}`, 'milk');
  toast(`تم حفظ سجل الحلب ✓${personal>0?` — خُصم ${personal} لتر للعامل`:''}`);
  const pEl = document.getElementById('mk-personal'); if(pEl) pEl.value = 0;
}

let milkEditMeta = {};
async function openMilkEdit(date, session) {
  milkEditMeta = {date, session};
  document.getElementById('mk-edit-title').textContent = `تعديل: ${date} — ${session}`;
  const [{data:recs},{data:cows}] = await Promise.all([
    sb.from('milk_records').select('id,liters,cow_id').eq('record_date',date).eq('session',session),
    sb.from('cows').select('id,name').order('name'),
  ]);
  const map = {}; (recs||[]).forEach(r=>map[r.cow_id]={id:r.id,liters:r.liters});
  document.getElementById('mk-edit-rows').innerHTML = (cows||[]).map(c=>`<tr>
    <td>${c.name}</td>
    <td><input type="number" min="0" step="0.1" value="${map[c.id]?.liters||0}"
      data-cow="${c.id}" oninput="calcMkEditTotal()"
      style="width:75px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"></td>
  </tr>`).join('');
  calcMkEditTotal();
  modal('mk-edit-modal');
}
function calcMkEditTotal() {
  let t=0; document.querySelectorAll('#mk-edit-rows input').forEach(i=>t+= +i.value||0);
  document.getElementById('mk-edit-total').textContent = t.toFixed(1);
}
async function saveMilkEdit() {
  const {date,session} = milkEditMeta;
  await sb.from('milk_records').delete().eq('record_date',date).eq('session',session);
  const inputs = document.querySelectorAll('#mk-edit-rows input');
  const recs = [];
  inputs.forEach(inp => { const l= +inp.value; if(l>0) recs.push({record_date:date,session,cow_id:+inp.dataset.cow,liters:l,quality:'جيدة'}); });
  if (recs.length) await sb.from('milk_records').insert(recs);
  await logAction('تعديل حليب', `${date} — ${session}`, 'milk');
  closeModal('mk-edit-modal'); loadMilkHist(); toast('تم تعديل السجل ✓');
}
async function deleteMilkSession() {
  if (!confirm(`حذف سجل ${milkEditMeta.date} — ${milkEditMeta.session}؟`)) return;
  await sb.from('milk_records').delete().eq('record_date',milkEditMeta.date).eq('session',milkEditMeta.session);
  await logAction('حذف سجل حليب', `${milkEditMeta.date} — ${milkEditMeta.session}`, 'milk');
  closeModal('mk-edit-modal'); loadMilkHist(); toast('تم الحذف');
}
async function loadMilkHist() {
  const {data} = await sb.from('milk_records').select('record_date,session,liters').order('record_date',{ascending:false}).limit(300);
  const grouped = {};
  (data||[]).forEach(r=>{ const k=r.record_date+'|'+r.session; if(!grouped[k]) grouped[k]={date:r.record_date,session:r.session,total:0}; grouped[k].total+= +r.liters; });
  const {data:cows} = await sb.from('cows').select('id');
  const cc = cows?.length||1;
  const rows = Object.values(grouped);
  const tb = document.getElementById('mk-hist-tb');
  const canEdit = CU.role==='admin';
  tb.innerHTML = rows.map(r=>`<tr>
    <td>${r.date}</td><td>${r.session}</td>
    <td><strong>${r.total.toFixed(1)}</strong> لتر</td>
    <td>${(r.total/cc).toFixed(1)} لتر</td>
    ${canEdit?`<td><button class="btn btn-sm" onclick="openMilkEdit('${r.date}','${r.session}')">تعديل</button></td>`:''}
  </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد سجلات</td></tr>';
}

async function initFacNew() {
  // جلب كل المنتجات واستثناء الحليب الخام فقط
  const {data:prods, error} = await sb.from('products')
    .select('name,unit,product_type')
    .order('sort_order',{ascending:true}).order('name');
  const sel = document.getElementById('fac-prod');
  if(!sel) return;
  if (error) { console.error('initFacNew:', error.message); return; }
  // استثناء الحليب الخام فقط
  const prodList = (prods||[]).filter(p => p.product_type !== 'raw_milk');
  if (!prodList.length) {
    sel.innerHTML = '<option value="">— لا توجد منتجات —</option>';
    toast('لا توجد منتجات مسجلة في المخزون', false);
    return;
  }
  sel.innerHTML = prodList.map(p =>
    `<option value="${p.name}" data-unit="${p.unit||'كغ'}" data-type="${p.product_type||''}">${p.name}</option>`
  ).join('');
  await loadMilkSourceStocks();
  onFacProdChange();
  // تحميل سعر لتر الحليب للمدير
  if (CU.role==='admin') {
    const {data:pr} = await sb.from('cost_settings').select('setting_value').eq('setting_key','milk_price_per_liter').maybeSingle();
    const el = document.getElementById('fac-milk-price');
    if (el && pr) el.value = +pr.setting_value;
  }
}

async function saveFacMilkPrice() {

  if (error) { toast('خطأ: '+error.message,false); return; }

}

async function loadMilkSourceStocks() {
  const [{data:farmMilk},{data:powderItem}] = await Promise.all([
    sb.from('products').select('qty').eq('product_type','raw_milk').maybeSingle(),
    sb.from('consumables').select('qty_available').ilike('name','%بودرة%').maybeSingle(),
  ]);
  const fms = document.getElementById('farm-milk-stock');
  const ps = document.getElementById('powder-stock');
  if(fms) fms.textContent = (farmMilk?.qty||0).toFixed(1)+' لتر';
  if(ps) ps.textContent = (powderItem?.qty_available||0)+' غ';
}

function updateTotalMilk() {
  const farm = +document.getElementById('fac-milk-farm')?.value||0;
  const powderKg = +document.getElementById('fac-milk-powder')?.value||0;
  const purchased = +document.getElementById('fac-milk-purchased')?.value||0;
  // 1 كغ حليب بودرة ≈ 8 لتر حليب
  const powderAsLiters = powderKg * 8;
  const total = farm + powderAsLiters + purchased;
  const el = document.getElementById('fac-milk-total');
  if(el) el.textContent = total.toFixed(1);
  return {farm, powderKg, purchased, total};
}

async function onFacProdChange() {
  const sel = document.getElementById('fac-prod');
  if(!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const ptype = opt?.dataset?.type||'';
  const labanRow = document.getElementById('fac-laban-row');
  const milkSources = document.getElementById('fac-milk-sources');
  if(!labanRow||!milkSources) return;
  if (ptype === 'labneh') {
    labanRow.style.display='block';
    milkSources.style.display='none';
    const {data:laban} = await sb.from('products').select('qty').eq('product_type','laban').maybeSingle();
    const stock = laban?.qty||0;
    const stockEl = document.getElementById('fac-laban-stock');
    if(stockEl) stockEl.textContent = stock+' لتر';
    const remainEl = document.getElementById('fac-laban-remain');
    if(remainEl) remainEl.textContent = stock+' لتر';
    labanRow._stock = stock;
  } else {
    labanRow.style.display='none';
    milkSources.style.display='block';
    await loadMilkSourceStocks();
  }
}

function previewLabanBalance() {
  const labanRow = document.getElementById('fac-laban-row');
  const used = +document.getElementById('fac-laban-used')?.value||0;
  const stock = labanRow?._stock||0;
  const remain = Math.max(0, stock - used);
  const el = document.getElementById('fac-laban-remain');
  if(el) {
    el.textContent = remain.toFixed(1)+' لتر';
    el.style.color = remain<5?'var(--red)':'var(--teal)';
  }
}

async function saveProduction() {
  const sel = document.getElementById('fac-prod');
  const pn = sel?.value;
  const opt = sel?.options[sel?.selectedIndex];
  const ptype = opt?.dataset?.type||'';
  const qty = +document.getElementById('fac-qty').value;
  const prodDate = document.getElementById('fac-date').value;
  if (!pn||!qty) { toast('أدخل المنتج والكمية',false); return; }
  const extraCost = +document.getElementById('fac-cost').value||0;
  const calcium = +document.getElementById('fac-calcium').value||0;
  const rennet = +document.getElementById('fac-rennet').value||0;

  let milkUsed = 0;

  if (ptype === 'labneh') {
    // اللبنة: من مخزون اللبن فقط
    const labanUsed = +document.getElementById('fac-laban-used')?.value||0;
    if (!labanUsed) { toast('أدخل كمية اللبن المستخدمة',false); return; }
    const {data:labanProd} = await sb.from('products').select('id,qty,cost_per_unit').eq('product_type','laban').maybeSingle();
    if (!labanProd) { toast('لا يوجد منتج لبن رائب في النظام',false); return; }
    if (+labanProd.qty < labanUsed) { toast(`مخزون اللبن غير كافٍ — متاح: ${labanProd.qty} لتر`,false); return; }
    const newLabanQty = +labanProd.qty - labanUsed;
    await sb.from('products').update({qty:newLabanQty}).eq('id',labanProd.id);
    await sb.from('inventory_logs').insert({
      product_name:'لبن رائب', change_type:'استخدام لإنتاج لبنة',
      qty_before:+labanProd.qty, qty_after:newLabanQty, qty_change:-labanUsed,
      reason:`دفعة لبنة — ${prodDate}`
    });
    milkUsed = labanUsed;

  } else {
    // أجبان وألبان: من مصادر متعددة
    const farmMilk = +document.getElementById('fac-milk-farm')?.value||0;
    const powderKg  = +document.getElementById('fac-milk-powder')?.value||0;
    const purchMilk= +document.getElementById('fac-milk-purchased')?.value||0;
    milkUsed = farmMilk + (powderKg * 8) + purchMilk;
    if (!milkUsed) { toast('أدخل مصدر الحليب المستخدم',false); return; }

    // خصم حليب المزرعة
    if (farmMilk > 0) {
      const {data:rawMilk} = await sb.from('products').select('id,qty').eq('product_type','raw_milk').maybeSingle();
      if (rawMilk) {
        if (+rawMilk.qty < farmMilk) { toast(`حليب المزرعة غير كافٍ — متاح: ${rawMilk.qty} لتر`,false); return; }
        const newQ = +rawMilk.qty - farmMilk;
        await sb.from('products').update({qty:newQ}).eq('id',rawMilk.id);
        await sb.from('inventory_logs').insert({
          product_name:'حليب طازج', change_type:'استخدام في الإنتاج',
          qty_before:+rawMilk.qty, qty_after:newQ, qty_change:-farmMilk,
          reason:`إنتاج ${pn} — ${prodDate}`
        });
      }
    }

    // خصم حليب البودرة من المستهلكات (بالكيلو)
    if (powderKg > 0) {
      const {data:powderItem} = await sb.from('consumables').select('id,qty_available').ilike('name','%بودرة%').maybeSingle();
      if (powderItem && +powderItem.qty_available >= powderKg) {
        await sb.from('consumables').update({qty_available:+powderItem.qty_available - powderKg}).eq('id',powderItem.id);
      }
    }
  }

  const {error, data:prod} = await sb.from('productions').insert({
    prod_date: prodDate,
    product_name:pn, milk_used:milkUsed, qty_produced:qty,
    extra_cost: extraCost,
    expiry_date: document.getElementById('fac-expiry').value||null,
    calcium_chloride: calcium,
    rennet_ml: rennet,
    milk_powder_g: +document.getElementById('fac-milk-powder')?.value||0, // مخزون بالكغ
    notes: document.getElementById('fac-notes').value,
  }).select().single();
  if (error) { toast('خطأ: '+error.message,false); return; }

  // حساب التكلفة
  await calcProductionCost(prod, prodDate, milkUsed, qty, extraCost, ptype==='labneh');

  // تحديث مخزون المنتج
  const {data:p} = await sb.from('products').select('qty').eq('name',pn).maybeSingle();
  if (p) {
    await sb.from('products').update({qty: +p.qty+qty}).eq('name',pn);
    await sb.from('inventory_logs').insert({
      product_name:pn, change_type:'إنتاج معمل',
      qty_before:+p.qty, qty_after:+p.qty+qty, qty_change:qty,
      reason:`دفعة إنتاج — ${prodDate}`
    });
  }

  await logAction('إنتاج معمل', `${pn} — ${qty} وحدة`, 'factory');
  toast('تم تسجيل الدفعة ✓');
  ['fac-qty','fac-notes','fac-laban-used','fac-milk-farm','fac-milk-powder','fac-milk-purchased'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='0';
  });
  ['fac-calcium','fac-rennet','fac-cost'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='0';
  });
  updateTotalMilk();
  onFacProdChange();
}

async function calcProductionCost(prod, prodDate, milkUsed, qtyProduced, extraCost, isLabneh=false) {
  if (!qtyProduced) return;
  const {data:settings} = await sb.from('cost_settings').select('setting_key,setting_value');
  const cfg = {};
  (settings||[]).forEach(s => cfg[s.setting_key] = +s.setting_value);
  const milkPrice       = cfg['milk_price_per_liter']      || 20;
  const dieselPrice     = cfg['diesel_price_per_liter']    || 500;
  const dieselLiters    = cfg['diesel_liters_per_day']     || 15;
  const rennetPrice     = cfg['rennet_price_per_ml']       || 50;
  const calciumPrice    = cfg['calcium_price_per_g']       || 5;
  const salesFarmPct    = (cfg['sales_manager_ratio_farm'] || 20) / 100;
  const salesFactoryPct = (cfg['sales_manager_ratio_factory'] || 80) / 100;

  const thisMonth = prodDate.slice(0,7);

  // جلب كل الرواتب الشهرية مرة واحدة
  const {data:allSals} = await sb.from('salaries').select('net_salary,department').eq('salary_month', thisMonth);
  const salesMonthly = (allSals||[]).filter(s=>s.department==='مبيعات').reduce((a,r)=>a + +r.net_salary,0);

  // ── إجمالي الكيلوات المنتجة اليوم (للتوزيع) ──
  const {data:dayProds} = await sb.from('productions').select('qty_produced').eq('prod_date', prodDate);
  const dayTotalQty = (dayProds||[]).reduce((s,r)=>s + +r.qty_produced,0) || qtyProduced;
  const myShare = dayTotalQty > 0 ? qtyProduced / dayTotalQty : 1;

  let milkCost = 0, dieselCost = 0, laborCost = 0, materialsCost = 0;

  if (isLabneh) {
    // تكلفة اللبنة = تكلفة اللبن المستخدم + عمالة المعمل فقط
    const {data:labanProd} = await sb.from('products').select('cost_per_unit').eq('product_type','laban').maybeSingle();
    const labanCostPerLiter = +labanProd?.cost_per_unit || 0;
    milkCost = milkUsed * labanCostPerLiter;

    const factoryMonthly = (allSals||[]).filter(s=>s.department==='معمل').reduce((a,r)=>a + +r.net_salary,0);
    const factorySalesShare = salesMonthly * salesFactoryPct;
    laborCost = ((factoryMonthly + factorySalesShare) / 26) * myShare;
    dieselCost = 0; // اللبنة لا تستهلك مازوت

  } else {
    // ── تكلفة الحليب الكاملة (مزرعة + بودرة + مشتريات) ──
    const rawMilkCost = milkUsed * milkPrice;
    // عمالة المزرعة اليومية
    const farmMonthly = (allSals||[]).filter(s=>s.department==='مزرعة').reduce((a,r)=>a + +r.net_salary,0);
    const farmSalesShare = salesMonthly * salesFarmPct;
    const dailyFarmLabor = (farmMonthly + farmSalesShare) / 26;
    // مشتريات المزرعة
    const {data:farmPurch} = await sb.from('purchases').select('total').eq('status','approved').gte('purchase_date',thisMonth+'-01').lte('purchase_date',thisMonth+'-31');
    const farmPurchDaily = (farmPurch||[]).reduce((a,r)=>a + +r.total,0) / 26;
    // نسبة الحليب المستخدم من إجمالي الحليب اليوم
    const {data:dayMilk} = await sb.from('milk_records').select('liters').eq('record_date',prodDate);
    const totalDayMilk = (dayMilk||[]).reduce((s,r)=>s + +r.liters,0) || milkUsed;
    const milkShare = totalDayMilk > 0 ? milkUsed / totalDayMilk : 1;
    milkCost = rawMilkCost + (dailyFarmLabor + farmPurchDaily) * milkShare;

    // ── المازوت: 15 لتر ÷ إجمالي الكيلوات اليومية ──
    const totalDieselCost = dieselLiters * dieselPrice;
    dieselCost = totalDieselCost * myShare;

    // ── عمالة المعمل اليومية ÷ إجمالي الكيلوات ──
    const factoryMonthly = (allSals||[]).filter(s=>s.department==='معمل').reduce((a,r)=>a + +r.net_salary,0);
    const factorySalesShare = salesMonthly * salesFactoryPct;
    laborCost = ((factoryMonthly + factorySalesShare) / 26) * myShare;

    // ── تكلفة المواد: منفحة + كلوريد الكالسيوم (من المستهلكات) ──
    const rennetCost  = (prod.rennet_ml||0) * rennetPrice;
    const calciumCost = (prod.calcium_chloride||0) * calciumPrice;
    materialsCost = rennetCost + calciumCost;
  }

  const totalCost = milkCost + dieselCost + laborCost + materialsCost + extraCost;
  const costPerUnit = qtyProduced > 0 ? totalCost / qtyProduced : 0;

  // متوسط آخر 30 دفعة
  const {data:recent} = await sb.from('production_costs')
    .select('cost_per_unit').eq('product_name', prod.product_name)
    .order('created_at',{ascending:false}).limit(30);
  const recentCosts = (recent||[]).map(r=> +r.cost_per_unit).filter(v=>v>0);
  recentCosts.push(costPerUnit);
  const avg30 = recentCosts.reduce((a,b)=>a+b,0) / recentCosts.length;
  const suggestedPrice = Math.ceil(avg30 * 1.25 / 100) * 100;

  await sb.from('production_costs').insert({
    production_id:prod.id, prod_date:prodDate,
    product_name:prod.product_name, qty_produced:qtyProduced,
    milk_cost:Math.round(milkCost), labor_cost:Math.round(laborCost),
    diesel_cost:Math.round(dieselCost), materials_cost:Math.round(materialsCost),
    extra_cost:Math.round(extraCost), total_cost:Math.round(totalCost),
    cost_per_unit:Math.round(costPerUnit), avg_cost_30d:Math.round(avg30),
    suggested_price:suggestedPrice,
  });
  await sb.from('products').update({cost_per_unit:Math.round(avg30)}).eq('name',prod.product_name);
}

async function loadFacHist() {

    const m = +p.price_per_unit>0 ? Math.round(((+p.price_per_unit - +p.cost_per_unit)/ +p.price_per_unit)*100) : 0;
    const st = +p.qty>+p.min_qty*2?['متوفر','b-green']:+p.qty>+p.min_qty?['محدود','b-amber']:['منخفض','b-red'];

          <button onclick="moveProductRow(${idx},1)" style="background:none;border:none;cursor:pointer;font-size:11px;padding:0;line-height:1;color:var(--txt2)" ${idx===data.length-1?'disabled':''}>▼</button>

        : `<td colspan="3" style="color:var(--txt2);font-size:12px">—</td>`

        <button class="btn btn-sm" onclick="openInvAdj('${p.name.replace(/'/g,"\'")}',${p.qty},'${p.unit}')">كمية</button>
        <button class="btn btn-sm btn-b" onclick="openInvPrice('${p.name.replace(/'/g,"\'")}',${p.cost_per_unit},${p.price_per_unit})">سعر</button>
        <button class="btn btn-sm btn-r" onclick="deleteProduct(${p.id},'${p.name.replace(/'/g,"\'")}')">حذف</button>

  }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--txt3)">لا توجد منتجات</td></tr>';

async function moveProductRow(idx, dir) {
  const tb = document.getElementById('inv-tb');
  if (!tb) return;
  const rows = [...tb.querySelectorAll('[data-sort-id]')];
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= rows.length) return;
  if (dir === -1) tb.insertBefore(rows[idx], rows[newIdx]);
  else tb.insertBefore(rows[newIdx], rows[idx]);
  const newOrder = [...tb.querySelectorAll('[data-sort-id]')].map(r => +r.dataset.sortId);
  await saveUserSortPref('products', newOrder);
  const allRows = [...tb.querySelectorAll('[data-sort-id]')];
  allRows.forEach((row, i) => {
    const btns = row.querySelectorAll('button[onclick*="moveProductRow"]');
    if (btns[0]) { btns[0].disabled=(i===0); btns[0].setAttribute('onclick',`moveProductRow(${i},-1)`); }
    if (btns[1]) { btns[1].disabled=(i===allRows.length-1); btns[1].setAttribute('onclick',`moveProductRow(${i},1)`); }
  });
}


async function deleteProduct(id, name) {
  if(!confirm(`حذف المنتج "${name}"؟ لا يمكن التراجع.`)) return;
  await sb.from('products').delete().eq('id', id);
  await sb.from('inventory_logs').insert({product_name:name,change_type:'حذف منتج',qty_before:0,qty_after:0,qty_change:0,reason:'حذف بواسطة الإدارة'});
  await logAction('حذف منتج', name, 'inventory');
  loadInvList();
  toast('تم حذف المنتج');
}

async function saveProduct() {
  const name = document.getElementById('inv-name').value.trim();
  if (!name) { toast('أدخل اسم المنتج',false); return; }
  const qty = +document.getElementById('inv-qty').value||0;
  const unit = document.getElementById('inv-unit').value;
  const min_qty = +document.getElementById('inv-min').value||5;
  const cost_per_unit = +document.getElementById('inv-cost').value||0;
  const price_per_unit = +document.getElementById('inv-price').value||0;
  const barcode = document.getElementById('inv-barcode').value||null;

  // تحقق أولاً هل المنتج موجود
  const {data:existing} = await sb.from('products').select('id,qty').eq('name',name).maybeSingle();
  if (existing) {
    // تحديث المنتج الموجود
    await sb.from('products').update({unit,min_qty,cost_per_unit,price_per_unit,barcode}).eq('id',existing.id);
    if (qty>0) {
      const newQty = +existing.qty + qty;
      await sb.from('products').update({qty:newQty}).eq('id',existing.id);
      await sb.from('inventory_logs').insert({product_name:name,change_type:'إضافة للمخزون',qty_before:+existing.qty,qty_after:newQty,qty_change:qty,reason:'تعديل يدوي'});
    }
    toast('تم تحديث المنتج ✓');
  } else {
    // منتج جديد
    const {error} = await sb.from('products').insert({name,unit,qty,min_qty,cost_per_unit,price_per_unit,barcode});
    if (error) { toast('خطأ: '+error.message,false); return; }
    if (qty>0) await sb.from('inventory_logs').insert({product_name:name,change_type:'منتج جديد',qty_before:0,qty_after:qty,qty_change:qty,reason:'إضافة منتج جديد'});
    toast('تم إضافة المنتج ✓');
  }
  await logAction('حفظ منتج', name, 'inventory');
  document.getElementById('inv-name').value='';
  document.getElementById('inv-qty').value='0';
  // تحديث قائمة المنتجات في صفحة الإنتاج إن كانت مفتوحة
  refreshFactoryProductList();
  loadInvList();
}

// تحديث قائمة المنتجات في الإنتاج بدون إعادة تحميل الصفحة
