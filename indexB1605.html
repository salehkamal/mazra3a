    const st = +m.qty_available > +m.min_qty*2 ? ['متوفر','b-green']
             : +m.qty_available > +m.min_qty   ? ['محدود','b-amber']
             : ['منخفض','b-red'];
    return `<tr>
      <td><strong>${m.name}</strong>${m.notes?`<br><span style="font-size:10px;color:var(--txt2)">${m.notes}</span>`:''}</td>
      <td><span class="badge ${catColors[m.category]||'b-teal'}">${m.category||'—'}</span></td>
      <td style="font-size:16px;font-weight:700;color:${+m.qty_available<=+m.min_qty?'var(--red)':'var(--txt)'}">${m.qty_available||0}</td>
      <td>${m.unit||'—'}</td>
      <td style="color:var(--txt2)">${+m.last_price>0?fmt(m.last_price)+' '+CUR:'—'}</td>
      <td style="color:var(--amber)">${+m.cost_per_unit>0?fmt(m.cost_per_unit)+' '+CUR:'—'}</td>
      <td><span class="badge ${st[1]}">${st[0]}</span></td>
      ${canEdit?`<td><button class="btn btn-sm" onclick="openRMAdj(${m.id},'${m.name.replace(/'/g,"\\'")}',${m.qty_available})">تعديل</button></td>`:''}
    </tr>`;
  }).join('');
}

async function saveRMMaterial() {
  const name = document.getElementById('rm-name').value.trim();
  if (!name) { toast('أدخل اسم المادة',false); return; }
  const initQty = +document.getElementById('rm-init-qty').value||0;
  const initPrice = +document.getElementById('rm-init-price').value||0;
  const {data:ex} = await sb.from('raw_materials').select('id').eq('name',name).maybeSingle();
  if (ex) { toast('هذه المادة موجودة مسبقاً',false); return; }
  const {error} = await sb.from('raw_materials').insert({
    name,
    category: document.getElementById('rm-cat').value,
    unit:     document.getElementById('rm-unit').value,
    min_qty:  +document.getElementById('rm-min').value||1,
    qty_available: initQty,
    last_price: initPrice,
    cost_per_unit: initPrice,
    notes: document.getElementById('rm-notes').value,
  });
  if (error) { toast('خطأ: '+error.message,false); return; }
  if (initQty > 0) {
    await sb.from('rm_transactions').insert({
      material_name:name, type:'استلام', qty:initQty,
      price_per_unit:initPrice, total:initQty*initPrice,
      reason:'رصيد افتتاحي', date:todayStr(), recorded_by:CU.full_name
    });
  }
  await logAction('إضافة مادة أولية', name, 'raw_materials');
  ['rm-name','rm-notes','rm-init-qty','rm-init-price'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value=id.includes('qty')||id.includes('price')?'0':'';
  });
  loadRMStock();
  toast('تمت إضافة المادة ✓');
}

function updateRMTotal() {

  const price = +document.getElementById('rm-recv-price')?.value||0;
  const el = document.getElementById('rm-recv-total');

async function saveRMReceive() {
  const sel = document.getElementById('rm-recv-item');
  const itemId = +sel?.value;
  const qty = +document.getElementById('rm-recv-qty')?.value||0;
  const price = +document.getElementById('rm-recv-price')?.value||0;
  if (!itemId||!qty||!price) { toast('أدخل المادة والكمية والسعر',false); return; }
  const opt = sel.options[sel.selectedIndex];
  const name = opt?.dataset?.name||'';
  const total = qty*price;
  const recvDate = document.getElementById('rm-recv-date').value;

  // تحديث المخزون
  const {data:mat} = await sb.from('raw_materials').select('qty_available').eq('id',itemId).single();
  const newQty = +mat.qty_available + qty;
  await sb.from('raw_materials').update({
    qty_available: newQty,
    last_price: price,
    cost_per_unit: price
  }).eq('id', itemId);

  // تسجيل الحركة
  await sb.from('rm_transactions').insert({
    material_id: itemId, material_name: name,
    type: 'استلام', qty, price_per_unit: price, total,
    supplier: document.getElementById('rm-recv-supplier')?.value||'',
    ref: document.getElementById('rm-recv-ref')?.value||'',
    date: recvDate, recorded_by: CU.full_name,
    reason: 'استلام شحنة'
  });

  // تسجيل في المصاريف
  await sb.from('expenses').insert({
    expense_date: recvDate, category: 'مواد أولية',
    description: `استلام ${name} — ${qty} ${opt?.dataset?.unit||''} × ${fmt(price)}`,
    amount: total
  });

  await logAction('استلام مواد أولية', `${name} — ${qty} — ${fmt(total)} ${CUR}`, 'raw_materials');
  ['rm-recv-qty','rm-recv-price','rm-recv-supplier','rm-recv-ref'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  loadRMStock();
  loadRMRecvHist();
  toast('تم تسجيل الاستلام ✓ — أضيف للمصاريف تلقائياً');
}

async function saveRMUsage() {
  const sel = document.getElementById('rm-use-item');
  const itemId = +sel?.value;
  const qty = +document.getElementById('rm-use-qty')?.value||0;
  const reason = document.getElementById('rm-use-reason')?.value||'';
  if (!itemId||!qty) { toast('أدخل المادة والكمية',false); return; }
  const opt = sel.options[sel.selectedIndex];
  const name = opt?.dataset?.name||'';

  const {data:mat} = await sb.from('raw_materials').select('qty_available').eq('id',itemId).single();
  if (+mat.qty_available < qty) { toast(`المخزون غير كافٍ — متاح: ${mat.qty_available}`,false); return; }

  await sb.from('raw_materials').update({qty_available: +mat.qty_available - qty}).eq('id',itemId);
  await sb.from('rm_transactions').insert({
    material_id:itemId, material_name:name, type:'استهلاك', qty,
    price_per_unit:0, total:0, reason,
    date: document.getElementById('rm-use-date').value,
    recorded_by: CU.full_name
  });
  await logAction('استهلاك مواد أولية', `${name} — ${qty}`, 'raw_materials');
  document.getElementById('rm-use-qty').value='';
  document.getElementById('rm-use-reason').value='';
  loadRMStock();
  loadRMUsage();
  toast('تم تسجيل الاستهلاك ✓');
}

function openRMAdj(id, name, currentQty) {
  rmCurrentItem = {id, name, currentQty};
  document.getElementById('rm-adj-title').textContent = `تعديل: ${name} (الحالي: ${currentQty})`;
  document.getElementById('rm-adj-qty').value = '';
  document.getElementById('rm-adj-reason').value = '';
  modal('rm-adj-modal');
}

async function saveRMAdj() {
  const type = document.getElementById('rm-adj-type').value;
  const qty = +document.getElementById('rm-adj-qty').value||0;
  const reason = document.getElementById('rm-adj-reason').value.trim();
  if (!reason) { toast('أدخل سبب التعديل',false); return; }
  const cur = +rmCurrentItem.currentQty;
  const newQty = type==='add'?cur+qty : type==='sub'?Math.max(0,cur-qty) : qty;
  await sb.from('raw_materials').update({qty_available:newQty}).eq('id',rmCurrentItem.id);
  await sb.from('rm_transactions').insert({
    material_id:rmCurrentItem.id, material_name:rmCurrentItem.name,
    type:'تسوية', qty:Math.abs(newQty-cur), price_per_unit:0, total:0,
    reason:`${reason} (${cur}→${newQty})`,
    date:todayStr(), recorded_by:CU.full_name
  });
  await logAction('تسوية مواد أولية', `${rmCurrentItem.name}: ${cur}→${newQty}`, 'raw_materials');
  closeModal('rm-adj-modal');
  loadRMStock();
  toast('تم التعديل ✓');
}

async function loadDailyReportPage() {
  const date = document.getElementById('dr-date')?.value || todayStr();
  const lbl = document.getElementById('dr-date-lbl');
  if(lbl) lbl.textContent = date;
  const body = document.getElementById('dr-body');
  if(!body) return;
  body.innerHTML = '<div class="ld"><span class="spin"></span></div>';

  const [salesR, milkR, prodR, expR, invR, costR] = await Promise.all([
    sb.from('sales').select('id,total,payment_method,notes,clients(name),sale_items(product_name,qty,unit_price)').eq('sale_date', date),
    sb.from('milk_records').select('liters,session').eq('record_date', date),
    sb.from('productions').select('product_name,qty_produced,milk_used').eq('prod_date', date),
    sb.from('expenses').select('category,amount,description').eq('expense_date', date),
    sb.from('products').select('name,qty,unit,min_qty').order('sort_order',{ascending:true}).order('name'),
    sb.from('production_costs').select('product_name,cost_per_unit,suggested_price,total_cost,milk_cost,labor_cost,diesel_cost,materials_cost').eq('prod_date', date),
  ]);

  const totalSales = (salesR.data||[]).reduce((s,r)=>s + +r.total, 0);
  const totalMilk  = (milkR.data||[]).reduce((s,r)=>s + +r.liters, 0);
  const totalProd  = (prodR.data||[]).reduce((s,r)=>s + +r.qty_produced, 0);
  const totalExp   = (expR.data||[]).reduce((s,r)=>s + +r.amount, 0);

  // مبيعات حسب المنتج
  const soldByProd = {};
  (salesR.data||[]).forEach(s=>(s.sale_items||[]).forEach(i=>{
    if(!soldByProd[i.product_name]) soldByProd[i.product_name]={qty:0,revenue:0};
    soldByProd[i.product_name].qty += +i.qty;
    soldByProd[i.product_name].revenue += +i.qty * +i.unit_price;
  }));

  const isAdmin = CU.role==='admin';

  body.innerHTML = `
  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-lbl">مبيعات اليوم</div><div class="kpi-val" style="color:var(--green)">${fmt(totalSales)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">حليب منتج</div><div class="kpi-val" style="color:var(--teal)">${totalMilk.toFixed(1)}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">إنتاج المعمل</div><div class="kpi-val" style="color:var(--blue)">${totalProd.toFixed(1)}</div><div class="kpi-unit">كغ</div></div>
    <div class="kpi"><div class="kpi-lbl">مصاريف اليوم</div><div class="kpi-val" style="color:var(--red)">${fmt(totalExp)}</div><div class="kpi-unit">${CUR}</div></div>
  </div>

  <!-- المبيعات -->
  <div class="sec">المبيعات — ${(salesR.data||[]).length} فاتورة</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>#</th><th>العميل</th><th>المبلغ</th><th>الدفع</th><th>ملاحظات</th></tr></thead>
    <tbody>${(salesR.data||[]).map(s=>`<tr>
      <td>#${s.id}</td>
      <td>${s.clients?.name||'كاش'}</td>
      <td style="font-weight:600">${fmt(s.total)} ${CUR}</td>
      <td><span class="badge ${s.payment_method==='آجل'?'b-amber':'b-green'}">${s.payment_method}</span></td>
      <td style="font-size:11px;color:var(--txt2)">${s.notes||'—'}</td>
    </tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد مبيعات</td></tr>'}</tbody>
  </table></div></div>

  <!-- مبيعات حسب المنتج -->
  <div class="sec">المبيعات حسب المنتج</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>المنتج</th><th>الكمية المباعة</th><th>الإيراد</th><th>المخزون الحالي</th><th>الفرق (إنتاج - مبيع)</th></tr></thead>
    <tbody>${(invR.data||[]).map(p=>{
      const sold = soldByProd[p.name]||{qty:0,revenue:0};
      const produced = (prodR.data||[]).find(r=>r.product_name===p.name)?.qty_produced||0;
      const diff = produced - sold.qty;
      return `<tr>
        <td><strong>${p.name}</strong></td>
        <td>${sold.qty>0?sold.qty+' '+p.unit:'—'}</td>
        <td>${sold.revenue>0?fmt(sold.revenue)+' '+CUR:'—'}</td>
        <td style="color:${+p.qty<=+p.min_qty?'var(--red)':'var(--txt)'};font-weight:600">${p.qty} ${p.unit}</td>
        <td style="color:${diff<0?'var(--red)':diff>0?'var(--green)':'var(--txt2)'};font-weight:600">${produced>0||sold.qty>0?(diff>0?'+':'')+diff:'—'}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div></div>

  <!-- الإنتاج والتكاليف -->
  <div class="sec">إنتاج المعمل</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>المنتج</th><th>الكمية</th><th>حليب مستخدم</th>${isAdmin?'<th>تكلفة/كغ</th><th>سعر مرجعي</th>':''}</tr></thead>
    <tbody>${(prodR.data||[]).map(p=>{
      const c=(costR.data||[]).find(x=>x.product_name===p.product_name);
      return`<tr>
        <td><strong>${p.product_name}</strong></td>
        <td>${p.qty_produced} كغ</td>
        <td>${p.milk_used} لتر</td>
        ${isAdmin?`<td style="color:var(--red)">${c?fmt(c.cost_per_unit)+' '+CUR:'—'}</td><td style="color:var(--green);font-weight:700">${c?fmt(c.suggested_price)+' '+CUR:'—'}</td>`:''}
      </tr>`;
    }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا يوجد إنتاج</td></tr>'}</tbody>
  </table></div></div>

  <!-- إنتاج الحليب -->
  <div class="sec">إنتاج الحليب</div>
  <div class="card">
    ${(()=>{
      const bySession={};
      (milkR.data||[]).forEach(r=>{bySession[r.session]=(bySession[r.session]||0)+ +r.liters;});
      return Object.entries(bySession).map(([s,l])=>`
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bdr)">
          <span>${s}</span><strong>${l.toFixed(1)} لتر</strong>
        </div>`).join('')||'<div style="text-align:center;color:var(--txt3);padding:16px">لا يوجد سجل حليب</div>';
    })()}
    <div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:700">
      <span>الإجمالي</span><strong style="color:var(--teal)">${totalMilk.toFixed(1)} لتر</strong>
    </div>
  </div>

  <!-- المصاريف -->
  ${(expR.data||[]).length?`
  <div class="sec">مصاريف اليوم</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>الفئة</th><th>الوصف</th><th>المبلغ</th></tr></thead>
    <tbody>${(expR.data||[]).map(e=>`<tr><td><span class="badge b-amber">${e.category}</span></td><td>${e.description||'—'}</td><td style="font-weight:600">${fmt(e.amount)} ${CUR}</td></tr>`).join('')}</tbody>
  </table></div></div>`:''}`;
}

        <div><span style="color:var(--txt2);font-size:11px">بالكيلو</span><br><strong id="wc-result-kg" style="font-size:18px">—</strong></div>
        <div><span style="color:var(--txt2);font-size:11px">بالغرام</span><br><strong id="wc-result-g" style="font-size:18px">—</strong></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="document.getElementById('weight-calc-modal').classList.remove('open')">إغلاق</button>
      <button class="btn btn-p" onclick="applyWeightToRow(${rowIdx},${pricePerKg},'${context}')">✓ تطبيق على الصنف</button>
    </div>
  </div>`;
  modal_el.classList.add('open');
}

function wcFromKg(price) {
  const kg = +document.getElementById('wc-kg').value||0;
  document.getElementById('wc-g').value = Math.round(kg*1000);
  document.getElementById('wc-result-price').textContent = fmt(Math.round(kg*price))+' '+CUR;
}
function wcFromGram(price) {
  const g = +document.getElementById('wc-g').value||0;
  const kg = g/1000;
  document.getElementById('wc-kg').value = kg.toFixed(3);
  document.getElementById('wc-result-price').textContent = fmt(Math.round(kg*price))+' '+CUR;
}
function wcFromAmount(price) {
  const amount = +document.getElementById('wc-amount').value||0;
  if(!price) return;
  const kg = amount/price;
  document.getElementById('wc-result-kg').textContent = kg.toFixed(3)+' كغ';
  document.getElementById('wc-result-g').textContent  = Math.round(kg*1000)+' غ';
}

function applyWeightToRow(rowIdx, pricePerKg, context) {
  // إذا أدخل مبلغاً بدل وزن، نحوّله للكيلو أولاً
  const amountVal = +document.getElementById('wc-amount').value||0;
  let kg = +document.getElementById('wc-kg').value||0;

  if (!kg && amountVal && pricePerKg) {
    // حوّل المبلغ لكيلو
    kg = amountVal / pricePerKg;
    // حدّث حقل الكيلو
    document.getElementById('wc-kg').value = kg.toFixed(3);
  }

  if (!kg) { toast('أدخل الوزن أو المبلغ أولاً', false); return; }

  const finalKg = parseFloat(kg.toFixed(3));

  if (context === 'sale' && saleRows && saleRows[rowIdx] !== undefined) {
    saleRows[rowIdx].qty   = finalKg;
    saleRows[rowIdx].price = pricePerKg;
    renderSaleRows();
  } else if (context === 'pos' && posCart && posCart[rowIdx] !== undefined) {
    posCart[rowIdx].qty = finalKg;
    renderPOSCart();
  }
  document.getElementById('weight-calc-modal').classList.remove('open');
  const displayStr = finalKg >= 1
    ? finalKg.toFixed(3) + ' كغ'
    : Math.round(finalKg * 1000) + ' غ';
  toast(`✓ تم تطبيق ${displayStr} — ${fmt(Math.round(finalKg * pricePerKg))} ${CUR}`);
}

// ══════════════════════════════════════════════
//  تقرير المقطوعية الشهري
// ══════════════════════════════════════════════
async function rpMaqtouia(div, from, to) {
  // استخراج الشهر من الفترة
  const month = from.slice(0,7); // YYYY-MM
  const fromDate = month+'-01';
  const toDate   = month+'-31';

  const [{data:prods},{data:costs},{data:saleItems},{data:settings}] = await Promise.all([
    sb.from('productions').select('*').gte('prod_date',fromDate).lte('prod_date',toDate).not('qty_produced','is',null),
    sb.from('production_costs').select('*').gte('prod_date',fromDate).lte('prod_date',toDate),
    sb.from('sale_items').select('product_name,qty,unit_price,sale_id,sales(sale_date)').gte('sales.sale_date',fromDate).lte('sales.sale_date',toDate),
    sb.from('cost_settings').select('setting_key,setting_value'),
  ]);

  const milkPrice = +(settings||[]).find(s=>s.setting_key==='milk_price_per_liter')?.setting_value || 5100;

  // تجميع حسب المنتج
  const byProduct = {};
  (prods||[]).forEach(p=>{
    if(!p.product_name) return;
    if(!byProduct[p.product_name]) byProduct[p.product_name]={
      name:p.product_name, batches:[], totalMilk:0, totalQty:0,
      totalCost:0, soldQty:0, soldRevenue:0
    };
    const g=byProduct[p.product_name];
    g.batches.push(p);
    g.totalMilk += +p.milk_used||0;
    g.totalQty  += +p.qty_produced||0;
  });

  // التكاليف
  (costs||[]).forEach(c=>{
    if(byProduct[c.product_name]) {
      byProduct[c.product_name].totalCost += +c.total_cost||0;
    }
  });

  // المبيعات — نفلتر بالتاريخ في JS لأن nested filter ما دائماً يشتغل
  const validSaleItems = (saleItems||[]).filter(si=>si.sales?.sale_date>=fromDate && si.sales?.sale_date<=toDate);
  validSaleItems.forEach(si=>{
    if(byProduct[si.product_name]) {
      byProduct[si.product_name].soldQty      += +si.qty||0;
      byProduct[si.product_name].soldRevenue  += (+si.qty||0)*(+si.unit_price||0);
    }
  });

  const rows = Object.values(byProduct);
  const totQty  = rows.reduce((s,r)=>s+r.totalQty,0);
  const totMilk = rows.reduce((s,r)=>s+r.totalMilk,0);
  const totCost = rows.reduce((s,r)=>s+r.totalCost,0);
  const totSold = rows.reduce((s,r)=>s+r.soldQty,0);
  const totRev  = rows.reduce((s,r)=>s+r.soldRevenue,0);

  div.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:16px;font-weight:800">📋 تقرير المقطوعية — ${month}</div>
      <div style="font-size:11px;color:var(--txt2)">سعر الحليب: ${fmt(milkPrice)} ${CUR}/لتر</div>
    </div>
    <button class="btn btn-p" onclick="downloadMaqtouia('${month}')">⬇ تنزيل Excel</button>
  </div>

  <div class="kpi-grid" style="margin-bottom:14px">
    <div class="kpi"><div class="kpi-lbl">إجمالي الإنتاج</div><div class="kpi-val" style="color:var(--teal)">${totQty.toFixed(1)}</div><div class="kpi-unit">كغ/لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">حليب مستخدم</div><div class="kpi-val" style="color:var(--blue)">${totMilk.toFixed(0)}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">إجمالي التكاليف</div><div class="kpi-val" style="color:var(--red)">${fmt(totCost)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">كمية مباعة</div><div class="kpi-val" style="color:var(--green)">${totSold.toFixed(1)}</div><div class="kpi-unit">كغ/لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">إيرادات المبيعات</div><div class="kpi-val" style="color:var(--green)">${fmt(totRev)}</div><div class="kpi-unit">${CUR}</div></div>
  </div>

  <div class="card" style="padding:0">
    <div style="padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--bdr);background:var(--amber-l);color:var(--amber)">
      📋 تفصيل المقطوعية حسب المنتج
    </div>
    <div class="tw"><table id="maqtouia-table">
      <thead><tr style="background:var(--bg)">
        <th>المنتج</th>
        <th>دفعات</th>
        <th>حليب (لتر)</th>
        <th>إنتاج (كغ/لتر)</th>
        <th>المقطوعية</th>
        <th>تكلفة/وحدة</th>
        <th>مباع</th>
        <th>متبقي</th>
        <th>إيراد</th>
        <th>هامش</th>
      </tr></thead>
      <tbody>
      ${rows.length ? rows.map(r=>{
        const maqtouia = r.totalQty>0 ? (r.totalMilk / r.totalQty).toFixed(2) : '—';
        const costPerUnit = r.totalQty>0 ? r.totalCost / r.totalQty : 0;
        const remaining = r.totalQty - r.soldQty;
        const margin = r.soldRevenue>0 ? ((r.soldRevenue-r.totalCost)/r.soldRevenue*100).toFixed(1) : '—';
        return `<tr>
          <td><strong>${r.name}</strong></td>
          <td style="text-align:center">${r.batches.length}</td>
          <td style="color:var(--blue)">${r.totalMilk.toFixed(0)}</td>
          <td style="font-weight:600;color:var(--teal)">${r.totalQty.toFixed(1)}</td>
          <td style="font-weight:700;color:var(--amber)">${maqtouia} لتر/كغ</td>
          <td style="color:var(--red)">${costPerUnit>0?fmt(costPerUnit)+' '+CUR:'—'}</td>
          <td style="color:var(--green)">${r.soldQty.toFixed(1)}</td>
          <td style="color:${remaining<0?'var(--red)':'var(--txt2)'}">${remaining.toFixed(1)}</td>
          <td style="font-weight:600">${fmt(r.soldRevenue)}</td>
          <td style="color:${+margin>20?'var(--green)':+margin>0?'var(--amber)':'var(--red)'}">
            ${margin!=='—'?margin+'%':'—'}
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="10" style="text-align:center;padding:16px;color:var(--txt3)">لا توجد بيانات إنتاج لهذا الشهر</td></tr>`}
      </tbody>
      ${rows.length?`<tfoot style="background:var(--bg);font-weight:700">
        <tr>
          <td>الإجمالي</td>
          <td></td>
          <td>${totMilk.toFixed(0)}</td>
          <td>${totQty.toFixed(1)}</td>
          <td style="color:var(--amber)">${totQty>0?(totMilk/totQty).toFixed(2)+' لتر/كغ':'—'}</td>
          <td style="color:var(--red)">${totQty>0?fmt(totCost/totQty)+' '+CUR:'—'}</td>
          <td style="color:var(--green)">${totSold.toFixed(1)}</td>
          <td>${(totQty-totSold).toFixed(1)}</td>
          <td style="color:var(--green)">${fmt(totRev)}</td>
          <td style="color:${totRev>totCost?'var(--green)':'var(--red)'}">
            ${totRev>0?((totRev-totCost)/totRev*100).toFixed(1)+'%':'—'}
          </td>
        </tr>
      </tfoot>`:''}
    </table></div>
  </div>

  ${rows.length?`<div class="card" style="margin-top:12px">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px">📊 تفاصيل الدفعات</div>
    <div class="tw"><table>
      <thead><tr><th>التاريخ</th><th>المنتج</th><th>حليب (لتر)</th><th>أُنتج</th><th>مقطوعية</th></tr></thead>
      <tbody>
      ${(prods||[]).sort((a,b)=>a.prod_date>b.prod_date?1:-1).map(p=>{
        const mq = p.qty_produced>0?(+p.milk_used/+p.qty_produced).toFixed(2):'—';
        return `<tr>
          <td>${p.prod_date}</td><td>${p.product_name||'—'}</td>
          <td>${p.milk_used}</td><td>${p.qty_produced}</td>
          <td style="font-weight:600;color:var(--amber)">${mq}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>`:''}`;
}

async function downloadMaqtouia(month) {
  const {data:prods} = await sb.from('productions').select('*')
    .gte('prod_date',month+'-01').lte('prod_date',month+'-31').not('qty_produced','is',null);
  const {data:costs} = await sb.from('production_costs').select('*')
    .gte('prod_date',month+'-01').lte('prod_date',month+'-31');

  // بناء CSV
  let csv = '\uFEFF'; // BOM for Arabic support
  csv += 'التاريخ,المنتج,حليب مستخدم (لتر),كمية منتجة,المقطوعية,تكلفة/وحدة,الكلفة الإجمالية\n';
  (prods||[]).forEach(p=>{
    const c = (costs||[]).find(x=>x.production_id===p.id);
    const mq = p.qty_produced>0?(+p.milk_used/+p.qty_produced).toFixed(2):'';
    csv += `${p.prod_date},${p.product_name||''},${p.milk_used||0},${p.qty_produced||0},${mq},${c?c.cost_per_unit:''},${c?c.total_cost:''}\n`;
  });

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`مقطوعية-${month}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('تم تنزيل المقطوعية ✓');
}

// ══════════════════════════════════════════════
//  دعم صور المنتجات
// ══════════════════════════════════════════════
async function uploadProductImage(productId, file) {
  if(!file || !productId) return null;
  const ext  = file.name.split('.').pop();
  const path = `products/${productId}.${ext}`;
  const { error } = await sb.storage.from('product-images').upload(path, file, { upsert:true });
  if(error){ toast('خطأ في رفع الصورة: '+error.message, false); return null; }
  const { data } = sb.storage.from('product-images').getPublicUrl(path);
  // حفظ URL في جدول products
  await sb.from('products').update({ image_url: data.publicUrl + '?t=' + Date.now() }).eq('id', productId);
  return data.publicUrl;
}

function openProductImagePicker(productId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    toast('جارٍ رفع الصورة...', true);
    const url = await uploadProductImage(productId, file);
    if(url) {
      // تحديث الصورة في الواجهة فوراً
      const imgEl = document.getElementById(`prod-img-${productId}`);
      if(imgEl) { imgEl.src = url; imgEl.style.display='block'; }
      toast('تم رفع الصورة ✓');
    }
  };
  input.click();
}
