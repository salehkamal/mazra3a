<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LebnAra — لبينارا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d6a1f;--green-l:#eaf3de;--green-m:#4a9e2f;
  --red:#a32d2d;--red-l:#fcebeb;--red-m:#e24b4a;
  --amber:#ba7517;--amber-l:#faeeda;--amber-m:#ef9f27;
  --blue:#185fa5;--blue-l:#e6f1fb;
  --teal:#0f6e56;--teal-l:#e1f5ee;
  --purple:#534ab7;--purple-l:#eeedfe;
  --bg:#f4f6f8;--surf:#fff;--bdr:#e5e7eb;
  --txt:#1a1a1a;--txt2:#6b7280;--txt3:#9ca3af;
  --r:10px;--rs:6px;
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a3a0f,#2d6a1f)}
.login-box{background:var(--surf);border-radius:16px;padding:40px 32px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{font-size:28px;font-weight:800;color:var(--green);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--txt2);margin-bottom:28px}
.login-box input{width:100%;padding:10px 14px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:14px;margin-bottom:12px;font-family:inherit;background:var(--bg)}
.login-box input:focus{outline:none;border-color:var(--green-m)}
.login-btn{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.login-btn:hover{background:var(--green-m)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none}

/* ── APP SHELL ── */
#app{display:none}
.topbar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.logo-name{font-size:15px;font-weight:800;color:var(--green)}
.logo-ar{font-size:11px;color:var(--txt2)}
.user-info{display:flex;align-items:center;gap:8px;font-size:13px}
.role-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.role-admin{background:var(--purple-l);color:var(--purple)}
.role-factory{background:var(--teal-l);color:var(--teal)}
.role-farm{background:var(--green-l);color:var(--green)}
.role-sales{background:var(--blue-l);color:var(--blue)}
.role-purchases{background:var(--amber-l);color:var(--amber)}
.logout-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:none;cursor:pointer;font-size:12px;color:var(--txt2)}

.nav{background:var(--surf);border-bottom:1px solid var(--bdr);display:flex;overflow-x:auto;padding:0 8px;gap:2px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:9px 13px;font-size:12px;border:none;background:none;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;font-family:inherit}
.nav-btn:hover{color:var(--txt);background:var(--bg)}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}

.main{padding:14px;max-width:960px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px}
.kpi-lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.kpi-val{font-size:22px;font-weight:700;line-height:1}
.kpi-unit{font-size:10px;color:var(--txt2);margin-top:2px}

/* ── BADGES ── */
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block}
.b-green{background:var(--green-l);color:var(--green)}
.b-red{background:var(--red-l);color:var(--red)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-blue{background:var(--blue-l);color:var(--blue)}
.b-teal{background:var(--teal-l);color:var(--teal)}
.b-purple{background:var(--purple-l);color:var(--purple)}

/* ── TABLES ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:7px 9px;color:var(--txt2);font-weight:500;border-bottom:1px solid var(--bdr);font-size:11px;white-space:nowrap}
td{text-align:right;padding:9px;border-bottom:1px solid var(--bdr);color:var(--txt)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* ── FORMS ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:11px;color:var(--txt2);font-weight:500}
.fi input,.fi select,.fi textarea{padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--surf);color:var(--txt);font-size:13px;font-family:inherit}
.fi input:focus,.fi select:focus{outline:none;border-color:var(--green-m)}
.fi.full{grid-column:1/-1}
.sec{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;padding-top:6px;border-top:1px solid var(--bdr)}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:var(--rs);font-size:13px;cursor:pointer;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);transition:all .15s;font-family:inherit}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--green);color:#fff;border-color:var(--green)}
.btn-p:hover{background:var(--green-m);border-color:var(--green-m)}
.btn-r{background:var(--red-l);color:var(--red);border-color:var(--red-m)}
.btn-a{background:var(--amber-l);color:var(--amber);border-color:var(--amber-m)}
.btn-b{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* ── TABS ── */
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--bdr);background:var(--surf);cursor:pointer;color:var(--txt2);transition:all .15s;font-family:inherit}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}

/* ── MODAL ── */
.modal-bg{display:none;background:rgba(0,0,0,.5);position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;align-items:flex-start;justify-content:center;padding-top:60px}
.modal-bg.open{display:flex}
.modal{background:var(--surf);border-radius:var(--r);padding:20px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--txt2);line-height:1}

/* ── ALERTS ── */
.alert{padding:9px 12px;border-radius:var(--rs);font-size:13px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.al-w{background:var(--amber-l);color:var(--amber)}
.al-d{background:var(--red-l);color:var(--red)}
.al-i{background:var(--blue-l);color:var(--blue)}
.al-s{background:var(--green-l);color:var(--green)}

/* ── PROGRESS ── */
.prog{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:3px;background:var(--amber-m)}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:9999;white-space:nowrap;max-width:90vw}

/* ── LOADING ── */
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--green-m);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.ld{text-align:center;padding:24px;color:var(--txt2);font-size:13px}

/* ══════════════════════════════════════════
   POS — نقطة البيع
══════════════════════════════════════════ */
#pos-page{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:300;flex-direction:column}
#pos-page.open{display:flex}
.pos-top{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pos-title{font-size:16px;font-weight:700}
.pos-body{display:flex;flex:1;overflow:hidden;gap:0}
.pos-products{flex:1;padding:12px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}
.pos-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s;text-align:center;user-select:none}
.pos-card:hover{border-color:var(--green-m);transform:scale(1.02)}
.pos-card:active{transform:scale(.97)}
.pos-card-name{font-size:13px;font-weight:600;margin-bottom:4px}
.pos-card-price{font-size:18px;font-weight:800;color:var(--green)}
.pos-card-unit{font-size:10px;color:var(--txt2)}
.pos-cart{width:300px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.pos-cart-items{flex:1;overflow-y:auto;padding:10px}
.pos-cart-item{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bdr)}
.pos-cart-item:last-child{border-bottom:none}
.pci-name{flex:1;font-size:12px;font-weight:500}
.pci-qty{display:flex;align-items:center;gap:4px}
.pci-qty button{width:22px;height:22px;border:1px solid var(--bdr);border-radius:4px;background:var(--bg);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.pci-qty span{font-size:13px;font-weight:600;min-width:20px;text-align:center}
.pci-price{font-size:12px;font-weight:600;color:var(--green);min-width:60px;text-align:left}
.pci-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 2px}
.pos-footer{padding:12px;border-top:1px solid var(--bdr);background:var(--surf)}
.pos-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pos-total-lbl{font-size:13px;color:var(--txt2)}
.pos-total-val{font-size:22px;font-weight:800;color:var(--green)}
.pos-disc-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.pos-disc-row label{font-size:11px;color:var(--txt2)}
.pos-disc-row input{width:80px;padding:5px 8px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg)}
.pos-disc-btn{padding:5px 10px;font-size:11px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--amber-l);color:var(--amber);cursor:pointer;font-family:inherit}
.pos-client-row{margin-bottom:8px}
.pos-client-row select{width:100%;padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg);font-family:inherit}
.pos-pay-btn{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.pos-pay-btn:hover{background:var(--green-m)}
.pos-pay-btn:disabled{background:var(--txt3);cursor:not-allowed}
.pos-barcode-row{display:flex;gap:6px;margin-bottom:10px}
.pos-barcode-row input{flex:1;padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--bg);font-family:inherit}

/* ── RECEIPT PRINT ── */
@media print{
  body>*{display:none!important}
  #receipt-print{display:block!important}
}
#receipt-print{display:none;font-family:'Courier New',monospace;font-size:12px;width:280px;margin:0 auto;direction:rtl}
.rcp-logo{text-align:center;font-size:16px;font-weight:bold;border-bottom:1px dashed #000;padding-bottom:6px;margin-bottom:6px}
.rcp-row{display:flex;justify-content:space-between;margin:2px 0}
.rcp-sep{border-top:1px dashed #000;margin:6px 0}
.rcp-total{font-size:15px;font-weight:bold}

/* ── USERS PAGE ── */
.user-card{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--bdr)}
.user-card:last-child{border-bottom:none}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--green);flex-shrink:0}
.user-info-col{flex:1}
.user-name{font-size:14px;font-weight:600}
.user-role{font-size:11px;color:var(--txt2)}

/* ── ACCOUNT STATEMENT ── */
.stmt-balance{text-align:center;padding:16px;border-radius:var(--r);margin-bottom:12px}
.stmt-bal-pos{background:var(--green-l)}
.stmt-bal-neg{background:var(--red-l)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .fg{grid-template-columns:1fr}
  .pos-cart{width:260px}
  .pos-products{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .pos-card-price{font-size:15px}
}
@media(max-width:480px){
  .pos-body{flex-direction:column}
  .pos-cart{width:100%;height:50%;border-right:none;border-top:1px solid var(--bdr)}
  .pos-products{height:50%}
}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">LebnAra</div>
    <div class="login-sub">لبينارا — نظام إدارة الألبان والأجبان</div>
    <input type="text" id="l-user" placeholder="اسم المستخدم" autocomplete="username">
    <input type="password" id="l-pass" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-err" id="login-err">اسم المستخدم أو كلمة المرور غير صحيحة</div>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app">
  <div class="topbar">
    <div class="logo-wrap">
      <div class="logo-icon">LB</div>
      <div>
        <div class="logo-name">LebnAra</div>
        <div class="logo-ar">لبينارا</div>
      </div>
    </div>
    <div class="user-info">
      <!-- بحث سريع عن فاتورة -->
      <div style="display:flex;gap:4px;align-items:center">
        <input type="number" id="topbar-invoice-search" placeholder="# فاتورة..."
          style="width:90px;padding:4px 8px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:12px;background:var(--bg);font-family:inherit"
          onkeydown="if(event.key==='Enter')quickSearchInvoice()">
        <button class="logout-btn" onclick="quickSearchInvoice()" title="بحث عن فاتورة">🔍</button>
      </div>
      <span id="top-username"></span>
      <span class="role-badge" id="top-role-badge"></span>
      <button class="logout-btn" onclick="openSelfPassChange()">🔑</button>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>
  <div class="nav" id="main-nav"></div>
  <div class="main" id="main-content"></div>
</div>

<!-- modal تغيير كلمة المرور الشخصية -->
<div class="modal-bg" id="self-pass-modal">
  <div class="modal" style="max-width:360px">
    <div class="modal-hdr"><span class="modal-title">تغيير كلمة مرورك</span><button class="modal-close" onclick="closeModal('self-pass-modal')">×</button></div>
    <div class="fi" style="margin-bottom:10px"><label>كلمة المرور الحالية</label><input type="password" id="self-pass-old" placeholder="أدخل كلمة المرور الحالية"></div>
    <div class="fi" style="margin-bottom:10px"><label>كلمة المرور الجديدة</label><input type="password" id="self-pass-new" placeholder="كلمة المرور الجديدة (4 أحرف أو أكثر)"></div>
    <div class="fi" style="margin-bottom:10px"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="self-pass-confirm" placeholder="أعد الكتابة"></div>
    <div class="btn-row">
      <button class="btn" onclick="closeModal('self-pass-modal')">إلغاء</button>
      <button class="btn btn-p" onclick="saveSelfPass()">حفظ</button>
    </div>
  </div>
</div>

<!-- ══════════════ POS OVERLAY ══════════════ -->
<div id="pos-page">
  <div class="pos-top">
    <div class="pos-title">🧀 LebnAra — نقطة البيع</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="pos-cashier" style="font-size:12px;opacity:.8"></span>
      <button onclick="closePOS()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px">✕ خروج</button>
    </div>
  </div>
  <div class="pos-body">
    <!-- المنتجات -->
    <div class="pos-products" id="pos-products-grid"></div>
    <!-- السلة -->
    <div class="pos-cart">
      <div style="padding:10px;border-bottom:1px solid var(--bdr);display:flex;gap:6px">
        <div class="pos-barcode-row" style="margin:0;flex:1">
          <input type="text" id="pos-barcode" placeholder="باركود..." onkeydown="if(event.key==='Enter')scanBarcode()">
          <button onclick="scanBarcode()" class="btn btn-sm btn-b">بحث</button>
        </div>
      </div>
      <div class="pos-cart-items" id="pos-cart-items">
        <div style="text-align:center;padding:30px;color:var(--txt3);font-size:13px">اضغط على منتج للإضافة</div>
      </div>
      <div class="pos-footer">
        <div class="pos-client-row" style="display:flex;gap:6px">
          <select id="pos-client" style="flex:1"></select>
          <button onclick="openPOSNewClient()" class="btn btn-sm btn-b" style="flex-shrink:0" title="عميل جديد">+</button>
        </div>
        <div style="margin-bottom:8px">
          <input type="text" id="pos-notes" placeholder="ملاحظات (اختياري)..."
            style="width:100%;padding:6px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);font-size:12px;font-family:inherit">
        </div>
        <div class="pos-disc-row">
          <label>خصم:</label>
          <input type="number" id="pos-disc-pct" placeholder="%" min="0" max="10" step="1" oninput="updatePOSTotal()">
          <button class="pos-disc-btn" onclick="applyDiscount10()">10%</button>
          <label style="margin-right:8px">قيمة:</label>
          <input type="number" id="pos-disc-val" placeholder="ل.س" min="0" oninput="updatePOSTotal()">
        </div>
        <div class="pos-total-row">
          <span class="pos-total-lbl">الإجمالي</span>
          <span class="pos-total-val" id="pos-total">0 ل.س</span>
        </div>
        <div class="pos-total-row" id="pos-disc-display" style="display:none">
          <span style="font-size:12px;color:var(--red)">الخصم</span>
          <span style="font-size:13px;font-weight:600;color:var(--red)" id="pos-disc-amount">0 ل.س</span>
        </div>
        <div class="pos-total-row" id="pos-net-row" style="display:none">
          <span style="font-size:13px;font-weight:600">الصافي</span>
          <span style="font-size:20px;font-weight:800;color:var(--green)" id="pos-net-total">0 ل.س</span>
        </div>
        <button class="pos-pay-btn" id="pos-pay-btn" onclick="processPOSSale()">💰 إتمام الدفع</button>
      </div>
    </div>
  </div>
</div>

<!-- modal عميل جديد في POS -->
<div class="modal-bg" id="pos-new-client-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-hdr"><span class="modal-title">عميل جديد</span><button class="modal-close" onclick="closeModal('pos-new-client-modal')">×</button></div>
    <div class="fg">
      <div class="fi"><label>الاسم</label><input type="text" id="pos-nc-name"></div>
      <div class="fi"><label>الهاتف</label><input type="tel" id="pos-nc-phone"></div>

async function doLogin() {
  const username = document.getElementById('l-user').value.trim();

  if (!username || !password) return;
  const { data, error } = await sb.from('app_users')
    .select('*').eq('username', username).eq('password_hash', password).eq('is_active', true).single();
  if (error || !data) {
    document.getElementById('login-err').style.display = 'block'; return;
  }
  CU = data;

function can(action) {
  if (!CU) return false;
  if (CU.role === 'admin') return true;

function buildNav() {
  const nav = document.getElementById('main-nav');
  nav.innerHTML = '';
  Object.entries(PAGES).forEach(([key, pg]) => {
    if (!pg.roles.includes(CU.role)) return;
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = pg.label;
    btn.dataset.page = key;
    if (pg.isPOS) {
      btn.onclick = () => openPOS();
    } else {
      btn.onclick = () => showPage(key, btn);
    }
    nav.appendChild(btn);
  });
}

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const b = document.querySelector(`.nav-btn[data-page="${name}"]`);
    if (b) b.classList.add('active');
  }
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div id="page-${name}" class="page active"></div>`;
  const pg = document.getElementById(`page-${name}`);
  const loader = pageLoaders[name];
  if (loader) loader(pg);
}

  dashboard:    renderDashboard,

function fmt(n) { return Math.round(+n||0).toLocaleString('ar-SY'); }
function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = ok ? '#1a1a1a' : '#a32d2d';
  t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display='none', 3000);
}
function modal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function setDate(id) { const el = document.getElementById(id); if(el) el.value = todayStr(); }
function tabs(prefix, name, btn, loader) {
  document.querySelectorAll(`[id^="${prefix}-tab-"]`).forEach(el => el.style.display='none');
  const el = document.getElementById(`${prefix}-tab-${name}`);
  if (el) el.style.display = 'block';
  btn.closest('.tabs').querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (loader) loader();
}

async function dashAdmin() {
  const today = todayStr(), ms = today.slice(0,7)+'-01';

  const [milkR,salesTodayR,salesMonthR,expR,clientsR,recentR,saleItemsR,prodsR] = await Promise.all([

    sb.from('sales').select('id,sale_date,total,payment_method,cashier_name,clients(name),sale_items(product_name,qty,unit_price)').order('created_at',{ascending:false}).limit(6),
    sb.from('sale_items').select('product_name,qty,unit_price').gte('created_at',ms+'T00:00:00'),
    sb.from('products').select('name,qty,min_qty,unit'),
  ]);

  const milk=+(milkR.data||[]).reduce((s,r)=>s+ +r.liters,0);
  const salesToday=(salesTodayR.data||[]).reduce((s,r)=>s+ +r.total,0);
  const salesMonth=(salesMonthR.data||[]).reduce((s,r)=>s+ +r.total,0);
  const exp=(expR.data||[]).reduce((s,r)=>s+ +r.amount,0);
  const debt=(clientsR.data||[]).reduce((s,c)=>s+ +c.debt,0);
  const net=salesMonth-exp;
  const lowStock=(prodsR.data||[]).filter(p=> +p.qty<= +p.min_qty);

  // أكثر الأصناف مبيعاً
  const pt={};
  (saleItemsR.data||[]).forEach(i=>{
    if(!pt[i.product_name]) pt[i.product_name]={rev:0,qty:0};
    pt[i.product_name].rev += +i.qty * +i.unit_price;
    pt[i.product_name].qty += +i.qty;
  });
  const topProds=Object.entries(pt).sort((a,b)=>b[1].rev-a[1].rev).slice(0,6);
  const maxProd=Math.max(...topProds.map(([,v])=>v.rev),1);
  const clrs=['var(--green-m)','var(--teal)','var(--blue)','var(--amber-m)','var(--purple)','var(--red-m)'];

  div.innerHTML = `
  <!-- KPIs -->
  <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:12px">
    <div class="kpi"><div class="kpi-lbl">🥛 حليب اليوم</div><div class="kpi-val" style="color:var(--teal)">${milk.toFixed(1)}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">💰 مبيعات اليوم</div><div class="kpi-val" style="color:var(--green)">${fmt(salesToday)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">📈 مبيعات الشهر</div><div class="kpi-val" style="color:var(--green)">${fmt(salesMonth)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">📉 مصاريف الشهر</div><div class="kpi-val" style="color:var(--red)">${fmt(exp)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi" style="background:${net>=0?'var(--green-l)':'var(--red-l)'}"><div class="kpi-lbl">✨ صافي الربح</div><div class="kpi-val" style="color:${net>=0?'var(--green)':'var(--red)'}">${fmt(net)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">💳 ديون العملاء</div><div class="kpi-val" style="color:var(--amber)">${fmt(debt)}</div><div class="kpi-unit">${CUR}</div></div>
  </div>

  <!-- تنبيهات مخزون منخفض -->
  ${lowStock.length?`<div class="card" style="background:var(--amber-l);border:1px solid var(--amber-m);margin-bottom:12px">
    <div style="font-size:12px;font-weight:700;color:var(--amber);margin-bottom:6px">⚠️ مخزون منخفض</div>
    ${lowStock.map(p=>`<span style="display:inline-block;background:#fff;border-radius:12px;padding:2px 10px;font-size:11px;margin:2px;color:var(--amber)">${p.name}: ${p.qty} ${p.unit}</span>`).join('')}
  </div>`:''}

  <!-- رسم + فواتير -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
    <div>
      <div class="sec" style="margin-top:0">أكثر الأصناف مبيعاً (الشهر)</div>
      <div class="card">${topProds.length?`<div style="display:flex;flex-direction:column;gap:6px">
        ${topProds.map(([name,v],i)=>`<div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">
            <span style="font-weight:600">${name}</span>
            <strong>${fmt(v.rev)} ${CUR}</strong>
          </div>
          <div style="background:var(--bg);border-radius:3px;height:6px">
            <div style="height:100%;width:${Math.round(v.rev/maxProd*100)}%;background:${clrs[i%clrs.length]};border-radius:3px"></div>
          </div></div>`).join('')}
      </div>`:'<div style="text-align:center;color:var(--txt3);font-size:12px;padding:20px">لا توجد مبيعات هذا الشهر</div>'}</div>
    </div>
    <div>
      <div class="sec" style="margin-top:0">آخر الفواتير</div>
      <div class="card" style="padding:0">
        ${(recentR.data||[]).map(s=>{
          const items=(s.sale_items||[]).map(i=>`<span style="font-size:10px;background:var(--green-l);color:var(--green);border-radius:10px;padding:1px 6px;margin:1px;display:inline-block">${i.product_name}</span>`).join('');
          return `<div style="padding:8px 12px;border-bottom:1px solid var(--bdr);cursor:pointer" onclick="openSaleDetail(${s.id})">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <span style="background:var(--green);color:#fff;padding:1px 8px;border-radius:12px;font-size:11px;font-weight:700">#${s.id}</span>
              <strong style="color:var(--green);font-size:13px">${fmt(s.total)} ${CUR}</strong>

            <div style="margin-top:3px">${items}</div>

        }).join('')||'<div style="text-align:center;padding:20px;color:var(--txt3);font-size:12px">لا توجد فواتير</div>'}

async function loadMilkEntry() {
  const {data:cows} = await sb.from('cows').select('id,name,daily_liters').order('name');
  const tb = document.getElementById('mk-rows');
  if (!cows?.length) { tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--txt3)">لا توجد أبقار</td></tr>'; return; }
  tb.innerHTML = cows.map(c=>`<tr>
    <td>${c.name}</td>
    <td><input type="number" min="0" step="0.1" value="${c.daily_liters||0}"
      style="width:75px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
      data-cow="${c.id}" oninput="calcMilkTotal()"></td>
    <td><select style="font-size:11px;padding:3px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt)"><option>ممتازة</option><option>جيدة</option><option>عادية</option></select></td>
    <td><input type="text" placeholder="..." style="width:80px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:11px"></td>
  </tr>`).join('');
  calcMilkTotal();
}

function calcMilkTotal() {
  let t=0; document.querySelectorAll('#mk-rows input[type=number]').forEach(i=>t+= +i.value||0);
  document.getElementById('mk-total').textContent = t.toFixed(1);
}

async function saveMilk() {
  const date = document.getElementById('mk-date').value;
  const session = document.getElementById('mk-session').value;
  const inputs = document.querySelectorAll('#mk-rows input[type=number]');
  const recs = [];
  let totalLiters = 0;
  inputs.forEach(inp => { const l= +inp.value; if(l>0){ recs.push({record_date:date,session,cow_id:+inp.dataset.cow,liters:l,quality:'جيدة'}); totalLiters+=l; } });
  if (!recs.length) { toast('أدخل كميات الحليب',false); return; }
  const {error} = await sb.from('milk_records').insert(recs);
  if (error) { toast('خطأ: '+error.message,false); return; }

  // إضافة الحليب تلقائياً لمخزون منتج الحليب الطازج
  const {data:milkProd} = await sb.from('products').select('id,qty').eq('product_type','raw_milk').maybeSingle();
  if (milkProd) {
    const newQty = +milkProd.qty + totalLiters;
    await sb.from('products').update({qty: newQty}).eq('id', milkProd.id);
    await sb.from('inventory_logs').insert({
      product_name:'حليب طازج', change_type:'إنتاج يومي',
      qty_before:+milkProd.qty, qty_after:newQty, qty_change:totalLiters,
      reason:`${date} — ${session}`
    });
  }

  await logAction('تسجيل حليب', `${date} ${session} — ${totalLiters.toFixed(1)} لتر`, 'milk');
  toast('تم حفظ سجل الحلب ✓');
}

let milkEditMeta = {};
async function openMilkEdit(date, session) {
  milkEditMeta = {date, session};
  document.getElementById('mk-edit-title').textContent = `تعديل: ${date} — ${session}`;
  const [{data:recs},{data:cows}] = await Promise.all([
    sb.from('milk_records').select('id,liters,cow_id').eq('record_date',date).eq('session',session),
    sb.from('cows').select('id,name').order('name'),
  ]);
  const map = {}; (recs||[]).forEach(r=>map[r.cow_id]={id:r.id,liters:r.liters});
  document.getElementById('mk-edit-rows').innerHTML = (cows||[]).map(c=>`<tr>
    <td>${c.name}</td>
    <td><input type="number" min="0" step="0.1" value="${map[c.id]?.liters||0}"
      data-cow="${c.id}" oninput="calcMkEditTotal()"
      style="width:75px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"></td>
  </tr>`).join('');
  calcMkEditTotal();
  modal('mk-edit-modal');
}
function calcMkEditTotal() {
  let t=0; document.querySelectorAll('#mk-edit-rows input').forEach(i=>t+= +i.value||0);
  document.getElementById('mk-edit-total').textContent = t.toFixed(1);
}
async function saveMilkEdit() {
  const {date,session} = milkEditMeta;
  await sb.from('milk_records').delete().eq('record_date',date).eq('session',session);
  const inputs = document.querySelectorAll('#mk-edit-rows input');
  const recs = [];
  inputs.forEach(inp => { const l= +inp.value; if(l>0) recs.push({record_date:date,session,cow_id:+inp.dataset.cow,liters:l,quality:'جيدة'}); });
  if (recs.length) await sb.from('milk_records').insert(recs);
  await logAction('تعديل حليب', `${date} — ${session}`, 'milk');
  closeModal('mk-edit-modal'); loadMilkHist(); toast('تم تعديل السجل ✓');
}
async function deleteMilkSession() {
  if (!confirm(`حذف سجل ${milkEditMeta.date} — ${milkEditMeta.session}؟`)) return;
  await sb.from('milk_records').delete().eq('record_date',milkEditMeta.date).eq('session',milkEditMeta.session);
  await logAction('حذف سجل حليب', `${milkEditMeta.date} — ${milkEditMeta.session}`, 'milk');
  closeModal('mk-edit-modal'); loadMilkHist(); toast('تم الحذف');
}
async function loadMilkHist() {
  const {data} = await sb.from('milk_records').select('record_date,session,liters').order('record_date',{ascending:false}).limit(300);
  const grouped = {};
  (data||[]).forEach(r=>{ const k=r.record_date+'|'+r.session; if(!grouped[k]) grouped[k]={date:r.record_date,session:r.session,total:0}; grouped[k].total+= +r.liters; });
  const {data:cows} = await sb.from('cows').select('id');
  const cc = cows?.length||1;
  const rows = Object.values(grouped);
  const tb = document.getElementById('mk-hist-tb');
  const canEdit = CU.role==='admin';
  tb.innerHTML = rows.map(r=>`<tr>
    <td>${r.date}</td><td>${r.session}</td>
    <td><strong>${r.total.toFixed(1)}</strong> لتر</td>
    <td>${(r.total/cc).toFixed(1)} لتر</td>
    ${canEdit?`<td><button class="btn btn-sm" onclick="openMilkEdit('${r.date}','${r.session}')">تعديل</button></td>`:''}
  </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد سجلات</td></tr>';
}

async function initFacNew() {
  // جلب كل المنتجات وفلتر raw_milk في JavaScript
  const {data:prods} = await sb.from('products')
    .select('name,unit,product_type')
    .order('sort_order',{ascending:true}).order('name');
  const sel = document.getElementById('fac-prod');
  if(!sel) return;
  // استثناء حليب المزرعة الخام فقط — كل الأجبان واللبن واللبنة تظهر
  const list = (prods||[]).filter(p => p.product_type !== 'raw_milk');
  sel.innerHTML = list.map(p=>`
    <option value="${p.name}" data-unit="${p.unit||'كغ'}" data-type="${p.product_type||''}">
      ${p.name}${p.product_type==='laban'?' (لبن رائب)':p.product_type==='labneh'?' (لبنة)':''}
    </option>`).join('');
  await loadMilkSourceStocks();
  onFacProdChange();
}

async function loadMilkSourceStocks() {
  const [{data:farmMilk},{data:powderItem}] = await Promise.all([
    sb.from('products').select('qty').eq('product_type','raw_milk').maybeSingle(),
    sb.from('consumables').select('qty_available').ilike('name','%بودرة%').maybeSingle(),
  ]);
  const fms = document.getElementById('farm-milk-stock');
  const ps  = document.getElementById('powder-stock');
  const farmQty = +(farmMilk?.qty||0);
  if(fms) {
    fms.textContent = farmQty.toFixed(1)+' لتر';
    fms.style.color = farmQty < 10 ? 'var(--red)' : 'var(--green)';
  }
  if(ps) ps.textContent = (powderItem?.qty_available||0)+' كغ';
}

async function onFacProdChange() {
  const sel = document.getElementById('fac-prod');
  if(!sel) return;
  const opt   = sel.options[sel.selectedIndex];
  const ptype = opt?.dataset?.type||'';
  const labanRow    = document.getElementById('fac-laban-row');
  const milkSources = document.getElementById('fac-milk-sources');
  if(!labanRow||!milkSources) return;
  if (ptype === 'labneh') {
    labanRow.style.display    = 'block';
    milkSources.style.display = 'none';
    const {data:laban} = await sb.from('products').select('qty').eq('product_type','laban').maybeSingle();
    const stock = +(laban?.qty||0);
    const stockEl = document.getElementById('fac-laban-stock');
    if(stockEl) stockEl.textContent = stock.toFixed(1)+' لتر';
    const remainEl = document.getElementById('fac-laban-remain');
    if(remainEl) remainEl.textContent = stock.toFixed(1)+' لتر';
    labanRow._stock = stock;
  } else {
    labanRow.style.display    = 'none';
    milkSources.style.display = 'block';
    await loadMilkSourceStocks();
  }
}

function previewLabanBalance() {
  const labanRow = document.getElementById('fac-laban-row');
  const used  = +document.getElementById('fac-laban-used')?.value||0;
  const stock = labanRow?._stock||0;
  const remain = Math.max(0, stock - used);
  const el = document.getElementById('fac-laban-remain');
  if(el) {
    el.textContent = remain.toFixed(1)+' لتر';
    el.style.color = remain < 5 ? 'var(--red)' : 'var(--teal)';
  }
}

function updateTotalMilk() {
  const farm      = +document.getElementById('fac-milk-farm')?.value||0;
  const powderKg  = +document.getElementById('fac-milk-powder')?.value||0;
  const purchased = +document.getElementById('fac-milk-purchased')?.value||0;
  const el  = document.getElementById('fac-milk-total');
  if(el) el.textContent = (farm + powderKg + purchased).toFixed(1);
  // إظهار حقل سعر المشتريات عند إدخال كمية
  const priceRow = document.getElementById('fac-purchased-price-row');
  if(priceRow) priceRow.style.display = purchased > 0 ? 'flex' : 'none';
  // معاينة تكلفة الحليب
  const preview = document.getElementById('fac-milk-cost-preview');
  if(preview) {
    const price = 5100; // سيُجلب من الإعدادات لاحقاً
    const cost = (farm + powderKg) * price + purchased * (+document.getElementById('fac-milk-purchased-price')?.value||price);
    preview.textContent = cost > 0 ? `تكلفة الحليب: ${fmt(Math.round(cost))} ${CUR}` : '';
  }
}

function toggleFacNewProdInline() {
  const f = document.getElementById('fac-new-prod-inline');
  if(f) f.style.display = f.style.display==='none'?'block':'none';
}

async function saveInlineNewProduct() {
  const name = document.getElementById('fac-inline-name').value.trim();
  if(!name) { toast('أدخل اسم المنتج',false); return; }
  const {data:ex} = await sb.from('products').select('id').eq('name',name).maybeSingle();
  if(ex) {
    toast('المنتج موجود — تم اختياره',false);
    await initFacNew();
    const sel = document.getElementById('fac-prod');
    if(sel) { sel.value = name; onFacProdChange(); }
    toggleFacNewProdInline();
    return;
  }
  const {error} = await sb.from('products').insert({
    name,
    unit:  document.getElementById('fac-inline-unit').value,
    qty: 0, min_qty: 5,
    price_per_unit: +document.getElementById('fac-inline-price').value||0,
    product_type:   document.getElementById('fac-inline-type').value||null,
  });
  if(error) { toast('خطأ: '+error.message,false); return; }
  await logAction('إضافة منتج', name, 'factory');
  await initFacNew();
  const sel = document.getElementById('fac-prod');
  if(sel) { sel.value = name; onFacProdChange(); }
  toggleFacNewProdInline();
  document.getElementById('fac-inline-name').value='';
  toast(`تمت إضافة "${name}" ✓`);
}

async function previewFacCost() {
  const sel = document.getElementById('fac-prod');
  const pn  = sel?.value;
  if(!pn) { toast('اختر المنتج أولاً',false); return; }
  const numProds = +document.getElementById('fac-num-products').value||1;
  const farm   = +document.getElementById('fac-milk-farm')?.value||0;
  const powder = +document.getElementById('fac-milk-powder')?.value||0;
  const purch  = +document.getElementById('fac-milk-purchased')?.value||0;
  const purchP = +document.getElementById('fac-milk-purchased-price')?.value||0;
  const extra  = +document.getElementById('fac-cost').value||0;
  const rennet = +document.getElementById('fac-rennet').value||0;
  const calcium= +document.getElementById('fac-calcium').value||0;

  const {data:settings} = await sb.from('cost_settings').select('setting_key,setting_value');
  const cfg = {};
  (settings||[]).forEach(s=>cfg[s.setting_key]= +s.setting_value);
  const milkP   = cfg['milk_price_per_liter']||5100;
  const wages   = cfg['daily_wages_total']   ||172500;
  const mazot   = cfg['daily_mazot_total']   ||172500;
  const rennetP = cfg['rennet_price_per_ml'] ||50;
  const calcP   = cfg['calcium_price_per_g'] ||5;

  const milkCost  = (farm+powder)*milkP + purch*(purchP||milkP);
  const laborCost = wages/numProds;
  const mazotCost = mazot/numProds;
  const matCost   = rennet*rennetP + calcium*calcP;
  const totalFixed= laborCost+mazotCost;
  const total     = milkCost+laborCost+mazotCost+matCost+extra;

  document.getElementById('cost-preview-body').innerHTML = `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
    <div class="kpi"><div class="kpi-lbl">🥛 تكلفة الحليب</div>
      <div class="kpi-val" style="font-size:16px;color:var(--blue)">${fmt(Math.round(milkCost))}</div>
      <div class="kpi-unit">${CUR}</div>
      <div style="font-size:10px;color:var(--txt2);margin-top:2px">(${farm+powder} وحدة × ${fmt(milkP)})</div>
    </div>
    <div class="kpi"><div class="kpi-lbl">👷 يوميات العمالة</div>
      <div class="kpi-val" style="font-size:16px;color:var(--purple)">${fmt(Math.round(laborCost))}</div>
      <div class="kpi-unit">${CUR}</div>
      <div style="font-size:10px;color:var(--txt2);margin-top:2px">${fmt(wages)} ÷ ${numProds} أصناف</div>
    </div>
    <div class="kpi"><div class="kpi-lbl">⛽ مازوت</div>
      <div class="kpi-val" style="font-size:16px;color:var(--amber)">${fmt(Math.round(mazotCost))}</div>
      <div class="kpi-unit">${CUR}</div>
      <div style="font-size:10px;color:var(--txt2);margin-top:2px">${fmt(mazot)} ÷ ${numProds} أصناف</div>
    </div>
    <div class="kpi"><div class="kpi-lbl">🧪 مواد + إضافات</div>
      <div class="kpi-val" style="font-size:16px;color:var(--teal)">${fmt(Math.round(matCost+extra))}</div>
      <div class="kpi-unit">${CUR}</div>
    </div>
  </div>
  <div style="background:var(--green-l);border-radius:var(--rs);padding:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--green-m)">
    <div>
      <div style="font-size:12px;color:var(--txt2)">إجمالي التكاليف المسجّلة</div>
      <div style="font-size:11px;color:var(--txt3)">(بدون الكمية — ستُقسَّم على الناتج لاحقاً)</div>
    </div>
    <div style="font-size:24px;font-weight:800;color:var(--green)">${fmt(Math.round(total))} ${CUR}</div>
  </div>`;
  modal('cost-preview-modal');
}
async function checkPendingWarning() {
  const twoDaysAgo = new Date();
  twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
  const cutoff = twoDaysAgo.toISOString().split('T')[0];
  const {data} = await sb.from('productions')
    .select('id,product_name,prod_date')
    .is('qty_produced', null)
    .lte('prod_date', cutoff);
  if (data?.length) {
    const names = data.map(r=>`${r.product_name} (${r.prod_date})`).join('، ');
    toast(`⚠️ تحذير: ${data.length} دفعة منتظرة لأكثر من يومين بدون كمية: ${names}`, false);
  }
}

    .select('*')
    .is('qty_produced', null)
    .order('prod_date', {ascending:false});

  const today = todayStr();
  if (!data?.length) {
    div.innerHTML = `<div class="card" style="text-align:center;padding:24px;color:var(--green)">
      ✅ لا توجد دفعات منتظرة — كل الدفعات مكتملة
    </div>`;

  div.innerHTML = `<div class="card" style="margin-bottom:12px;background:var(--amber-l);border:1px solid var(--amber-m)">
    <div style="font-weight:700;color:var(--amber);margin-bottom:4px">⏳ ${data.length} دفعة تنتظر إدخال الكمية المنتجة</div>
    <div style="font-size:11px;color:var(--txt2)">اضغط على أي دفعة لإدخال الكمية المنتجة</div>
  </div>
  <div class="card" style="padding:0">
    ${data.map(r=>{
      const daysPast = Math.floor((new Date(today)-new Date(r.prod_date))/(1000*60*60*24));
      const isLate = daysPast >= 2;
      return `<div style="padding:12px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;${isLate?'background:var(--red-l)':''}"
        onclick="openFacQtyModal(${r.id})">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-weight:700;font-size:14px">${r.product_name}</span>
          <span class="badge ${isLate?'b-red':'b-amber'}">${isLate?'⚠️ متأخرة '+daysPast+' أيام':'معلقة'}</span>
        </div>
        <div style="font-size:12px;color:var(--txt2)">

async function saveFacQty() {
  const qty = +document.getElementById('fac-qty-input').value;
  if (!qty || qty <= 0) { toast('أدخل الكمية المنتجة',false); return; }
  if (!currentPendingId) return;

  const expiry = document.getElementById('fac-expiry-input').value;

  // جلب بيانات الدفعة
  const {data:prod} = await sb.from('productions').select('*').eq('id',currentPendingId).single();

  // تحديث الدفعة بالكمية المنتجة
  await sb.from('productions').update({
    qty_produced: qty,
    expiry_date: expiry||null,
  }).eq('id', currentPendingId);

  // إضافة للمخزون
  const {data:p} = await sb.from('products').select('id,qty,unit').eq('name',prod.product_name).maybeSingle();
  if (!p) { toast(`تحذير: المنتج "${prod.product_name}" غير موجود في المخزون`,false); return; }
  const newQty = +p.qty + qty;
  await sb.from('products').update({qty: newQty}).eq('id', p.id);
  await sb.from('inventory_logs').insert({
    product_name: prod.product_name,
    change_type: 'إنتاج معمل',
    qty_before: +p.qty, qty_after: newQty, qty_change: qty,
    reason: `دفعة إنتاج #${currentPendingId} — ${prod.prod_date}`
  });

  // حساب التكلفة الآن
  await calcProductionCost(
    {...prod, id:currentPendingId},
    prod.prod_date, prod.milk_used||0, qty, prod.extra_cost||0,
    prod.product_type==='labneh'
  );

  await logAction('إكمال دفعة إنتاج', `${prod.product_name} — ${qty} ${p.unit||'كغ'}`, 'factory');
  closeModal('fac-qty-modal');
  loadPendingProductions();
  toast(`✅ ${prod.product_name}: أضيف ${qty} ${p.unit||'كغ'} للمخزون (إجمالي: ${newQty})`);
}

async function calcProductionCost(prod, prodDate, milkUsed, qtyProduced, extraCost, isLabneh=false) {
  if (!qtyProduced) return;
  const {data:settings} = await sb.from('cost_settings').select('setting_key,setting_value');
  const cfg = {};
  (settings||[]).forEach(s => cfg[s.setting_key] = +s.setting_value);
  // الأسعار الصحيحة من الملف
  const milkPrice   = cfg['milk_price_per_liter'] || 5100;  // سعر اللتر
  const dailyWages  = cfg['daily_wages_total']    || 172500; // إجمالي أجور يومية ÷ أصناف
  const dailyMazot  = cfg['daily_mazot_total']    || 172500; // مازوت يومي ÷ أصناف
  const rennetPrice = cfg['rennet_price_per_ml']  || 50;
  const calciumPrice= cfg['calcium_price_per_g']  || 5;

  // عدد الأصناف اليوم من ملاحظات الدفعة
  let numProds = 1;
  if (prod.notes) {
    const m = prod.notes.match(/أصناف اليوم:(\d+)/);
    if (m) numProds = Math.max(+m[1], 1);
  }
  if (numProds === 1) {
    const {data:dp} = await sb.from('productions').select('id').eq('prod_date', prodDate);
    numProds = Math.max(dp?.length||1, 1);
  }

  let milkCost=0, laborCost=0, mazotCost=0, materialsCost=0;

  if (isLabneh) {
    const {data:lp} = await sb.from('products').select('cost_per_unit').eq('product_type','laban').maybeSingle();
    milkCost  = milkUsed * (+lp?.cost_per_unit||0);
    laborCost = dailyWages / numProds;
    mazotCost = 0;
  } else {
    // تكلفة الحليب: (طازج + بودرة_كغ + مشتريات) × السعر
    // البودرة تُحسب بنفس سعر اللتر (من الملف: 571200 = (100+12)×5100)
    const mFarm   = +(prod.milk_farm||0);
    const mPowder = +(prod.milk_powder_g||0); // كغ
    const mPurch  = +(prod.milk_purchased||0);
    const pPrice  = +(prod.milk_purchased_price||0)||milkPrice;
    milkCost  = (mFarm + mPowder) * milkPrice + mPurch * pPrice;
    laborCost = dailyWages / numProds;
    mazotCost = dailyMazot / numProds;
    materialsCost = (prod.rennet_ml||0)*rennetPrice + (prod.calcium_chloride||0)*calciumPrice;
  }

  const totalCost   = milkCost + laborCost + mazotCost + materialsCost + extraCost;
  const costPerUnit = qtyProduced > 0 ? totalCost / qtyProduced : 0;

  const {data:recent} = await sb.from('production_costs')
    .select('cost_per_unit').eq('product_name', prod.product_name)
    .order('created_at',{ascending:false}).limit(30);
  const rc = (recent||[]).map(r=>+r.cost_per_unit).filter(v=>v>0);
  rc.push(costPerUnit);
  const avg30 = rc.reduce((a,b)=>a+b,0)/rc.length;
  const suggestedPrice = Math.ceil(avg30*1.25/500)*500;

  await sb.from('production_costs').insert({
    production_id:prod.id, prod_date:prodDate,
    product_name:prod.product_name, qty_produced:qtyProduced,
    milk_cost:Math.round(milkCost), labor_cost:Math.round(laborCost),
    diesel_cost:Math.round(mazotCost), materials_cost:Math.round(materialsCost),
    extra_cost:Math.round(extraCost), total_cost:Math.round(totalCost),
    cost_per_unit:Math.round(costPerUnit), avg_cost_30d:Math.round(avg30),
    suggested_price:suggestedPrice,
  });
  await sb.from('products').update({cost_per_unit:Math.round(avg30)}).eq('name',prod.product_name);
}
async function saveFacStep1() {
  const sel  = document.getElementById('fac-prod');
  const pn   = sel?.value;
  if (!pn) { toast('اختر المنتج أولاً',false); return; }

  const opt      = sel.options[sel.selectedIndex];
  const ptype    = opt?.dataset?.type||'';
  const prodDate = document.getElementById('fac-date').value;
  const calcium  = +document.getElementById('fac-calcium').value||0;
  const rennet   = +document.getElementById('fac-rennet').value||0;
  const extraCost= +document.getElementById('fac-cost').value||0;
  const numProds = +document.getElementById('fac-num-products').value||1;
  const notes    = document.getElementById('fac-notes').value||'';

  let milkUsed = 0;
  let milkFarm = 0, milkPowder = 0, milkPurch = 0, milkPurchPrice = 0;

  if (ptype === 'labneh') {
    const labanUsed = +document.getElementById('fac-laban-used')?.value||0;
    if (!labanUsed) { toast('أدخل كمية اللبن المستخدمة',false); return; }
    // التحقق من مخزون اللبن
    const {data:labanProd} = await sb.from('products').select('id,qty').eq('product_type','laban').maybeSingle();
    if (!labanProd) { toast('لا يوجد منتج لبن رائب في النظام',false); return; }
    if (+labanProd.qty < labanUsed) { toast(`مخزون اللبن غير كافٍ — متاح: ${labanProd.qty} لتر`,false); return; }
    const newLabanQty = +labanProd.qty - labanUsed;
    await sb.from('products').update({qty:newLabanQty}).eq('id',labanProd.id);
    await sb.from('inventory_logs').insert({
      product_name:'لبن رائب', change_type:'استخدام لإنتاج لبنة',
      qty_before:+labanProd.qty, qty_after:newLabanQty, qty_change:-labanUsed,
      reason:`دفعة لبنة — ${prodDate}`
    });
    milkUsed = labanUsed;
  } else {
    milkFarm  = +document.getElementById('fac-milk-farm')?.value||0;
    milkPowder= +document.getElementById('fac-milk-powder')?.value||0;
    milkPurch = +document.getElementById('fac-milk-purchased')?.value||0;
    milkPurchPrice = +document.getElementById('fac-milk-purchased-price')?.value||0;
    milkUsed  = milkFarm + milkPowder + milkPurch; // بالوحدات الحقيقية لكل مصدر
    if (!milkUsed) { toast('أدخل مصدر الحليب المستخدم',false); return; }

    // خصم حليب المزرعة
    if (milkFarm > 0) {
      const {data:rawMilk} = await sb.from('products').select('id,qty').eq('product_type','raw_milk').maybeSingle();
      if (!rawMilk) { toast('تحذير: لا يوجد منتج حليب طازج — سجّل إنتاج الحليب أولاً',false); return; }
      if (+rawMilk.qty < milkFarm) { toast(`حليب المزرعة غير كافٍ — متاح: ${rawMilk.qty} لتر`,false); return; }
      const newQ = +rawMilk.qty - milkFarm;
      await sb.from('products').update({qty:newQ}).eq('id',rawMilk.id);
      await sb.from('inventory_logs').insert({
        product_name:'حليب طازج', change_type:'استخدام في الإنتاج',
        qty_before:+rawMilk.qty, qty_after:newQ, qty_change:-milkFarm,
        reason:`إنتاج ${pn} — ${prodDate}`
      });
    }

    // خصم البودرة من المستهلكات
    if (milkPowder > 0) {
      const {data:powderItem} = await sb.from('consumables').select('id,qty_available').ilike('name','%بودرة%').maybeSingle();
      if (powderItem && +powderItem.qty_available >= milkPowder) {
        await sb.from('consumables').update({qty_available:+powderItem.qty_available - milkPowder}).eq('id',powderItem.id);
      }
    }
  }

  // حفظ الدفعة بدون qty_produced (null = منتظرة)
  const {data:prod, error} = await sb.from('productions').insert({
    prod_date: prodDate,
    product_name: pn,
    milk_used: milkUsed,
    qty_produced: null,  // ← سيُضاف لاحقاً
    extra_cost: extraCost,
    calcium_chloride: calcium,
    rennet_ml: rennet,
    milk_powder_g: milkPowder,
    notes: `أصناف اليوم:${numProds} | ${notes}`,
  }).select().single();

  if (error) { toast('خطأ: '+error.message,false); return; }

  await logAction('تسجيل مدخلات إنتاج', `${pn} — ${milkUsed} لتر حليب`, 'factory');

  // إعادة تعيين النموذج
  ['fac-notes','fac-laban-used','fac-milk-farm','fac-milk-powder','fac-milk-purchased','fac-milk-purchased-price'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  ['fac-calcium','fac-rennet','fac-cost'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='0';
  });
  document.getElementById('fac-num-products').value='1';
  updateTotalMilk();
  onFacProdChange();

  toast(`✅ تم تسجيل مدخلات ${pn} — أدخل الكمية المنتجة عند الانتهاء`);

  // افتح مباشرة نافذة الكمية
  await openFacQtyModal(prod.id);
}

let invCurrent = {};
let invSortOrder = {}; // حفظ ترتيب المنتجات
async function loadInvList() {
  const {data} = await sb.from('products').select('*').order('sort_order',{ascending:true}).order('name');
  const isAdmin = CU.role==='admin';
  const tb = document.getElementById('inv-tb');
  tb.innerHTML = (data||[]).map((p,idx)=>{
    const m = +p.price_per_unit>0 ? Math.round(((+p.price_per_unit - +p.cost_per_unit)/ +p.price_per_unit)*100) : 0;
    const st = +p.qty> +p.min_qty*2?['متوفر','b-green']: +p.qty> +p.min_qty?['محدود','b-amber']:['منخفض','b-red'];
    return `<tr data-id="${p.id}" data-idx="${idx}">
      <td>
        ${isAdmin?`<span style="cursor:grab;color:var(--txt3);margin-left:6px;font-size:16px" draggable="true" ondragstart="dragStart(event,${idx})" ondragover="event.preventDefault()" ondrop="dragDrop(event,${idx})">⠿</span>`:''}
        <strong>${p.name}</strong>${p.barcode?`<br><span style="font-size:10px;color:var(--txt3)">${p.barcode}</span>`:''}
      </td>
      <td>${p.qty}</td><td>${p.unit}</td>
      ${isAdmin
        ? `<td>${fmt(p.cost_per_unit)} ${CUR}</td><td>${fmt(p.price_per_unit)} ${CUR}</td><td style="color:${m>=30?'var(--green)':m>=15?'var(--amber)':'var(--red)'}">${m}%</td>`
        : `<td colspan="3" style="color:var(--txt2);font-size:12px">—</td>`
      }
      <td><span class="badge ${st[1]}">${st[0]}</span></td>
      ${isAdmin?`<td style="display:flex;gap:4px;flex-wrap:nowrap">
        <button class="btn btn-sm" onclick="openInvAdj('${p.name.replace(/'/g,"\\'")}',${p.qty},'${p.unit}')">كمية</button>
        <button class="btn btn-sm btn-b" onclick="openInvPrice('${p.name.replace(/'/g,"\\'")}',${p.cost_per_unit},${p.price_per_unit})">سعر</button>
        <button class="btn btn-sm btn-r" onclick="deleteProduct(${p.id},'${p.name.replace(/'/g,"\\'")}')">حذف</button>
      </td>`:''}
    </tr>`;
  }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--txt3)">لا توجد منتجات</td></tr>';

  invSortOrder = {};

// Drag & Drop لترتيب المنتجات
let dragSrcIdx = null;
function dragStart(e, idx) { dragSrcIdx = idx; e.dataTransfer.effectAllowed='move'; }
async function dragDrop(e, targetIdx) {
  e.preventDefault();
  if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
  const ids = Object.values(invSortOrder);
  const [moved] = ids.splice(dragSrcIdx, 1);
  ids.splice(targetIdx, 0, moved);
  // تحديث sort_order في Supabase
  for(let i=0; i<ids.length; i++) {
    await sb.from('products').update({sort_order:i}).eq('id', ids[i]);
  }
  dragSrcIdx = null;
  loadInvList();
}

async function deleteProduct(id, name) {
  if(!confirm(`حذف المنتج "${name}"؟ لا يمكن التراجع.`)) return;
  await sb.from('products').delete().eq('id', id);
  await sb.from('inventory_logs').insert({product_name:name,change_type:'حذف منتج',qty_before:0,qty_after:0,qty_change:0,reason:'حذف بواسطة الإدارة'});
  await logAction('حذف منتج', name, 'inventory');
  loadInvList();
  toast('تم حذف المنتج');
}

async function saveProduct() {
  const name = document.getElementById('inv-name').value.trim();
  if (!name) { toast('أدخل اسم المنتج',false); return; }
  const qty = +document.getElementById('inv-qty').value||0;
  const unit = document.getElementById('inv-unit').value;
  const min_qty = +document.getElementById('inv-min').value||5;
  const cost_per_unit = +document.getElementById('inv-cost').value||0;
  const price_per_unit = +document.getElementById('inv-price').value||0;
  const barcode = document.getElementById('inv-barcode').value||null;

  // تحقق أولاً هل المنتج موجود
  const {data:existing} = await sb.from('products').select('id,qty').eq('name',name).maybeSingle();
  if (existing) {
    // تحديث المنتج الموجود
    await sb.from('products').update({unit,min_qty,cost_per_unit,price_per_unit,barcode}).eq('id',existing.id);
    if (qty>0) {
      const newQty = +existing.qty + qty;
      await sb.from('products').update({qty:newQty}).eq('id',existing.id);
      await sb.from('inventory_logs').insert({product_name:name,change_type:'إضافة للمخزون',qty_before:+existing.qty,qty_after:newQty,qty_change:qty,reason:'تعديل يدوي'});
    }
    toast('تم تحديث المنتج ✓');
  } else {
    // منتج جديد
    const {error} = await sb.from('products').insert({name,unit,qty,min_qty,cost_per_unit,price_per_unit,barcode});
    if (error) { toast('خطأ: '+error.message,false); return; }
    if (qty>0) await sb.from('inventory_logs').insert({product_name:name,change_type:'منتج جديد',qty_before:0,qty_after:qty,qty_change:qty,reason:'إضافة منتج جديد'});
    toast('تم إضافة المنتج ✓');
  }
  await logAction('حفظ منتج', name, 'inventory');
  document.getElementById('inv-name').value='';
  document.getElementById('inv-qty').value='0';
  // تحديث قائمة المنتجات في صفحة الإنتاج إن كانت مفتوحة
  refreshFactoryProductList();
  loadInvList();
}

// تحديث قائمة المنتجات في الإنتاج بدون إعادة تحميل الصفحة
async function refreshFactoryProductList() {
  const sel = document.getElementById('fac-prod');
  if (!sel) return;
  const {data:prods} = await sb.from('products').select('name,unit').order('name');
  const cur = sel.value;
  sel.innerHTML = (prods||[]).map(p=>`<option value="${p.name}" data-unit="${p.unit||'كغ'}">${p.name}</option>`).join('');
  if (cur) sel.value = cur;
}

function openInvAdj(name,qty,unit) {
  invCurrent = {name,qty:+qty,unit};
  document.getElementById('inv-qty-title').textContent = 'تعديل كمية: '+name;
  document.getElementById('inv-cur-qty').textContent = qty+' '+unit;
  document.getElementById('inv-adj-qty').value='';
  document.getElementById('inv-adj-reason').value='';
  document.getElementById('inv-adj-preview').textContent='—';
  modal('inv-qty-modal');
}
function previewInvAdj() {
  const type = document.getElementById('inv-adj-type').value;
  const q = +document.getElementById('inv-adj-qty').value||0;
  const cur = invCurrent.qty;
  const after = type==='add'?cur+q:type==='sub'?Math.max(0,cur-q):q;
  document.getElementById('inv-adj-preview').textContent = after.toFixed(1)+' '+invCurrent.unit;
}
async function saveInvAdj() {
  const type = document.getElementById('inv-adj-type').value;
  const q = +document.getElementById('inv-adj-qty').value||0;
  const reason = document.getElementById('inv-adj-reason').value.trim();
  if (!reason) { toast('أدخل سبب التعديل',false); return; }
  const cur = invCurrent.qty;
  const after = type==='add'?cur+q:type==='sub'?Math.max(0,cur-q):q;
  const change = after-cur;
  await sb.from('products').update({qty:after}).eq('name',invCurrent.name);
  await sb.from('inventory_logs').insert({product_name:invCurrent.name,change_type:type==='add'?'إضافة':type==='sub'?'خصم':'تعيين',qty_before:cur,qty_after:after,qty_change:change,reason});
  await logAction('تعديل مخزون', `${invCurrent.name}: ${cur}→${after}`, 'inventory');
  closeModal('inv-qty-modal'); loadInvList(); toast('تم تعديل الكمية ✓');
}

let priceCurrent = {};
function openInvPrice(name,cost,price) {
  priceCurrent = {name};
  document.getElementById('inv-price-title').textContent = 'أسعار: '+name;
  document.getElementById('inv-pcost').value = cost;
  document.getElementById('inv-pprice').value = price;
  previewMargin();
  modal('inv-price-modal');
}
function previewMargin() {
  const c=+document.getElementById('inv-pcost').value||0;
  const p=+document.getElementById('inv-pprice').value||0;
  const m = p>0?Math.round(((p-c)/p)*100):0;
  const el=document.getElementById('inv-margin-preview');
  el.textContent=m+'%'; el.style.color=m>=20?'var(--green)':m>=10?'var(--amber)':'var(--red)';
}
async function saveInvPrice() {
  const c=+document.getElementById('inv-pcost').value||0;
  const p=+document.getElementById('inv-pprice').value||0;
  await sb.from('products').update({cost_per_unit:c,price_per_unit:p}).eq('name',priceCurrent.name);
  await sb.from('inventory_logs').insert({product_name:priceCurrent.name,change_type:'تعديل أسعار',qty_before:0,qty_after:0,qty_change:0,reason:`تكلفة: ${fmt(c)} — بيع: ${fmt(p)}`});
  await logAction('تعديل أسعار', `${priceCurrent.name}: ${fmt(c)}→${fmt(p)}`, 'inventory');
  closeModal('inv-price-modal'); loadInvList(); toast('تم تحديث الأسعار ✓');
}

async function loadInvLog() {
  const {data} = await sb.from('inventory_logs').select('*').order('created_at',{ascending:false}).limit(200);
  const tb = document.getElementById('inv-log-tb');
  tb.innerHTML = (data||[]).map(l=>{
    const dt = new Date(l.created_at).toLocaleString('ar-SY');
    const ch = +l.qty_change>0?`+${l.qty_change}`: l.qty_change;
    const col = +l.qty_change>0?'var(--green)': +l.qty_change<0?'var(--red)':'var(--txt2)';
    return `<tr>
      <td style="font-size:11px">${dt}</td><td><strong>${l.product_name}</strong></td>
      <td><span class="badge b-teal" style="font-size:10px">${l.change_type}</span></td>

    </tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--txt3)">لا توجد تعديلات</td></tr>';
}

let saleRows = [{prod:'',qty:1,price:0}];

}
function addSaleRow() { saleRows.push({prod:'',qty:1,price:0}); renderSaleRows(); }
function removeSaleRow(i) { saleRows.splice(i,1); if(!saleRows.length) saleRows=[{prod:'',qty:1,price:0}]; renderSaleRows(); }

async function renderSaleRows() {
  // كل المنتجات (بما فيها raw_milk للحليب الطازج)
  const {data:prods} = await sb.from('products')
    .select('name,price_per_unit,qty,unit,product_type')

    <td><select onchange="setSaleRow(${i},'prod',this)"

      style="width:75px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"

      style="width:80px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
      oninput="setSaleRow(${i},'price',this.value)"></td>
    <td style="font-weight:600;white-space:nowrap">${fmt(Math.round(r.qty*r.price))} ${CUR}</td>
    <td style="display:flex;gap:3px;flex-wrap:nowrap">
      <button onclick="openWeightCalc(${i},${r.price||0},'sale')" title="حاسبة الوزن"
        style="background:var(--amber-l);border:none;border-radius:var(--rs);padding:4px 7px;cursor:pointer;font-size:13px">⚖️</button>
      <button onclick="removeSaleRow(${i})"
        style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:0 4px">×</button>
    </td>
  </tr>`).join('');
  updateSaleGrand();
}

function setSaleRow(i,field,val) {
  if (field==='prod') {
    saleRows[i].prod = val.value;
    const opt = val.options[val.selectedIndex];
    if (opt?.dataset?.price) saleRows[i].price = +opt.dataset.price;
  } else {
    saleRows[i][field] = Math.min(1000, +val);
  }
  renderSaleRows();
}

function updateSaleGrand() {
  const tot = saleRows.reduce((s,r)=>s+r.qty*r.price,0);
  const el = document.getElementById('sl-grand');
  if(el) el.textContent = fmt(Math.round(tot))+' '+CUR;
}

async function saveSalePage() {
  const clientId = document.getElementById('sl-client').value;
  const total = Math.round(saleRows.reduce((s,r)=>s+r.qty*r.price,0));
  if (!total) { toast('أضف منتجات للفاتورة',false); return; }
  const pay   = document.getElementById('sl-pay').value;
  const notes = document.getElementById('sl-notes')?.value||'';
  const {data:sale,error} = await sb.from('sales').insert({
    sale_date: document.getElementById('sl-date').value,
    client_id: clientId||null, total, payment_method:pay, notes,
    cashier_name: CU.full_name,
  }).select().single();
  if (error) { toast('خطأ: '+error.message,false); return; }

  const items = saleRows.filter(r=>r.prod&&r.qty>0).map(r=>({
    sale_id:sale.id, product_name:r.prod,
    qty:r.qty, unit_price:r.price
  }));
  if (items.length) await sb.from('sale_items').insert(items);

  if (pay==='آجل'&&clientId) {
    const {data:cl} = await sb.from('clients').select('debt').eq('id',clientId).single();
    await sb.from('clients').update({debt:(+cl?.debt||0)+total}).eq('id',clientId);
  }
  await logAction('إصدار فاتورة', `#${sale.id} — ${fmt(total)} ${CUR} — ${pay}`, 'sales');

  // إعادة تعيين النموذج
  saleRows=[{prod:'',qty:1,price:0}];
  document.getElementById('sl-notes').value='';
  renderSaleRows();

  // إظهار رقم الفاتورة بشكل واضح
  toast(`✅ تم إصدار الفاتورة رقم #${sale.id} بنجاح`);

  // فتح تفاصيل الفاتورة فوراً
  openSaleDetail(sale.id);
}

async function loadSalesHist() {
  const searchId = document.getElementById('sl-search-id')?.value?.trim();
  const from  = document.getElementById('sl-filter-from')?.value;
  const to    = document.getElementById('sl-filter-to')?.value;
  const pay   = document.getElementById('sl-filter-pay')?.value;

  let q = sb.from('sales')
    .select('id,sale_date,created_at,total,payment_method,notes,cashier_name,clients(name)')
    .order('created_at',{ascending:false}).limit(300);

  if(searchId) q = q.eq('id', +searchId);
  if(from)     q = q.gte('sale_date', from);
  if(to)       q = q.lte('sale_date', to);
  if(pay)      q = q.eq('payment_method', pay);

  const {data} = await q;
  const grandTotal = (data||[]).reduce((s,r)=>s+ +r.total, 0);
  const tb = document.getElementById('sl-hist-tb');

  tb.innerHTML = (data||[]).map(s=>{
    const timeStr = s.created_at ? new Date(s.created_at).toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'}) : '—';
    return `<tr style="cursor:pointer" onclick="openSaleDetail(${s.id})">
      <td>
        <span style="background:var(--green);color:#fff;padding:3px 10px;border-radius:20px;font-weight:800;font-size:13px">
          #${s.id}
        </span>
      </td>
      <td style="font-size:12px">${s.sale_date}</td>
      <td style="font-size:11px;color:var(--txt2)">${timeStr}</td>
      <td><strong>${s.clients?.name||'كاش'}</strong></td>
      <td style="font-weight:700;color:var(--green)">${fmt(s.total)} ${CUR}</td>
      <td><span class="badge ${s.payment_method==='آجل'?'b-amber':s.payment_method==='تحويل'?'b-blue':'b-green'}">${s.payment_method}</span></td>
      <td style="font-size:11px;color:var(--txt2)">${s.cashier_name||'—'}</td>
      <td><button class="btn btn-sm btn-b" onclick="event.stopPropagation();openSaleDetail(${s.id})">عرض</button></td>
    </tr>`;
  }).join('');

  if(data?.length) {
    tb.innerHTML += `<tr style="background:var(--green-l)">
      <td colspan="4" style="font-weight:700;padding:10px">${data.length} فاتورة — الإجمالي</td>
      <td style="font-weight:800;color:var(--green);font-size:16px">${fmt(grandTotal)} ${CUR}</td>
      <td colspan="3"></td>
    </tr>`;
  } else {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--txt3);padding:20px">لا توجد فواتير</td></tr>';
  }
}

async function printSaleReceipt(id) {
  const [{data:sale},{data:items}] = await Promise.all([
    sb.from('sales').select('*,clients(name)').eq('id',id).single(),
    sb.from('sale_items').select('*').eq('sale_id',id).order('id'),
  ]);
  const subtotal   = (items||[]).reduce((s,i)=>s + +i.qty * +i.unit_price, 0);
  const cartItems  = (items||[]).map(i=>({name:i.product_name, qty:+i.qty, price:+i.unit_price}));
  const disc       = Math.round(subtotal - +sale.total);
  printReceipt(
    id, cartItems, subtotal, disc>0?disc:0, +sale.total,
    sale.notes||'',
    sale.cashier_name||CU.full_name,
    sale.clients?.name||'',
    sale.payment_method||'نقد'
  );
}

async function editSaleInModal() {
  if(!currentSaleId) return;
  const newPay   = prompt('طريقة الدفع الجديدة (نقد / آجل / تحويل):');
  if(newPay===null) return;
  const newNotes = prompt('ملاحظات:') || '';
  await sb.from('sales').update({payment_method:newPay.trim(), notes:newNotes}).eq('id',currentSaleId);
  await logAction('تعديل فاتورة', `#${currentSaleId}`, 'sales');
  closeModal('sl-detail-modal');
  loadSalesHist();
  toast('تم تعديل الفاتورة ✓');
}

async function deleteSaleInModal() {
  if(!currentSaleId) return;
  if(!confirm(`حذف الفاتورة #${currentSaleId}؟ لا يمكن التراجع.`)) return;
  await sb.from('sale_items').delete().eq('sale_id',currentSaleId);
  await sb.from('sales').delete().eq('id',currentSaleId);
  await logAction('حذف فاتورة', `#${currentSaleId}`, 'sales');
  closeModal('sl-detail-modal');
  loadSalesHist();
  toast('تم حذف الفاتورة');
}

async function saveClient() {
  const name = document.getElementById('cl-name').value.trim();
  if (!name) { toast('أدخل اسم العميل',false); return; }
  await sb.from('clients').insert({name, phone:document.getElementById('cl-phone').value, client_type:document.getElementById('cl-type').value, notes:document.getElementById('cl-notes').value, debt:0});
  await logAction('إضافة عميل', name, 'clients');
  document.getElementById('cl-name').value='';
  loadClientsList(); toast('تمت إضافة العميل ✓');
}

async function savePayment() {
  const clientId = document.getElementById('pay-client-sel').value;
  const amount = +document.getElementById('pay-amount').value||0;
  if (!clientId||!amount) { toast('اختر العميل وأدخل المبلغ',false); return; }
  const {data:cl} = await sb.from('clients').select('debt,name').eq('id',clientId).single();
  const newDebt = Math.max(0,(+cl?.debt||0)-amount);
  await sb.from('clients').update({debt:newDebt}).eq('id',clientId);
  await sb.from('payments').insert({client_id:+clientId,payment_date:document.getElementById('pay-date').value,amount,balance_after:newDebt,notes:document.getElementById('pay-notes').value});

async function previewMonthSalaries() {
  const month=document.getElementById('sal-month-batch').value;
  if(!month){toast('اختر الشهر',false);return;}
  const {data:emps}=await sb.from('employees').select('*').eq('is_active',true).order('department');

  div.innerHTML=`<div class="tw"><table>
    <thead><tr><th>الاسم</th><th>القسم</th><th>الصافي</th><th>خصومات</th><th>الإجمالي</th></tr></thead>
    <tbody>${emps.map(e=>{
      const net=+e.base_salary + +e.allowances;
      return`<tr><td>${e.name}</td>
        <td><span class="badge ${deptColors[e.department]||''}">${e.department}</span></td>
        <td>${fmt(net)}</td>
        <td><input type="number" value="0" step="1" min="0" id="deduct-${e.id}" style="width:80px;padding:4px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);font-size:12px"></td>
        <td id="net-${e.id}" style="font-weight:700">${fmt(net)} ${CUR}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>
  <div style="margin-top:10px;padding:10px;background:var(--green-l);border-radius:var(--rs);display:flex;justify-content:space-between">
    <span style="font-size:13px;color:var(--txt2)">إجمالي الرواتب</span>
    <strong style="font-size:16px;color:var(--green)">${fmt(total)} ${CUR}</strong>
  </div></div>`;
  // ربط حقول الخصومات
  emps.forEach(e=>{
    const inp=document.getElementById(`deduct-${e.id}`);
    const net=+e.base_salary + +e.allowances;
    inp?.addEventListener('input',()=>{
      const d=+inp.value||0;
      const el=document.getElementById(`net-${e.id}`);
      if(el) el.textContent=fmt(Math.max(0,net-d))+' '+CUR;
    });
  });

async function confirmMonthlySalaries() {
  const month=document.getElementById('sal-month-batch').value;
  if(!month){toast('اختر الشهر',false);return;}
  const {data:emps}=await sb.from('employees').select('*').eq('is_active',true);
  if(!emps?.length){toast('لا يوجد موظفون نشطون',false);return;}
  if(!confirm(`تأكيد صرف رواتب ${month} لـ ${emps.length} موظفين؟`)) return;
  const records=[];
  let totalPaid=0;
  for(const e of emps){
    const deductEl=document.getElementById(`deduct-${e.id}`);
    const deduct=deductEl?+deductEl.value||0:0;
    const net=Math.max(0,(+e.base_salary + +e.allowances)-deduct);
    records.push({
      employee_name:e.name,salary_month:month,department:e.department,
      base_salary:+e.base_salary,bonuses:+e.allowances,deductions:deduct,net_salary:net
    });
    totalPaid+=net;
  }
  const {error}=await sb.from('salaries').insert(records);
  if(error){toast('خطأ: '+error.message,false);return;}
  // تسجيل في المصاريف تلقائياً (تكلفة محاسبية)
  await sb.from('expenses').insert({
    expense_date:month+'-01',
    category:'رواتب (محاسبية)',
    description:`رواتب شهر ${month} — ${emps.length} موظفين`,
    amount:totalPaid
  });
  await logAction('صرف رواتب شهرية',`${month} — إجمالي: ${fmt(totalPaid)} ${CUR}`,'accounts');
  loadSalaries();
  document.getElementById('sal-batch-preview').innerHTML='';
  toast(`تم تسجيل رواتب ${month} ✓`);
}

function calcSalNet() {
  const b=+(document.getElementById('sal-base')?.value)||0;
  const bo=+(document.getElementById('sal-bonus')?.value)||0;
  const d=+(document.getElementById('sal-deduct')?.value)||0;
  const el=document.getElementById('sal-net-preview');
  if(el) el.textContent=fmt(b+bo-d)+' '+CUR;
}

async function openPermModal(userId, name, role) {
  permUserId = userId;
  document.getElementById('perm-modal-title').textContent = `صلاحيات: ${name}`;
  // جلب الصلاحيات الحالية
  const {data:perms} = await sb.from('user_permissions').select('*').eq('user_id', userId);
  const permMap = {};
  (perms||[]).forEach(p=>permMap[p.page_key]=p);
  // الصلاحيات الافتراضية حسب الدور
  const defaultByRole = {
    admin:['dashboard','pos','milk','factory','inventory','costs','reports','sales_page','clients','purchases','returns','accounts','users','logs'],
    factory:['dashboard','pos','factory','inventory','returns'],
    farm:['dashboard','milk','purchases'],
    sales:['dashboard','pos','sales_page','clients','returns','inventory'],
    purchases:['dashboard','purchases'],
  };
  const defaults = defaultByRole[role]||[];
  document.getElementById('perm-modal-body').innerHTML = `
  <p style="font-size:12px;color:var(--txt2);margin-bottom:12px">حدد الصفحات التي يمكن للمستخدم الوصول إليها وصلاحيات التعديل والحذف</p>
  <table style="width:100%;font-size:13px">
    <thead><tr><th style="text-align:right;padding:6px">الصفحة</th><th style="text-align:center;padding:6px">وصول</th><th style="text-align:center;padding:6px">تعديل</th><th style="text-align:center;padding:6px">حذف</th></tr></thead>
    <tbody>
    ${ALL_PAGES_LIST.map(pg=>{
      const p = permMap[pg.key];
      const hasAccess = p ? p.can_access : defaults.includes(pg.key);
      const canEdit = p ? p.can_edit : (role==='admin');
      const canDel = p ? p.can_delete : (role==='admin');
      return `<tr style="border-bottom:1px solid var(--bdr)">
        <td style="padding:8px 6px;font-weight:500">${pg.label}</td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="access" ${hasAccess?'checked':''} onchange="syncPermRow(this)"></td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="edit" ${canEdit&&hasAccess?'checked':''} ${!hasAccess?'disabled':''}></td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="delete" ${canDel&&hasAccess?'checked':''} ${!hasAccess?'disabled':''}></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
  modal('perm-modal');
}

function syncPermRow(accessCb) {
  const page = accessCb.dataset.page;
  const row = accessCb.closest('tr');
  const editCb = row.querySelector('[data-type="edit"]');
  const delCb = row.querySelector('[data-type="delete"]');
  if (!accessCb.checked) {
    editCb.checked = false; editCb.disabled = true;
    delCb.checked = false; delCb.disabled = true;
  } else {
    editCb.disabled = false; delCb.disabled = false;
  }
}

async function savePermissions() {
  if (!permUserId) return;
  const rows = document.querySelectorAll('#perm-modal-body tbody tr');
  const toUpsert = [];
  rows.forEach(row => {
    const page = row.querySelector('[data-type="access"]')?.dataset?.page;
    if (!page) return;
    toUpsert.push({
      user_id: permUserId,
      page_key: page,
      can_access: row.querySelector('[data-type="access"]')?.checked||false,
      can_edit: row.querySelector('[data-type="edit"]')?.checked||false,
      can_delete: row.querySelector('[data-type="delete"]')?.checked||false,
    });
  });
  // حذف القديم وإدراج الجديد
  await sb.from('user_permissions').delete().eq('user_id', permUserId);
  if (toUpsert.length) await sb.from('user_permissions').insert(toUpsert);
  await logAction('تعديل صلاحيات', `#${permUserId}`, 'users');
  closeModal('perm-modal');
  toast('تم حفظ الصلاحيات ✓');
}
