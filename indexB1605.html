async function loadSlClients() {
  const {data:cls} = await sb.from('clients').select('id,name').order('name');
  const sel = document.getElementById('sl-client');
  if(!sel) return;
  sel.innerHTML = '<option value="">كاش — بدون عميل</option>';
  (cls||[]).forEach(c => sel.innerHTML += '<option value="' + c.id + '">' + c.name + '</option>');
}

function toggleSlClientForm() {
  const f = document.getElementById('sl-client-form');
  if(f) f.style.display = f.style.display==='none'?'block':'none';
}

async function saveSlNewClient() {
  const name = document.getElementById('sl-new-client-name').value.trim();
  if(!name){toast('أدخل اسم العميل',false);return;}
  const {data:cl,error} = await sb.from('clients').insert({
    name, phone:document.getElementById('sl-new-client-phone').value,
    client_type:document.getElementById('sl-new-client-type').value, debt:0
  }).select().single();
  if(error){toast('خطأ: '+error.message,false);return;}
  await loadSlClients();
  const sel = document.getElementById('sl-client');
  if(sel) sel.value = cl.id;
  toggleSlClientForm();
  toast('تمت إضافة العميل ✓');
}

let saleRows = [{prod:'',qty:1,price:0}];
function initNewSale() {
  saleRows = [{prod:'',qty:1,price:0}];
  renderSaleRows();
}
function addSaleRow() { saleRows.push({prod:'',qty:1,price:0}); renderSaleRows(); }
function removeSaleRow(i) { saleRows.splice(i,1); if(!saleRows.length) saleRows=[{prod:'',qty:1,price:0}]; renderSaleRows(); }

async function renderSaleRows() {
  // كل المنتجات (بما فيها raw_milk للحليب الطازج)
  const {data:prods} = await sb.from('products')
    .select('name,price_per_unit,qty,unit,product_type')
    .order('sort_order',{ascending:true}).order('name');
  const tb = document.getElementById('sl-items-tb');
  if(!tb) return;
  tb.innerHTML = saleRows.map((r,i)=>`<tr>
    <td><select onchange="setSaleRow(${i},'prod',this)"
      style="font-size:12px;padding:4px 6px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);max-width:160px">
      <option value="">-- اختر --</option>
      ${(prods||[]).map(p=>`<option value="${p.name}" data-price="${p.price_per_unit||0}" ${r.prod===p.name?'selected':''}>${p.name} (${p.qty||0} ${p.unit||'كغ'})</option>`).join('')}
    </select></td>
    <td><input type="number" value="${r.qty}" min="0.001" max="1000" step="0.001"
      style="width:75px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
      oninput="setSaleRow(${i},'qty',this.value)"></td>
    <td><input type="number" value="${r.price}" step="1"
      style="width:80px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
      oninput="setSaleRow(${i},'price',this.value)"></td>
    <td style="font-weight:600;white-space:nowrap">${fmt(Math.round(r.qty*r.price))} ${CUR}</td>
    <td style="display:flex;gap:3px;flex-wrap:nowrap">
      <button onclick="openWeightCalc(${i},${r.price||0},'sale')" title="حاسبة الوزن"
        style="background:var(--amber-l);border:none;border-radius:var(--rs);padding:4px 7px;cursor:pointer;font-size:13px">⚖️</button>
      <button onclick="removeSaleRow(${i})"
        style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:0 4px">×</button>
    </td>
  </tr>`).join('');
  updateSaleGrand();
}

function setSaleRow(i,field,val) {
  if (field==='prod') {
    saleRows[i].prod = val.value;
    const opt = val.options[val.selectedIndex];
    if (opt?.dataset?.price) saleRows[i].price = +opt.dataset.price;
  } else {
    saleRows[i][field] = Math.min(1000, +val);
  }
  renderSaleRows();
}

function updateSaleGrand() {
  const tot = saleRows.reduce((s,r)=>s+r.qty*r.price,0);
  const el = document.getElementById('sl-grand');
  if(el) el.textContent = fmt(Math.round(tot))+' '+CUR;
}

async function saveSalePage() {
  const clientId = document.getElementById('sl-client').value;
  const total = Math.round(saleRows.reduce((s,r)=>s+r.qty*r.price,0));
  if (!total) { toast('أضف منتجات للفاتورة',false); return; }
  const pay   = document.getElementById('sl-pay').value;
  const notes = document.getElementById('sl-notes')?.value||'';
  const {data:sale,error} = await sb.from('sales').insert({
    sale_date: document.getElementById('sl-date').value,
    client_id: clientId||null, total, payment_method:pay, notes,
    cashier_name: CU.full_name,
  }).select().single();
  if (error) { toast('خطأ: '+error.message,false); return; }

  const items = saleRows.filter(r=>r.prod&&r.qty>0).map(r=>({
    sale_id:sale.id, product_name:r.prod,
    qty:r.qty, unit_price:r.price
  }));
  if (items.length) await sb.from('sale_items').insert(items);

  if (pay==='آجل'&&clientId) {
    const {data:cl} = await sb.from('clients').select('debt').eq('id',clientId).single();
    await sb.from('clients').update({debt:(+cl?.debt||0)+total}).eq('id',clientId);
  }
  await logAction('إصدار فاتورة', `#${sale.id} — ${fmt(total)} ${CUR} — ${pay}`, 'sales');

  // إعادة تعيين النموذج
  saleRows=[{prod:'',qty:1,price:0}];
  document.getElementById('sl-notes').value='';
  renderSaleRows();

  // إظهار رقم الفاتورة بشكل واضح
  toast(`✅ تم إصدار الفاتورة رقم #${sale.id} بنجاح`);

  // فتح تفاصيل الفاتورة فوراً
  openSaleDetail(sale.id);
}

async function loadSalesHist() {
  const searchId = document.getElementById('sl-search-id')?.value?.trim();
  const from  = document.getElementById('sl-filter-from')?.value;
  const to    = document.getElementById('sl-filter-to')?.value;
  const pay   = document.getElementById('sl-filter-pay')?.value;

  let q = sb.from('sales')
    .select('id,sale_date,created_at,total,payment_method,notes,cashier_name,clients(name)')
    .order('created_at',{ascending:false}).limit(300);

  if(searchId) q = q.eq('id', +searchId);
  if(from)     q = q.gte('sale_date', from);
  if(to)       q = q.lte('sale_date', to);
  if(pay)      q = q.eq('payment_method', pay);

  const {data} = await q;
  const grandTotal = (data||[]).reduce((s,r)=>s+ +r.total, 0);
  const tb = document.getElementById('sl-hist-tb');

  tb.innerHTML = (data||[]).map(s=>{
    const timeStr = s.created_at ? new Date(s.created_at).toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'}) : '—';
    return `<tr style="cursor:pointer" onclick="openSaleDetail(${s.id})">
      <td>
        <span style="background:var(--green);color:#fff;padding:3px 10px;border-radius:20px;font-weight:800;font-size:13px">
          #${s.id}
        </span>
      </td>
      <td style="font-size:12px">${s.sale_date}</td>
      <td style="font-size:11px;color:var(--txt2)">${timeStr}</td>
      <td><strong>${s.clients?.name||'كاش'}</strong></td>
      <td style="font-weight:700;color:var(--green)">${fmt(s.total)} ${CUR}</td>
      <td><span class="badge ${s.payment_method==='آجل'?'b-amber':s.payment_method==='تحويل'?'b-blue':'b-green'}">${s.payment_method}</span></td>
      <td style="font-size:11px;color:var(--txt2)">${s.cashier_name||'—'}</td>
      <td><button class="btn btn-sm btn-b" onclick="event.stopPropagation();openSaleDetail(${s.id})">عرض</button></td>
    </tr>`;
  }).join('');

  if(data?.length) {
    tb.innerHTML += `<tr style="background:var(--green-l)">
      <td colspan="4" style="font-weight:700;padding:10px">${data.length} فاتورة — الإجمالي</td>
      <td style="font-weight:800;color:var(--green);font-size:16px">${fmt(grandTotal)} ${CUR}</td>
      <td colspan="3"></td>
    </tr>`;
  } else {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--txt3);padding:20px">لا توجد فواتير</td></tr>';
  }
}

    sb.from('sales').select('*,clients(name)').eq('id',id).single(),
    sb.from('sale_items').select('*').eq('sale_id',id).order('id'),
  ]);
  const subtotal   = (items||[]).reduce((s,i)=>s + +i.qty * +i.unit_price, 0);
  const cartItems  = (items||[]).map(i=>({name:i.product_name, qty:+i.qty, price:+i.unit_price}));
  const disc       = Math.round(subtotal - +sale.total);
  printReceipt(
    id, cartItems, subtotal, disc>0?disc:0, +sale.total,
    sale.notes||'',
    sale.cashier_name||CU.full_name,
    sale.clients?.name||'',
    sale.payment_method||'نقد'
  );
}

async function deleteSaleInModal() {

async function saveClient() {
  const name = document.getElementById('cl-name').value.trim();
  if (!name) { toast('أدخل اسم العميل',false); return; }
  await sb.from('clients').insert({name, phone:document.getElementById('cl-phone').value, client_type:document.getElementById('cl-type').value, notes:document.getElementById('cl-notes').value, debt:0});
  await logAction('إضافة عميل', name, 'clients');
  document.getElementById('cl-name').value='';
  loadClientsList(); toast('تمت إضافة العميل ✓');
}

async function savePayment() {
  const clientId = document.getElementById('pay-client-sel').value;
  const amount = +document.getElementById('pay-amount').value||0;
  if (!clientId||!amount) { toast('اختر العميل وأدخل المبلغ',false); return; }
  const {data:cl} = await sb.from('clients').select('debt,name').eq('id',clientId).single();
  const newDebt = Math.max(0,(+cl?.debt||0)-amount);
  await sb.from('clients').update({debt:newDebt}).eq('id',clientId);
  await sb.from('payments').insert({client_id:+clientId,payment_date:document.getElementById('pay-date').value,amount,balance_after:newDebt,notes:document.getElementById('pay-notes').value});
  await logAction('تسجيل دفعة', `${cl?.name} — ${fmt(amount)} ${CUR}`, 'clients');
  document.getElementById('pay-amount').value='';
  document.getElementById('pay-notes').value='';
  loadPayHist(); loadClientsList(); toast('تم تسجيل الدفعة ✓');
}

async function loadPayHist() {
  const {data} = await sb.from('payments').select('*,clients(name)').order('payment_date',{ascending:false}).limit(50);
  const tb = document.getElementById('pay-hist-tb');
  if (!tb) return;
  tb.innerHTML = (data||[]).map(p=>`<tr>
    <td>${p.payment_date}</td><td>${p.clients?.name||'—'}</td>
    <td style="color:var(--green);font-weight:600">${fmt(p.amount)} ${CUR}</td>
    <td>${fmt(p.balance_after)} ${CUR}</td>
    <td style="font-size:11px">${p.notes||'—'}</td>
  </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد دفعات</td></tr>';
}

// تحديث الأصناف حسب القسم
function updatePuCategories() {
  const dept  = document.getElementById('pu-dept').value;
  const catEl = document.getElementById('pu-cat');
  const cats  = {
    'مزرعة': ['علف','تبن','دواء/علاج أبقار','مياه وصرف','معدات مزرعة','أخرى'],
    'معمل':  ['منفحة','حليب بودرة','ملح طعام','كلوريد كالسيوم','مواد تعبئة','مواد تنظيف','معدات معمل','أخرى'],
    'تسويق': ['عبوات تغليف','أكياس','مطبوعات','أخرى'],
    'عام':   ['كهرباء','مازوت','صيانة','مكتبية','أخرى'],
  };
  catEl.innerHTML = (cats[dept]||['أخرى']).map(c=>`<option>${c}</option>`).join('');

  // تحديث المستهلك المقترح
  const targetEl = document.getElementById('pu-inventory-target');
  if(dept==='مزرعة') targetEl.value='farm_feed';
  else if(dept==='معمل') targetEl.value='consumables';
  else targetEl.value='none';
}

function updatePuUnitDisplay() {
  const unit = document.getElementById('pu-unit-type').value;
  const weightRow = document.getElementById('pu-weight-row');
  const countUnits = ['قطعة','طرد','كيس','علبة','كرتون'];
  weightRow.style.display = countUnits.includes(unit) ? 'flex' : 'none';
  document.getElementById('pu-qty-lbl').textContent =
    unit === 'كغ' ? 'الكمية (كغ)' :
    unit === 'لتر' ? 'الكمية (لتر)' :
    unit === 'طن' ? 'الكمية (طن)' :
    `الكمية (عدد ${unit}ات)`;
  updatePuTotal();
}

function updatePuTotal() {
  const qty     = +document.getElementById('pu-qty')?.value||0;
  const price   = +document.getElementById('pu-uprice')?.value||0;
  const unit    = document.getElementById('pu-unit-type').value;
  const unitW   = +document.getElementById('pu-unit-weight')?.value||0;
  const countUnits = ['قطعة','طرد','كيس','علبة','كرتون'];
  const totalKg = countUnits.includes(unit) && unitW > 0 ? qty * unitW : null;

  document.getElementById('pu-total-preview').textContent = fmt(Math.round(qty*price))+' ${CUR}';
  const sumEl = document.getElementById('pu-weight-summary');
  if(totalKg) {
    sumEl.style.display='block';
    sumEl.textContent = `الوزن الإجمالي: ${totalKg.toFixed(1)} كغ (${qty} ${unit} × ${unitW} كغ)`;
  } else {
    sumEl.style.display='none';
  }
}

  const invName= document.getElementById('pu-inv-name')?.value?.trim();
  if (!qty) { toast('أدخل الكمية',false); return; }

  const countUnits = ['قطعة','طرد','كيس','علبة','كرتون'];
  const totalKg = countUnits.includes(unit) && unitW > 0 ? qty * unitW : null;

  const {data:pur, error} = await sb.from('purchases').insert({
    purchase_date: document.getElementById('pu-date').value,
    category:      document.getElementById('pu-cat').value,
    supplier:      document.getElementById('pu-supplier').value,
    description:   document.getElementById('pu-desc').value,
    qty, unit, unit_price:price, total:qty*price,
    status:'pending', requested_by: CU.full_name,
    notes: JSON.stringify({dept, unit_weight:unitW, total_kg:totalKg, inventory_target:target, inv_name:invName}),
  }).select().single();

  if (error) { toast('خطأ: '+error.message,false); return; }
  await logAction('طلب شراء', `${dept} — ${document.getElementById('pu-cat').value} — ${qty} ${unit}`, 'purchases');
  toast('✅ تم إرسال طلب الشراء بانتظار الموافقة');
  loadPurchasesList();
}

async function loadPurchasesList() {
  const {data} = await sb.from('purchases').select('*').order('created_at',{ascending:false});
  const tb = document.getElementById('pu-tb');
  const stMap = {pending:['بانتظار','b-amber'],approved:['موافق','b-green'],rejected:['مرفوض','b-red'],received:['مستلم','b-blue']};
  tb.innerHTML = (data||[]).map(p=>{
    const st=stMap[p.status]||['—',''];

      <td>${p.purchase_date}</td><td><span class="badge b-teal">${p.category}</span></td>
      <td>${p.description||'—'}</td><td>${p.qty} ${p.unit}</td>
      <td>${fmt(p.unit_price)} ${CUR}</td><td style="font-weight:600">${fmt(p.total)} ${CUR}</td>
      <td><span class="badge ${st[1]}">${st[0]}</span></td>

  }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--txt3)">لا توجد مشتريات</td></tr>';
}

async function loadPendingPurchases() {
  const {data} = await sb.from('purchases').select('*').eq('status','pending').order('created_at');
  const tb = document.getElementById('pu-pending-tb');
  tb.innerHTML = (data||[]).map(p=>`<tr>
    <td>${p.purchase_date}</td><td><span class="badge b-amber">${p.category}</span></td>
    <td>${p.description||'—'}</td><td>${p.qty} ${p.unit}</td>
    <td style="font-weight:600">${fmt(p.total)} ${CUR}</td>
    <td style="font-size:11px">${p.requested_by||'—'}</td>
    <td style="display:flex;gap:4px">
      <button class="btn btn-sm btn-p" onclick="approvePurchase(${p.id})">موافقة</button>
      <button class="btn btn-sm btn-r" onclick="rejectPurchase(${p.id})">رفض</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--txt3)">لا توجد طلبات معلقة</td></tr>';

async function approvePurchase(id) {
  const {data:pur} = await sb.from('purchases').select('*').eq('id',id).single();
  await sb.from('purchases').update({status:'approved', approved_by:CU.full_name}).eq('id',id);

  // إضافة للمخزون إذا حُدّد target
  if (pur?.notes) {
    try {
      const meta = JSON.parse(pur.notes);
      const target  = meta.inventory_target;
      const invName = meta.inv_name || pur.category;
      const totalKg = meta.total_kg || pur.qty;
      const qtyToAdd= meta.unit === 'طن' ? pur.qty * 1000 : (totalKg || pur.qty);

      if (target === 'consumables' || target === 'farm_feed') {
        // ابحث عن الصنف في المستهلكات أو أنشئه
        const {data:existing} = await sb.from('consumables').select('id,qty_available').ilike('name', invName).maybeSingle();
        if (existing) {
          await sb.from('consumables').update({qty_available: +existing.qty_available + qtyToAdd, last_price: pur.unit_price}).eq('id', existing.id);
        } else {
          await sb.from('consumables').insert({name: invName, qty_available: qtyToAdd, last_price: pur.unit_price, unit: pur.unit==='طن'?'كغ':pur.unit, category: meta.dept==='مزرعة'?'علف مزرعة':'مواد معمل'});
        }
        toast(`✅ الموافقة + إضافة ${qtyToAdd} ${pur.unit==='طن'?'كغ':pur.unit} من "${invName}" للمستهلكات`);
      } else if (target === 'raw_materials') {
        const {data:existing} = await sb.from('raw_materials').select('id,qty_available').ilike('name', invName).maybeSingle();
        if (existing) {
          await sb.from('raw_materials').update({qty_available: +existing.qty_available + qtyToAdd, last_price: pur.unit_price}).eq('id', existing.id);
        } else {
          await sb.from('raw_materials').insert({name: invName, qty_available: qtyToAdd, last_price: pur.unit_price, unit: pur.unit, category: meta.dept||'أخرى'});
        }
        toast(`✅ الموافقة + إضافة ${qtyToAdd} ${pur.unit} من "${invName}" للمواد الأولية`);
      } else {
        toast('تمت الموافقة ✓');
      }
    } catch(e) {
      toast('تمت الموافقة ✓');
    }
  } else {
    toast('تمت الموافقة ✓');
  }

  await logAction('موافقة شراء', `#${id}`, 'purchases');
  loadPendingPurchases(); loadPurchasesList();
}
async function rejectPurchase(id) {
  await sb.from('purchases').update({status:'rejected',approved_by:CU.full_name}).eq('id',id);
  await logAction('رفض شراء', `#${id}`, 'purchases');
  loadPendingPurchases(); loadPurchasesList(); toast('تم الرفض');
}

  document.getElementById('emp-base').value='';

    inp?.addEventListener('input',()=>{

async function confirmMonthlySalaries() {
  const month=document.getElementById('sal-month-batch').value;
  if(!month){toast('اختر الشهر',false);return;}
  const {data:emps}=await sb.from('employees').select('*').eq('is_active',true);
  if(!emps?.length){toast('لا يوجد موظفون نشطون',false);return;}

  // جلب خصومات الحليب الشخصي للشهر المختار
  const fromDate = month+'-01';
  const toDate   = month+'-31';
  const {data:milkDeds} = await sb.from('expenses')
    .select('amount')
    .eq('category','خصم حليب موظف')
    .gte('expense_date', fromDate)
    .lte('expense_date', toDate);
  const totalMilkDeduct = (milkDeds||[]).reduce((s,r)=>s+ +r.amount, 0);

  if(!confirm(`تأكيد صرف رواتب ${month} لـ ${emps.length} موظفين؟${totalMilkDeduct>0?'\nخصم حليب مزرعة: '+fmt(totalMilkDeduct)+' '+CUR:''}`)) return;

  const records=[];
  let totalPaid=0;
  for(const e of emps){
    const deductEl=document.getElementById(`deduct-${e.id}`);
    let deduct=deductEl?+deductEl.value||0:0;
    // إضافة خصم الحليب تلقائياً لموظف المزرعة
    if(e.department==='مزرعة' && totalMilkDeduct>0) {
      deduct += totalMilkDeduct;
    }
    const net=Math.max(0,(+e.base_salary + +e.allowances)-deduct);
    records.push({
      employee_name:e.name,salary_month:month,department:e.department,
      base_salary:+e.base_salary,bonuses:+e.allowances,deductions:deduct,net_salary:net,
      notes: e.department==='مزرعة'&&totalMilkDeduct>0?`خصم حليب: ${fmt(totalMilkDeduct)} ${CUR}`:''
    });
    totalPaid+=net;
  }
  const {error}=await sb.from('salaries').insert(records);
  if(error){toast('خطأ: '+error.message,false);return;}
  await sb.from('expenses').insert({
    expense_date:month+'-01',
    category:'رواتب (محاسبية)',
    description:`رواتب شهر ${month} — ${emps.length} موظفين`,
    amount:totalPaid
  });
  await logAction('صرف رواتب شهرية',`${month} — إجمالي: ${fmt(totalPaid)} ${CUR} — خصم حليب: ${fmt(totalMilkDeduct)} ${CUR}`,'accounts');
  loadSalaries();
  document.getElementById('sal-batch-preview').innerHTML='';
  toast(`تم تسجيل رواتب ${month} ✓${totalMilkDeduct>0?' (مع خصم الحليب)':''}`);
}

function calcSalNet() {
  const b=+(document.getElementById('sal-base')?.value)||0;
  const bo=+(document.getElementById('sal-bonus')?.value)||0;
  const d=+(document.getElementById('sal-deduct')?.value)||0;
  const el=document.getElementById('sal-net-preview');
  if(el) el.textContent=fmt(b+bo-d)+' '+CUR;

  const debt=(debtR.data||[]).reduce((s,r)=>s+ +r.debt,0);
  const net=rev-exp;
  const bycat={};
  (expR.data||[]).forEach(e=>bycat[e.category]=(bycat[e.category]||0)+ +e.amount);
  document.getElementById('ac-tab-summary').innerHTML=`
  <div class="kpi-grid">

async function loadPLReport() {
  const [sR,eR,salR]= await Promise.all([sb.from('sales').select('total'),sb.from('expenses').select('amount,category'),sb.from('salaries').select('net_salary')]);
  const rev=(sR.data||[]).reduce((s,r)=>s+ +r.total,0);
  const byc={};(eR.data||[]).forEach(e=>byc[e.category]=(byc[e.category]||0)+ +e.amount);
  const sal=(salR.data||[]).reduce((s,r)=>s+ +r.net_salary,0);
  const exp=Object.values(byc).reduce((a,b)=>a+b,0);
  const net=rev-exp;

  document.getElementById('pl-card').innerHTML=`<table>
    <tr style="background:var(--bg)"><td colspan="2" style="padding:10px;font-weight:700">الإيرادات</td></tr>

async function openPermModal(userId, name, role) {
  permUserId = userId;
  document.getElementById('perm-modal-title').textContent = `صلاحيات: ${name}`;
  // جلب الصلاحيات الحالية
  const {data:perms} = await sb.from('user_permissions').select('*').eq('user_id', userId);
  const permMap = {};
  (perms||[]).forEach(p=>permMap[p.page_key]=p);
  // الصلاحيات الافتراضية حسب الدور
  const defaultByRole = {
    admin:['dashboard','pos','milk','factory','inventory','costs','reports','sales_page','clients','purchases','returns','accounts','users','logs'],
    factory:['dashboard','pos','factory','inventory','returns'],
    farm:['dashboard','milk','purchases'],
    sales:['dashboard','pos','sales_page','clients','returns','inventory'],
    purchases:['dashboard','purchases'],
  };
  const defaults = defaultByRole[role]||[];
  document.getElementById('perm-modal-body').innerHTML = `
  <p style="font-size:12px;color:var(--txt2);margin-bottom:12px">حدد الصفحات التي يمكن للمستخدم الوصول إليها وصلاحيات التعديل والحذف</p>
  <table style="width:100%;font-size:13px">
    <thead><tr><th style="text-align:right;padding:6px">الصفحة</th><th style="text-align:center;padding:6px">وصول</th><th style="text-align:center;padding:6px">تعديل</th><th style="text-align:center;padding:6px">حذف</th></tr></thead>
    <tbody>
    ${ALL_PAGES_LIST.map(pg=>{
      const p = permMap[pg.key];
      const hasAccess = p ? p.can_access : defaults.includes(pg.key);
      const canEdit = p ? p.can_edit : (role==='admin');
      const canDel = p ? p.can_delete : (role==='admin');
      return `<tr style="border-bottom:1px solid var(--bdr)">
        <td style="padding:8px 6px;font-weight:500">${pg.label}</td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="access" ${hasAccess?'checked':''} onchange="syncPermRow(this)"></td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="edit" ${canEdit&&hasAccess?'checked':''} ${!hasAccess?'disabled':''}></td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="delete" ${canDel&&hasAccess?'checked':''} ${!hasAccess?'disabled':''}></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
  modal('perm-modal');
}

function syncPermRow(accessCb) {
  const page = accessCb.dataset.page;
  const row = accessCb.closest('tr');
  const editCb = row.querySelector('[data-type="edit"]');
  const delCb = row.querySelector('[data-type="delete"]');
  if (!accessCb.checked) {
    editCb.checked = false; editCb.disabled = true;
    delCb.checked = false; delCb.disabled = true;
  } else {
    editCb.disabled = false; delCb.disabled = false;
  }
}

async function savePermissions() {
  if (!permUserId) return;
  const rows = document.querySelectorAll('#perm-modal-body tbody tr');
  const toUpsert = [];
  rows.forEach(row => {
    const page = row.querySelector('[data-type="access"]')?.dataset?.page;
    if (!page) return;
    toUpsert.push({
      user_id: permUserId,
      page_key: page,
      can_access: row.querySelector('[data-type="access"]')?.checked||false,
      can_edit: row.querySelector('[data-type="edit"]')?.checked||false,
      can_delete: row.querySelector('[data-type="delete"]')?.checked||false,
    });
  });
  // حذف القديم وإدراج الجديد
  await sb.from('user_permissions').delete().eq('user_id', permUserId);
  if (toUpsert.length) await sb.from('user_permissions').insert(toUpsert);
  await logAction('تعديل صلاحيات', `#${permUserId}`, 'users');
  closeModal('perm-modal');
  toast('تم حفظ الصلاحيات ✓');
}

async function loadCostDashboard() {
  const today = todayStr();
  const {data:todayCosts} = await sb.from('production_costs').select('*').eq('prod_date', today);

  const milkTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.milk_cost, 0);
  const dieselTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.diesel_cost, 0);
  const laborTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.labor_cost, 0);
  const totalProd = (todayCosts||[]).reduce((s,r)=>s+ +r.qty_produced, 0);
  const totalCost = (todayCosts||[]).reduce((s,r)=>s+ +r.total_cost, 0);
  const avgPerKg = totalProd > 0 ? totalCost / totalProd : 0;

  document.getElementById('ck-today').textContent = fmt(avgPerKg);
  document.getElementById('ck-milk').textContent = fmt(milkTotal);
  document.getElementById('ck-diesel').textContent = fmt(dieselTotal);
  document.getElementById('ck-labor').textContent = fmt(laborTotal);

  // تفصيل اليوم
  const detail = document.getElementById('cost-today-detail');
  if (!todayCosts?.length) {
    detail.innerHTML = '<div style="text-align:center;padding:20px;color:var(--txt3)">لا يوجد إنتاج مسجّل اليوم</div>';
  } else {
    detail.innerHTML = `<div class="tw"><table>
      <thead><tr><th>المنتج</th><th>الكمية</th><th>تك. الحليب</th><th>المازوت</th><th>العمالة</th><th>إضافي</th><th>الإجمالي</th><th>تكلفة/وحدة</th><th>سعر مرجعي</th></tr></thead>
      <tbody>${todayCosts.map(c=>`<tr>
        <td><strong>${c.product_name}</strong></td>
        <td>${c.qty_produced}</td>
        <td>${fmt(c.milk_cost)}</td>
        <td>${fmt(c.diesel_cost)}</td>
        <td>${fmt(c.labor_cost)}</td>
        <td>${fmt(c.extra_cost)}</td>
        <td style="font-weight:700">${fmt(c.total_cost)} ${CUR}</td>
        <td style="color:var(--red);font-weight:700">${fmt(c.cost_per_unit)} ${CUR}</td>
        <td style="color:var(--green);font-weight:700">${fmt(c.suggested_price)} ${CUR}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  // مخطط المتوسط
  const {data:recent} = await sb.from('production_costs')
    .select('prod_date,product_name,cost_per_unit,suggested_price')
    .order('prod_date',{ascending:false}).limit(60);
  const avgChart = document.getElementById('cost-avg-chart');
  if (!recent?.length) { avgChart.innerHTML='<div style="text-align:center;padding:20px;color:var(--txt3)">لا توجد بيانات كافية</div>'; return; }
  // تجميع حسب المنتج
  const byProd = {};
  (recent||[]).forEach(r=>{ if(!byProd[r.product_name]) byProd[r.product_name]=[]; byProd[r.product_name].push(r); });
  avgChart.innerHTML = Object.entries(byProd).map(([prod, rows])=>{
    const avg = rows.reduce((s,r)=>s+ +r.cost_per_unit,0)/rows.length;
    const suggested = rows[0]?.suggested_price||0;
    const minC = Math.min(...rows.map(r=> +r.cost_per_unit));
    const maxC = Math.max(...rows.map(r=> +r.cost_per_unit));
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <strong style="font-size:13px">${prod}</strong>
        <div style="display:flex;gap:12px;font-size:12px">
          <span style="color:var(--txt2)">أدنى: ${fmt(minC)}</span>
          <span style="color:var(--txt2)">أعلى: ${fmt(maxC)}</span>
          <span style="color:var(--red);font-weight:600">متوسط: ${fmt(avg)} ${CUR}</span>
          <span style="color:var(--green);font-weight:600">مرجعي: ${fmt(suggested)} ${CUR}</span>
        </div>
      </div>
      <div style="display:flex;gap:3px;align-items:flex-end;height:50px">
        ${rows.slice(0,20).reverse().map(r=>{
          const h = maxC>0 ? Math.max(4, Math.round((+r.cost_per_unit/maxC)*46)) : 4;
          return `<div style="flex:1;height:${h}px;background:var(--amber-m);border-radius:2px 2px 0 0;min-width:6px" title="${r.prod_date}: ${fmt(r.cost_per_unit)}"></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('<hr style="border:none;border-top:1px solid var(--bdr);margin:12px 0">');
}

async function loadCostBatches() {
  const prodFilter = document.getElementById('cost-prod-filter')?.value;
  const monthFilter = document.getElementById('cost-month-filter')?.value;
  let q = sb.from('production_costs').select('*').order('prod_date',{ascending:false});
  if(prodFilter) q = q.eq('product_name', prodFilter);
  if(monthFilter) q = q.gte('prod_date', monthFilter+'-01').lte('prod_date', monthFilter+'-31');
  const {data} = await q.limit(100);

  // تعبئة فلتر المنتجات
  const {data:prods} = await sb.from('products').select('name').order('name');
  const pf = document.getElementById('cost-prod-filter');
  if(pf && pf.options.length<=1) {
    (prods||[]).forEach(p=>pf.innerHTML+=`<option value="${p.name}">${p.name}</option>`);
  }

  const tb = document.getElementById('cost-batches-tb');
  tb.innerHTML = (data||[]).map(c=>{
    const diff = +c.suggested_price - +c.cost_per_unit;
    return `<tr>
      <td style="font-size:11px">${c.prod_date}</td>
      <td><strong>${c.product_name}</strong></td>
      <td>${c.qty_produced}</td>
      <td>${fmt(c.milk_cost)}</td>
      <td>${fmt(c.diesel_cost)}</td>
      <td>${fmt(c.labor_cost)}</td>
      <td>${fmt(c.extra_cost)}</td>
      <td style="font-weight:600">${fmt(c.total_cost)}</td>
      <td style="color:var(--red);font-weight:700">${fmt(c.cost_per_unit)} ${CUR}</td>
      <td style="color:var(--amber);font-weight:600">${fmt(c.avg_cost_30d)} ${CUR}</td>
      <td style="color:var(--green);font-weight:700">${fmt(c.suggested_price)} ${CUR}
        <span style="font-size:10px;color:var(--txt3)">(+${Math.round(diff/Math.max(1,+c.cost_per_unit)*100)}%)</span>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="11" style="text-align:center;color:var(--txt3)">لا توجد بيانات</td></tr>';
}

async function loadRefPrices() {
  // آخر سعر مرجعي لكل منتج
  const {data:costs} = await sb.from('production_costs').select('product_name,avg_cost_30d,suggested_price').order('created_at',{ascending:false});
  const latestByProd = {};
  (costs||[]).forEach(c=>{ if(!latestByProd[c.product_name]) latestByProd[c.product_name]=c; });
  const {data:prods} = await sb.from('products').select('name,price_per_unit').order('name');
  const tb = document.getElementById('ref-price-tb');
  tb.innerHTML = (prods||[]).map(p=>{
    const ref = latestByProd[p.name];
    if(!ref) return `<tr><td>${p.name}</td><td colspan="5" style="color:var(--txt3)">لا توجد دفعات مسجّلة بعد</td></tr>`;
    const diff = +p.price_per_unit - +ref.suggested_price;
    const diffColor = diff>=0?'var(--green)':'var(--red)';
    return `<tr>
      <td><strong>${p.name}</strong></td>
      <td style="color:var(--red);font-weight:600">${fmt(ref.avg_cost_30d)} ${CUR}</td>
      <td style="color:var(--green);font-weight:700;font-size:15px">${fmt(ref.suggested_price)} ${CUR}</td>
      <td>${fmt(p.price_per_unit)} ${CUR}</td>
      <td style="color:${diffColor};font-weight:600">${diff>=0?'+':''}${fmt(diff)} ${CUR}</td>
      <td>
        <button class="btn btn-sm btn-p" onclick="applyOneRefPrice('${p.name}',${ref.suggested_price})">تطبيق</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--txt3)">لا توجد منتجات</td></tr>';
}

async function applyOneRefPrice(name, price) {
  await sb.from('products').update({price_per_unit: price}).eq('name', name);
  await sb.from('inventory_logs').insert({product_name:name,change_type:'تحديث سعر مرجعي',qty_before:0,qty_after:0,qty_change:0,reason:`سعر مرجعي جديد: ${fmt(price)} ${CUR}`});
  await logAction('تطبيق سعر مرجعي', `${name}: ${fmt(price)} ${CUR}`, 'costs');
  loadRefPrices(); toast(`تم تحديث سعر ${name} ✓`);
}

async function applyRefPrices() {
  if(!confirm('هل تريد تطبيق جميع الأسعار المرجعية على المنتجات؟')) return;
  const {data:costs} = await sb.from('production_costs').select('product_name,suggested_price').order('created_at',{ascending:false});
  const latest = {};
  (costs||[]).forEach(c=>{ if(!latest[c.product_name]) latest[c.product_name]=c.suggested_price; });
  for(const [name, price] of Object.entries(latest)) {
    await sb.from('products').update({price_per_unit: price}).eq('name', name);
    await sb.from('inventory_logs').insert({product_name:name,change_type:'تحديث سعر مرجعي',qty_before:0,qty_after:0,qty_change:0,reason:`سعر مرجعي: ${fmt(price)} ${CUR}`});
  }
  await logAction('تطبيق أسعار مرجعية', `${Object.keys(latest).length} منتجات`, 'costs');
  toast('تم تحديث جميع الأسعار ✓');
  loadRefPrices();
}

    rennet_price_per_ml:   'سعر المنفحة (ل.س/مل)',
    calcium_price_per_g:   'سعر كلوريد الكالسيوم (ل.س/غ)',
    worker_milk_price:     '🔒 سعر لتر الحليب الشخصي للموظف (يُخصم من راتبه)',

  // worker_milk_price للأدمن فقط — يُخفى عن غيره

  form.innerHTML = `
  <div class="fg">
    ${visibleSettings.map(s=>`
    <div class="fi" style="${s.setting_key==='worker_milk_price'?'border:1px solid var(--purple);border-radius:var(--rs);padding:8px;background:var(--purple-l)':''}">
      <label style="${s.setting_key==='worker_milk_price'?'color:var(--purple);font-weight:700':''}">
        ${labels[s.setting_key]||s.setting_key}
      </label>
      <input type="number" id="cs-${s.setting_key}" value="${s.setting_value}" step="1"
        style="${s.setting_key==='worker_milk_price'?'border:2px solid var(--purple)':''}">

  </div>
  <div class="btn-row"><button class="btn btn-p" onclick="saveCostSettings()">حفظ الإعدادات</button></div>`;

  // إجمالي خصومات الحليب الشخصي هذا الشهر (للأدمن فقط)
  if (CU.role === 'admin') {
    const thisMonth = new Date().toISOString().slice(0,7);
    const {data:deductions} = await sb.from('expenses')
      .select('amount,description,expense_date')
      .eq('category','خصم حليب موظف')
      .gte('expense_date', thisMonth+'-01')
      .order('expense_date',{ascending:false});
    const totalDeduct = (deductions||[]).reduce((s,r)=>s + +r.amount, 0);
    if (deductions?.length) {
      form.innerHTML += `
      <div style="margin-top:14px;padding:12px;background:var(--purple-l);border-radius:var(--rs);border:1px solid var(--purple)">
        <div style="font-size:12px;font-weight:700;color:var(--purple);margin-bottom:8px">
          خصومات الحليب الشخصي — ${thisMonth}
        </div>
        ${deductions.map(d=>`
        <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--bdr)">
          <span style="color:var(--txt2)">${d.expense_date} — ${d.description}</span>
          <strong style="color:var(--purple)">${fmt(d.amount)} ${CUR}</strong>
        </div>`).join('')}
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:700">
          <span>إجمالي الخصومات</span>
          <span style="color:var(--purple)">${fmt(totalDeduct)} ${CUR}</span>
        </div>
        <div style="font-size:11px;color:var(--txt2);margin-top:4px">
          ⚠️ تُخصم هذه المبالغ من راتب عامل المزرعة عند صرف الرواتب الشهرية
        </div>
      </div>`;
    }
  }

  // تكاليف العمالة
  const thisMonth2 = new Date().toISOString().slice(0,7);
  const {data:sals} = await sb.from('salaries').select('employee_name,department,net_salary').eq('salary_month', thisMonth2);
  const byDept = {};
  (sals||[]).forEach(s=>{ if(!byDept[s.department]) byDept[s.department]={total:0,employees:[]}; byDept[s.department].total+= +s.net_salary; byDept[s.department].employees.push(s.employee_name); });
  const lb = document.getElementById('labor-breakdown');
  if(lb) lb.innerHTML = Object.entries(byDept).length
    ? Object.entries(byDept).map(([dept,info])=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bdr)">

          <span style="font-size:11px;color:var(--txt2);margin-right:8px">${info.employees.join('، ')}</span>

async function saveCostSettings() {
  const {data:settings} = await sb.from('cost_settings').select('setting_key');
  for(const s of (settings||[])) {
    const el = document.getElementById(`cs-${s.setting_key}`);
    if(el) await sb.from('cost_settings').update({setting_value: +el.value, updated_by: CU.full_name, updated_at: new Date().toISOString()}).eq('setting_key', s.setting_key);
  }
  await logAction('تحديث إعدادات التكلفة', '', 'costs');
  toast('تم حفظ الإعدادات ✓');
}

async function recalcDayCosts() {
  const date = document.getElementById('recalc-date').value;
  if(!date) { toast('اختر التاريخ',false); return; }
  const {data:prods} = await sb.from('productions').select('*').eq('prod_date', date);
  if(!prods?.length) { toast('لا يوجد إنتاج في هذا اليوم',false); return; }
  await sb.from('production_costs').delete().eq('prod_date', date);
  for(const prod of prods) {
    await calcProductionCost(prod, date, prod.milk_used, prod.qty_produced, prod.extra_cost);
  }
  await logAction('إعادة حساب تكاليف', date, 'costs');
  toast(`تم إعادة حساب تكاليف ${date} ✓`);
  loadCostDashboard();
}

// ── إدارة الفترة الزمنية ──
window._rpPeriod = { from: '', to: '' };
window._rpActiveReport = null;

function setReportPeriod(type, btn) {
  const today = todayStr();
  const d = new Date();
  let from, to;

  if (type === 'today') {
    from = to = today;
  } else if (type === 'week') {
    const day = d.getDay();
    const mon = new Date(d); mon.setDate(d.getDate() - ((day+6)%7));
    from = mon.toISOString().split('T')[0]; to = today;
  } else if (type === 'month') {
    from = today.slice(0,7)+'-01'; to = today;
  } else if (type === 'last') {
    const lm = new Date(d.getFullYear(), d.getMonth()-1, 1);
    const le = new Date(d.getFullYear(), d.getMonth(), 0);
    from = lm.toISOString().split('T')[0];
    to   = le.toISOString().split('T')[0];
  } else if (type === 'custom') {
    const cd = document.getElementById('rp-custom-dates');
    if(cd) { cd.style.display='flex'; }
    const fromEl=document.getElementById('rp-from'), toEl=document.getElementById('rp-to');
    if(fromEl&&!fromEl.value) fromEl.value = today.slice(0,7)+'-01';
    if(toEl&&!toEl.value)     toEl.value   = today;
    from = fromEl?.value||today.slice(0,7)+'-01';
    to   = toEl?.value||today;
  }

  if (type !== 'custom') {
    const cd = document.getElementById('rp-custom-dates');
    if(cd) cd.style.display='none';
  }

  document.querySelectorAll('.tabs .tab[id^="rp-period"]').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');

  window._rpPeriod = { from, to };

  const lbl = document.getElementById('rp-period-label');
  if(lbl) lbl.textContent = from===to ? from : `${from}  →  ${to}`;

  if(window._rpActiveReport) reloadActiveReport();
}

function reloadActiveReport() {
  if(window._rpActiveReport) {
    const rpt = window._rpActiveReport;
    window._rpActiveReport = null;
    showReport(rpt, document.querySelector(`.tab[onclick*="'${rpt}'"]`));
  }
}

function showReport(type, btn) {
  window._rpActiveReport = type;
  document.querySelectorAll('.tabs .tab:not([id^="rp-period"])').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const div = document.getElementById('rp-content');
  div.innerHTML = '<div class="ld"><span class="spin"></span> جارٍ تحميل التقرير...</div>';
  const { from, to } = window._rpPeriod;
  const dispatchers = {
    profit:      ()=>rpProfit(div,from,to),
    sales:       ()=>rpSales(div,from,to),
    products:    ()=>rpProducts(div,from,to),
    production:  ()=>rpProduction(div,from,to),
    milk:        ()=>rpMilk(div,from,to),
    consumption: ()=>rpConsumption(div,from,to),
    clients:     ()=>rpClients(div,from,to),
    operating:   ()=>rpOperating(div,from,to),
    maqtouia:   ()=>rpMaqtouia(div,from,to),
  };
  dispatchers[type]?.();
}

      .gte('sale_date',from).lte('sale_date',to).order('sale_date',{ascending:false}),
    sb.from('sale_items').select('product_name,qty,unit_price,sale_id,sales(sale_date)')
      .gte('sales.sale_date',from).lte('sales.sale_date',to),

  const sales   = salesR.data||[];
  const items   = (itemsR.data||[]).filter(i=>i.sales?.sale_date>=from && i.sales?.sale_date<=to);
  const total   = sales.reduce((s,r)=>s+ +r.total,0);
  const cash    = sales.filter(s=>s.payment_method==='نقد').reduce((s,r)=>s+ +r.total,0);

      </div>`).join('')}
    </div>
  </div>`:''}

  <!-- جدول الفواتير -->
  <div class="card" style="padding:0">
    <div style="padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between">

    </div>
    <div style="max-height:400px;overflow-y:auto">
    <table><thead><tr><th>#</th><th>التاريخ</th><th>العميل</th><th>الكاشير</th><th>المبلغ</th><th>الدفع</th></tr></thead>
    <tbody>${sales.map(s=>`<tr style="cursor:pointer" onclick="openSaleDetail(${s.id})">
      <td><span style="background:var(--green);color:#fff;padding:1px 7px;border-radius:12px;font-size:11px">#${s.id}</span></td>
      <td style="font-size:11px">${s.sale_date}</td>

async function rpProducts(div, from, to) {
  const [itemsR, costsR, prodsR, retR] = await Promise.all([
    sb.from('sale_items').select('product_name,qty,unit_price,sales(sale_date)')
      .gte('sales.sale_date',from).lte('sales.sale_date',to),
    sb.from('production_costs').select('product_name,cost_per_unit,avg_cost_30d,suggested_price,qty_produced,prod_date')
      .gte('prod_date',from).lte('prod_date',to),
    sb.from('products').select('name,qty,unit,price_per_unit,cost_per_unit,min_qty'),
    sb.from('returns_damage').select('product_name,qty,value,record_type,record_date')
      .gte('record_date',from).lte('record_date',to),
  ]);

  const items   = (itemsR.data||[]).filter(i=>i.sales?.sale_date>=from && i.sales?.sale_date<=to);
  const costs   = costsR.data||[];
  const prods   = prodsR.data||[];
  const returns = retR.data||[];

  // تجميع المبيعات حسب الصنف
  const soldMap={};
  items.forEach(i=>{
    if(!soldMap[i.product_name]) soldMap[i.product_name]={qty:0,rev:0};
    soldMap[i.product_name].qty += +i.qty;
    soldMap[i.product_name].rev += +i.qty * +i.unit_price;
  });

  // تجميع الإنتاج والتكلفة
  const costMap={};
  costs.forEach(c=>{
    if(!costMap[c.product_name]) costMap[c.product_name]={prod:0,totalCost:0,lastCPU:0,suggested:0};
    costMap[c.product_name].prod += +c.qty_produced;
    costMap[c.product_name].totalCost += +c.qty_produced * +c.cost_per_unit;
    costMap[c.product_name].lastCPU = +c.cost_per_unit;
    costMap[c.product_name].suggested = +c.suggested_price;
  });

  // تجميع المرتجعات والتالف
  const retMap={};
  returns.forEach(r=>{ retMap[r.product_name]=(retMap[r.product_name]||0)+ +r.qty; });

  div.innerHTML = `
  <div class="card" style="padding:0">
    <div style="padding:10px 14px;font-weight:700;border-bottom:1px solid var(--bdr)">تحليل الأصناف — المبيعات والتكاليف والهامش</div>
    <div class="tw">
    <table>
      <thead><tr>
        <th>الصنف</th>
        <th>مبيع (كغ)</th>
        <th>إيراد</th>
        <th>تكلفة/كغ</th>
        <th>سعر البيع/كغ</th>
        <th>هامش الربح</th>
        <th>مرتجع/تالف</th>
        <th>المخزون الحالي</th>
      </tr></thead>
      <tbody>
        ${prods.map(p=>{
          const sold   = soldMap[p.name]||{qty:0,rev:0};
          const cost   = costMap[p.name]||{prod:0,lastCPU:+p.cost_per_unit||0,suggested:0};
          const retQty = retMap[p.name]||0;
          const cpu    = cost.lastCPU || +p.cost_per_unit||0;
          const price  = sold.qty>0 ? sold.rev/sold.qty : +p.price_per_unit||0;
          const margin = price>0 ? ((price-cpu)/price*100).toFixed(1) : '—';
          const marginNum = price>0 ? (price-cpu)/price*100 : 0;
          const isLow  = +p.qty <= +p.min_qty;
          return `<tr>
            <td><strong>${p.name}</strong></td>
            <td>${sold.qty>0?(sold.qty%1===0?sold.qty:sold.qty.toFixed(2))+' '+p.unit:'—'}</td>
            <td style="color:var(--green);font-weight:600">${sold.rev>0?fmt(sold.rev)+' '+CUR:'—'}</td>
            <td style="color:var(--red)">${cpu>0?fmt(cpu)+' '+CUR:'—'}</td>
            <td>${fmt(price)} ${CUR}</td>
            <td style="color:${marginNum>=25?'var(--green)':marginNum>=10?'var(--amber)':'var(--red)'};font-weight:700">${margin}%</td>
            <td style="color:${retQty>0?'var(--red)':'var(--txt3)'}">${retQty>0?retQty+' '+p.unit:'—'}</td>
            <td style="color:${isLow?'var(--red)':'var(--txt)'};font-weight:${isLow?'700':'400'}">
              ${p.qty} ${p.unit}${isLow?' ⚠️':''}
            </td>
          </tr>`;
        }).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--txt3);padding:16px">لا توجد بيانات</td></tr>'}
      </tbody>
    </table>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════
// 4. تقرير الإنتاج
// ═══════════════════════════════════════════
async function rpProduction(div, from, to) {
  const [prodR, costsR] = await Promise.all([
    sb.from('productions').select('*').gte('prod_date',from).lte('prod_date',to).order('prod_date',{ascending:false}),
    sb.from('production_costs').select('*').gte('prod_date',from).lte('prod_date',to),
  ]);
  const prods = prodR.data||[];
  const costs = costsR.data||[];

  const totalQty  = prods.filter(p=>p.qty_produced).reduce((s,r)=>s+ +r.qty_produced,0);
  const totalMilk = prods.reduce((s,r)=>s+ +r.milk_used,0);
  const pending   = prods.filter(p=>!p.qty_produced).length;

  // تجميع حسب الصنف
  const byProd={};
  prods.forEach(r=>{
    if(!byProd[r.product_name]) byProd[r.product_name]={qty:0,milk:0,batches:0,pendingBatches:0};
    byProd[r.product_name].qty    += +(r.qty_produced||0);
    byProd[r.product_name].milk   += +(r.milk_used||0);
    byProd[r.product_name].batches++;
    if(!r.qty_produced) byProd[r.product_name].pendingBatches++;
  });

  // تجميع التكاليف
  const costByProd={};
  costs.forEach(c=>{
    if(!costByProd[c.product_name]) costByProd[c.product_name]={total:0,count:0,lastCPU:0};
    costByProd[c.product_name].total += +c.total_cost;
    costByProd[c.product_name].count++;
    costByProd[c.product_name].lastCPU = +c.cost_per_unit;
  });

  div.innerHTML = `
  <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:14px">
    <div class="kpi"><div class="kpi-lbl">🏭 عدد الدفعات</div><div class="kpi-val" style="color:var(--blue)">${prods.length}</div></div>
    <div class="kpi"><div class="kpi-lbl">📦 إجمالي الإنتاج</div><div class="kpi-val" style="color:var(--blue)">${totalQty.toFixed(1)}</div><div class="kpi-unit">كغ</div></div>
    <div class="kpi"><div class="kpi-lbl">🥛 حليب مستخدم</div><div class="kpi-val" style="color:var(--teal)">${totalMilk.toFixed(1)}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">📐 معدل التحويل</div><div class="kpi-val" style="color:var(--amber)">${totalQty>0?(totalMilk/totalQty).toFixed(2):'—'}</div><div class="kpi-unit">لتر/كغ</div></div>
    ${pending>0?`<div class="kpi" style="background:var(--amber-l)"><div class="kpi-lbl">⏳ دفعات منتظرة</div><div class="kpi-val" style="color:var(--amber)">${pending}</div></div>`:''}
  </div>

  <div class="card" style="padding:0;margin-bottom:12px">
    <div style="padding:10px 14px;font-weight:700;border-bottom:1px solid var(--bdr)">الإنتاج حسب الصنف</div>
    <div class="tw"><table>
      <thead><tr><th>الصنف</th><th>الدفعات</th><th>الكمية</th><th>حليب مستخدم</th><th>معدل التحويل</th><th>تكلفة/كغ</th><th>منتظرة</th></tr></thead>
      <tbody>${Object.entries(byProd).sort((a,b)=>b[1].qty-a[1].qty).map(([name,v])=>{
        const cc = costByProd[name]||{lastCPU:0};
        return `<tr>
          <td><strong>${name}</strong></td>
          <td style="color:var(--txt2)">${v.batches}</td>
          <td style="font-weight:700;color:var(--blue)">${v.qty.toFixed(1)} كغ</td>
          <td>${v.milk.toFixed(1)} لتر</td>
          <td>${v.qty>0?(v.milk/v.qty).toFixed(2):'-'} لتر/كغ</td>
          <td style="color:var(--amber)">${cc.lastCPU>0?fmt(cc.lastCPU)+' '+CUR:'—'}</td>
          <td>${v.pendingBatches>0?`<span class="badge b-amber">${v.pendingBatches}</span>`:'—'}</td>
        </tr>`;
      }).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--txt3);padding:16px">لا يوجد إنتاج</td></tr>'}
      </tbody>
    </table></div>
  </div>

  <div class="card" style="padding:0">
    <div style="padding:10px 14px;font-weight:700;border-bottom:1px solid var(--bdr)">سجل الدفعات</div>
    <div style="max-height:350px;overflow-y:auto">
    <table><thead><tr><th>التاريخ</th><th>الصنف</th><th>حليب</th><th>الكمية</th><th>الحالة</th></tr></thead>
    <tbody>${prods.map(r=>`<tr style="${!r.qty_produced?'background:var(--amber-l)':''}">
      <td style="font-size:11px">${r.prod_date}</td>
      <td><strong>${r.product_name}</strong></td>
      <td style="color:var(--txt2)">${r.milk_used||0} لتر</td>
      <td style="font-weight:700;color:${r.qty_produced?'var(--blue)':'var(--amber)'}">
        ${r.qty_produced?r.qty_produced+' كغ':'⏳ منتظر'}
      </td>
      <td>${r.qty_produced
        ?'<span class="badge b-green">مكتمل</span>'
        :`<button class="btn btn-sm btn-p" onclick="openFacQtyModal(${r.id})">إدخال الكمية</button>`}
      </td>
    </tr>`).join('')}
    </tbody></table>
    </div>
  </div>`;
}

// 5. تقرير الحليب والمزرعة
// ═══════════════════════════════════════════
async function rpMilk(div, from, to) {
  const [milkR, cowsR, feedExp] = await Promise.all([
    sb.from('milk_records').select('record_date,session,liters,feed_kg_recorded,cow_id,cows(name)')
      .gte('record_date',from).lte('record_date',to).order('record_date',{ascending:false}),
    sb.from('cows').select('id,name,health,daily_liters').order('sort_order'),
    sb.from('expenses').select('amount,description,expense_date,category')
      .eq('category','خصم حليب موظف').gte('expense_date',from).lte('expense_date',to),
  ]);

  const records = milkR.data||[];
  const cows    = cowsR.data||[];
  const totalLiters   = records.reduce((s,r)=>s+ +r.liters,0);
  const totalFeed     = records.reduce((s,r)=>s+ +(r.feed_kg_recorded||0),0);
  const personalDeduct= feedExp.data?.reduce((s,r)=>s+ +r.amount,0)||0;
  const sessions = records.length;

  // تجميع حسب اليوم
  const byDay={};
  records.forEach(r=>{
    if(!byDay[r.record_date]) byDay[r.record_date]={morning:0,evening:0,feed:0};
    if(r.session==='صباح') byDay[r.record_date].morning += +r.liters;
    else byDay[r.record_date].evening += +r.liters;
    byDay[r.record_date].feed += +(r.feed_kg_recorded||0);
  });
  const days = Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0]));

  // تجميع حسب البقرة
  const byCow={};
  records.forEach(r=>{
    const n=r.cows?.name||r.cow_id;
    if(!byCow[n]) byCow[n]={total:0,sessions:0};
    byCow[n].total   += +r.liters;
    byCow[n].sessions++;
  });

  const maxDay = Math.max(...days.map(([,v])=>v.morning+v.evening),1);

  div.innerHTML = `
  <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:14px">
    <div class="kpi"><div class="kpi-lbl">🥛 إجمالي الحليب</div><div class="kpi-val" style="color:var(--teal)">${totalLiters.toFixed(1)}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">📅 أيام مسجّلة</div><div class="kpi-val" style="color:var(--blue)">${days.length}</div></div>
    <div class="kpi"><div class="kpi-lbl">📊 متوسط يومي</div><div class="kpi-val" style="color:var(--teal)">${days.length>0?(totalLiters/days.length).toFixed(1):'0'}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">🐄 عدد الأبقار</div><div class="kpi-val" style="color:var(--green)">${cows.length}</div></div>
    <div class="kpi"><div class="kpi-lbl">📊 متوسط/بقرة/يوم</div><div class="kpi-val" style="color:var(--green)">${cows.length&&days.length?(totalLiters/cows.length/days.length).toFixed(1):'—'}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">🌾 علف إجمالي</div><div class="kpi-val" style="color:var(--amber)">${totalFeed.toFixed(0)}</div><div class="kpi-unit">كغ</div></div>
    ${personalDeduct>0?`<div class="kpi" style="background:var(--purple-l)"><div class="kpi-lbl">👤 خصم شخصي</div><div class="kpi-val" style="color:var(--purple)">${fmt(personalDeduct)}</div><div class="kpi-unit">${CUR}</div></div>`:''}
  </div>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px">
    <!-- مخطط يومي -->
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">الحليب اليومي (صباح + مساء)</div>
      <div style="display:flex;gap:2px;align-items:flex-end;height:80px">
        ${days.map(([d,v])=>`
        <div style="flex:1;display:flex;gap:1px;align-items:flex-end;flex-direction:row;justify-content:center" title="${d}: ${(v.morning+v.evening).toFixed(1)} لتر">
          <div style="width:48%;height:${Math.max(2,Math.round(v.morning/maxDay*70))}px;background:var(--teal);border-radius:2px 2px 0 0"></div>
          <div style="width:48%;height:${Math.max(2,Math.round(v.evening/maxDay*70))}px;background:var(--blue);border-radius:2px 2px 0 0"></div>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:12px;margin-top:6px;font-size:10px">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--teal);border-radius:2px;margin-left:3px"></span>صباح</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:2px;margin-left:3px"></span>مساء</span>
      </div>
    </div>

    <!-- حليب حسب البقرة -->
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">إنتاج كل بقرة</div>
      ${Object.entries(byCow).sort((a,b)=>b[1].total-a[1].total).map(([name,v])=>`
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:12px">
        <span>${name}</span>
        <strong style="color:var(--teal)">${v.total.toFixed(1)} لتر</strong>
      </div>`).join('')||'—'}
    </div>
  </div>

  <!-- جدول السجل اليومي -->
  <div class="card" style="padding:0">
    <div style="padding:10px 14px;font-weight:700;border-bottom:1px solid var(--bdr)">السجل اليومي</div>
    <div class="tw"><table>
      <thead><tr><th>التاريخ</th><th>صباح</th><th>مساء</th><th>اليومي</th><th>علف</th></tr></thead>
      <tbody>${days.map(([d,v])=>`<tr>
        <td style="font-size:12px">${d}</td>
        <td style="color:var(--teal)">${v.morning.toFixed(1)}</td>
        <td style="color:var(--blue)">${v.evening.toFixed(1)}</td>
        <td style="font-weight:700">${(v.morning+v.evening).toFixed(1)} لتر</td>
        <td style="color:var(--amber)">${v.feed.toFixed(0)} كغ</td>
      </tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--txt3);padding:16px">لا توجد سجلات</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

// ═══════════════════════════════════════════
// 7. تقرير العملاء
// ═══════════════════════════════════════════
async function rpClients(div, from, to) {
  const [salesR, paymentsR, clientsR] = await Promise.all([
    sb.from('sales').select('total,payment_method,client_id,sale_date,clients(name,client_type)')
      .gte('sale_date',from).lte('sale_date',to),
    sb.from('payments').select('amount,client_id,payment_date,clients(name)')
      .gte('payment_date',from).lte('payment_date',to),
    sb.from('clients').select('id,name,debt,client_type').order('debt',{ascending:false}),
  ]);

  const sales    = salesR.data||[];
  const payments = paymentsR.data||[];
  const clients  = clientsR.data||[];

  // تجميع حسب العميل
  const byCl={};
  sales.forEach(s=>{
    const k = s.clients?.name||'كاش';
    if(!byCl[k]) byCl[k]={total:0,cnt:0,type:s.clients?.client_type||'أفراد',defer:0};
    byCl[k].total += +s.total;
    byCl[k].cnt++;
    if(s.payment_method==='آجل') byCl[k].defer += +s.total;
  });
  const topClients = Object.entries(byCl).sort((a,b)=>b[1].total-a[1].total);
  const totalPaid = payments.reduce((s,r)=>s+ +r.amount,0);
  const totalDebt = clients.reduce((s,c)=>s+ +c.debt,0);

      <tbody>${topClients.slice(0,15).map(([name,v])=>`<tr>

  <!-- ديون مستحقة -->

async function rpOperating(div, from, to) {
  const [expR, salR, purR, conPurR, costsR] = await Promise.all([
    sb.from('expenses').select('*').gte('expense_date',from).lte('expense_date',to).order('expense_date',{ascending:false}),
    sb.from('salaries').select('*').gte('salary_month',from.slice(0,7)).lte('salary_month',to.slice(0,7)),
    sb.from('purchases').select('*').eq('status','approved').gte('purchase_date',from).lte('purchase_date',to),
    sb.from('consumable_purchases').select('*').gte('purchase_date',from).lte('purchase_date',to),
    sb.from('production_costs').select('milk_cost,labor_cost,diesel_cost,materials_cost,extra_cost,total_cost,product_name,prod_date')
      .gte('prod_date',from).lte('prod_date',to),
  ]);

  const exp     = expR.data||[];
  const sal     = salR.data||[];
  const pur     = purR.data||[];
  const conPur  = conPurR.data||[];
  const costs   = costsR.data||[];

  const totalExp    = exp.reduce((s,r)=>s+ +r.amount,0);
  const totalSal    = sal.reduce((s,r)=>s+ +r.net_salary,0);
  const totalPur    = pur.reduce((s,r)=>s+ +r.total,0);
  const totalConPur = conPur.reduce((s,r)=>s+ +r.total,0);
  const grandTotal  = totalExp + totalSal + totalPur + totalConPur;

  // تفصيل تكاليف الإنتاج
  const prodCosts = {
    milk:  costs.reduce((s,r)=>s+ +r.milk_cost,0),
    labor: costs.reduce((s,r)=>s+ +r.labor_cost,0),
    mazot: costs.reduce((s,r)=>s+ +r.diesel_cost,0),
    mats:  costs.reduce((s,r)=>s+ +r.materials_cost,0),
    extra: costs.reduce((s,r)=>s+ +r.extra_cost,0),
  };
  const totalProdCost = Object.values(prodCosts).reduce((a,b)=>a+b,0);

  // رواتب حسب القسم
  const byDept={};
  sal.forEach(s=>{ byDept[s.department]=(byDept[s.department]||0)+ +s.net_salary; });

  // مصاريف حسب الفئة
  const bycat={};
  exp.forEach(e=>{ bycat[e.category]=(bycat[e.category]||0)+ +e.amount; });

  div.innerHTML = `
  <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px">
    <div class="kpi" style="background:var(--red-l)"><div class="kpi-lbl">⚙️ إجمالي التكاليف</div><div class="kpi-val" style="color:var(--red)">${fmt(grandTotal)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">👷 الرواتب</div><div class="kpi-val" style="color:var(--purple)">${fmt(totalSal)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">📋 مصاريف تشغيل</div><div class="kpi-val" style="color:var(--red)">${fmt(totalExp)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">🛒 مشتريات</div><div class="kpi-val" style="color:var(--amber)">${fmt(totalPur+totalConPur)}</div><div class="kpi-unit">${CUR}</div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
    <!-- تكاليف الإنتاج التفصيلية -->
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">تكاليف الإنتاج (${fmt(totalProdCost)} ${CUR})</div>
      ${[
        ['🥛 حليب',   prodCosts.milk,  'var(--teal)'],
        ['👷 عمالة',  prodCosts.labor, 'var(--purple)'],
        ['⛽ مازوت',  prodCosts.mazot, 'var(--amber)'],
        ['🧪 مواد',   prodCosts.mats,  'var(--blue)'],
        ['➕ إضافية', prodCosts.extra, 'var(--txt2)'],
      ].map(([lbl,val,clr])=>`
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:12px">
        <span>${lbl}</span>
        <span style="font-weight:700;color:${clr}">${fmt(val)} ${CUR}
          <span style="font-size:10px;color:var(--txt3)">(${totalProdCost>0?(val/totalProdCost*100).toFixed(1):'0'}%)</span>
        </span>
      </div>`).join('')}
    </div>

    <!-- رواتب حسب القسم -->
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">الرواتب حسب القسم</div>
      ${Object.entries(byDept).sort((a,b)=>b[1]-a[1]).map(([dept,amt])=>`
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:12px">
        <span class="badge ${dept==='معمل'?'b-teal':dept==='مزرعة'?'b-green':'b-blue'}">${dept}</span>
        <strong style="color:var(--purple)">${fmt(amt)} ${CUR}</strong>
      </div>`).join('')||'<div style="color:var(--txt3);text-align:center;padding:12px">لا توجد رواتب</div>'}
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:800;margin-top:4px">
        <span>الإجمالي</span><strong style="color:var(--purple)">${fmt(totalSal)} ${CUR}</strong>
      </div>
    </div>
  </div>

  <!-- المصاريف التفصيلية -->
  <div class="card" style="padding:0">
    <div style="padding:10px 14px;font-weight:700;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between">
      <span>سجل المصاريف</span><span style="color:var(--red)">${fmt(totalExp)} ${CUR}</span>
    </div>
    <div style="max-height:350px;overflow-y:auto">
    <table><thead><tr><th>التاريخ</th><th>الفئة</th><th>الوصف</th><th>المبلغ</th></tr></thead>
    <tbody>${exp.map(e=>`<tr>
      <td style="font-size:11px">${e.expense_date}</td>
      <td><span class="badge b-amber" style="font-size:10px">${e.category}</span></td>
      <td style="font-size:11px;color:var(--txt2)">${e.description||'—'}</td>
      <td style="font-weight:700;color:var(--red)">${fmt(e.amount)} ${CUR}</td>
    </tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--txt3);padding:16px">لا توجد مصاريف</td></tr>'}
    </tbody></table>
    </div>
  </div>`;
}

//  COST PREVIEW BEFORE PRODUCTION SAVE
// ══════════════════════════════════════════════
async function previewProductionCost() {
  const sel = document.getElementById('fac-prod');
  const pn = sel?.value;
  const opt = sel?.options[sel?.selectedIndex];
  const ptype = opt?.dataset?.type||'';
  const qty = +document.getElementById('fac-qty').value;
  if (!pn||!qty) { toast('أدخل المنتج والكمية أولاً',false); return; }

  const prodDate = document.getElementById('fac-date').value;
  const calcium = +document.getElementById('fac-calcium').value||0;
  const rennet = +document.getElementById('fac-rennet').value||0;
  const extraCost = +document.getElementById('fac-cost').value||0;

  // جلب الإعدادات
  const {data:settings} = await sb.from('cost_settings').select('setting_key,setting_value');
  const cfg={};
  (settings||[]).forEach(s=>cfg[s.setting_key]=+s.setting_value);
  const milkPrice=cfg['milk_price_per_liter']||20;
  const dieselPrice=cfg['diesel_price_per_liter']||500;
  const dieselLiters=cfg['diesel_liters_per_day']||15;
  const rennetPrice=cfg['rennet_price_per_ml']||50;
  const calciumPrice=cfg['calcium_price_per_g']||5;
  const salesFactoryPct=(cfg['sales_manager_ratio_factory']||80)/100;
  const salesFarmPct=(cfg['sales_manager_ratio_farm']||20)/100;
  const thisMonth=prodDate.slice(0,7);

  const {data:allSals}=await sb.from('salaries').select('net_salary,department').eq('salary_month',thisMonth);
  const salesMonthly=(allSals||[]).filter(s=>s.department==='مبيعات').reduce((a,r)=>a+ +r.net_salary,0);
  const factoryMonthly=(allSals||[]).filter(s=>s.department==='معمل').reduce((a,r)=>a+ +r.net_salary,0);
  const {data:dayProds}=await sb.from('productions').select('qty_produced').eq('prod_date',prodDate);
  const dayQty=(dayProds||[]).reduce((s,r)=>s+ +r.qty_produced,0)+qty;
  const myShare=dayQty>0?qty/dayQty:1;

  let milkCost=0,dieselCost=0,laborCost=0,materialsCost=0;
  let milkDetails='';

  if(ptype==='labneh'){
    const labanUsed=+document.getElementById('fac-laban-used')?.value||0;
    const {data:lb}=await sb.from('products').select('cost_per_unit').eq('product_type','laban').maybeSingle();
    milkCost = milkUsed * milkPrice;  // للبنة تُحسب من تكلفة اللبن
    milkDetails=`لبن رائب: ${labanUsed} لتر × ${fmt(lb?.cost_per_unit||0)} = ${fmt(milkCost)} ${CUR}`;
    laborCost=((factoryMonthly+salesMonthly*salesFactoryPct)/26)*myShare;
  } else {
    const farmMilk=+document.getElementById('fac-milk-farm')?.value||0;
    const powderG=+document.getElementById('fac-milk-powder')?.value||0;
    const purchMilk=+document.getElementById('fac-milk-purchased')?.value||0;
    const purchMilkPriceInput2 = +document.getElementById('fac-milk-purchased-price')?.value||0;
    const purchPrice = purchMilkPriceInput2 > 0 ? purchMilkPriceInput2 : milkPrice;
    const totalMilk=farmMilk+powderG/125+purchMilk;
    milkCost = (farmMilk * milkPrice) + (powderG/125 * milkPrice) + (purchMilk * purchPrice);
    const farmMonthly=(allSals||[]).filter(s=>s.department==='مزرعة').reduce((a,r)=>a+ +r.net_salary,0);
    const dailyFarmLabor=(farmMonthly+salesMonthly*salesFarmPct)/26;
    milkCost+=dailyFarmLabor*(farmMilk/Math.max(totalMilk,1));
    milkDetails=`مزرعة: ${farmMilk}ل (${fmt(milkPrice)}) + بودرة: ${powderG}كغ + مشتريات: ${purchMilk}ل (${fmt(purchPrice)}) = ${totalMilk.toFixed(1)} لتر`;
    dieselCost=dieselLiters*dieselPrice*myShare;
    laborCost=((factoryMonthly+salesMonthly*salesFactoryPct)/26)*myShare;
  }
  materialsCost=rennet*rennetPrice+calcium*calciumPrice;
  const total=milkCost+dieselCost+laborCost+materialsCost+extraCost;
  const perUnit=qty>0?total/qty:0;

  document.getElementById('cost-preview-body').innerHTML=`
  <div style="background:var(--bg);border-radius:var(--rs);padding:12px;margin-bottom:12px;font-size:12px;color:var(--txt2)">${milkDetails}</div>
  <table style="width:100%;font-size:13px">
    <tr><td style="padding:6px 0">تكلفة الحليب</td><td style="text-align:left;font-weight:600">${fmt(milkCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">المازوت (حصة ${qty}كغ)</td><td style="text-align:left">${fmt(dieselCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">العمالة (حصة)</td><td style="text-align:left">${fmt(laborCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">مواد (منفحة+كالسيوم)</td><td style="text-align:left">${fmt(materialsCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">تكاليف إضافية</td><td style="text-align:left">${fmt(extraCost)} ${CUR}</td></tr>
    <tr style="border-top:2px solid var(--bdr)">
      <td style="padding:10px 0;font-weight:700">إجمالي التكلفة</td>
      <td style="text-align:left;font-size:18px;font-weight:800;color:var(--red)">${fmt(total)} ${CUR}</td>
    </tr>
    <tr>
      <td style="padding:4px 0;color:var(--txt2)">تكلفة الوحدة (كغ)</td>
      <td style="text-align:left;font-weight:700;color:var(--amber)">${fmt(perUnit)} ${CUR}</td>
    </tr>
    <tr>
      <td style="padding:4px 0;color:var(--txt2)">السعر المقترح (+25%)</td>
      <td style="text-align:left;font-weight:700;color:var(--green)">${fmt(Math.ceil(perUnit*1.25/100)*100)} ${CUR}</td>
    </tr>
  </table>`;
  modal('cost-preview-modal');
}

function openSelfPassChange() {
  document.getElementById('self-pass-old').value='';
  document.getElementById('self-pass-new').value='';
  document.getElementById('self-pass-confirm').value='';
  modal('self-pass-modal');
}
async function saveSelfPass() {
  const old=document.getElementById('self-pass-old').value;
  const nw=document.getElementById('self-pass-new').value;
  const conf=document.getElementById('self-pass-confirm').value;
  if(!old||!nw){toast('أدخل كلمة المرور الحالية والجديدة',false);return;}
  if(nw.length<4){toast('كلمة المرور قصيرة جداً — 4 أحرف على الأقل',false);return;}
  if(nw!==conf){toast('كلمتا المرور غير متطابقتين',false);return;}
  // تحقق من كلمة المرور الحالية
  const {data}=await sb.from('app_users').select('id').eq('id',CU.id).eq('password_hash',old).maybeSingle();
  if(!data){toast('كلمة المرور الحالية غير صحيحة',false);return;}
  await sb.from('app_users').update({password_hash:nw}).eq('id',CU.id);
  await logAction('تغيير كلمة المرور الشخصية','','' );
  closeModal('self-pass-modal');
  toast('تم تغيير كلمة المرور ✓');
}

async function saveFacNewProduct() {

  const {data:existing} = await sb.from('products').select('id').eq('name',name).maybeSingle();
  if(existing) { toast('المنتج موجود مسبقاً — عدّله من المخزون',false); return; }

    name,
    unit:           document.getElementById('fac-new-unit').value,

    min_qty:        +document.getElementById('fac-new-min').value||5,
    price_per_unit: +document.getElementById('fac-new-price').value||0,
    barcode:        document.getElementById('fac-new-barcode').value||null,
    product_type:   document.getElementById('fac-new-type').value||null,
  });
  if(error) { toast('خطأ: '+error.message,false); return; }
  await logAction('إضافة منتج جديد', name, 'factory');

  document.getElementById('fac-new-price').value='0';
  document.getElementById('fac-new-barcode').value='';

async function saveFactoryReturn() {
  const prodName = document.getElementById('ret-prod').value;
  const type     = document.getElementById('ret-type').value;
  const qty      = +document.getElementById('ret-qty').value;
  const date     = document.getElementById('ret-date').value;
  const reason   = document.getElementById('ret-reason').value.trim();
  if(!qty||!reason) { toast('أدخل الكمية والسبب',false); return; }
  const sel = document.getElementById('ret-prod');
  const unit = sel?.options[sel?.selectedIndex]?.dataset?.unit||'كغ';
  // تأثير على المخزون
  const {data:p} = await sb.from('products').select('id,qty').eq('name',prodName).maybeSingle();
  if(p) {
    const newQty = type==='مرتجع' ? +p.qty+qty : Math.max(0,+p.qty-qty);
    await sb.from('products').update({qty:newQty}).eq('id',p.id);
    await sb.from('inventory_logs').insert({
      product_name:prodName, change_type:type,
      qty_before:+p.qty, qty_after:newQty, qty_change:type==='مرتجع'?qty:-qty,
      reason
    });
  }
  await sb.from('returns_damage').insert({
    record_date:date, record_type:type, product_name:prodName,
    qty, unit, reason, registered_by:CU.full_name,
    value:0
  });
  await logAction(type, `${prodName} — ${qty} ${unit}`, 'factory');
  document.getElementById('ret-qty').value='0';
  document.getElementById('ret-reason').value='';
  loadFactoryReturnsPage();
  toast(`تم تسجيل ${type} ✓`);
}

      </tr>`).join('')}
      </tbody>

function updateStocktakeDiff(inp) {
  const sys=+inp.dataset.sys||0, actual=+inp.value||0, diff=actual-sys;
  const cell=document.getElementById(`stk-diff-${inp.dataset.id}`);
  if(cell){cell.textContent=(diff>0?'+':'')+diff.toFixed(1);cell.style.color=diff>0?'var(--green)':diff<0?'var(--red)':'var(--txt2)';}
}

async function saveStocktake() {
  const inputs=document.querySelectorAll('#stocktake-body input[type=number]');
  const updates=[],logs=[];
  for(const inp of inputs){
    const sys=+inp.dataset.sys||0,actual=+inp.value||0,diff=actual-sys;
    if(Math.abs(diff)>0.01){
      updates.push({name:inp.dataset.name,newQty:actual});
      logs.push({product_name:inp.dataset.name,change_type:'تسوية جرد',qty_before:sys,qty_after:actual,qty_change:diff,reason:`جرد ${todayStr()} — ${CU.full_name}`});
    }
  }
  if(!updates.length){toast('لا توجد فروقات — المخزون مطابق');return;}
  for(const u of updates) await sb.from('products').update({qty:u.newQty}).eq('name',u.name);
  if(logs.length) await sb.from('inventory_logs').insert(logs);
  await sb.from('stocktakes').insert({stocktake_date:todayStr(),recorded_by:CU.full_name,items_count:updates.length,notes:`${updates.length} فروقات`});
  await logAction('جرد يومي',`${updates.length} تسوية`,'factory');
  toast(`تم حفظ الجرد — ${updates.length} تسوية ✓`);
  loadDailyStocktake();
}

async function loadStocktakeHistory() {
  const {data}=await sb.from('stocktakes').select('*').order('stocktake_date',{ascending:false}).limit(20);
  const div=document.getElementById('stocktake-history');
  if(!div) return;
  if(!data?.length){div.innerHTML='<div style="text-align:center;color:var(--txt3);padding:16px">لا توجد جرود سابقة</div>';return;}
  div.innerHTML=`<table><thead><tr><th>التاريخ</th><th>بواسطة</th><th>التسويات</th></tr></thead><tbody>
    ${data.map(s=>`<tr><td>${s.stocktake_date}</td><td>${s.recorded_by||'—'}</td><td><span class="badge b-amber">${s.items_count||0}</span></td></tr>`).join('')}
  </tbody></table>`;
}

async function saveConsumableItem() {

  const {data:ex}=await sb.from('consumables').select('id').eq('name',name).maybeSingle();

async function loadPOSProducts() {
  const {data}=await sb.from('products')
    .select('*')
    .order('sort_order',{ascending:true}).order('name');
  posProducts = data||[];
  const grid=document.getElementById('pos-products-grid');
  grid.innerHTML=posProducts.map((p,idx)=>
    `<button class="pos-card" onclick="addToCart(${idx})" style="border:none;cursor:pointer;text-align:center;font-family:inherit;width:100%;background:transparent">
      <div class="pos-card-name">${p.name}</div>

      <div style="margin-top:4px"><span style="font-size:10px;color:${+p.qty>5?'var(--green)':'var(--red)'}">

function addToCart(idx) {
  const prod=posProducts[idx];
  if(!prod) return;
  if(+prod.qty<=0) { toast('هذا المنتج نفد من المخزون',false); return; }
  const existing=posCart.find(i=>i.name===prod.name);
  if(existing) { existing.qty+=1; }
  else { posCart.push({name:prod.name,price:+prod.price_per_unit,costPrice:+prod.cost_per_unit,qty:1,unit:prod.unit||'وحدة'}); }
  renderPOSCart();
}

function updatePOSTotal() {
  const subtotal=posCart.reduce((s,i)=>s+i.qty*i.price,0);
  const totalCost=posCart.reduce((s,i)=>s+i.qty*(i.costPrice||0),0); // مخفي

  // حساب الخصم
  const isAdmin=(CU.role==='admin');
  const pct=isAdmin?+document.getElementById('pos-disc-pct').value||0:Math.min(10,+document.getElementById('pos-disc-pct').value||0);
  const val=isAdmin?+document.getElementById('pos-disc-val').value||0:+document.getElementById('pos-disc-val').value||0;
  let discAmt=Math.max(pct>0?subtotal*pct/100:0, val);

  // حماية صامتة: لا يُسمح بالبيع بأقل من سعر التكلفة (لغير الأدمن)
  if(!isAdmin && discAmt>0) {
    const netAfterDisc = subtotal - discAmt;
    if(netAfterDisc < totalCost) {
      // تعديل الخصم صامتاً حتى لا يكشف سعر التكلفة
      discAmt = Math.max(0, subtotal - totalCost);
    }
  }

  const net=Math.max(0,subtotal-discAmt);
  document.getElementById('pos-total').textContent=fmt(subtotal)+' '+CUR;
  if(discAmt>0) {
    document.getElementById('pos-disc-display').style.display='flex';
    document.getElementById('pos-disc-amount').textContent=fmt(discAmt)+' '+CUR;
    document.getElementById('pos-net-row').style.display='flex';
    document.getElementById('pos-net-total').textContent=fmt(net)+' '+CUR;
  } else {
    document.getElementById('pos-disc-display').style.display='none';
    document.getElementById('pos-net-row').style.display='none';
  }
  return {subtotal, discAmt, net, totalCost};
}

async function processPOSSale() {
  if(!posCart.length){toast('السلة فارغة',false);return;}
  const btn=document.getElementById('pos-pay-btn');
  btn.disabled=true; btn.textContent='جارٍ المعالجة...';

  const {subtotal, discAmt, net, totalCost} = updatePOSTotal();

  // تحقق أخير: البيع لا يقل عن التكلفة
  if(net < totalCost && CU.role!=='admin') {
    toast('لا يمكن البيع بهذا السعر',false);
    btn.disabled=false; btn.textContent='💰 إتمام الدفع';
    return;
  }

  const clientId=document.getElementById('pos-client').value;
  const posNotes=document.getElementById('pos-notes')?.value||'';

  const {data:sale,error}=await sb.from('sales').insert({
    sale_date:todayStr(),client_id:clientId||null,total:net,
    payment_method:'نقد', notes:posNotes,
  }).select().single();
  if(error){toast('خطأ: '+error.message,false);btn.disabled=false;btn.textContent='💰 إتمام الدفع';return;}
  const items=posCart.map(i=>({sale_id:sale.id,product_name:i.name,qty:i.qty,unit_price:i.price}));
  await sb.from('sale_items').insert(items);

  // خصم الكميات من المخزون
  for(const item of posCart) {
    const {data:p}=await sb.from('products').select('qty').eq('name',item.name).maybeSingle();
    if(p) {
      const newQty=Math.max(0,+p.qty-item.qty);
      await sb.from('products').update({qty:newQty}).eq('name',item.name);
      await sb.from('inventory_logs').insert({
        product_name:item.name, change_type:'بيع POS',
        qty_before:+p.qty, qty_after:newQty, qty_change:-item.qty,
        reason:`فاتورة #${sale.id}`
      });
    }
  }

  if(clientId) {
    // تحديث الديون إن كانت آجل — POS نقد فقط ولكن نبقي الخيار
  }

  await logAction('بيع POS',`#${sale.id} — ${fmt(net)} ${CUR}`,'pos');
  printReceipt(sale.id, posCart, subtotal, discAmt, net, posNotes, CU.full_name,
    document.getElementById('pos-client')?.options[document.getElementById('pos-client')?.selectedIndex]?.text||'',
    'نقد');

  posCart=[];
  document.getElementById('pos-disc-pct').value='';
  document.getElementById('pos-disc-val').value='';
  document.getElementById('pos-client').value='';
  const notesEl=document.getElementById('pos-notes'); if(notesEl) notesEl.value='';
  renderPOSCart();
  btn.disabled=false; btn.textContent='💰 إتمام الدفع';

  // إظهار رقم الفاتورة مع زر للعرض
  const t = document.getElementById('toast');
  t.innerHTML = `✅ فاتورة <strong>#${sale.id}</strong> — <span style="text-decoration:underline;cursor:pointer" onclick="closePOS();openSaleDetail(${sale.id})">عرض التفاصيل</span>`;
  t.style.background = '#1a1a1a';
  t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.display='none', 6000);
}

function scanBarcode() {
  const bc=document.getElementById('pos-barcode').value.trim();
  if(!bc) return;
  const idx=posProducts.findIndex(p=>p.barcode===bc||p.name===bc);
  if(idx>=0) { addToCart(idx); document.getElementById('pos-barcode').value=''; }
  else toast('لم يُعثر على المنتج',false);
}

function renderPOSCart() {
  const div=document.getElementById('pos-cart-items');
  if(!posCart.length) { div.innerHTML='<div style="text-align:center;padding:30px;color:var(--txt3);font-size:13px">اضغط على منتج للإضافة</div>'; updatePOSTotal(); return; }
  div.innerHTML=posCart.map((item,i)=>`
  <div class="pos-cart-item">
    <div class="pci-name">${item.name}<br>
      <span style="font-size:10px;color:var(--txt3)">${fmt(item.price)} ${CUR}/كغ</span>
      ${item.qty<1?`<span style="font-size:10px;color:var(--amber)"> · ${Math.round(item.qty*1000)}غ</span>`:''}
    </div>
    <div class="pci-qty">
      <button onclick="changePOSQty(${i},-1)">−</button>
      <span>${item.qty<1?(item.qty*1000).toFixed(0)+'غ':item.qty+'كغ'}</span>
      <button onclick="changePOSQty(${i},1)">+</button>
    </div>
    <div class="pci-price">${fmt(Math.round(item.qty*item.price))}</div>
    <button onclick="openWeightCalc(${i},${item.price},'pos')" title="حاسبة الوزن"
      style="background:var(--amber-l);border:none;border-radius:4px;padding:3px 6px;cursor:pointer;font-size:12px">⚖️</button>
    <button class="pci-del" onclick="removeFromCart(${i})">×</button>
  </div>`).join('');
  updatePOSTotal();
}

function changePOSQty(i,d) {
  posCart[i].qty=Math.max(0.1,posCart[i].qty+d);
  if(posCart[i].qty<=0) posCart.splice(i,1);
  renderPOSCart();
}
function removeFromCart(i) { posCart.splice(i,1); renderPOSCart(); }

function applyDiscount10() {
  document.getElementById('pos-disc-pct').value=10;
  document.getElementById('pos-disc-val').value='';
  updatePOSTotal();
}

    'مواد حفظ':'b-amber','مواد تنظيف':'b-green','أخرى':'b-red'
