  const cur = sel.value;
  sel.innerHTML = (prods||[]).map(p=>`<option value="${p.name}" data-unit="${p.unit||'كغ'}">${p.name}</option>`).join('');
  if (cur) sel.value = cur;
}

function openInvAdj(name,qty,unit) {
  invCurrent = {name,qty:+qty,unit};
  document.getElementById('inv-qty-title').textContent = 'تعديل كمية: '+name;
  document.getElementById('inv-cur-qty').textContent = qty+' '+unit;
  document.getElementById('inv-adj-qty').value='';
  document.getElementById('inv-adj-reason').value='';
  document.getElementById('inv-adj-preview').textContent='—';
  modal('inv-qty-modal');
}
function previewInvAdj() {
  const type = document.getElementById('inv-adj-type').value;
  const q = +document.getElementById('inv-adj-qty').value||0;
  const cur = invCurrent.qty;
  const after = type==='add'?cur+q:type==='sub'?Math.max(0,cur-q):q;
  document.getElementById('inv-adj-preview').textContent = after.toFixed(1)+' '+invCurrent.unit;
}
async function saveInvAdj() {
  const type = document.getElementById('inv-adj-type').value;
  const q = +document.getElementById('inv-adj-qty').value||0;
  const reason = document.getElementById('inv-adj-reason').value.trim();
  if (!reason) { toast('أدخل سبب التعديل',false); return; }
  const cur = invCurrent.qty;
  const after = type==='add'?cur+q:type==='sub'?Math.max(0,cur-q):q;
  const change = after-cur;
  await sb.from('products').update({qty:after}).eq('name',invCurrent.name);
  await sb.from('inventory_logs').insert({product_name:invCurrent.name,change_type:type==='add'?'إضافة':type==='sub'?'خصم':'تعيين',qty_before:cur,qty_after:after,qty_change:change,reason});
  await logAction('تعديل مخزون', `${invCurrent.name}: ${cur}→${after}`, 'inventory');
  closeModal('inv-qty-modal'); loadInvList(); toast('تم تعديل الكمية ✓');
}

  const c=+document.getElementById('inv-pcost').value||0;
  const p=+document.getElementById('inv-pprice').value||0;
  await sb.from('products').update({cost_per_unit:c,price_per_unit:p}).eq('name',priceCurrent.name);

async function loadInvLog() {
  const {data} = await sb.from('inventory_logs').select('*').order('created_at',{ascending:false}).limit(200);

  tb.innerHTML = (data||[]).map(l=>{

    return `<tr>
      <td style="font-size:11px">${dt}</td><td><strong>${l.product_name}</strong></td>

}

async function loadSlClients() {
  const {data:cls} = await sb.from('clients').select('id,name').order('name');
  const sel = document.getElementById('sl-client');
  if(!sel) return;
  sel.innerHTML = '<option value="">كاش — بدون عميل</option>';

}

function toggleSlClientForm() {
  const f = document.getElementById('sl-client-form');
  if(f) f.style.display = f.style.display==='none'?'block':'none';
}

async function saveSlNewClient() {
  const name = document.getElementById('sl-new-client-name').value.trim();
  if(!name){toast('أدخل اسم العميل',false);return;}
  const {data:cl,error} = await sb.from('clients').insert({
    name, phone:document.getElementById('sl-new-client-phone').value,
    client_type:document.getElementById('sl-new-client-type').value, debt:0
  }).select().single();

}

let saleRows = [{prod:'',qty:1,price:0}];
function initNewSale() {
  saleRows = [{prod:'',qty:1,price:0}];
  renderSaleRows();
}
function addSaleRow() { saleRows.push({prod:'',qty:1,price:0}); renderSaleRows(); }
function removeSaleRow(i) { saleRows.splice(i,1); if(!saleRows.length) saleRows=[{prod:'',qty:1,price:0}]; renderSaleRows(); }

async function renderSaleRows() {
  const {data:prods} = await sb.from('products').select('name,price_per_unit,qty').order('sort_order',{ascending:true}).order('name');
  const tb = document.getElementById('sl-items-tb');
  if(!tb) return;
  tb.innerHTML = saleRows.map((r,i)=>`<tr>
    <td><select onchange="setSaleRow(${i},'prod',this)" style="font-size:12px;padding:4px 6px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);max-width:160px" id="sl-sel-${i}">
      <option value="">-- اختر --</option>
      ${(prods||[]).map(p=>{const cp=getPriceForProduct(p.id,p.price_per_unit);return`<option value="${p.name}" data-price="${cp}" ${r.prod===p.name?'selected':''}>${p.name} (${p.qty})</option>`;}).join('')}
    </select></td>
    <td><input type="number" value="${r.qty}" min="0.1" max="1000" step="0.1"
      style="width:70px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
      oninput="setSaleRow(${i},'qty',this.value)"></td>
    <td><input type="number" value="${r.price}" step="1"
      style="width:80px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
      oninput="setSaleRow(${i},'price',this.value)"></td>
    <td style="font-weight:600">${fmt(r.qty*r.price)} ${CUR}</td>
    <td style="display:flex;gap:3px">
      <button onclick="openWeightCalc(${i},${r.price||0},'sale')" title="حاسبة الوزن"
        style="background:var(--amber-l);border:none;border-radius:var(--rs);padding:4px 7px;cursor:pointer;font-size:13px">⚖️</button>
      <button onclick="removeSaleRow(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:0 4px">×</button>
    </td>
  </tr>`).join('');
  updateSaleGrand();
}
function setSaleRow(i,field,val) {
  if (field==='prod') {
    saleRows[i].prod = val.value;
    const opt = val.options[val.selectedIndex];
    if (opt?.dataset?.price) saleRows[i].price = +opt.dataset.price;
  } else {
    saleRows[i][field] = Math.min(1000, +val); // max 1000
  }
  renderSaleRows();
}
function updateSaleGrand() {
  const tot = saleRows.reduce((s,r)=>s+r.qty*r.price,0);
  const el = document.getElementById('sl-grand');
  if(el) el.textContent = fmt(tot)+' '+CUR;
}
async function saveSalePage() {
  const clientId = document.getElementById('sl-client').value;
  const total = saleRows.reduce((s,r)=>s+r.qty*r.price,0);
  if (!total) { toast('أضف منتجات للفاتورة',false); return; }
  const pay = document.getElementById('sl-pay').value;
  const notes = document.getElementById('sl-notes')?.value||'';
  const {data:sale,error} = await sb.from('sales').insert({
    sale_date: document.getElementById('sl-date').value,
    client_id: clientId||null, total, payment_method:pay, notes,
    cashier_name: CU.full_name||CU.username,
  }).select().single();
  if (error) { toast('خطأ: '+error.message,false); return; }
  const items = saleRows.filter(r=>r.prod).map(r=>({sale_id:sale.id,product_name:r.prod,qty:r.qty,unit_price:r.price}));
  if (items.length) await sb.from('sale_items').insert(items);
  if (pay==='آجل'&&clientId) {
    const {data:cl} = await sb.from('clients').select('debt').eq('id',clientId).single();
    await sb.from('clients').update({debt:(+cl?.debt||0)+total}).eq('id',clientId);
  }
  await logAction('إصدار فاتورة', `#${sale.id} — ${fmt(total)} ${CUR} — ${pay}`, 'sales');
  saleRows=[{prod:'',qty:1,price:0}];
  document.getElementById('sl-notes').value='';
  renderSaleRows();
  toast('تم إصدار الفاتورة #'+sale.id+' ✓');
}

async function loadSalesSummary() {
  const box = document.getElementById('sl-summary');
  if(!box) return;
  const t = todayStr(), m = t.slice(0,7)+'-01';
  const [{data:todayS},{data:monthS}] = await Promise.all([
    sb.from('sales').select('id,total,cashier_name,payment_method,clients(name)').eq('sale_date',t).order('id',{ascending:false}),
    sb.from('sales').select('total,cashier_name').gte('sale_date',m),
  ]);
  const tArr = todayS||[], mArr = monthS||[];
  const todayTotal = tArr.reduce((s,r)=>s+ +r.total,0);
  const monthTotal = mArr.reduce((s,r)=>s+ +r.total,0);
  // شو انباع اليوم
  let items = [];
  const ids = tArr.map(s=>s.id);
  if(ids.length){
    const r = await sb.from('sale_items').select('product_name,qty,unit_price').in('sale_id',ids);
    items = r.data||[];
  }
  const byProd = {};
  items.forEach(i=>{
    if(!byProd[i.product_name]) byProd[i.product_name]={qty:0,val:0};
    byProd[i.product_name].qty += +i.qty;
    byProd[i.product_name].val += +i.qty * +i.unit_price;
  });
  // مبيعات كل مستخدم يومي وشهري
  const byUser = {};
  tArr.forEach(s=>{ const u=s.cashier_name||'غير محدد'; if(!byUser[u])byUser[u]={d:0,dc:0,m:0,mc:0}; byUser[u].d+= +s.total; byUser[u].dc++; });
  mArr.forEach(s=>{ const u=s.cashier_name||'غير محدد'; if(!byUser[u])byUser[u]={d:0,dc:0,m:0,mc:0}; byUser[u].m+= +s.total; byUser[u].mc++; });

  box.innerHTML = `
  <div class="kpi-grid" style="margin-bottom:12px">
    <div class="kpi"><div class="kpi-lbl">مبيعات اليوم</div><div class="kpi-val" style="color:var(--green)">${fmt(todayTotal)}</div><div class="kpi-unit">${CUR} — ${tArr.length} فاتورة</div></div>
    <div class="kpi"><div class="kpi-lbl">مبيعات الشهر</div><div class="kpi-val" style="color:var(--teal)">${fmt(monthTotal)}</div><div class="kpi-unit">${CUR} — ${mArr.length} فاتورة</div></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-hdr"><span class="card-title">📦 مبيعات اليوم بالتفصيل</span></div>
    <div class="tw"><table>
      <thead><tr><th>المنتج</th><th>الكمية</th><th>قيمة المبيع</th></tr></thead>
      <tbody>${Object.entries(byProd).sort((a,b)=>b[1].val-a[1].val).map(([n,v])=>`<tr>
        <td>${n}</td><td>${v.qty}</td><td style="font-weight:600;color:var(--green)">${fmt(v.val)} ${CUR}</td>
      </tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:var(--txt3)">لا مبيعات اليوم</td></tr>'}</tbody>
    </table></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-hdr"><span class="card-title">🧾 فواتير اليوم — مين سجّلها</span></div>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>المسجّل</th><th>العميل</th><th>المبلغ</th><th>الدفع</th></tr></thead>
      <tbody>${tArr.map(s=>`<tr>
        <td><button class="btn btn-sm" onclick="openSaleDetail(${s.id})" style="padding:2px 8px">#${s.id}</button></td>
        <td style="font-weight:600;color:var(--blue)">${s.cashier_name||'غير محدد'}</td>
        <td>${s.clients?.name||'كاش'}</td>
        <td style="font-weight:600;color:var(--green)">${fmt(s.total)} ${CUR}</td>
        <td><span class="badge ${s.payment_method==='آجل'?'b-amber':'b-green'}">${s.payment_method}</span></td>
      </tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا فواتير اليوم</td></tr>'}</tbody>
    </table></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-hdr"><span class="card-title">👤 مبيعات المستخدمين</span></div>
    <div class="tw"><table>
      <thead><tr><th>المستخدم</th><th>اليوم</th><th>فواتير</th><th>الشهر</th><th>فواتير</th></tr></thead>
      <tbody>${Object.entries(byUser).sort((a,b)=>b[1].m-a[1].m).map(([u,v])=>`<tr>
        <td style="font-weight:600">${u}</td>
        <td style="color:var(--green)">${fmt(v.d)} ${CUR}</td><td>${v.dc}</td>
        <td style="color:var(--teal)">${fmt(v.m)} ${CUR}</td><td>${v.mc}</td>
      </tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا بيانات</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

async function editSaleInModal() {
  if(!currentSaleId) return;
  const newPay = prompt('طريقة الدفع (نقد / آجل / تحويل):');
  if(!newPay) return;
  const newNotes = prompt('ملاحظات:');
  await sb.from('sales').update({payment_method:newPay,notes:newNotes||''}).eq('id',currentSaleId);

  closeModal('sl-detail-modal');
  loadSalesHist();

}

async function deleteSaleInModal() {
  if(!currentSaleId) return;
  if(!confirm(`حذف الفاتورة #${currentSaleId}؟ لا يمكن التراجع.`)) return;
  await sb.from('sale_items').delete().eq('sale_id',currentSaleId);

  await logAction('حذف فاتورة',`#${currentSaleId}`,'sales');
  closeModal('sl-detail-modal');
  loadSalesHist();
  toast('تم حذف الفاتورة');
}

async function openClientLedger(clientId, clientName) {
  if (!clientId && !clientName) return;
  const today = todayStr();
  const firstOfMonth = today.slice(0,7)+'-01';
  modal('client-ledger-modal');
  document.getElementById('cl-title').textContent = `كشف حساب — ${clientName||'عميل'}`;
  document.getElementById('cl-from').value = firstOfMonth;
  document.getElementById('cl-to').value   = today;
  window._ledgerClientId   = clientId;
  window._ledgerClientName = clientName;
  loadClientLedger();
}

async function loadClientLedger() {
  const clientId   = window._ledgerClientId;
  const clientName = window._ledgerClientName;
  const from = document.getElementById('cl-from')?.value;
  const to   = document.getElementById('cl-to')?.value;
  if (!from||!to) return;
  const el = document.getElementById('cl-body');
  el.innerHTML = '<div class="ld"><span class="spin"></span></div>';

  let q = sb.from('sales').select('id,sale_date,total,payment_method,notes,cashier_name').order('sale_date',{ascending:true});
  if (clientId) q = q.eq('client_id', clientId);
  else q = q.is('client_id', null);
  q = q.gte('sale_date', from).lte('sale_date', to);
  const {data:sales} = await q;

  const saleIds = (sales||[]).map(s=>s.id);
  let itemsMap = {};
  if (saleIds.length) {
    const {data:items} = await sb.from('sale_items').select('sale_id,product_name,qty,unit_price').in('sale_id', saleIds);
    (items||[]).forEach(i=>{ if(!itemsMap[i.sale_id]) itemsMap[i.sale_id]=[]; itemsMap[i.sale_id].push(i); });
  }

  const grandTotal = (sales||[]).reduce((s,r)=>s+(+r.total||0),0);

  if (!(sales||[]).length) {
    el.innerHTML = '<p style="text-align:center;color:var(--txt3);padding:24px">لا توجد مشتريات في هذه الفترة</p>';
    return;
  }

  el.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-bottom:12px;border-bottom:2px solid var(--brd)">
    <span style="font-size:13px;color:var(--txt2)">${(sales||[]).length} فاتورة</span>
    <div style="text-align:left">
      <div style="font-size:11px;color:var(--txt2)">الإجمالي</div>
      <strong style="font-size:20px;color:var(--green)">${fmt(grandTotal)} ${CUR}</strong>
    </div>
  </div>
  ${(sales||[]).map(s=>{
    const items = itemsMap[s.id]||[];
    const stBadge = s.payment_method==='آجل'?'b-amber':s.payment_method==='تحويل'?'b-blue':'b-green';
    return `
    <div style="border:1px solid var(--brd);border-radius:var(--rs);margin-bottom:10px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg)">
        <div>
          <span style="font-weight:700;color:var(--txt2);font-size:12px">#${s.id}</span>
          <span style="font-size:12px;color:var(--txt2);margin-right:8px">📅 ${s.sale_date}</span>
          <span class="badge ${stBadge}" style="font-size:10px">${s.payment_method}</span>
        </div>
        <strong style="color:var(--green)">${fmt(s.total)} ${CUR}</strong>
      </div>
      ${items.length?`<table style="width:100%;font-size:12px">
        <thead><tr style="background:var(--bg2)"><th style="padding:4px 8px;text-align:right">المنتج</th><th style="padding:4px 8px;text-align:center">الكمية</th><th style="padding:4px 8px;text-align:center">السعر</th><th style="padding:4px 8px;text-align:center">الإجمالي</th></tr></thead>
        <tbody>${items.map(i=>`<tr>
          <td style="padding:4px 8px">${i.product_name}</td>
          <td style="padding:4px 8px;text-align:center">${i.qty}</td>
          <td style="padding:4px 8px;text-align:center">${fmt(i.unit_price)} ${CUR}</td>
          <td style="padding:4px 8px;text-align:center;font-weight:600">${fmt(i.qty*(+i.unit_price||0))} ${CUR}</td>
        </tr>`).join('')}</tbody>
      </table>`:''}
      ${s.cashier_name?`<div style="padding:4px 12px;font-size:11px;color:var(--txt3)">👤 ${s.cashier_name}</div>`:''}
      ${s.notes?`<div style="padding:4px 12px;font-size:11px;color:var(--amber)">📝 ${s.notes}</div>`:''}
    </div>`;
  }).join('')}`;
}

async function printClientLedger() {
  const clientName = window._ledgerClientName||'عميل';
  const from = document.getElementById('cl-from')?.value;
  const to   = document.getElementById('cl-to')?.value;
  const body = document.getElementById('cl-body')?.innerHTML||'';

}

async function saveClient() {
  const name = document.getElementById('cl-name').value.trim();
  if (!name) { toast('أدخل اسم العميل',false); return; }
  await sb.from('clients').insert({name, phone:document.getElementById('cl-phone').value, client_type:document.getElementById('cl-type').value, notes:document.getElementById('cl-notes').value, debt:0});
  await logAction('إضافة عميل', name, 'clients');
  document.getElementById('cl-name').value='';
  loadClientsList(); toast('تمت إضافة العميل ✓');
}

async function savePayment() {
  const clientId = document.getElementById('pay-client-sel').value;
  const amount = +document.getElementById('pay-amount').value||0;
  if (!clientId||!amount) { toast('اختر العميل وأدخل المبلغ',false); return; }
  const {data:cl} = await sb.from('clients').select('debt,name').eq('id',clientId).single();
  const newDebt = Math.max(0,(+cl?.debt||0)-amount);
  await sb.from('clients').update({debt:newDebt}).eq('id',clientId);
  await sb.from('payments').insert({client_id:+clientId,payment_date:document.getElementById('pay-date').value,amount,balance_after:newDebt,notes:document.getElementById('pay-notes').value});
  await logAction('تسجيل دفعة', `${cl?.name} — ${fmt(amount)} ${CUR}`, 'clients');
  document.getElementById('pay-amount').value='';
  document.getElementById('pay-notes').value='';
  loadPayHist(); loadClientsList(); toast('تم تسجيل الدفعة ✓');
}

async function loadPayHist() {
  const {data} = await sb.from('payments').select('*,clients(name)').order('payment_date',{ascending:false}).limit(50);
  const tb = document.getElementById('pay-hist-tb');
  if (!tb) return;
  tb.innerHTML = (data||[]).map(p=>`<tr>
    <td>${p.payment_date}</td><td>${p.clients?.name||'—'}</td>
    <td style="color:var(--green);font-weight:600">${fmt(p.amount)} ${CUR}</td>
    <td>${fmt(p.balance_after)} ${CUR}</td>
    <td style="font-size:11px">${p.notes||'—'}</td>
  </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد دفعات</td></tr>';
}

async function loadPurchaseCategories() {

function toggleNewCatForm() {
  const f = document.getElementById('new-cat-form');
  if (f) f.style.display = f.style.display==='none' ? 'block' : 'none';
}

async function savePurchaseCategoryInline() {
  const name = document.getElementById('pu-newcat-name')?.value.trim();
  if (!name) { toast('أدخل اسم الصنف',false); return; }
  const desc = document.getElementById('pu-newcat-desc')?.value.trim();
  const {error} = await sb.from('purchase_categories').insert({name, description:desc||null, created_by:CU.full_name});
  if (error) {
    if (error.code==='23505') { toast('هذا الصنف موجود مسبقاً',false); }
    else { toast('خطأ: '+error.message,false); }
    return;
  }
  document.getElementById('pu-newcat-name').value='';
  document.getElementById('pu-newcat-desc').value='';
  toggleNewCatForm();
  await logAction('إضافة صنف مشتريات', name, 'purchases');
  toast('تم إضافة الصنف ✓');
  // reload categories in select
  const cats = await loadPurchaseCategories();
  const sel = document.getElementById('pu-cat');
  if (sel) {
    sel.innerHTML = cats.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
    sel.value = name;
  }
}

async function initPurchaseReq() {
  setDate('pu-date');
  ['pu-qty','pu-uprice'].forEach(id=>document.getElementById(id)?.addEventListener('input', ()=>{
    const q=+document.getElementById('pu-qty')?.value||0;
    const p=+document.getElementById('pu-uprice')?.value||0;
    document.getElementById('pu-total-preview').textContent=fmt(q*p)+' '+CUR;
  }));
  const cats = await loadPurchaseCategories();
  const sel = document.getElementById('pu-cat');
  if (sel) {
    sel.innerHTML = cats.length
      ? cats.map(c=>`<option value="${c.name}">${c.name}</option>`).join('')
      : '<option value="">لا توجد أصناف — أضف صنفاً جديداً</option>';
  }
}

async function savePurchaseReq() {
  const qty = +document.getElementById('pu-qty').value||0;
  const up = +document.getElementById('pu-uprice').value||0;
  if (!qty) { toast('أدخل الكمية',false); return; }
  const {error} = await sb.from('purchases').insert({
    purchase_date: document.getElementById('pu-date').value,
    category: document.getElementById('pu-cat').value,
    supplier: document.getElementById('pu-supplier').value,
    description: document.getElementById('pu-desc').value,
    qty, unit: document.getElementById('pu-unit').value,
    unit_price:up, total:qty*up,
    status:'pending', requested_by: CU.full_name,
  });
  if (error) { toast('خطأ: '+error.message,false); return; }
  await logAction('طلب شراء', `${document.getElementById('pu-cat').value} — ${qty}`, 'purchases');
  toast('تم إرسال طلب الشراء ✓');
  loadPurchasesList();
}

async function loadPurchasesList() {

    rejected: {label:'مرفوض',            cls:'b-red',    icon:'❌'},
    received: {label:'مستلم',            cls:'b-blue',   icon:'📦'},

    return `<div style="border:1px solid var(--brd);border-radius:var(--rs);padding:12px;margin-bottom:10px;background:var(--card)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
        <div style="display:flex;align-items:center;gap:8px">

          <span class="badge ${st.cls}">${st.icon} ${st.label}</span>
        </div>
        <span style="font-size:12px;color:var(--txt2)">${p.purchase_date}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-bottom:8px">
        <div><span style="color:var(--txt2)">الكمية: </span><strong>${p.qty} ${p.unit}</strong></div>
        <div><span style="color:var(--txt2)">سعر الوحدة: </span><strong>${fmt(p.unit_price)} ${CUR}</strong></div>
        <div><span style="color:var(--txt2)">المورد: </span><strong>${p.supplier||'—'}</strong></div>
        <div><span style="color:var(--txt2)">الإجمالي: </span><strong style="color:var(--green);font-size:15px">${fmt(p.total)} ${CUR}</strong></div>
      </div>

async function loadPendingPurchases() {
  const {data} = await sb.from('purchases').select('*').eq('status','pending').order('created_at');
  const tb = document.getElementById('pu-pending-tb');
  tb.innerHTML = (data||[]).map(p=>`<tr>

    <td>${p.description||'—'}</td><td>${p.qty} ${p.unit}</td>
    <td style="font-weight:600">${fmt(p.total)} ${CUR}</td>

async function approvePurchase(id) {
  await sb.from('purchases').update({status:'approved',approved_by:CU.full_name}).eq('id',id);
  await logAction('موافقة شراء', `#${id}`, 'purchases');
  loadPendingPurchases(); loadPurchasesList(); toast('تمت الموافقة ✓');
}
async function rejectPurchase(id) {
  await sb.from('purchases').update({status:'rejected',approved_by:CU.full_name}).eq('id',id);
  await logAction('رفض شراء', `#${id}`, 'purchases');
  loadPendingPurchases(); loadPurchasesList(); toast('تم الرفض');

async function loadRMList() {
  const RAW_CATS = ['مواد تصنيع', 'مستلزمات تعبئة', 'أخرى'];
  const {data} = await sb.from('consumables').select('*').in('category', RAW_CATS).order('name');
  const tb = document.getElementById('rm-list-tb');
  if (!tb) return;
  if (!data?.length) { tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--txt3)">لا توجد مواد أولية — أضف من تبويب المستهلكات باختيار فئة "مواد تصنيع"</td></tr>'; return; }
  tb.innerHTML = data.map(c => {
    const st = +c.qty_available > +c.min_qty*2 ? ['متوفر','b-green'] : +c.qty_available > +c.min_qty ? ['محدود','b-amber'] : ['منخفض','b-red'];
    return `<tr>
      <td><strong>${c.name}</strong>${c.notes?`<br><span style="font-size:10px;color:var(--txt2)">${c.notes}</span>`:''}</td>
      <td><span class="badge b-teal">${c.category}</span></td>
      <td style="font-weight:700;font-size:15px">${c.qty_available||0}</td>
      <td>${c.unit||'—'}</td>
      <td style="color:var(--txt2)">${+c.last_price>0?fmt(c.last_price)+' '+CUR:'—'}</td>
      <td><span class="badge ${st[1]}">${st[0]}</span></td>
    </tr>`;
  }).join('');
}

function updateRMTotal() {
  const q = +document.getElementById('rm-buy-qty')?.value||0;
  const p = +document.getElementById('rm-buy-price')?.value||0;
  const el = document.getElementById('rm-buy-total');
  if (el) el.textContent = fmt(q*p) + ' ' + CUR;
}

async function saveRMPurchase() {
  const sel = document.getElementById('rm-buy-item');
  const itemId = +sel?.value;
  const qty   = +document.getElementById('rm-buy-qty')?.value||0;
  const price = +document.getElementById('rm-buy-price')?.value||0;
  if (!itemId||!qty||!price) { toast('أدخل المادة والكمية والسعر',false); return; }
  const buyDate = document.getElementById('rm-buy-date').value;
  const {data:item} = await sb.from('consumables').select('name,qty_available').eq('id',itemId).single();
  await sb.from('consumables').update({qty_available: +item.qty_available+qty, last_price:price}).eq('id',itemId);
  const opt = sel.options[sel.selectedIndex];
  await sb.from('consumable_purchases').insert({
    consumable_id:itemId, item_name:item.name, purchase_date:buyDate,
    qty, unit_price:price, total:qty*price,
    supplier: document.getElementById('rm-buy-supplier')?.value||'',
    ref: document.getElementById('rm-buy-ref')?.value||'',
    recorded_by: CU.full_name,
  });
  await sb.from('expenses').insert({
    expense_date:buyDate, category:'مواد تصنيع',
    description:`شراء ${item.name} — ${qty} ${opt?.dataset?.unit||''}`,
    amount: qty*price,
  });
  await logAction('وارد مواد أولية', `${item.name} — ${fmt(qty*price)} ${CUR}`, 'factory');
  ['rm-buy-qty','rm-buy-price','rm-buy-supplier','rm-buy-ref'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  loadRMList();
  toast('تم تسجيل الوارد ✓');
}

async function confirmMonthlySalaries() {
  const month=document.getElementById('sal-month-batch').value;
  if(!month){toast('اختر الشهر',false);return;}
  const {data:emps}=await sb.from('employees').select('*').eq('is_active',true);
  if(!emps?.length){toast('لا يوجد موظفون نشطون',false);return;}
  if(!confirm(`تأكيد صرف رواتب ${month} لـ ${emps.length} موظفين؟`)) return;
  // جلب خصومات حليب الموظفين لهذا الشهر
  const {data:milkDeds} = await sb.from('expenses').select('description,amount')
    .eq('category','خصم حليب موظف').gte('expense_date',month+'-01').lte('expense_date',month+'-31');
  const records=[];
  let totalPaid=0;
  for(const e of emps){
    const deductEl=document.getElementById(`deduct-${e.id}`);
    let deduct=deductEl?+deductEl.value||0:0;
    // خصم الحليب الشخصي تلقائياً (مطابقة اسم الموظف في وصف الخصم)
    const milkDeduct=(milkDeds||[]).filter(d=>(d.description||'').startsWith(e.name)).reduce((s,d)=>s+ +d.amount,0);
    deduct += milkDeduct;
    const net=Math.max(0,(+e.base_salary + +e.allowances)-deduct);
    records.push({
      employee_name:e.name,salary_month:month,department:e.department,
      base_salary:+e.base_salary,bonuses:+e.allowances,deductions:deduct,net_salary:net,
      notes: milkDeduct>0?`منها خصم حليب: ${fmt(milkDeduct)} ${CUR}`:''
    });
    totalPaid+=net;
  }
  const {error}=await sb.from('salaries').insert(records);
  if(error){toast('خطأ: '+error.message,false);return;}
  // تسجيل في المصاريف تلقائياً (تكلفة محاسبية)
  await sb.from('expenses').insert({
    expense_date:month+'-01',
    category:'رواتب (محاسبية)',
    description:`رواتب شهر ${month} — ${emps.length} موظفين`,
    amount:totalPaid
  });
  await logAction('صرف رواتب شهرية',`${month} — إجمالي: ${fmt(totalPaid)} ${CUR}`,'accounts');
  loadSalaries();
  document.getElementById('sal-batch-preview').innerHTML='';
  toast(`تم تسجيل رواتب ${month} ✓`);
}

async function openPermModal(userId, name, role) {
  permUserId = userId;
  document.getElementById('perm-modal-title').textContent = `صلاحيات: ${name}`;
  // جلب الصلاحيات الحالية
  const {data:perms} = await sb.from('user_permissions').select('*').eq('user_id', userId);
  const permMap = {};
  (perms||[]).forEach(p=>permMap[p.page_key]=p);
  // الصلاحيات الافتراضية حسب الدور
  const defaultByRole = {
    admin:['dashboard','pos','milk','factory','inventory','costs','reports','sales_page','clients','purchases','returns','accounts','users','logs'],
    factory:['dashboard','pos','factory','inventory','returns'],
    farm:['dashboard','milk','purchases'],
    sales:['dashboard','pos','sales_page','clients','returns','inventory'],
    purchases:['dashboard','purchases'],
  };
  const defaults = defaultByRole[role]||[];
  document.getElementById('perm-modal-body').innerHTML = `
  <p style="font-size:12px;color:var(--txt2);margin-bottom:12px">حدد الصفحات التي يمكن للمستخدم الوصول إليها وصلاحيات التعديل والحذف</p>
  <table style="width:100%;font-size:13px">
    <thead><tr><th style="text-align:right;padding:6px">الصفحة</th><th style="text-align:center;padding:6px">وصول</th><th style="text-align:center;padding:6px">تعديل</th><th style="text-align:center;padding:6px">حذف</th></tr></thead>
    <tbody>
    ${ALL_PAGES_LIST.map(pg=>{
      const p = permMap[pg.key];
      const hasAccess = p ? p.can_access : defaults.includes(pg.key);
      const canEdit = p ? p.can_edit : (role==='admin');
      const canDel = p ? p.can_delete : (role==='admin');
      return `<tr style="border-bottom:1px solid var(--bdr)">
        <td style="padding:8px 6px;font-weight:500">${pg.label}</td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="access" ${hasAccess?'checked':''} onchange="syncPermRow(this)"></td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="edit" ${canEdit&&hasAccess?'checked':''} ${!hasAccess?'disabled':''}></td>
        <td style="text-align:center"><input type="checkbox" data-page="${pg.key}" data-type="delete" ${canDel&&hasAccess?'checked':''} ${!hasAccess?'disabled':''}></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
  modal('perm-modal');
}

function syncPermRow(accessCb) {
  const page = accessCb.dataset.page;
  const row = accessCb.closest('tr');
  const editCb = row.querySelector('[data-type="edit"]');
  const delCb = row.querySelector('[data-type="delete"]');
  if (!accessCb.checked) {
    editCb.checked = false; editCb.disabled = true;
    delCb.checked = false; delCb.disabled = true;
  } else {
    editCb.disabled = false; delCb.disabled = false;
  }
}

async function savePermissions() {
  if (!permUserId) return;
  const rows = document.querySelectorAll('#perm-modal-body tbody tr');
  const toUpsert = [];
  rows.forEach(row => {
    const page = row.querySelector('[data-type="access"]')?.dataset?.page;
    if (!page) return;
    toUpsert.push({
      user_id: permUserId,
      page_key: page,
      can_access: row.querySelector('[data-type="access"]')?.checked||false,
      can_edit: row.querySelector('[data-type="edit"]')?.checked||false,
      can_delete: row.querySelector('[data-type="delete"]')?.checked||false,
    });
  });
  // حذف القديم وإدراج الجديد
  await sb.from('user_permissions').delete().eq('user_id', permUserId);
  if (toUpsert.length) await sb.from('user_permissions').insert(toUpsert);
  await logAction('تعديل صلاحيات', `#${permUserId}`, 'users');
  closeModal('perm-modal');
  toast('تم حفظ الصلاحيات ✓');
}

let resetPassUserId = null;
function openResetPass(userId, name) {
  resetPassUserId = userId;

  document.getElementById('new-pass-input').value = '';

async function saveNewPass() {

  await sb.from('app_users').update({password_hash: newPass}).eq('id', resetPassUserId);

  closeModal('reset-pass-modal');
  toast('تم تغيير كلمة المرور ✓');
}

async function saveNewUser() {
  const username=document.getElementById('nu-user').value.trim();
  const pass=document.getElementById('nu-pass').value;
  const name=document.getElementById('nu-name').value.trim();
  const role=document.getElementById('nu-role').value;
  if(!username||!pass||!name){toast('أدخل جميع البيانات',false);return;}
  const {error}=await sb.from('app_users').insert({username,password_hash:pass,full_name:name,role,is_active:true});
  if(error){toast('خطأ: '+error.message,false);return;}
  await logAction('إضافة مستخدم',`${name} (${username}) — ${role}`,'users');

async function changeUserRole(id,role) {
  await sb.from('app_users').update({role}).eq('id',id);
  await logAction('تغيير صلاحية',`#${id} → ${role}`,'users');
  loadUsersList(); toast('تم تغيير الصلاحية ✓');
}

async function toggleUser(id, active) {
  await sb.from('app_users').update({is_active:!active}).eq('id',id);
  await logAction(active?'تعطيل مستخدم':'تفعيل مستخدم',`#${id}`,'users');
  loadUsersList(); toast(active?'تم تعطيل المستخدم':'تم تفعيل المستخدم');

const LOG_COLORS = {

  'حذف':'#ef4444','بيع':'#8b5cf6','إنتاج':'#14b8a6','مرتجع':'#f97316',

function logColor(action) {
  for(const [k,c] of Object.entries(LOG_COLORS)) if(action&&action.includes(k)) return c;

async function loadLogs() {
  const userF=document.getElementById('log-user-filter')?.value;
  const pageF=document.getElementById('log-page-filter')?.value;
  const dateFrom=document.getElementById('log-date-from')?.value;
  const dateTo=document.getElementById('log-date-to')?.value;
  let q=sb.from('user_logs').select('*').order('created_at',{ascending:false}).limit(500);
  if(userF) q=q.eq('username',userF);
  if(pageF) q=q.eq('page',pageF);
  if(dateFrom) q=q.gte('created_at', dateFrom+'T00:00:00');
  if(dateTo) q=q.lte('created_at', dateTo+'T23:59:59');
  const {data}=await q;
  const tb=document.getElementById('logs-tb');
  const cnt=document.getElementById('logs-count');
  if(cnt) cnt.textContent = data?.length ? `${data.length} سجل` : '';
  tb.innerHTML=(data||[]).map(l=>{
    const dt=new Date(l.created_at).toLocaleString('ar-SY');
    const clr=logColor(l.action);
    const pageBadgeColors={login:'b-green',milk:'b-teal',factory:'b-blue',sales:'b-purple',
      inventory:'b-amber',accounts:'b-blue',users:'b-red',purchases:'b-amber',returns:'b-orange',pos:'b-purple'};

    return`<tr>
      <td style="font-size:11px;white-space:nowrap;color:var(--txt2)">${dt}</td>
      <td><strong style="font-size:13px">${l.username||'—'}</strong></td>

  }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--txt3);padding:20px">لا توجد سجلات</td></tr>';
}

async function loadCostDashboard() {
  const today = todayStr();
  const {data:todayCosts} = await sb.from('production_costs').select('*').eq('prod_date', today);

  const milkTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.milk_cost, 0);
  const dieselTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.diesel_cost, 0);
  const laborTotal = (todayCosts||[]).reduce((s,r)=>s+ +r.labor_cost, 0);
  const totalProd = (todayCosts||[]).reduce((s,r)=>s+ +r.qty_produced, 0);
  const totalCost = (todayCosts||[]).reduce((s,r)=>s+ +r.total_cost, 0);
  const avgPerKg = totalProd > 0 ? totalCost / totalProd : 0;

  document.getElementById('ck-today').textContent = fmt(avgPerKg);
  document.getElementById('ck-milk').textContent = fmt(milkTotal);
  document.getElementById('ck-diesel').textContent = fmt(dieselTotal);
  document.getElementById('ck-labor').textContent = fmt(laborTotal);

  // تفصيل اليوم
  const detail = document.getElementById('cost-today-detail');
  if (!todayCosts?.length) {
    detail.innerHTML = '<div style="text-align:center;padding:20px;color:var(--txt3)">لا يوجد إنتاج مسجّل اليوم</div>';
  } else {
    detail.innerHTML = `<div class="tw"><table>
      <thead><tr><th>المنتج</th><th>الكمية</th><th>تك. الحليب</th><th>المازوت</th><th>العمالة</th><th>إضافي</th><th>الإجمالي</th><th>تكلفة/وحدة</th><th>سعر مرجعي</th></tr></thead>
      <tbody>${todayCosts.map(c=>`<tr>
        <td><strong>${c.product_name}</strong></td>
        <td>${c.qty_produced}</td>
        <td>${fmt(c.milk_cost)}</td>
        <td>${fmt(c.diesel_cost)}</td>
        <td>${fmt(c.labor_cost)}</td>
        <td>${fmt(c.extra_cost)}</td>
        <td style="font-weight:700">${fmt(c.total_cost)} ${CUR}</td>
        <td style="color:var(--red);font-weight:700">${fmt(c.cost_per_unit)} ${CUR}</td>
        <td style="color:var(--green);font-weight:700">${fmt(c.suggested_price)} ${CUR}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  // مخطط المتوسط
  const {data:recent} = await sb.from('production_costs')
    .select('prod_date,product_name,cost_per_unit,suggested_price')
    .order('prod_date',{ascending:false}).limit(60);
  const avgChart = document.getElementById('cost-avg-chart');
  if (!recent?.length) { avgChart.innerHTML='<div style="text-align:center;padding:20px;color:var(--txt3)">لا توجد بيانات كافية</div>'; return; }
  // تجميع حسب المنتج
  const byProd = {};
  (recent||[]).forEach(r=>{ if(!byProd[r.product_name]) byProd[r.product_name]=[]; byProd[r.product_name].push(r); });
  avgChart.innerHTML = Object.entries(byProd).map(([prod, rows])=>{
    const avg = rows.reduce((s,r)=>s+ +r.cost_per_unit,0)/rows.length;
    const suggested = rows[0]?.suggested_price||0;
    const minC = Math.min(...rows.map(r=> +r.cost_per_unit));
    const maxC = Math.max(...rows.map(r=> +r.cost_per_unit));
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <strong style="font-size:13px">${prod}</strong>
        <div style="display:flex;gap:12px;font-size:12px">
          <span style="color:var(--txt2)">أدنى: ${fmt(minC)}</span>
          <span style="color:var(--txt2)">أعلى: ${fmt(maxC)}</span>
          <span style="color:var(--red);font-weight:600">متوسط: ${fmt(avg)} ${CUR}</span>
          <span style="color:var(--green);font-weight:600">مرجعي: ${fmt(suggested)} ${CUR}</span>
        </div>
      </div>
      <div style="display:flex;gap:3px;align-items:flex-end;height:50px">
        ${rows.slice(0,20).reverse().map(r=>{
          const h = maxC>0 ? Math.max(4, Math.round((+r.cost_per_unit/maxC)*46)) : 4;
          return `<div style="flex:1;height:${h}px;background:var(--amber-m);border-radius:2px 2px 0 0;min-width:6px" title="${r.prod_date}: ${fmt(r.cost_per_unit)}"></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('<hr style="border:none;border-top:1px solid var(--bdr);margin:12px 0">');
}

async function loadRefPrices() {
  // آخر سعر مرجعي لكل منتج
  const {data:costs} = await sb.from('production_costs').select('product_name,avg_cost_30d,suggested_price').order('created_at',{ascending:false});
  const latestByProd = {};
  (costs||[]).forEach(c=>{ if(!latestByProd[c.product_name]) latestByProd[c.product_name]=c; });
  const {data:prods} = await sb.from('products').select('name,price_per_unit').order('name');
  const tb = document.getElementById('ref-price-tb');
  tb.innerHTML = (prods||[]).map(p=>{
    const ref = latestByProd[p.name];
    if(!ref) return `<tr><td>${p.name}</td><td colspan="5" style="color:var(--txt3)">لا توجد دفعات مسجّلة بعد</td></tr>`;
    const diff = +p.price_per_unit - +ref.suggested_price;

    return `<tr>
      <td><strong>${p.name}</strong></td>

async function applyOneRefPrice(name, price) {
  await sb.from('products').update({price_per_unit: price}).eq('name', name);
  await sb.from('inventory_logs').insert({product_name:name,change_type:'تحديث سعر مرجعي',qty_before:0,qty_after:0,qty_change:0,reason:`سعر مرجعي جديد: ${fmt(price)} ${CUR}`});
  await logAction('تطبيق سعر مرجعي', `${name}: ${fmt(price)} ${CUR}`, 'costs');
  loadRefPrices(); toast(`تم تحديث سعر ${name} ✓`);
}

async function applyRefPrices() {
  if(!confirm('هل تريد تطبيق جميع الأسعار المرجعية على المنتجات؟')) return;
  const {data:costs} = await sb.from('production_costs').select('product_name,suggested_price').order('created_at',{ascending:false});
  const latest = {};
  (costs||[]).forEach(c=>{ if(!latest[c.product_name]) latest[c.product_name]=c.suggested_price; });
  for(const [name, price] of Object.entries(latest)) {
    await sb.from('products').update({price_per_unit: price}).eq('name', name);
    await sb.from('inventory_logs').insert({product_name:name,change_type:'تحديث سعر مرجعي',qty_before:0,qty_after:0,qty_change:0,reason:`سعر مرجعي: ${fmt(price)} ${CUR}`});
  }
  await logAction('تطبيق أسعار مرجعية', `${Object.keys(latest).length} منتجات`, 'costs');
  toast('تم تحديث جميع الأسعار ✓');
  loadRefPrices();
}

async function saveCostSettings() {
  const {data:settings} = await sb.from('cost_settings').select('setting_key');
  for(const s of (settings||[])) {
    const el = document.getElementById(`cs-${s.setting_key}`);
    if(el) await sb.from('cost_settings').update({setting_value: +el.value, updated_by: CU.full_name, updated_at: new Date().toISOString()}).eq('setting_key', s.setting_key);
  }
  await logAction('تحديث إعدادات التكلفة', '', 'costs');
  toast('تم حفظ الإعدادات ✓');
}

async function recalcDayCosts() {
  const date = document.getElementById('recalc-date').value;
  if(!date) { toast('اختر التاريخ',false); return; }
  const {data:prods} = await sb.from('productions').select('*').eq('prod_date', date);
  if(!prods?.length) { toast('لا يوجد إنتاج في هذا اليوم',false); return; }
  await sb.from('production_costs').delete().eq('prod_date', date);
  for(const prod of prods) {
    await calcProductionCost(prod, date, prod.milk_used, prod.qty_produced, prod.extra_cost);
  }
  await logAction('إعادة حساب تكاليف', date, 'costs');
  toast(`تم إعادة حساب تكاليف ${date} ✓`);
  loadCostDashboard();
}

    sb.from('purchases').select('total').eq('status','approved').gte('purchase_date',from).lte('purchase_date',to),

  const totalMilk = (milkR.data||[]).reduce((s,r)=>s+ +r.liters,0);

  const credit = sArr.filter(s=>s.payment_method==='آجل').reduce((s,r)=>s+ +r.total,0);
  // المنتجات المباعة بالفترة
  let byProd = {};
  const ids = sArr.map(s=>s.id);
  for (let i=0; i<ids.length; i+=200) {
    const {data:items} = await sb.from('sale_items').select('product_name,qty,unit_price').in('sale_id',ids.slice(i,i+200));
    (items||[]).forEach(it=>{
      if(!byProd[it.product_name]) byProd[it.product_name]={qty:0,val:0};

  const byUser = {};
  sArr.forEach(s=>{ const u=s.cashier_name||'غير محدد'; if(!byUser[u])byUser[u]={v:0,c:0}; byUser[u].v+= +s.total; byUser[u].c++; });

    <div class="kpi"><div class="kpi-lbl">المشتريات</div><div class="kpi-val" style="color:var(--red)">${fmt(totalPurch)}</div><div class="kpi-unit">${CUR}</div></div>

    <div class="kpi"><div class="kpi-lbl">الصافي</div><div class="kpi-val" style="color:${totalSales-totalExp>=0?'var(--green)':'var(--red)'}">${fmt(totalSales-totalExp)}</div><div class="kpi-unit">${CUR}</div></div>

  <div class="card"><div class="tw"><table>
    <thead><tr><th>المنتج</th><th>الكمية</th><th>القيمة</th></tr></thead>
    <tbody>${Object.entries(byProd).sort((a,b)=>b[1].val-a[1].val).map(([n,v])=>`<tr>
      <td>${n}</td><td>${v.qty}</td><td style="font-weight:600;color:var(--green)">${fmt(v.val)} ${CUR}</td>

  <div class="sec">مبيعات المستخدمين في الفترة</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>المستخدم</th><th>المبيعات</th><th>عدد الفواتير</th></tr></thead>

    </tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:var(--txt3)">لا بيانات</td></tr>'}</tbody>
  </table></div></div>`;
}

function barChart(data, maxVal, color='var(--green-m)', height=80) {
  if (!data.length) return '<div style="text-align:center;color:var(--txt3);padding:20px">لا توجد بيانات</div>';
  const max = maxVal || Math.max(...data.map(d=>d.val), 1);
  return `<div style="display:flex;gap:6px;align-items:flex-end;height:${height}px;padding:0 4px">
    ${data.map(d=>{
      const h = Math.max(4, Math.round((d.val/max)*height*0.9));
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end;min-width:0">
        <div style="font-size:9px;color:var(--txt2);writing-mode:horizontal-tb">${fmt(d.val)}</div>
        <div style="width:100%;height:${h}px;background:${d.color||color};border-radius:3px 3px 0 0" title="${d.label}: ${fmt(d.val)}"></div>
        <div style="font-size:9px;color:var(--txt2);text-align:center;white-space:nowrap;overflow:hidden;max-width:40px">${d.label}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function pieSegments(data) {
  const total = data.reduce((s,d)=>s+d.val,0);
  if (!total) return '<div style="text-align:center;color:var(--txt3)">لا توجد بيانات</div>';
  let html = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">';
  const colors=['var(--green-m)','var(--amber-m)','var(--red-m)','var(--blue)','var(--teal)','var(--purple)'];
  data.forEach((d,i)=>{
    const pct = Math.round(d.val/total*100);
    html+=`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
      <div style="width:12px;height:12px;border-radius:2px;background:${colors[i%colors.length]};flex-shrink:0"></div>
      <span>${d.label}</span><strong>${pct}%</strong><span style="color:var(--txt2)">(${fmt(d.val)} ${CUR})</span>
    </div>`;
  });
  return html+'</div>';
}

async function loadProfitSources() {
  const div = document.getElementById('rp-tab-profit-src');
  const {data:items} = await sb.from('sale_items').select('product_name,qty,unit_price');
  const {data:costs} = await sb.from('production_costs').select('product_name,avg_cost_30d');
  const avgCostMap={};
  (costs||[]).forEach(c=>{ if(!avgCostMap[c.product_name]) avgCostMap[c.product_name]=+c.avg_cost_30d; });
  const byProd={};
  (items||[]).forEach(i=>{
    if(!byProd[i.product_name]) byProd[i.product_name]={sales:0,qty:0,cost:0,profit:0};
    const rev= +i.qty * +i.unit_price;
    const cost= +i.qty * (avgCostMap[i.product_name]||0);
    byProd[i.product_name].sales+=rev;
    byProd[i.product_name].qty+= +i.qty;
    byProd[i.product_name].cost+=cost;
    byProd[i.product_name].profit+=rev-cost;
  });
  const sorted=Object.entries(byProd).sort((a,b)=>b[1].profit-a[1].profit);
  const maxProfit=Math.max(...sorted.map(([,v])=>v.profit),1);

  div.innerHTML=`
  <div class="card">
    <div class="card-hdr"><span class="card-title">ربح كل منتج (إجمالي)</span></div>
    ${barChart(sorted.map(([n,v])=>({label:n,val:v.profit,color:v.profit>=0?'var(--green-m)':'var(--red-m)'})),maxProfit,undefined,100)}
  </div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>المنتج</th><th>إجمالي المبيعات</th><th>إجمالي التكلفة</th><th>الربح</th><th>هامش %</th></tr></thead>
    <tbody>${sorted.map(([n,v])=>{
      const mg=v.sales>0?Math.round(v.profit/v.sales*100):0;
      return`<tr><td><strong>${n}</strong></td>
        <td>${fmt(v.sales)} ${CUR}</td><td style="color:var(--red)">${fmt(v.cost)} ${CUR}</td>
        <td style="color:${v.profit>=0?'var(--green)':'var(--red)'};font-weight:700">${fmt(v.profit)} ${CUR}</td>
        <td style="font-weight:600;color:${mg>=25?'var(--green)':mg>=10?'var(--amber)':'var(--red)'}">${mg}%</td></tr>`;
    }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--txt3)">لا توجد بيانات</td></tr>'}</tbody>
  </table></div></div>`;
}

  <div class="card">
    <div class="card-hdr"><span class="card-title">مقارنة شهرية — آخر 6 أشهر</span></div>
    <div id="monthly-table-body"><div class="ld"><span class="spin"></span></div></div>

async function previewProductionCost() {
  const sel = document.getElementById('fac-prod');
  const pn = sel?.value;
  const opt = sel?.options[sel?.selectedIndex];
  const ptype = opt?.dataset?.type||'';
  const qty = +document.getElementById('fac-qty').value;
  if (!pn||!qty) { toast('أدخل المنتج والكمية أولاً',false); return; }

  const prodDate = document.getElementById('fac-date').value;
  const calcium = +document.getElementById('fac-calcium').value||0;
  const rennet = +document.getElementById('fac-rennet').value||0;
  const extraCost = +document.getElementById('fac-cost').value||0;

  // جلب الإعدادات
  const {data:settings} = await sb.from('cost_settings').select('setting_key,setting_value');
  const cfg={};
  (settings||[]).forEach(s=>cfg[s.setting_key]=+s.setting_value);
  const milkPrice=cfg['milk_price_per_liter']||20;
  const dieselPrice=cfg['diesel_price_per_liter']||500;
  const dieselLiters=cfg['diesel_liters_per_day']||15;
  const rennetPrice=cfg['rennet_price_per_ml']||50;
  const calciumPrice=cfg['calcium_price_per_g']||5;
  const salesFactoryPct=(cfg['sales_manager_ratio_factory']||80)/100;
  const salesFarmPct=(cfg['sales_manager_ratio_farm']||20)/100;
  const thisMonth=prodDate.slice(0,7);

  const {data:allSals}=await sb.from('salaries').select('net_salary,department').eq('salary_month',thisMonth);
  const salesMonthly=(allSals||[]).filter(s=>s.department==='مبيعات').reduce((a,r)=>a+ +r.net_salary,0);
  const factoryMonthly=(allSals||[]).filter(s=>s.department==='معمل').reduce((a,r)=>a+ +r.net_salary,0);
  const {data:dayProds}=await sb.from('productions').select('qty_produced').eq('prod_date',prodDate);
  const dayQty=(dayProds||[]).reduce((s,r)=>s+ +r.qty_produced,0)+qty;
  const myShare=dayQty>0?qty/dayQty:1;

  let milkCost=0,dieselCost=0,laborCost=0,materialsCost=0;
  let milkDetails='';

  if(ptype==='labneh'){
    const labanUsed=+document.getElementById('fac-laban-used')?.value||0;
    const {data:lb}=await sb.from('products').select('cost_per_unit').eq('product_type','laban').maybeSingle();
    milkCost = milkUsed * milkPrice;  // للبنة تُحسب من تكلفة اللبن
    milkDetails=`لبن رائب: ${labanUsed} لتر × ${fmt(lb?.cost_per_unit||0)} = ${fmt(milkCost)} ${CUR}`;
    laborCost=((factoryMonthly+salesMonthly*salesFactoryPct)/26)*myShare;
  } else {
    const farmMilk=+document.getElementById('fac-milk-farm')?.value||0;
    const powderG=+document.getElementById('fac-milk-powder')?.value||0;
    const purchMilk=+document.getElementById('fac-milk-purchased')?.value||0;
    const totalMilk=farmMilk+powderG/125+purchMilk;
    milkCost=totalMilk*milkPrice;
    const farmMonthly=(allSals||[]).filter(s=>s.department==='مزرعة').reduce((a,r)=>a+ +r.net_salary,0);
    const dailyFarmLabor=(farmMonthly+salesMonthly*salesFarmPct)/26;
    milkCost+=dailyFarmLabor*(farmMilk/Math.max(totalMilk,1));
    milkDetails=`حليب مزرعة: ${farmMilk}ل + بودرة: ${powderG}غ + مشتريات: ${purchMilk}ل = ${totalMilk.toFixed(1)} لتر`;
    dieselCost=dieselLiters*dieselPrice*myShare;
    laborCost=((factoryMonthly+salesMonthly*salesFactoryPct)/26)*myShare;
  }
  materialsCost=rennet*rennetPrice+calcium*calciumPrice;
  const total=milkCost+dieselCost+laborCost+materialsCost+extraCost;
  const perUnit=qty>0?total/qty:0;

  document.getElementById('cost-preview-body').innerHTML=`
  <div style="background:var(--bg);border-radius:var(--rs);padding:12px;margin-bottom:12px;font-size:12px;color:var(--txt2)">${milkDetails}</div>
  <table style="width:100%;font-size:13px">
    <tr><td style="padding:6px 0">تكلفة الحليب</td><td style="text-align:left;font-weight:600">${fmt(milkCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">المازوت (حصة ${qty}كغ)</td><td style="text-align:left">${fmt(dieselCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">العمالة (حصة)</td><td style="text-align:left">${fmt(laborCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">مواد (منفحة+كالسيوم)</td><td style="text-align:left">${fmt(materialsCost)} ${CUR}</td></tr>
    <tr><td style="padding:6px 0">تكاليف إضافية</td><td style="text-align:left">${fmt(extraCost)} ${CUR}</td></tr>
    <tr style="border-top:2px solid var(--bdr)">
      <td style="padding:10px 0;font-weight:700">إجمالي التكلفة</td>
      <td style="text-align:left;font-size:18px;font-weight:800;color:var(--red)">${fmt(total)} ${CUR}</td>
    </tr>
    <tr>
      <td style="padding:4px 0;color:var(--txt2)">تكلفة الوحدة (كغ)</td>
      <td style="text-align:left;font-weight:700;color:var(--amber)">${fmt(perUnit)} ${CUR}</td>
    </tr>
    <tr>
      <td style="padding:4px 0;color:var(--txt2)">السعر المقترح (+25%)</td>
      <td style="text-align:left;font-weight:700;color:var(--green)">${fmt(Math.ceil(perUnit*1.25/100)*100)} ${CUR}</td>
    </tr>
  </table>`;
  modal('cost-preview-modal');
}

function openSelfPassChange() {
  document.getElementById('self-pass-old').value='';
  document.getElementById('self-pass-new').value='';
  document.getElementById('self-pass-confirm').value='';
  modal('self-pass-modal');
}
async function saveSelfPass() {
  const old=document.getElementById('self-pass-old').value;
  const nw=document.getElementById('self-pass-new').value;
  const conf=document.getElementById('self-pass-confirm').value;
  if(!old||!nw){toast('أدخل كلمة المرور الحالية والجديدة',false);return;}
  if(nw.length<4){toast('كلمة المرور قصيرة جداً — 4 أحرف على الأقل',false);return;}
  if(nw!==conf){toast('كلمتا المرور غير متطابقتين',false);return;}
  // تحقق من كلمة المرور الحالية
  const {data}=await sb.from('app_users').select('id').eq('id',CU.id).eq('password_hash',old).maybeSingle();
  if(!data){toast('كلمة المرور الحالية غير صحيحة',false);return;}
  await sb.from('app_users').update({password_hash:nw}).eq('id',CU.id);
  await logAction('تغيير كلمة المرور الشخصية','','' );
  closeModal('self-pass-modal');
  toast('تم تغيير كلمة المرور ✓');
}

async function loadDailyStocktake() {
  const lbl = document.getElementById('stocktake-date-lbl');
  if(lbl) lbl.textContent = todayStr();
  const {data:prods} = await sb.from('products').select('*').order('sort_order',{ascending:true}).order('name');
  const body = document.getElementById('stocktake-body');
  if(!body) return;
  body.innerHTML = `
  <p style="font-size:12px;color:var(--txt2);margin-bottom:12px">سجّل الكميات الفعلية. الفروقات تُسجَّل تلقائياً في سجل المخزون.</p>
  <div class="tw"><table>
    <thead><tr><th>المنتج</th><th>الوحدة</th><th>كمية النظام</th><th>الكمية الفعلية</th><th>الفرق</th></tr></thead>
    <tbody>${(prods||[]).map(p=>`<tr>
      <td><strong>${p.name}</strong></td><td>${p.unit||'كغ'}</td>
      <td style="color:var(--txt2)">${p.qty}</td>
      <td><input type="number" min="0" step="0.1" value="${p.qty}"
        data-id="${p.id}" data-name="${p.name.replace(/"/g,'&quot;')}" data-sys="${p.qty}"
        style="width:80px;padding:5px 7px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:13px"
        oninput="updateStocktakeDiff(this)"></td>
      <td id="stk-diff-${p.id}" style="font-weight:600;color:var(--txt2)">0</td>
    </tr>`).join('')}
    </tbody>
  </table></div>`;
  loadStocktakeHistory();
}

function updateStocktakeDiff(inp) {
  const sys=+inp.dataset.sys||0, actual=+inp.value||0, diff=actual-sys;
  const cell=document.getElementById(`stk-diff-${inp.dataset.id}`);
  if(cell){cell.textContent=(diff>0?'+':'')+diff.toFixed(1);cell.style.color=diff>0?'var(--green)':diff<0?'var(--red)':'var(--txt2)';}
}

async function saveStocktake() {
  const inputs=document.querySelectorAll('#stocktake-body input[type=number]');
  const updates=[],logs=[];
  for(const inp of inputs){
    const sys=+inp.dataset.sys||0,actual=+inp.value||0,diff=actual-sys;
    if(Math.abs(diff)>0.01){
      updates.push({name:inp.dataset.name,newQty:actual});
      logs.push({product_name:inp.dataset.name,change_type:'تسوية جرد',qty_before:sys,qty_after:actual,qty_change:diff,reason:`جرد ${todayStr()} — ${CU.full_name}`});
    }
  }
  if(!updates.length){toast('لا توجد فروقات — المخزون مطابق');return;}
  for(const u of updates) await sb.from('products').update({qty:u.newQty}).eq('name',u.name);
  if(logs.length) await sb.from('inventory_logs').insert(logs);
  await sb.from('stocktakes').insert({stocktake_date:todayStr(),recorded_by:CU.full_name,items_count:updates.length,notes:`${updates.length} فروقات`});
  await logAction('جرد يومي',`${updates.length} تسوية`,'factory');
  toast(`تم حفظ الجرد — ${updates.length} تسوية ✓`);
  loadDailyStocktake();
}

async function loadStocktakeHistory() {
  const {data}=await sb.from('stocktakes').select('*').order('stocktake_date',{ascending:false}).limit(20);
  const div=document.getElementById('stocktake-history');
  if(!div) return;
  if(!data?.length){div.innerHTML='<div style="text-align:center;color:var(--txt3);padding:16px">لا توجد جرود سابقة</div>';return;}
  div.innerHTML=`<table><thead><tr><th>التاريخ</th><th>بواسطة</th><th>التسويات</th></tr></thead><tbody>
    ${data.map(s=>`<tr><td>${s.stocktake_date}</td><td>${s.recorded_by||'—'}</td><td><span class="badge b-amber">${s.items_count||0}</span></td></tr>`).join('')}
  </tbody></table>`;
}

async function loadPOSProducts() {
  const {data}=await sb.from('products').select('*').order('sort_order',{ascending:true}).order('name');
  posProducts = data||[];
  const grid=document.getElementById('pos-products-grid');
  grid.innerHTML=posProducts.map((p,idx)=>{
    const price = getPriceForProduct(p.id, p.price_per_unit);
    const hasCustom = CU_PRICES[p.id] !== undefined && CU_PRICES[p.id] !== +p.price_per_unit;
    return `<button class="pos-card" onclick="addToCart(${idx})" style="border:none;cursor:pointer;text-align:center;font-family:inherit;width:100%;background:transparent">
      <div class="pos-card-name">${p.name}</div>
      <div class="pos-card-price" style="color:${hasCustom?'var(--amber)':'var(--green)'}">${fmt(price)}</div>
      <div class="pos-card-unit">${CUR} / ${p.unit||'وحدة'}</div>
      <div style="margin-top:4px"><span style="font-size:10px;color:${+p.qty>5?'var(--green)':'var(--red)'}">
        ${+p.qty>0?p.qty+' متاح':'نفد'}</span></div>
    </button>`;
  }).join('');

function addToCart(idx) {
  const prod=posProducts[idx];
  if(!prod) return;
  if(+prod.qty<=0) { toast('هذا المنتج نفد من المخزون',false); return; }
  const price = getPriceForProduct(prod.id, prod.price_per_unit);
  const existing=posCart.find(i=>i.name===prod.name);
  if(existing) { existing.qty+=1; }
  else { posCart.push({name:prod.name,price:+price,costPrice:+prod.cost_per_unit,qty:1,unit:prod.unit||'وحدة',prodId:prod.id}); }
  renderPOSCart();
}

function updatePOSTotal() {
  const subtotal=posCart.reduce((s,i)=>s+i.qty*i.price,0);
  const totalCost=posCart.reduce((s,i)=>s+i.qty*(i.costPrice||0),0); // مخفي

  // حساب الخصم
  const isAdmin=(CU.role==='admin');
  const pct=isAdmin?+document.getElementById('pos-disc-pct').value||0:Math.min(10,+document.getElementById('pos-disc-pct').value||0);
  const val=isAdmin?+document.getElementById('pos-disc-val').value||0:+document.getElementById('pos-disc-val').value||0;
  let discAmt=Math.max(pct>0?subtotal*pct/100:0, val);

  // حماية صامتة: لا يُسمح بالبيع بأقل من سعر التكلفة (لغير الأدمن)
  if(!isAdmin && discAmt>0) {
    const netAfterDisc = subtotal - discAmt;
    if(netAfterDisc < totalCost) {
      // تعديل الخصم صامتاً حتى لا يكشف سعر التكلفة
      discAmt = Math.max(0, subtotal - totalCost);
    }
  }

  const net=Math.max(0,subtotal-discAmt);
  document.getElementById('pos-total').textContent=fmt(subtotal)+' '+CUR;
  if(discAmt>0) {
    document.getElementById('pos-disc-display').style.display='flex';
    document.getElementById('pos-disc-amount').textContent=fmt(discAmt)+' '+CUR;
    document.getElementById('pos-net-row').style.display='flex';
    document.getElementById('pos-net-total').textContent=fmt(net)+' '+CUR;
  } else {
    document.getElementById('pos-disc-display').style.display='none';
    document.getElementById('pos-net-row').style.display='none';
  }
  return {subtotal, discAmt, net, totalCost};
}

async function processPOSSale() {
  if(!posCart.length){toast('السلة فارغة',false);return;}
  const btn=document.getElementById('pos-pay-btn');
  btn.disabled=true; btn.textContent='جارٍ المعالجة...';

  const {subtotal, discAmt, net, totalCost} = updatePOSTotal();

  // تحقق أخير: البيع لا يقل عن التكلفة
  if(net < totalCost && CU.role!=='admin') {
    toast('لا يمكن البيع بهذا السعر',false);
    btn.disabled=false; btn.textContent='💰 إتمام الدفع';
    return;
  }

  const clientId=document.getElementById('pos-client').value;
  const posNotes=document.getElementById('pos-notes')?.value||'';

  const {data:sale,error}=await sb.from('sales').insert({
    sale_date:todayStr(),client_id:clientId||null,total:net,
    payment_method:'نقد', notes:posNotes,
    cashier_name: CU.full_name||CU.username,
  }).select().single();
  if(error){toast('خطأ: '+error.message,false);btn.disabled=false;btn.textContent='💰 إتمام الدفع';return;}
  const items=posCart.map(i=>({sale_id:sale.id,product_name:i.name,qty:i.qty,unit_price:i.price}));
  await sb.from('sale_items').insert(items);

  // خصم الكميات من المخزون
  for(const item of posCart) {
    const {data:p}=await sb.from('products').select('qty').eq('name',item.name).maybeSingle();
    if(p) {
      const newQty=Math.max(0,+p.qty-item.qty);
      await sb.from('products').update({qty:newQty}).eq('name',item.name);
      await sb.from('inventory_logs').insert({
        product_name:item.name, change_type:'بيع POS',
        qty_before:+p.qty, qty_after:newQty, qty_change:-item.qty,
        reason:`فاتورة #${sale.id}`
      });
    }
  }

  if(clientId) {
    // تحديث الديون إن كانت آجل — POS نقد فقط ولكن نبقي الخيار
  }

  await logAction('بيع POS',`#${sale.id} — ${fmt(net)} ${CUR}`,'pos');
  printReceipt(sale.id, posCart, subtotal, discAmt, net, posNotes);

  posCart=[];
  document.getElementById('pos-disc-pct').value='';
  document.getElementById('pos-disc-val').value='';
  document.getElementById('pos-client').value='';
  const notesEl=document.getElementById('pos-notes'); if(notesEl) notesEl.value='';
  renderPOSCart();
  btn.disabled=false; btn.textContent='💰 إتمام الدفع';
  toast('تم البيع بنجاح ✓');
}

function scanBarcode() {
  const bc=document.getElementById('pos-barcode').value.trim();
  if(!bc) return;
  const idx=posProducts.findIndex(p=>p.barcode===bc||p.name===bc);
  if(idx>=0) { addToCart(idx); document.getElementById('pos-barcode').value=''; }
  else toast('لم يُعثر على المنتج',false);
}

function renderPOSCart() {
  const div=document.getElementById('pos-cart-items');
  if(!posCart.length) { div.innerHTML='<div style="text-align:center;padding:30px;color:var(--txt3);font-size:13px">اضغط على منتج للإضافة</div>'; updatePOSTotal(); return; }
  div.innerHTML=posCart.map((item,i)=>`
  <div class="pos-cart-item">
    <div class="pci-name">${item.name}<br>
      <span style="font-size:10px;color:var(--txt3)">${fmt(item.price)} ${CUR}/كغ</span>
      ${item.qty<1?`<span style="font-size:10px;color:var(--amber)"> · ${Math.round(item.qty*1000)}غ</span>`:''}
    </div>
    <div class="pci-qty">
      <button onclick="changePOSQty(${i},-1)">−</button>
      <span>${item.qty<1?(item.qty*1000).toFixed(0)+'غ':item.qty+'كغ'}</span>
      <button onclick="changePOSQty(${i},1)">+</button>
    </div>
    <div class="pci-price">${fmt(Math.round(item.qty*item.price))}</div>
    <button onclick="openWeightCalc(${i},${item.price},'pos')" title="حاسبة الوزن"
      style="background:var(--amber-l);border:none;border-radius:4px;padding:3px 6px;cursor:pointer;font-size:12px">⚖️</button>
    <button class="pci-del" onclick="removeFromCart(${i})">×</button>
  </div>`).join('');
  updatePOSTotal();
}

function changePOSQty(i,d) {
  posCart[i].qty=Math.max(0.1,posCart[i].qty+d);
  if(posCart[i].qty<=0) posCart.splice(i,1);
  renderPOSCart();
}
function removeFromCart(i) { posCart.splice(i,1); renderPOSCart(); }

function applyDiscount10() {
  document.getElementById('pos-disc-pct').value=10;
  document.getElementById('pos-disc-val').value='';
  updatePOSTotal();
}

    sb.from('productions').select('product_name,qty_produced,milk_used').eq('prod_date', date),
    sb.from('expenses').select('category,amount,description').eq('expense_date', date),

    if(!soldByProd[i.product_name]) soldByProd[i.product_name]={qty:0,revenue:0};
    soldByProd[i.product_name].qty += +i.qty;
    soldByProd[i.product_name].revenue += +i.qty * +i.unit_price;

    <div class="kpi"><div class="kpi-lbl">مبيعات اليوم</div><div class="kpi-val" style="color:var(--green)">${fmt(totalSales)}</div><div class="kpi-unit">${CUR}</div></div>
    <div class="kpi"><div class="kpi-lbl">حليب منتج</div><div class="kpi-val" style="color:var(--teal)">${totalMilk.toFixed(1)}</div><div class="kpi-unit">لتر</div></div>
    <div class="kpi"><div class="kpi-lbl">إنتاج المعمل</div><div class="kpi-val" style="color:var(--blue)">${totalProd.toFixed(1)}</div><div class="kpi-unit">كغ</div></div>
    <div class="kpi"><div class="kpi-lbl">مصاريف اليوم</div><div class="kpi-val" style="color:var(--red)">${fmt(totalExp)}</div><div class="kpi-unit">${CUR}</div></div>

      <span>الإجمالي</span><strong style="color:var(--teal)">${totalMilk.toFixed(1)} لتر</strong>
    </div>
  </div>

  <!-- المصاريف -->
  ${(expR.data||[]).length?`
  <div class="sec">مصاريف اليوم</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>الفئة</th><th>الوصف</th><th>المبلغ</th></tr></thead>
    <tbody>${(expR.data||[]).map(e=>`<tr><td><span class="badge b-amber">${e.category}</span></td><td>${e.description||'—'}</td><td style="font-weight:600">${fmt(e.amount)} ${CUR}</td></tr>`).join('')}</tbody>
  </table></div></div>`:''}`;
}

    <div class="modal-hdr">
      <span class="modal-title">⚖️ حاسبة الوزن والسعر</span>
      <button class="modal-close" onclick="document.getElementById('weight-calc-modal').classList.remove('open')">×</button>
    </div>
    <div style="background:var(--green-l);border-radius:var(--rs);padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--txt2)">سعر الكيلو</span>

    </div>

    <div class="sec" style="margin:0 0 8px">من الوزن → احسب السعر</div>
    <div class="fg">
      <div class="fi">
        <label>الوزن بالكيلو</label>
        <input type="number" id="wc-kg" min="0" step="0.001" placeholder="0.000"
          style="padding:8px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);font-size:14px;width:100%"
          oninput="wcFromKg(${pricePerKg})">
      </div>
      <div class="fi">
        <label>الوزن بالغرام</label>
        <input type="number" id="wc-g" min="0" step="1" placeholder="0"
          style="padding:8px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);font-size:14px;width:100%"
          oninput="wcFromGram(${pricePerKg})">
      </div>

    <div style="background:var(--green-l);border-radius:var(--rs);padding:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--txt2)">السعر المحسوب</span>
      <strong id="wc-result-price" style="font-size:24px;font-weight:800;color:var(--green)">0 ${CUR}</strong>
    </div>

    <div class="sec" style="margin:0 0 8px">من السعر → احسب الوزن</div>
    <div class="fi">
      <label>المبلغ المطلوب (${CUR})</label>
      <input type="number" id="wc-amount" min="0" step="1" placeholder="0"
        style="padding:8px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);font-size:14px;width:100%"
        oninput="wcFromAmount(${pricePerKg})">
    </div>
    <div style="background:var(--amber-l);border-radius:var(--rs);padding:12px;margin-bottom:16px">
      <div style="display:flex;gap:20px;font-size:14px">
        <div><span style="color:var(--txt2);font-size:11px">بالكيلو</span><br><strong id="wc-result-kg" style="font-size:18px">—</strong></div>
        <div><span style="color:var(--txt2);font-size:11px">بالغرام</span><br><strong id="wc-result-g" style="font-size:18px">—</strong></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="document.getElementById('weight-calc-modal').classList.remove('open')">إغلاق</button>
      <button class="btn btn-p" onclick="applyWeightToRow(${rowIdx},${pricePerKg},'${context}')">✓ تطبيق على الصنف</button>
    </div>
  </div>`;
  modal_el.classList.add('open');
}

function wcFromKg(price) {
  const kg = +document.getElementById('wc-kg').value||0;
  document.getElementById('wc-g').value = Math.round(kg*1000);
  document.getElementById('wc-result-price').textContent = fmt(Math.round(kg*price))+' '+CUR;
}
function wcFromGram(price) {
  const g = +document.getElementById('wc-g').value||0;
  const kg = g/1000;
  document.getElementById('wc-kg').value = kg.toFixed(3);
  document.getElementById('wc-result-price').textContent = fmt(Math.round(kg*price))+' '+CUR;
}
function wcFromAmount(price) {
  const amount = +document.getElementById('wc-amount').value||0;
  if(!price) return;
  const kg = amount/price;
  document.getElementById('wc-result-kg').textContent = kg.toFixed(3)+' كغ';
  document.getElementById('wc-result-g').textContent  = Math.round(kg*1000)+' غ';
  document.getElementById('wc-kg').value = kg.toFixed(3);    // ← أضف هذا
  document.getElementById('wc-g').value  = Math.round(kg*1000); // ← أضف هذا
}

function applyWeightToRow(rowIdx, pricePerKg, context) {
  const kg = +document.getElementById('wc-kg').value||0;
  if(!kg){ toast('أدخل الوزن أولاً',false); return; }
  if(context==='sale' && saleRows && saleRows[rowIdx] !== undefined) {
    saleRows[rowIdx].qty   = parseFloat(kg.toFixed(3));
    saleRows[rowIdx].price = pricePerKg;
    renderSaleRows();
  } else if(context==='pos' && posCart && posCart[rowIdx] !== undefined) {
    posCart[rowIdx].qty = parseFloat(kg.toFixed(3));
    renderPOSCart();
  }
  document.getElementById('weight-calc-modal').classList.remove('open');
  toast(`✓ تم تطبيق ${kg>=1?kg.toFixed(3)+' كغ':Math.round(kg*1000)+' غ'}`);
}

    <div id="inp-result"><p style="text-align:center;color:var(--txt3);padding:24px">اختر القسم والفترة ثم اضغط عرض</p></div>
  </div>`;
}

async function loadInputsReport() {
  const dept = document.getElementById('inp-dept')?.value;
  const from = document.getElementById('inp-from')?.value;
  const to   = document.getElementById('inp-to')?.value;
  if (!from||!to) { toast('حدد الفترة',false); return; }
  const el = document.getElementById('inp-result');
  el.innerHTML = `<div class="ld"><span class="spin"></span></div>`;

  try {
    let html = '';
    if (dept === 'farm')      html = await buildFarmInputs(from, to);
    else if (dept === 'factory')   html = await buildFactoryInputs(from, to);
    else if (dept === 'purchases') html = await buildPurchasesInputs(from, to);
    else if (dept === 'sales')     html = await buildSalesInputs(from, to);
    else if (dept === 'accounts')  html = await buildAccountsInputs(from, to);
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<p style="color:var(--red)">خطأ: ${e.message}</p>`;
  }
}

  const stMap = {pending:['بانتظار','b-amber'],approved:['موافق','b-green'],rejected:['مرفوض','b-red'],received:['مستلم','b-blue']};
  const approved = (purch||[]).filter(p=>['approved','received'].includes(p.status));
  const totalApproved = approved.reduce((s,r)=>s+(+r.total||0),0);

  const rows = (purch||[]).map(r=>{
    const st=stMap[r.status]||['—',''];

// ── تصدير CSV ──
async function exportInputsCSV() {
  const dept = document.getElementById('inp-dept')?.value;
  const from = document.getElementById('inp-from')?.value;
  const to   = document.getElementById('inp-to')?.value;
  if (!from||!to) { toast('حدد الفترة',false); return; }

  const deptNames = {farm:'المزرعة',factory:'المصنع',purchases:'المشتريات',sales:'المبيعات',accounts:'الحسابات'};
  let rows = [], headers = [];

  if (dept==='farm') {
    const {data} = await sb.from('milk_records').select('record_date,session,liters,cows(name)').gte('record_date',from).lte('record_date',to).order('record_date',{ascending:false});
    headers = ['التاريخ','الجلسة','البقرة','الكمية (لتر)'];
    rows = (data||[]).map(r=>[r.record_date,r.session,r.cows?.name||'',r.liters]);
  } else if (dept==='factory') {
    const {data} = await sb.from('productions').select('prod_date,product_name,farm_liters,powder_kg,qty_produced').gte('prod_date',from).lte('prod_date',to).order('prod_date',{ascending:false});
    headers = ['التاريخ','المنتج','الحليب (لتر)','البودرة (كغ)','الكمية المنتجة (كغ)'];
    rows = (data||[]).map(r=>[r.prod_date,r.product_name,r.farm_liters,r.powder_kg,r.qty_produced]);
  } else if (dept==='purchases') {
    const {data} = await sb.from('purchases').select('purchase_date,category,description,qty,unit,unit_price,total,status,requested_by').gte('purchase_date',from).lte('purchase_date',to).order('purchase_date',{ascending:false});
    headers = ['التاريخ','الصنف','الوصف','الكمية','الوحدة','سعر الوحدة','الإجمالي','الحالة','طلبه'];
    rows = (data||[]).map(r=>[r.purchase_date,r.category,r.description,r.qty,r.unit,r.unit_price,r.total,r.status,r.requested_by]);
  } else if (dept==='sales') {
    const {data} = await sb.from('sales').select('id,sale_date,total,payment_method,cashier_name,clients(name)').gte('sale_date',from).lte('sale_date',to).order('sale_date',{ascending:false});
    headers = ['#','التاريخ','العميل','طريقة الدفع','الإجمالي','الكاشير'];
    rows = (data||[]).map(r=>[r.id,r.sale_date,r.clients?.name||'نقدي',r.payment_method,r.total,r.cashier_name]);
  } else if (dept==='accounts') {
    const {data} = await sb.from('expenses').select('expense_date,category,description,amount').gte('expense_date',from).lte('expense_date',to).order('expense_date',{ascending:false});
    headers = ['التاريخ','الفئة','الوصف','المبلغ'];
    rows = (data||[]).map(r=>[r.expense_date,r.category,r.description,r.amount]);
  }

  const csv = [headers, ...rows].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `مدخلات_${deptNames[dept]}_${from}_${to}.csv`;
  a.click();
  toast('تم تصدير CSV ✓');
}
